<!-- Tally Embed -->
<iframe id="tally-embed"
  data-tally-src="https://tally.so/embed/n9kX5Y?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
  loading="lazy" width="100%" height="246" frameborder="0" marginheight="0" marginwidth="0"
  title="Flooring Quiz - Increase Friction (8/14/25)"></iframe>
<script>
  (function () {
    var d = document,
      w = "https://tally.so/widgets/embed.js",
      v = function () {
        if (typeof Tally !== "undefined") {
          Tally.loadEmbeds();
        } else {
          d.querySelectorAll('iframe[data-tally-src]:not([src])').forEach(function (e) {
            e.src = e.dataset.tallySrc;
          });
        }
      };
    if (typeof Tally !== "undefined") v();
    else if (d.querySelector('script[src="' + w + '"]') == null) {
      var s = d.createElement("script");
      s.src = w; s.onload = v; s.onerror = v; d.body.appendChild(s);
    }
  })();
</script>

<!-- Final Step: Address Autocomplete -->
<section id="final-step" style="margin-top:24px; padding:20px; border:1px solid #e5e7eb; border-radius:12px;">
  <h2 style="margin-bottom:12px; font-size:20px; line-height:1.2;">Final Step: Confirm Service Address</h2>
  <p style="margin-bottom:16px; color:#6b7280;">Start typing your street address, then choose a suggestion—City, State, and ZIP will auto-fill.</p>

  <form id="address-form" autocomplete="off">
    <div style="display:grid; grid-template-columns:1fr; gap:12px;">
      <label style="display:block;">
        <span style="display:block; font-size:14px; margin-bottom:6px;">Street Address</span>
        <input id="street" name="street" type="text" placeholder="123 Main St"
               style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;"/>
      </label>

      <div style="display:grid; grid-template-columns:1fr 100px 120px; gap:12px;">
        <label style="display:block;">
          <span style="display:block; font-size:14px; margin-bottom:6px;">City</span>
          <input id="city" name="city" type="text" placeholder="City"
                 style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;"/>
        </label>

        <label style="display:block;">
          <span style="display:block; font-size:14px; margin-bottom:6px;">State</span>
          <input id="state" name="state" type="text" placeholder="State"
                 style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;"/>
        </label>

        <label style="display:block;">
          <span style="display:block; font-size:14px; margin-bottom:6px;">ZIP</span>
          <input id="zip" name="zip" type="text" inputmode="numeric" pattern="[0-9]{5}"
                 placeholder="ZIP"
                 style="width:100%; padding:10px 12px; border:1px solid #d1d5db; border-radius:8px;"/>
        </label>
      </div>

      <div style="display:flex; gap:12px; align-items:center; margin-top:8px;">
        <button id="save-address" type="submit"
                style="padding:10px 14px; border:0; border-radius:8px; background:#111827; color:white; cursor:pointer;">
          Save Address
        </button>
        <span id="save-status" style="font-size:14px; color:#10b981; display:none;">Saved ✓</span>
      </div>

      <small style="color:#6b7280;">Tip: If your Tally form has fields (or hidden fields) named
        <code>address</code>, <code>city</code>, <code>state</code>, and <code>zip</code>, this will prefill them.</small>
    </div>
  </form>
</section>

<!-- Google Maps Places API (replace key) -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY_HERE&libraries=places"></script>

<script>
  (function () {
    // Helpers
    function $(id) { return document.getElementById(id); }
    function getIframe() { return document.getElementById('tally-embed'); }

    // Initialize Places Autocomplete on the street field
    let autocomplete;
    function initAutocomplete() {
      const streetInput = $('street');
      if (!streetInput) return;

      autocomplete = new google.maps.places.Autocomplete(streetInput, {
        types: ['address'],
        componentRestrictions: { country: ['us'] }, // adjust if needed
        fields: ['address_components', 'formatted_address']
      });

      autocomplete.addListener('place_changed', onPlaceChanged);
    }

    function onPlaceChanged() {
      const place = autocomplete.getPlace();
      if (!place || !place.address_components) return;

      const comps = place.address_components;

      // Map Google components -> our fields
      const get = (type) => {
        const c = comps.find(a => a.types.includes(type));
        return c ? c.long_name : '';
      };
      const getShort = (type) => {
        const c = comps.find(a => a.types.includes(type));
        return c ? c.short_name : '';
      };

      // Street number + route
      const streetNumber = get('street_number');
      const route = get('route');
      const street = [streetNumber, route].filter(Boolean).join(' ').trim();

      $('street').value = street || $('street').value;
      $('city').value   = get('locality') || get('sublocality') || get('postal_town') || '';
      $('state').value  = getShort('administrative_area_level_1') || '';
      $('zip').value    = get('postal_code') || '';
    }

    // Prefill Tally iframe by rewriting its src with query params
    function prefillTally(address, city, state, zip) {
      const iframe = getIframe();
      if (!iframe) return;

      const base = iframe.getAttribute('data-tally-src') || iframe.src;
      const url = new URL(base, window.location.origin);

      // Append/replace prefill params (keep existing params like dynamicHeight, etc.)
      url.searchParams.set('address', address);
      url.searchParams.set('city', city);
      url.searchParams.set('state', state);
      url.searchParams.set('zip', zip);

      // Reload the iframe with new params to trigger prefill on Tally side
      iframe.src = url.toString();
    }

    // Form save handler
    $('address-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const address = $('street').value.trim();
      const city = $('city').value.trim();
      const state = $('state').value.trim();
      const zip = $('zip').value.trim();

      // Basic validation
      if (!address || !city || !state || !zip) {
        alert('Please complete all address fields.');
        return;
      }
      if (!/^\d{5}(-\d{4})?$/.test(zip)) {
        alert('Please enter a valid ZIP code.');
        return;
      }

      prefillTally(address, city, state, zip);

      // UX feedback
      const status = $('save-status');
      status.style.display = 'inline';
      setTimeout(() => (status.style.display = 'none'), 2500);
    });

    // Boot
    if (window.google && google.maps && google.maps.places) {
      initAutocomplete();
    } else {
      window.addEventListener('load', initAutocomplete);
    }
  })();
</script>
