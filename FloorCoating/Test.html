<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project Quiz</title>
<style>
  :root{ --accent:#4f46e5; --ring:rgba(79,70,229,.35); }
  *{box-sizing:border-box}
  html, body {
    height: 100%; margin: 0;
    font: 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    background: url("https://raw.githubusercontent.com/peakleadsgroup/landing-pages/refs/heads/main/Images/garage-floor-coating-3-car-garage.webp") no-repeat center center fixed;
    background-size: cover; color:#111;
  }
  .wrap{ max-width:760px; margin:40px auto; padding:0 16px; }
  .card{ background:#fff; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.35); padding:28px; }
  .logo{ display:flex; justify-content:center; align-items:center; margin-bottom:14px; }
  .logo img{ max-height:64px; width:auto; }
  .progress{ height:10px; background:#eee; border-radius:999px; overflow:hidden; margin-bottom:18px;}
  .bar{ height:100%; width:0; background:linear-gradient(90deg,#4f46e5,#7c3aed); transition:width .35s ease;}
  .step{ display:none; } .step.active{ display:block; }
  .step h2{text-align:center; margin-bottom:12px;}
  .row{display:grid; gap:12px}
  @media(min-width:720px){.row.cols-2{grid-template-columns:1fr 1fr}}
  .choices{display:grid; gap:10px; margin-top:12px;}
  .choice{border:1px solid #ccc; background:#f9f9f9; border-radius:12px; padding:12px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-weight:600;}
  .choice:hover{background:#efefef}
  .choice.selected{border-color:#4f46e5; background:#e0e7ff}
  label{font-weight:600; margin-bottom:6px; display:block}
  input,textarea,select{width:100%; padding:12px 14px; border-radius:12px; border:1px solid #ccc; font-size:16px;}
  input:focus{outline:none; box-shadow:0 0 0 3px rgba(79,70,229,.3); border-color:#4f46e5;}
  .actions{display:flex; justify-content:center; gap:12px; margin-top:26px;}
  .btn{background:#4f46e5; color:#fff; font-weight:600; padding:12px 18px; border:none; border-radius:12px; cursor:pointer;}
  .btn:hover{background:#4338ca}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}
  .msg{margin-top:10px; padding:10px 12px; border-radius:10px; display:none;}
  .msg.bad{background:#fee2e2; color:#991b1b;}
  .msg.good{background:#dcfce7; color:#166534;}
  @media(max-width:600px){
    body{min-height:100svh; display:flex; align-items:center; justify-content:center; padding:12px;}
    .wrap{width:100%; max-width:760px; padding:0 8px;}
    .card{padding:22px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <img src="https://images.squarespace-cdn.com/content/v1/64909a307fc0025a2064d878/9b8fde02-b8f9-402b-be4c-366cb48134eb/Transparent+PNG+File.png" alt="Brand Logo">
    </div>
    <div class="progress"><div class="bar" id="progressBar"></div></div>

    <form id="quiz" action="https://hook.us2.make.com/qxdz19q8euzmejjffcgi6c6n9w47u1i7" method="POST" novalidate>
      <!-- Step 1 -->
      <section class="step active" data-step-name="homeowner" data-auto-advance="true">
        <h2>Are you a homeowner?</h2>
        <div class="choices">
          <button type="button" class="choice" data-name="homeowner" data-value="Yes">Yes</button>
          <button type="button" class="choice" data-name="homeowner" data-value="No">No</button>
        </div>
      </section>
      <!-- Step 2 -->
      <section class="step" data-step-name="project_type" data-auto-advance="true">
        <h2>What type of project is this?</h2>
        <div class="choices">
          <button type="button" class="choice" data-name="project_type" data-value="Garage">Garage</button>
          <button type="button" class="choice" data-name="project_type" data-value="Porch">Porch</button>
          <button type="button" class="choice" data-name="project_type" data-value="Deck">Deck</button>
          <button type="button" class="choice" data-name="project_type" data-value="Patio">Patio</button>
          <button type="button" class="choice" data-name="project_type" data-value="Basement">Basement</button>
          <button type="button" class="choice" data-name="project_type" data-value="Pool">Pool</button>
          <button type="button" class="choice" data-name="project_type" data-value="Other">Other</button>
        </div>
      </section>
      <!-- Step 3 -->
      <section class="step" data-step-name="timeline" data-auto-advance="true">
        <h2>When would you like your floors completed?</h2>
        <div class="choices">
          <button type="button" class="choice" data-name="timeline" data-value="ASAP">ASAP</button>
          <button type="button" class="choice" data-name="timeline" data-value="Within 2 weeks">Within 2 weeks</button>
          <button type="button" class="choice" data-name="timeline" data-value="Within a month">Within a month</button>
          <button type="button" class="choice" data-name="timeline" data-value="Within 2 months">Within 2 months</button>
        </div>
      </section>
      <!-- Step 4 -->
      <section class="step" data-step-name="phone">
        <h2>Where's the best place to reach you?</h2>
        <div class="row">
          <div>
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" required>
            <input type="hidden" id="phone_digits" name="phone_digits">
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn" data-prev>Back</button>
          <button type="button" class="btn" data-next disabled>Next</button>
        </div>
      </section>
      <!-- Step 5 -->
      <section class="step" data-step-name="contact_name">
        <h2>Who will we be meeting with?</h2>
        <div class="row cols-2">
          <div><label>First Name</label><input id="first" name="first_name" type="text" required></div>
          <div><label>Last Name</label><input id="last" name="last_name" type="text" required></div>
        </div>
        <div class="actions">
          <button type="button" class="btn" data-prev>Back</button>
          <button type="button" class="btn" data-next disabled>Next</button>
        </div>
      </section>
      <!-- Step 6 -->
      <section class="step" data-step-name="address">
        <h2>Where will we be meeting you?</h2>
        <div class="row"><div><label>Address</label><input id="address" name="address" type="text" required></div></div>
        <div class="row cols-2">
          <div><label>City</label><input id="city" name="city" type="text" required></div>
          <div><label>State</label><input id="state" name="state" type="text" required></div>
        </div>
        <div class="row"><div><label>Zip</label><input id="zip" name="zip" type="text" required></div></div>
        <div id="zipMsg" class="msg bad">Sorry — you're not within our area.</div>
        <div id="zipOk" class="msg good">Great — you're in our service area!</div>
        <div class="actions">
          <button type="button" class="btn" data-prev>Back</button>
          <button type="submit" class="btn" id="submitBtn" disabled>Submit</button>
        </div>
      </section>
    </form>
  </div>
</div>

<script>
(function(){
  // Debug helper
  window.onerror = (m,s,l,c,e)=>{ console.error("JS ERROR:",m,"@",s+":"+l,e); alert("JS error: "+m); };
  console.log("Quiz script loaded");
  const DEBUG = /[?&]debug=1/.test(location.search);
  function dbg(){ if(DEBUG) console.log.apply(console, arguments); }

  const stepWebhook = "https://hook.us2.make.com/0kfn50ruqjdtfvwpw4meuagndb76whq8";
  const SESSION_ID = Math.random().toString(36).slice(2);

  function postEvent(payload){
    try{
      const body = JSON.stringify(payload);
      dbg("POST EVENT →", payload);
      if(navigator.sendBeacon){
        navigator.sendBeacon(stepWebhook,new Blob([body],{type:"application/json"}));
      } else {
        fetch(stepWebhook,{method:"POST",headers:{"Content-Type":"application/json"},body,mode:"no-cors",keepalive:true});
      }
    }catch(e){console.warn("postEvent error:",e);}
  }
  function nowIso(){ return new Date().toISOString(); }

  const answers={};
  const steps=[...document.querySelectorAll(".step")];
  const bar=document.getElementById("progressBar");
  let idx=0;

  function show(i){
    idx=Math.max(0,Math.min(i,steps.length-1));
    steps.forEach((s,j)=>s.classList.toggle("active",j===idx));
    const pct=(idx/(steps.length-1))*100;
    bar.style.width=pct+"%";
    const stepEl=steps[idx];
    const stepName=(stepEl && stepEl.dataset && stepEl.dataset.stepName)?stepEl.dataset.stepName:"";
    postEvent({event_type:"step_view",session_id:SESSION_ID,step_index:idx,step_name:stepName,progress_pct:Math.round(pct),timestamp:nowIso(),answers});
  }

  document.querySelectorAll("[data-next]").forEach(btn=>btn.addEventListener("click",()=>show(idx+1)));
  document.querySelectorAll("[data-prev]").forEach(btn=>btn.addEventListener("click",()=>show(idx-1)));

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const name=btn.dataset.name, value=btn.dataset.value;
      answers[name]=value;
      const stepEl=btn.closest(".step");
      const stepName=(stepEl && stepEl.dataset && stepEl.dataset.stepName)?stepEl.dataset.stepName:"";
      postEvent({event_type:"answer_selected",session_id:SESSION_ID,step_index:idx,step_name:stepName,question:name,answer:value,timestamp:nowIso()});
      if(stepEl.dataset.autoAdvance==="true") setTimeout(()=>show(idx+1),200);
    });
  });

  document.getElementById("quiz").addEventListener("submit",e=>{
    e.preventDefault();
    postEvent({event_type:"submit",session_id:SESSION_ID,timestamp:nowIso(),answers});
    alert("Form would submit now (webhook + redirect).");
  });

  show(0);
})();
</script>
</body>
</html>
