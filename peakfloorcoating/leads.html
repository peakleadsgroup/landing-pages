<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peak Floor Coating - Leads CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 50;
            overflow-y: auto;
        }
        .modal-content {
            position: relative;
            margin: 5rem auto;
            padding: 1.25rem;
            border: 1px solid #e5e7eb;
            width: 90%;
            max-width: 42rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-radius: 0.5rem;
            background: white;
        }
        @media (max-width: 640px) {
            .modal-content {
                margin: 2rem auto;
                width: 95%;
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-4 sm:p-6">
        <div class="max-w-6xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-sm p-4 sm:p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
                    <div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Peak Floor Coating - Leads</h1>
                        <p class="text-sm text-gray-600 mt-1">Simple CRM for managing your leads</p>
                    </div>
                    <button onclick="fetchLeads()" id="refreshBtn" class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        <span class="hidden sm:inline">Refresh</span>
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <div class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <div>
                        <h3 class="font-semibold text-red-900 mb-1">Error Loading Leads</h3>
                        <p class="text-sm text-red-800" id="errorText"></p>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-12 text-center">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600">Loading leads...</p>
            </div>

            <!-- Leads List -->
            <div id="leadsContainer" class="hidden">
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="p-4 bg-gray-50 border-b border-gray-200">
                        <span class="font-semibold text-gray-700" id="leadCount">0 leads found</span>
                    </div>
                    <div id="leadsList" class="divide-y divide-gray-200">
                        <!-- Leads will be populated here -->
                    </div>
                </div>
            </div>

            <!-- No Leads State -->
            <div id="noLeadsState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-12 h-12 text-gray-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">No Leads Found</h3>
                <p class="text-gray-600">No leads found for Peak Floor Coating. Check back later!</p>
            </div>
        </div>
    </div>

    <!-- Lead Detail Modal -->
    <div id="leadModal" class="hidden modal-overlay">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Lead Details</h3>
                <button onclick="closeLeadModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="leadModalContent" class="space-y-4 max-h-[70vh] overflow-y-auto">
                <!-- Content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            tableId: 'tblPt6Wc79hTBSmcD',
            apiKey: 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589',
            linkedClientField: 'Linked Client',
            filterValue: 'Peak Floor Coating'
        };

        let allLeads = [];
        let currentLeadId = null;
        let notesSaveTimeout = null;
        let originalNotes = '';
        let originalStage = '';

        // Format date for display
        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    year: 'numeric', 
                    month: 'short', 
                    day: 'numeric' 
                });
            } catch (e) {
                return dateString;
            }
        }

        // Fetch leads from Airtable
        async function fetchLeads() {
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const loadingState = document.getElementById('loadingState');
            const errorMessage = document.getElementById('errorMessage');
            const leadsContainer = document.getElementById('leadsContainer');
            const noLeadsState = document.getElementById('noLeadsState');

            errorMessage.classList.add('hidden');
            leadsContainer.classList.add('hidden');
            noLeadsState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            refreshBtn.disabled = true;
            refreshIcon.classList.add('animate-spin');

            try {
                allLeads = [];
                let offset = null;

                // Build filter formula to find leads where Linked Client contains "Peak Floor Coating"
                const filterFormula = `FIND("${CONFIG.filterValue}", ARRAYJOIN({${CONFIG.linkedClientField}}))`;

                do {
                    let url = `https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableId)}?filterByFormula=${encodeURIComponent(filterFormula)}`;
                    
                    if (offset) {
                        url += `&offset=${offset}`;
                    }

                    const response = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` }
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Response error:', errorText);
                        throw new Error(`Failed to fetch: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    allLeads = allLeads.concat(data.records || []);
                    offset = data.offset;

                } while (offset);

                // Sort by Created date (newest first)
                allLeads.sort((a, b) => {
                    const dateA = new Date(a.fields['Created'] || 0);
                    const dateB = new Date(b.fields['Created'] || 0);
                    return dateB - dateA;
                });

                displayLeads();
            } catch (err) {
                document.getElementById('errorText').textContent = err.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loadingState.classList.add('hidden');
                refreshBtn.disabled = false;
                refreshIcon.classList.remove('animate-spin');
            }
        }

        // Display leads in list
        function displayLeads() {
            const leadsContainer = document.getElementById('leadsContainer');
            const noLeadsState = document.getElementById('noLeadsState');
            const leadsList = document.getElementById('leadsList');
            const leadCount = document.getElementById('leadCount');

            if (allLeads.length === 0) {
                leadsContainer.classList.add('hidden');
                noLeadsState.classList.remove('hidden');
                return;
            }

            leadsContainer.classList.remove('hidden');
            noLeadsState.classList.add('hidden');

            leadCount.textContent = allLeads.length + ' lead' + (allLeads.length !== 1 ? 's' : '') + ' found';

            leadsList.innerHTML = '';

            allLeads.forEach(lead => {
                const leadItem = document.createElement('div');
                leadItem.className = 'p-4 hover:bg-gray-50 cursor-pointer transition-colors';
                leadItem.onclick = () => openLeadModal(lead.id);

                const name = lead.fields['Full Name'] || 'No Name';
                const created = formatDate(lead.fields['Created']);

                leadItem.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                        <div class="flex-1">
                            <h3 class="font-semibold text-gray-900 text-lg">${name}</h3>
                            <p class="text-sm text-gray-600 mt-1">Created: ${created}</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                `;

                leadsList.appendChild(leadItem);
            });
        }

        // Open lead detail modal
        function openLeadModal(leadId) {
            const lead = allLeads.find(l => l.id === leadId);
            if (!lead) return;

            currentLeadId = leadId;
            const modal = document.getElementById('leadModal');
            const content = document.getElementById('leadModalContent');

            // Get field values
            const fullName = lead.fields['Full Name'] || 'N/A';
            const created = formatDate(lead.fields['Created']);
            const address = lead.fields['Address'] || 'N/A';
            const email = lead.fields['Email'] || 'N/A';
            const phone = lead.fields['Phone'] || 'N/A';
            const stage = lead.fields['Stage'] || '';
            const notes = lead.fields['Notes'] || '';

            originalNotes = notes;
            originalStage = stage;

            content.innerHTML = '';

            // Full Name
            addReadOnlyField(content, 'Full Name', fullName);

            // Created
            addReadOnlyField(content, 'Created', created);

            // Address
            addReadOnlyField(content, 'Address', address);

            // Email
            addReadOnlyField(content, 'Email', email);

            // Phone
            addReadOnlyField(content, 'Phone', phone);

            // Stage (editable)
            const stageDiv = document.createElement('div');
            stageDiv.className = 'border-b border-gray-200 pb-4';
            
            const stageLabel = document.createElement('label');
            stageLabel.className = 'block text-sm font-medium text-gray-700 mb-2';
            stageLabel.textContent = 'Stage';
            
            const stageSelect = document.createElement('select');
            stageSelect.id = 'modalStageField';
            stageSelect.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent';
            
            const stageOptions = [
                'Uncontacted',
                'Contacted',
                'Follow Up',
                'No show',
                'Appointment ran',
                'Close lost',
                'Close won',
                'First Contact',
                '2nd Follow Up',
                'Final Follow Up',
                'Not Interested',
                'Cancelled',
                'Unresponsive'
            ];
            
            const emptyOption = document.createElement('option');
            emptyOption.value = '';
            emptyOption.textContent = '-- Select Stage --';
            if (!stage) emptyOption.selected = true;
            stageSelect.appendChild(emptyOption);
            
            stageOptions.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                if (opt === stage) option.selected = true;
                stageSelect.appendChild(option);
            });

            stageSelect.addEventListener('change', function() {
                saveStage(stageSelect.value);
            });

            stageDiv.appendChild(stageLabel);
            stageDiv.appendChild(stageSelect);
            content.appendChild(stageDiv);

            // Notes (editable)
            const notesDiv = document.createElement('div');
            notesDiv.className = 'pb-4';
            
            const notesLabel = document.createElement('label');
            notesLabel.className = 'block text-sm font-medium text-gray-700 mb-2';
            notesLabel.textContent = 'Notes';
            
            const notesTextarea = document.createElement('textarea');
            notesTextarea.id = 'modalNotesField';
            notesTextarea.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent';
            notesTextarea.rows = 6;
            notesTextarea.value = notes;
            notesTextarea.placeholder = 'Enter notes here...';

            // Auto-save on change with debounce
            notesTextarea.addEventListener('input', function() {
                clearTimeout(notesSaveTimeout);
                notesSaveTimeout = setTimeout(() => {
                    saveNotes(notesTextarea.value);
                }, 1000); // Save 1 second after user stops typing
            });

            // Save on blur (when user clicks away)
            notesTextarea.addEventListener('blur', function() {
                clearTimeout(notesSaveTimeout);
                saveNotes(notesTextarea.value);
            });

            notesDiv.appendChild(notesLabel);
            notesDiv.appendChild(notesTextarea);
            content.appendChild(notesDiv);

            modal.classList.remove('hidden');
        }

        // Helper function to add read-only field
        function addReadOnlyField(container, label, value) {
            const div = document.createElement('div');
            div.className = 'border-b border-gray-200 pb-4';
            
            const fieldLabel = document.createElement('label');
            fieldLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
            fieldLabel.textContent = label;
            
            const fieldValue = document.createElement('div');
            fieldValue.className = 'text-sm text-gray-900';
            fieldValue.textContent = value;
            
            div.appendChild(fieldLabel);
            div.appendChild(fieldValue);
            container.appendChild(div);
        }

        // Save stage
        async function saveStage(newStage) {
            if (!currentLeadId) return;

            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableId)}/${currentLeadId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        fields: { 
                            'Stage': newStage || null
                        } 
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to save stage');
                }

                // Update local record
                const lead = allLeads.find(l => l.id === currentLeadId);
                if (lead) {
                    lead.fields['Stage'] = newStage || null;
                }

                originalStage = newStage;
            } catch (err) {
                console.error('Error saving stage:', err);
                alert('Error saving stage: ' + err.message);
            }
        }

        // Save notes
        async function saveNotes(newNotes) {
            if (!currentLeadId) return;

            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableId)}/${currentLeadId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        fields: { 
                            'Notes': newNotes || ''
                        } 
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to save notes');
                }

                // Update local record
                const lead = allLeads.find(l => l.id === currentLeadId);
                if (lead) {
                    lead.fields['Notes'] = newNotes || '';
                }

                originalNotes = newNotes;
            } catch (err) {
                console.error('Error saving notes:', err);
                alert('Error saving notes: ' + err.message);
            }
        }

        // Close modal and save any pending changes
        function closeLeadModal() {
            // Save notes if changed
            const notesField = document.getElementById('modalNotesField');
            if (notesField && notesField.value !== originalNotes) {
                clearTimeout(notesSaveTimeout);
                saveNotes(notesField.value);
            }

            const modal = document.getElementById('leadModal');
            modal.classList.add('hidden');
            currentLeadId = null;
        }

        // Close modal when clicking outside
        document.getElementById('leadModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLeadModal();
            }
        });

        // Initialize on page load
        fetchLeads();
    </script>
</body>
</html>
