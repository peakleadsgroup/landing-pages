<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ad Creation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
        .rotate-180 { transform: rotate(180deg); }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
                    <div class="flex items-center gap-4">
                        <img src="https://github.com/peakleadsgroup/landing-pages/blob/main/Images/Peak%20Leads%20Flattened%20Logo.png?raw=true" alt="Peak Leads Logo" class="h-10 w-auto">
                        <h1 class="text-2xl font-bold text-gray-900">Ad Creation Dashboard</h1>
                    </div>
                    <div class="flex items-center gap-2">
                        <a href="https://drive.google.com/drive/folders/1ybQy73Z71mOG3ZNgVYQSHrkUrDkeSS4d?usp=sharing" target="_blank" class="flex items-center justify-center gap-2 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            All Ads
                        </a>
                        <button onclick="fetchRecords()" id="refreshBtn" class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            Refresh
                        </button>
                    </div>
                </div>

                <!-- Search Bar -->
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search records..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        oninput="filterRecords()"
                    />
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <div class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <div>
                        <h3 class="font-semibold text-red-900 mb-1">Error Loading Records</h3>
                        <p class="text-sm text-red-800" id="errorText"></p>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600">Loading records...</p>
            </div>

            <!-- Tabs -->
            <div class="bg-white rounded-lg shadow-sm mb-6 overflow-hidden">
                <div class="flex border-b border-gray-200">
                    <button onclick="setActiveTab('templates')" id="tab-templates" class="relative flex-1 px-6 py-4 text-sm font-medium text-blue-600 border-b-2 border-blue-600 bg-blue-50 transition-colors">
                        TEMPLATES
                        <span id="badge-templates" class="absolute top-2 right-2 inline-flex items-center justify-center px-2 py-0.5 text-xs font-bold text-white bg-red-600 rounded-full hidden">0</span>
                    </button>
                    <button onclick="setActiveTab('duplicate')" id="tab-duplicate" class="relative flex-1 px-6 py-4 text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 border-b-2 border-transparent transition-colors">
                        DUPLICATE
                        <span id="badge-duplicate" class="absolute top-2 right-2 inline-flex items-center justify-center px-2 py-0.5 text-xs font-bold text-white bg-red-600 rounded-full hidden">0</span>
                    </button>
                </div>
            </div>

            <!-- Records Container -->
            <div id="recordsContainer" class="hidden">
                <!-- TEMPLATES Tab Content -->
                <div id="templatesTabContent" class="hidden">
                    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                        <div class="p-4 bg-gray-50 border-b border-gray-200 flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                            </svg>
                            <span class="font-semibold text-gray-700" id="templatesRecordCount">0 records found</span>
                        </div>
                        <div id="templatesTableBody" class="divide-y divide-gray-200">
                            <!-- Templates will be populated here -->
                        </div>
                    </div>
                </div>

                <!-- DUPLICATE Tab Content -->
                <div id="duplicateTabContent" class="hidden">
                    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                        <div class="p-4 bg-gray-50 border-b border-gray-200 flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                            </svg>
                            <span class="font-semibold text-gray-700" id="duplicateRecordCount">0 records found</span>
                        </div>
                        <div id="duplicateTableBody" class="divide-y divide-gray-200">
                            <!-- Duplicate records will be populated here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- No Records State -->
            <div id="noRecordsState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-12 h-12 text-gray-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                </svg>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">No Records Found</h3>
                <p class="text-gray-600">There are no records in this table yet.</p>
            </div>
        </div>
    </div>

    <!-- B2C Ad Detail Modal -->
    <div id="adDetailModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-2xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">B2C Ad Details</h3>
                <button onclick="closeAdDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="adDetailContent" class="space-y-4">
                <!-- Content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            tableId: 'tblc7NnCCKHfH1Aul',
            b2cAdsTable: 'B2C Ads',
            campaignsTable: 'Campaign',
            creationTrackerTable: 'tblOhXnYlWio4GvD6',
            apiKey: 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589'
        };

        let allRecords = [];
        let filteredRecords = [];
        let activeTab = 'templates';
        let creationTrackerCache = {}; // Will store Creation Tracker records by Ad Creation record ID
        let linkedRecordsCache = {
            b2cAds: {},  // Will store full ad record objects {name, movedToFB}
            campaigns: {}  // Will store just names
        };

        async function setActiveTab(tab) {
            activeTab = tab;
            
            // Update tab buttons
            document.querySelectorAll('[id^="tab-"]').forEach(btn => {
                btn.classList.remove('text-blue-600', 'border-blue-600', 'bg-blue-50');
                btn.classList.add('text-gray-600', 'border-transparent');
            });
            
            const activeTabBtn = document.getElementById('tab-' + tab);
            if (activeTabBtn) {
                activeTabBtn.classList.remove('text-gray-600', 'border-transparent');
                activeTabBtn.classList.add('text-blue-600', 'border-blue-600', 'bg-blue-50');
            }
            
            // Update tab content visibility
            document.getElementById('templatesTabContent').classList.toggle('hidden', tab !== 'templates');
            document.getElementById('duplicateTabContent').classList.toggle('hidden', tab !== 'duplicate');
            
            await displayRecords();
        }

        async function fetchAllCreationTrackerRecords(adCreationRecordId) {
            // Fallback: fetch all Creation Tracker records and filter client-side
            // Check if we already have all records cached globally
            if (!creationTrackerCache._allRecords) {
                try {
                    let allTrackerRecords = [];
                    let offset = null;

                    do {
                        let url = `https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.creationTrackerTable}`;
                        if (offset) {
                            url += `?offset=${offset}`;
                        }

                        const response = await fetch(url, {
                            headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` }
                        });

                        if (!response.ok) {
                            console.error(`Failed to fetch all Creation Tracker records: ${response.status}`);
                            return [];
                        }

                        const data = await response.json();
                        allTrackerRecords = allTrackerRecords.concat(data.records || []);
                        offset = data.offset;

                    } while (offset);

                    // Cache all records globally
                    creationTrackerCache._allRecords = allTrackerRecords;
                    console.log(`Cached ${allTrackerRecords.length} total Creation Tracker records`);
                } catch (error) {
                    console.error('Error fetching all Creation Tracker records:', error);
                    return [];
                }
            }

            // Filter client-side to find records linked to this Ad Creation record
            const allRecords = creationTrackerCache._allRecords || [];
            const filteredRecords = allRecords.filter(tracker => {
                const adsets = tracker.fields['Adsets'];
                if (Array.isArray(adsets)) {
                    return adsets.includes(adCreationRecordId);
                }
                return false;
            });

            // Fetch campaign names for each tracker record
            for (const trackerRecord of filteredRecords) {
                const campaignId = trackerRecord.fields['Campaign'];
                if (campaignId && Array.isArray(campaignId) && campaignId.length > 0) {
                    await fetchLinkedRecord(CONFIG.campaignsTable, campaignId[0]);
                }
            }

            creationTrackerCache[adCreationRecordId] = filteredRecords;
            console.log(`Fetched ${filteredRecords.length} Creation Tracker records (client-side filter) for ${adCreationRecordId}`);
            return filteredRecords;
        }

        async function fetchCreationTrackerRecords(adCreationRecordId) {
            // Check cache first
            if (creationTrackerCache[adCreationRecordId]) {
                return creationTrackerCache[adCreationRecordId];
            }

            try {
                // Fetch Creation Tracker records filtered by Ad Creation record ID
                // For linked records, we need to use the record ID directly in the filter
                const filterFormula = `{Adsets} = "${adCreationRecordId}"`;
                const url = `https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.creationTrackerTable}?filterByFormula=${encodeURIComponent(filterFormula)}`;
                
                let allTrackerRecords = [];
                let offset = null;

                do {
                    let fetchUrl = url;
                    if (offset) {
                        fetchUrl += `&offset=${offset}`;
                    }

                    const response = await fetch(fetchUrl, {
                        headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` }
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error(`Failed to fetch Creation Tracker records: ${response.status}`, errorText);
                        console.error(`Filter formula used: ${filterFormula}`);
                        // Try alternative: fetch all and filter client-side
                        console.log('Attempting to fetch all Creation Tracker records and filter client-side...');
                        return await fetchAllCreationTrackerRecords(adCreationRecordId);
                    }

                    const data = await response.json();
                    allTrackerRecords = allTrackerRecords.concat(data.records || []);
                    offset = data.offset;

                } while (offset);
                
                // If no records found with direct filter, try fetching all and filtering
                if (allTrackerRecords.length === 0) {
                    console.log(`No records found with filter, trying to fetch all and filter client-side for ${adCreationRecordId}`);
                    return await fetchAllCreationTrackerRecords(adCreationRecordId);
                }

                // Fetch campaign names for each tracker record
                for (const trackerRecord of allTrackerRecords) {
                    const campaignId = trackerRecord.fields['Campaign'];
                    if (campaignId && Array.isArray(campaignId) && campaignId.length > 0) {
                        await fetchLinkedRecord(CONFIG.campaignsTable, campaignId[0]);
                    }
                }

                // Cache the tracker records
                creationTrackerCache[adCreationRecordId] = allTrackerRecords;
                console.log(`Fetched ${allTrackerRecords.length} Creation Tracker records for ${adCreationRecordId}`);
                return allTrackerRecords;
            } catch (error) {
                console.error('Error fetching Creation Tracker records:', error);
                // Cache empty array so we don't keep trying
                creationTrackerCache[adCreationRecordId] = [];
                return [];
            }
        }

        async function fetchLinkedRecord(tableName, recordId) {
            // Check cache first
            const cacheKey = tableName === CONFIG.b2cAdsTable ? 'b2cAds' : 'campaigns';
            if (linkedRecordsCache[cacheKey][recordId]) {
                // For B2C Ads, return the cached object; for campaigns, return the name string
                if (cacheKey === 'b2cAds') {
                    return linkedRecordsCache[cacheKey][recordId];
                } else {
                    return linkedRecordsCache[cacheKey][recordId];
                }
            }

            try {
                const url = `https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(tableName)}/${recordId}`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` }
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error(`Failed to fetch ${tableName} record ${recordId}: ${response.status}`, errorText);
                    return null;
                }

                const data = await response.json();
                
                if (tableName === CONFIG.b2cAdsTable) {
                    // For B2C Ads, store full record data
                    const name = data.fields['Name'] || data.fields['Ad Name'] || recordId;
                    const movedToFB = data.fields['Moved to FB'] === true;
                    const scriptATID = data.fields['scriptATID'] || '';
                    const linkedPrimaryText = data.fields['Linked Primary Text'] || '';
                    const headline = data.fields['Headline'] || '';
                    const adData = {
                        name: name,
                        movedToFB: movedToFB,
                        recordId: recordId,
                        scriptATID: scriptATID,
                        linkedPrimaryText: linkedPrimaryText,
                        headline: headline
                    };
                    linkedRecordsCache[cacheKey][recordId] = adData;
                    return adData;
                } else {
                    // For campaigns, store the Campaign Name
                    const campaignName = data.fields['Campaign Name'] || data.fields['Name'] || data.fields['Campaign ID'] || recordId;
                    linkedRecordsCache[cacheKey][recordId] = campaignName;
                    return campaignName;
                }
            } catch (error) {
                console.error(`Error fetching ${tableName} record:`, error);
                return null;
            }
        }

        async function fetchRecords() {
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const loadingState = document.getElementById('loadingState');
            const errorMessage = document.getElementById('errorMessage');
            const recordsContainer = document.getElementById('recordsContainer');
            const noRecordsState = document.getElementById('noRecordsState');

            errorMessage.classList.add('hidden');
            recordsContainer.classList.add('hidden');
            noRecordsState.classList.add('hidden');
            loadingState.classList.remove('hidden');
            refreshBtn.disabled = true;
            refreshIcon.classList.add('animate-spin');

            try {
                allRecords = [];
                let offset = null;

                do {
                    let url = `https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.tableId}`;
                    if (offset) {
                        url += `?offset=${offset}`;
                    }

                    const response = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` }
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Response error:', errorText);
                        throw new Error(`Failed to fetch: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    allRecords = allRecords.concat(data.records || []);
                    offset = data.offset;

                } while (offset);

                // Fetch linked records for all records
                for (const record of allRecords) {
                    // Fetch B2C Ads linked records
                    if (record.fields['B2C Ads'] && Array.isArray(record.fields['B2C Ads'])) {
                        for (const adId of record.fields['B2C Ads']) {
                            await fetchLinkedRecord(CONFIG.b2cAdsTable, adId);
                        }
                    }

                    // Fetch Creation Tracker records for this Ad Creation record
                    await fetchCreationTrackerRecords(record.id);
                }

                filteredRecords = [...allRecords];
                filteredRecords.sort((a, b) => {
                    const nameA = (a.fields['Name'] || '').toLowerCase();
                    const nameB = (b.fields['Name'] || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });

                await displayRecords();
            } catch (err) {
                document.getElementById('errorText').textContent = err.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loadingState.classList.add('hidden');
                refreshBtn.disabled = false;
                refreshIcon.classList.remove('animate-spin');
            }
        }


        async function toggleDuplicated(trackerId, currentValue) {
            const newValue = !currentValue;
            
            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${CONFIG.creationTrackerTable}/${trackerId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: {
                            'Duplicated': newValue
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to update Duplicated status');
                }

                // Update cache
                for (const adCreationId in creationTrackerCache) {
                    const trackers = creationTrackerCache[adCreationId];
                    const tracker = trackers.find(t => t.id === trackerId);
                    if (tracker) {
                        tracker.fields['Duplicated'] = newValue;
                        break;
                    }
                }

                // Refresh display (preserve open dropdowns)
                await displayRecords();
            } catch (error) {
                console.error('Error toggling Duplicated:', error);
                alert('Failed to update Duplicated status. Please try again.');
            }
        }

        async function toggleMovedToFB(adId, currentValue) {
            const newValue = !currentValue;
            
            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.b2cAdsTable)}/${adId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: {
                            'Moved to FB': newValue
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to update Moved to FB status');
                }

                // Update cache
                if (linkedRecordsCache.b2cAds[adId]) {
                    linkedRecordsCache.b2cAds[adId].movedToFB = newValue;
                }

                // Update modal if open
                const modalAdId = document.getElementById('adDetailModal').dataset.adId;
                if (modalAdId === adId) {
                    showAdDetails(adId);
                }

                // Refresh display
                await displayRecords();
            } catch (error) {
                console.error('Error toggling Moved to FB:', error);
                alert('Failed to update Moved to FB status. Please try again.');
            }
        }

        async function showAdDetails(adId) {
            const modal = document.getElementById('adDetailModal');
            const content = document.getElementById('adDetailContent');
            modal.dataset.adId = adId;

            // Show loading state
            content.innerHTML = '<div class="text-center py-8"><svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg><p class="text-gray-600">Loading ad details...</p></div>';
            modal.classList.remove('hidden');

            // Fetch ad data if not cached
            let adData = linkedRecordsCache.b2cAds[adId];
            if (!adData) {
                adData = await fetchLinkedRecord(CONFIG.b2cAdsTable, adId);
            }

            if (!adData) {
                content.innerHTML = '<div class="text-center py-8"><p class="text-red-600">Failed to load ad data. Please try again.</p></div>';
                return;
            }

            const scriptATID = adData.scriptATID || '—';
            const linkedPrimaryText = adData.linkedPrimaryText || '—';
            const headline = adData.headline || '—';
            const movedToFB = adData.movedToFB === true;

            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Ad Name</label>
                        <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-sm text-gray-900 font-mono">${scriptATID}</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Primary Text</label>
                        <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-sm text-gray-900 whitespace-pre-wrap min-h-[60px]">${linkedPrimaryText}</div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Headline</label>
                        <div class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-md text-sm text-gray-900 whitespace-pre-wrap min-h-[60px]">${headline}</div>
                    </div>
                    <div>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input 
                                type="checkbox" 
                                ${movedToFB ? 'checked' : ''} 
                                onchange="toggleMovedToFB('${adId}', ${movedToFB})"
                                class="w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                            />
                            <span class="text-sm font-medium text-gray-700">Moved to FB</span>
                        </label>
                    </div>
                </div>
            `;
        }

        function closeAdDetailModal() {
            const modal = document.getElementById('adDetailModal');
            modal.classList.add('hidden');
            delete modal.dataset.adId;
        }

        document.getElementById('adDetailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAdDetailModal();
            }
        });

        function getOpenDropdowns() {
            const openDropdowns = [];
            document.querySelectorAll('[id^="dropdown-"]').forEach(dropdown => {
                if (!dropdown.classList.contains('hidden')) {
                    openDropdowns.push(dropdown.id);
                }
            });
            return openDropdowns;
        }

        function restoreOpenDropdowns(openDropdownIds) {
            openDropdownIds.forEach(dropdownId => {
                const dropdown = document.getElementById(dropdownId);
                const icon = document.getElementById('icon-' + dropdownId);
                if (dropdown && icon) {
                    dropdown.classList.remove('hidden');
                    icon.classList.add('rotate-180');
                }
            });
        }

        async function displayRecords() {
            const recordsContainer = document.getElementById('recordsContainer');
            const noRecordsState = document.getElementById('noRecordsState');

            if (filteredRecords.length === 0) {
                recordsContainer.classList.add('hidden');
                noRecordsState.classList.remove('hidden');
                return;
            }

            recordsContainer.classList.remove('hidden');
            noRecordsState.classList.add('hidden');

            // Save which dropdowns are currently open
            const openDropdowns = getOpenDropdowns();

            if (activeTab === 'templates') {
                displayTemplatesTab();
            } else if (activeTab === 'duplicate') {
                await displayDuplicateTab();
            }

            // Restore open dropdowns
            restoreOpenDropdowns(openDropdowns);
        }

        function displayTemplatesTab() {
            const templatesTableBody = document.getElementById('templatesTableBody');
            const templatesRecordCount = document.getElementById('templatesRecordCount');

            // Filter records to only show those with unchecked B2C Ads
            const visibleRecords = filteredRecords.filter(record => {
                const b2cAds = record.fields['B2C Ads'] && Array.isArray(record.fields['B2C Ads']) 
                    ? record.fields['B2C Ads'] 
                    : [];
                
                // Hide if no B2C Ads linked
                if (b2cAds.length === 0) {
                    return false;
                }
                
                // Filter to only show ads where Moved to FB is unchecked
                const uncheckedAds = b2cAds.filter(adId => {
                    const adData = linkedRecordsCache.b2cAds[adId];
                    return !adData || adData.movedToFB !== true;
                });
                
                // Hide if all ads are checked
                return uncheckedAds.length > 0;
            });

            templatesRecordCount.textContent = visibleRecords.length + ' record' + (visibleRecords.length !== 1 ? 's' : '') + ' found';
            
            // Update badge count
            const templatesBadge = document.getElementById('badge-templates');
            if (templatesBadge) {
                templatesBadge.textContent = visibleRecords.length;
                if (visibleRecords.length > 0) {
                    templatesBadge.classList.remove('hidden');
                } else {
                    templatesBadge.classList.add('hidden');
                }
            }

            templatesTableBody.innerHTML = visibleRecords.map((record, index) => {
                const name = record.fields['Name'] || '';
                const recordId = record.id;
                
                // Handle B2C Ads linked records
                const b2cAds = record.fields['B2C Ads'] && Array.isArray(record.fields['B2C Ads']) 
                    ? record.fields['B2C Ads'] 
                    : [];
                
                // Filter to only show ads where Moved to FB is unchecked
                const uncheckedAds = b2cAds.filter(adId => {
                    const adData = linkedRecordsCache.b2cAds[adId];
                    return !adData || adData.movedToFB !== true;
                });

                const adItems = uncheckedAds.map(adId => {
                    const adData = linkedRecordsCache.b2cAds[adId];
                    if (!adData) {
                        return `<div class="px-4 py-2 hover:bg-gray-50 border-b border-gray-100 last:border-b-0 text-sm text-gray-400">Loading...</div>`;
                    }
                    const adName = adData.name || adId;
                    return `
                        <div class="px-4 py-2 hover:bg-gray-50 border-b border-gray-100 last:border-b-0">
                            <button 
                                onclick="showAdDetails('${adId}')" 
                                class="text-sm text-blue-600 hover:text-blue-800 hover:underline cursor-pointer"
                            >
                                ${adName}
                            </button>
                        </div>
                    `;
                }).join('');
                
                const hasAds = uncheckedAds.length > 0;

                const dropdownId = `dropdown-${recordId}`;

                return `
                    <div class="border-b border-gray-200 last:border-b-0">
                        <div class="px-6 py-4 flex items-center hover:bg-gray-50">
                            <div class="flex items-center gap-4 flex-1">
                                <button 
                                    onclick="toggleDropdown('${dropdownId}')" 
                                    class="flex items-center gap-2 text-gray-400 hover:text-gray-600 transition-colors"
                                >
                                    <svg id="icon-${dropdownId}" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>
                                <span class="text-sm font-medium text-gray-900 flex-1">${name || '<span class="text-gray-400">—</span>'}</span>
                            </div>
                        </div>
                        <div id="${dropdownId}" class="hidden bg-gray-50 border-t border-gray-200">
                            ${hasAds ? adItems : '<div class="px-4 py-2 text-sm text-gray-400">No B2C Ads linked</div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function displayDuplicateTab() {
            const duplicateTableBody = document.getElementById('duplicateTableBody');
            const duplicateRecordCount = document.getElementById('duplicateRecordCount');

            // Fetch Creation Tracker records for all filtered records
            for (const record of filteredRecords) {
                await fetchCreationTrackerRecords(record.id);
            }

            // Filter to only show records where ALL B2C Ads are marked as "Moved to FB"
            const visibleRecords = filteredRecords.filter(record => {
                // Check B2C Ads - only show if ALL are marked as "Moved to FB"
                const b2cAds = record.fields['B2C Ads'] && Array.isArray(record.fields['B2C Ads']) 
                    ? record.fields['B2C Ads'] 
                    : [];
                
                // If no B2C Ads linked, don't show this record
                if (b2cAds.length === 0) {
                    return false;
                }
                
                // Check if ALL B2C Ads are marked as "Moved to FB"
                const allMovedToFB = b2cAds.every(adId => {
                    const adData = linkedRecordsCache.b2cAds[adId];
                    return adData && adData.movedToFB === true;
                });
                
                // Only show if all ads are moved to FB
                if (!allMovedToFB) {
                    return false;
                }
                
                // Also check that there are unchecked campaigns to show
                const trackerRecords = creationTrackerCache[record.id] || [];
                if (trackerRecords.length === 0) {
                    return false;
                }
                
                // Filter to only unchecked campaigns
                const uncheckedTrackers = trackerRecords.filter(tracker => {
                    return tracker.fields['Duplicated'] !== true;
                });
                
                // Only show if there are unchecked campaigns
                return uncheckedTrackers.length > 0;
            });

            console.log(`Total visible records: ${visibleRecords.length} out of ${filteredRecords.length}`);
            duplicateRecordCount.textContent = visibleRecords.length + ' record' + (visibleRecords.length !== 1 ? 's' : '') + ' found';
            
            // Update badge count
            const duplicateBadge = document.getElementById('badge-duplicate');
            if (duplicateBadge) {
                duplicateBadge.textContent = visibleRecords.length;
                if (visibleRecords.length > 0) {
                    duplicateBadge.classList.remove('hidden');
                } else {
                    duplicateBadge.classList.add('hidden');
                }
            }

            duplicateTableBody.innerHTML = visibleRecords.map((record, index) => {
                const name = record.fields['Name'] || '';
                const recordId = record.id;
                
                // Get Creation Tracker records for this Ad Creation record
                const trackerRecords = creationTrackerCache[recordId] || [];
                
                // Filter to only unchecked campaigns
                const uncheckedTrackers = trackerRecords.filter(tracker => {
                    return tracker.fields['Duplicated'] !== true;
                });
                
                const campaignItems = uncheckedTrackers.map(tracker => {
                    const campaignId = tracker.fields['Campaign'];
                    if (!campaignId || !Array.isArray(campaignId) || campaignId.length === 0) {
                        return '';
                    }
                    const campaignRecordId = campaignId[0];
                    const campaignName = linkedRecordsCache.campaigns[campaignRecordId] || campaignRecordId;
                    const duplicated = tracker.fields['Duplicated'] === true;
                    const trackerId = tracker.id;
                    
                    return `
                        <div class="px-4 py-2 hover:bg-gray-50 border-b border-gray-100 last:border-b-0 flex items-center justify-between">
                            <span class="text-sm text-gray-900">${campaignName}</span>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <span class="text-xs text-gray-600">Duplicated</span>
                                <input 
                                    type="checkbox" 
                                    ${duplicated ? 'checked' : ''} 
                                    onchange="toggleDuplicated('${trackerId}', ${duplicated})"
                                    class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                                />
                            </label>
                        </div>
                    `;
                }).join('');

                const hasCampaigns = uncheckedTrackers.length > 0;
                const dropdownId = `dropdown-duplicate-${recordId}`;

                return `
                    <div class="border-b border-gray-200 last:border-b-0">
                        <div class="px-6 py-4 flex items-center hover:bg-gray-50">
                            <div class="flex items-center gap-4 flex-1">
                                <button 
                                    onclick="toggleDropdown('${dropdownId}')" 
                                    class="flex items-center gap-2 text-gray-400 hover:text-gray-600 transition-colors"
                                >
                                    <svg id="icon-${dropdownId}" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                                    </svg>
                                </button>
                                <span class="text-sm font-medium text-gray-900 flex-1">${name || '<span class="text-gray-400">—</span>'}</span>
                            </div>
                        </div>
                        <div id="${dropdownId}" class="hidden bg-gray-50 border-t border-gray-200">
                            ${hasCampaigns ? campaignItems : '<div class="px-4 py-2 text-sm text-gray-400">No Campaigns linked</div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleDropdown(dropdownId) {
            const dropdown = document.getElementById(dropdownId);
            const icon = document.getElementById('icon-' + dropdownId);
            
            if (dropdown.classList.contains('hidden')) {
                dropdown.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                dropdown.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        async function filterRecords() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredRecords = allRecords.filter(record => {
                const name = (record.fields['Name'] || '').toLowerCase();
                
                // Check B2C Ads
                let b2cAdsMatch = false;
                if (record.fields['B2C Ads'] && Array.isArray(record.fields['B2C Ads'])) {
                    b2cAdsMatch = record.fields['B2C Ads'].some(adId => {
                        const adData = linkedRecordsCache.b2cAds[adId];
                        const adName = adData ? adData.name.toLowerCase() : adId.toLowerCase();
                        return adName.includes(searchTerm);
                    });
                }

                // Check Campaign
                let campaignMatch = false;
                if (record.fields['Campaign'] && Array.isArray(record.fields['Campaign'])) {
                    campaignMatch = record.fields['Campaign'].some(campaignId => {
                        const campaignName = (linkedRecordsCache.campaigns[campaignId] || campaignId).toLowerCase();
                        return campaignName.includes(searchTerm);
                    });
                }

                return name.includes(searchTerm) || b2cAdsMatch || campaignMatch;
            });

            await displayRecords();
        }

        // Initialize on page load
        setActiveTab('templates');
        fetchRecords();
    </script>
</body>
</html>
