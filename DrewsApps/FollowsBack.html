<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Follow Back Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-50 to-pink-50 p-8">
    <div class="max-w-4xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Instagram Follow Back Checker</h1>
            <p class="text-gray-600">Upload your Instagram data to see who doesn't follow you back</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <svg class="w-6 h-6 text-purple-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <h2 class="text-xl font-semibold text-gray-800">Followers</h2>
                </div>
                <label class="block">
                    <div class="border-2 border-dashed border-purple-300 rounded-lg p-8 text-center hover:border-purple-500 transition cursor-pointer">
                        <svg class="w-12 h-12 text-purple-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="text-gray-600 mb-2">Drop followers JSON file</p>
                        <p class="text-sm text-gray-400">or click to browse</p>
                        <input type="file" accept=".json" id="followersFile" class="hidden">
                    </div>
                </label>
                <p id="followersStatus" class="mt-3 text-gray-500"></p>
            </div>

            <div class="bg-white rounded-lg shadow-lg p-6">
                <div class="flex items-center mb-4">
                    <svg class="w-6 h-6 text-pink-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                    <h2 class="text-xl font-semibold text-gray-800">Following</h2>
                </div>
                <label class="block">
                    <div class="border-2 border-dashed border-pink-300 rounded-lg p-8 text-center hover:border-pink-500 transition cursor-pointer">
                        <svg class="w-12 h-12 text-pink-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                        </svg>
                        <p class="text-gray-600 mb-2">Drop following JSON file</p>
                        <p class="text-sm text-gray-400">or click to browse</p>
                        <input type="file" accept=".json" id="followingFile" class="hidden">
                    </div>
                </label>
                <p id="followingStatus" class="mt-3 text-gray-500"></p>
            </div>
        </div>

        <div class="text-center mb-8">
            <button id="analyzeBtn" disabled
                class="bg-gradient-to-r from-purple-600 to-pink-600 text-white px-8 py-3 rounded-lg font-semibold text-lg shadow-lg hover:shadow-xl transition disabled:opacity-50 disabled:cursor-not-allowed">
                Analyze Followers
            </button>
        </div>

        <div id="results" class="hidden bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">Results</h2>
            <div class="grid grid-cols-3 gap-4 mb-6">
                <div class="text-center p-4 bg-purple-50 rounded-lg">
                    <p id="totalFollowers" class="text-3xl font-bold text-purple-600">0</p>
                    <p class="text-gray-600">Followers</p>
                </div>
                <div class="text-center p-4 bg-pink-50 rounded-lg">
                    <p id="totalFollowing" class="text-3xl font-bold text-pink-600">0</p>
                    <p class="text-gray-600">Following</p>
                </div>
                <div class="text-center p-4 bg-red-50 rounded-lg">
                    <p id="notFollowingBackCount" class="text-3xl font-bold text-red-600">0</p>
                    <p class="text-gray-600">Not Following Back</p>
                </div>
            </div>

            <div class="text-center mb-6">
                <button id="exportBtn"
                    class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold shadow-lg hover:shadow-xl hover:bg-green-700 transition inline-flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Export to Excel
                </button>
            </div>

            <div id="userListContainer" class="hidden">
                <div class="flex items-center mb-3">
                    <svg class="w-5 h-5 text-red-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7a4 4 0 11-8 0 4 4 0 018 0zM9 14a6 6 0 00-6 6v1h12v-1a6 6 0 00-6-6zM21 12h-6"></path>
                    </svg>
                    <h3 class="text-lg font-semibold text-gray-800">Users Not Following You Back</h3>
                </div>
                <div id="userList" class="max-h-96 overflow-y-auto bg-gray-50 rounded-lg p-4"></div>
            </div>
        </div>
    </div>

    <script>
        let followersData = [];
        let followingData = [];
        let notFollowingBackList = [];

        function parseFollowersFile(jsonData) {
            try {
                const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                return data.map(item => {
                    const username = item.string_list_data?.[0]?.value || '';
                    return username.toLowerCase();
                }).filter(u => u);
            } catch (e) {
                alert('Error parsing followers file. Please check the format.');
                return [];
            }
        }

        function parseFollowingFile(jsonData) {
            try {
                const data = typeof jsonData === 'string' ? JSON.parse(jsonData) : jsonData;
                const followingList = data.relationships_following || data;
                return followingList.map(item => {
                    const username = item.title || '';
                    return username.toLowerCase();
                }).filter(u => u);
            } catch (e) {
                alert('Error parsing following file. Please check the format.');
                return [];
            }
        }

        function handleFileUpload(e, type) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const jsonData = event.target.result;
                
                if (type === 'followers') {
                    followersData = parseFollowersFile(jsonData);
                    document.getElementById('followersStatus').textContent = 
                        `✓ ${followersData.length} followers loaded`;
                    document.getElementById('followersStatus').className = 'mt-3 text-green-600 font-medium';
                } else {
                    followingData = parseFollowingFile(jsonData);
                    document.getElementById('followingStatus').textContent = 
                        `✓ ${followingData.length} following loaded`;
                    document.getElementById('followingStatus').className = 'mt-3 text-green-600 font-medium';
                }

                if (followersData.length > 0 && followingData.length > 0) {
                    document.getElementById('analyzeBtn').disabled = false;
                }
            };
            reader.readAsText(file);
        }

        function analyzeFollowers() {
            if (followersData.length === 0 || followingData.length === 0) {
                alert('Please upload both files first.');
                return;
            }

            const followersSet = new Set(followersData);
            notFollowingBackList = followingData.filter(username => !followersSet.has(username));
            
            document.getElementById('totalFollowers').textContent = followersData.length;
            document.getElementById('totalFollowing').textContent = followingData.length;
            document.getElementById('notFollowingBackCount').textContent = notFollowingBackList.length;

            const userList = document.getElementById('userList');
            userList.innerHTML = '';

            if (notFollowingBackList.length > 0) {
                notFollowingBackList.forEach(username => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between py-2 px-3 mb-2 bg-white rounded shadow-sm hover:shadow-md transition';
                    div.innerHTML = `
                        <span class="text-gray-800">${username}</span>
                        <a href="https://www.instagram.com/${username}" target="_blank" rel="noopener noreferrer"
                           class="text-purple-600 hover:text-purple-800 text-sm font-medium">
                            View Profile →
                        </a>
                    `;
                    userList.appendChild(div);
                });
                document.getElementById('userListContainer').classList.remove('hidden');
            }

            document.getElementById('results').classList.remove('hidden');
        }

        function exportToExcel() {
            // Create workbook
            const wb = XLSX.utils.book_new();

            // Summary sheet
            const summaryData = [
                ['Instagram Follow Back Analysis'],
                ['Generated on', new Date().toLocaleString()],
                [],
                ['Metric', 'Count'],
                ['Total Followers', followersData.length],
                ['Total Following', followingData.length],
                ['Not Following Back', notFollowingBackList.length],
                ['Follow Back Rate', `${((followersData.length / followingData.length) * 100).toFixed(2)}%`]
            ];
            const summarySheet = XLSX.utils.aoa_to_sheet(summaryData);
            
            // Set column widths
            summarySheet['!cols'] = [{ wch: 25 }, { wch: 15 }];
            XLSX.utils.book_append_sheet(wb, summarySheet, 'Summary');

            // Not Following Back sheet
            if (notFollowingBackList.length > 0) {
                const notFollowingData = [
                    ['Username', 'Instagram Link'],
                    ...notFollowingBackList.map(username => [
                        username,
                        `https://www.instagram.com/${username}`
                    ])
                ];
                const notFollowingSheet = XLSX.utils.aoa_to_sheet(notFollowingData);
                notFollowingSheet['!cols'] = [{ wch: 30 }, { wch: 50 }];
                XLSX.utils.book_append_sheet(wb, notFollowingSheet, 'Not Following Back');
            }

            // All Followers sheet
            const followersListData = [
                ['Username'],
                ...followersData.map(username => [username])
            ];
            const followersSheet = XLSX.utils.aoa_to_sheet(followersListData);
            followersSheet['!cols'] = [{ wch: 30 }];
            XLSX.utils.book_append_sheet(wb, followersSheet, 'All Followers');

            // All Following sheet
            const followingListData = [
                ['Username'],
                ...followingData.map(username => [username])
            ];
            const followingSheet = XLSX.utils.aoa_to_sheet(followingListData);
            followingSheet['!cols'] = [{ wch: 30 }];
            XLSX.utils.book_append_sheet(wb, followingSheet, 'All Following');

            // Generate filename with timestamp
            const timestamp = new Date().toISOString().split('T')[0];
            const filename = `instagram_follower_analysis_${timestamp}.xlsx`;

            // Save file
            XLSX.writeFile(wb, filename);
        }

        document.getElementById('followersFile').addEventListener('change', (e) => handleFileUpload(e, 'followers'));
        document.getElementById('followingFile').addEventListener('change', (e) => handleFileUpload(e, 'following'));
        document.getElementById('analyzeBtn').addEventListener('click', analyzeFollowers);
        document.getElementById('exportBtn').addEventListener('click', exportToExcel);
    </script>
</body>
</html>
