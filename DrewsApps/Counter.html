<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #counter-container {
            height: 140px;
            overflow: hidden;
            position: relative;
        }
        
        #counter {
            color: white;
            font-size: 120px;
            font-weight: bold;
            position: relative;
            transition: transform 0.3s ease-out;
        }
        
        .roll-up {
            animation: rollUp 0.3s ease-out;
        }
        
        @keyframes rollUp {
            0% {
                transform: translateY(140px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div id="counter-container">
        <div id="counter">0</div>
    </div>

    <script>
        let count = 0;
        const counterElement = document.getElementById('counter');
        
        const interval = setInterval(() => {
            count++;
            
            // Remove animation class if it exists
            counterElement.classList.remove('roll-up');
            
            // Force reflow to restart animation
            void counterElement.offsetWidth;
            
            // Update number and add animation
            counterElement.textContent = count;
            counterElement.classList.add('roll-up');
            
            if (count === 15) {
                clearInterval(interval);
            }
        }, 500); // 500ms = half a second
    </script>
</body>
</html>
