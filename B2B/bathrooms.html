<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Bathroom Remodeling Leads - Peak Leads Marketing Group</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .form-wrapper {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-top: 30px;
            margin-bottom: 30px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-img {
            max-width: 200px;
            max-height: 80px;
            object-fit: contain;
        }

        .quiz-card {
            background: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
        }

        .step-header {
            font-size: 24px;
            color: #000;
            margin-bottom: 10px;
            line-height: 1.4;
            font-weight: bold;
        }

        .step-subheader {
            font-size: 16px;
            color: #666;
            margin-bottom: 0;
            font-weight: 500;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" 
             alt="Peak Leads Marketing Group" 
             class="logo-img">
    </div>

    <div class="form-wrapper">
        <div class="quiz-card">
            <div class="step-header">Ready to transform your bathroom remodeling business?</div>
            <div class="step-subheader">Our partners connect with 70% of leads, set 50% of those and only pay for the ones that are qualified</div>
        </div>
    </div>
</body>
</html>
