<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>B2B Sales Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        th.sortable { cursor: pointer; user-select: none; }
        .sticky-filters { position: sticky; top: 0; z-index: 20; background: #f9fafb; }
        select[multiple].niche-multi { min-height: 7.5rem; }
        details.lead-disclosure > summary { list-style: none; cursor: pointer; }
        details.lead-disclosure > summary::-webkit-details-marker { display: none; }
        details.lead-disclosure[open] > summary { border-bottom: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="max-w-[96rem] mx-auto p-4 md:p-6">
        <div class="bg-white rounded-xl shadow-sm border border-gray-200">
            <div class="p-4 md:p-5 space-y-4">
                <details id="allLeadsDetails" class="lead-disclosure border border-gray-200 rounded-lg bg-white shadow-sm" open>
                    <summary id="allLeadsSummary" class="px-4 py-3 text-base font-semibold text-gray-900 bg-gray-50 rounded-t-lg hover:bg-gray-100 flex items-center justify-between gap-2">
                        <span>All Leads</span>
                        <span class="flex items-center gap-3 shrink-0">
                            <span class="text-sm font-normal text-gray-500" id="allLeadsSummaryMeta"></span>
                            <button id="clearFiltersBtn" type="button" class="text-sm font-medium text-blue-600 hover:text-blue-800 hover:underline px-1 py-0.5 rounded">Clear filters</button>
                        </span>
                    </summary>

                    <div class="px-5 py-3 text-sm text-gray-600 flex flex-wrap gap-4 border-t border-gray-200 bg-white">
                        <span id="statusText">Loading...</span>
                        <span id="resultCount"></span>
                    </div>

                    <div id="errorBox" class="hidden mx-5 mt-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700"></div>

                    <div class="overflow-auto max-h-[70vh] border-t border-gray-200">
                        <table class="min-w-full text-sm">
                            <thead class="sticky-filters border-b border-gray-200">
                                <tr class="text-left">
                                    <th class="p-3 font-semibold sortable" data-sort-key="businessName">Business Name <span id="sort-businessName"></span></th>
                                    <th class="p-3 font-semibold sortable" data-sort-key="createdTs">Created <span id="sort-createdTs"></span></th>
                                    <th class="p-3 font-semibold sortable" data-sort-key="niches">Niche(s) <span id="sort-niches"></span></th>
                                    <th class="p-3 font-semibold sortable" data-sort-key="source">Source <span id="sort-source"></span></th>
                                    <th class="p-3 font-semibold sortable" data-sort-key="location">Location <span id="sort-location"></span></th>
                                    <th class="p-3 font-semibold sortable" data-sort-key="status">Status <span id="sort-status"></span></th>
                                    <th class="p-3 font-semibold sortable" data-sort-key="discoveryStatus">Discovery Status <span id="sort-discoveryStatus"></span></th>
                                </tr>
                                <tr class="border-t border-gray-200">
                                    <th class="p-2">
                                        <input data-filter="businessName" type="text" placeholder="Filter..." class="w-full rounded border border-gray-300 px-2 py-1">
                                    </th>
                                    <th class="p-2 text-xs text-gray-400">—</th>
                                    <th class="p-2 align-top min-w-[10rem]">
                                        <label for="nicheMulti" class="sr-only">Filter by niche</label>
                                        <select id="nicheMulti" multiple class="niche-multi w-full rounded border border-gray-300 px-1 py-1 text-xs" title="Hold Ctrl (Windows) or Cmd (Mac) to select multiple">
                                        </select>
                                        <p class="text-[10px] text-gray-500 mt-1 leading-tight">Ctrl/Cmd+click for multiple. Empty = all niches.</p>
                                    </th>
                                    <th class="p-2">
                                        <select data-filter="source" class="w-full rounded border border-gray-300 px-2 py-1">
                                            <option value="">All</option>
                                        </select>
                                    </th>
                                    <th class="p-2">
                                        <input data-filter="location" type="text" placeholder="Filter..." class="w-full rounded border border-gray-300 px-2 py-1">
                                    </th>
                                    <th class="p-2">
                                        <select data-filter="status" class="w-full rounded border border-gray-300 px-2 py-1">
                                            <option value="">All</option>
                                        </select>
                                    </th>
                                    <th class="p-2">
                                        <select data-filter="discoveryStatus" class="w-full rounded border border-gray-300 px-2 py-1">
                                            <option value="">All</option>
                                        </select>
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
                        </table>
                    </div>
                </details>

                <details id="discoveryCallsDetails" class="lead-disclosure border border-gray-200 rounded-lg bg-white shadow-sm">
                    <summary id="discoveryCallsSummary" class="px-4 py-3 text-base font-semibold text-gray-900 bg-gray-50 rounded-t-lg hover:bg-gray-100 flex items-center justify-between gap-2">
                        <span>Discovery Calls</span>
                        <span class="text-sm font-normal text-gray-500" id="discoveryCallsSummaryMeta"></span>
                    </summary>
                    <div id="discoveryCallsContainer" class="p-4 space-y-2 border-t border-gray-200 bg-white text-sm">
                        <p class="text-gray-500 text-sm">Loading…</p>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            baseId: "appmBb0lzqRK9dI8v",
            tableId: "tbldNpwtCN9y5Pkiy",
            pageSize: 100
        };

        const state = {
            allRows: [],
            filteredRows: [],
            sortKey: "createdTs",
            sortDir: "desc",
            filters: {
                businessName: "",
                source: "",
                location: "",
                status: "",
                discoveryStatus: ""
            },
            /** Individual niche tags selected in multi-select; empty = no niche filter */
            selectedNiches: []
        };

        const els = {
            clearFiltersBtn: document.getElementById("clearFiltersBtn"),
            nicheMulti: document.getElementById("nicheMulti"),
            tableBody: document.getElementById("tableBody"),
            statusText: document.getElementById("statusText"),
            resultCount: document.getElementById("resultCount"),
            errorBox: document.getElementById("errorBox"),
            discoveryCallsContainer: document.getElementById("discoveryCallsContainer"),
            allLeadsSummaryMeta: document.getElementById("allLeadsSummaryMeta"),
            discoveryCallsSummaryMeta: document.getElementById("discoveryCallsSummaryMeta")
        };

        function safeText(v) {
            return (v == null ? "" : String(v)).trim();
        }

        function asList(v) {
            if (Array.isArray(v)) return v.map((x) => safeText(x)).filter(Boolean);
            if (!v) return [];
            return [safeText(v)].filter(Boolean);
        }

        function normalizeRecord(record) {
            const fields = record.fields || {};
            const niches = asList(fields["Niche(s)"]);
            const createdRaw = fields["Created"] || record.createdTime || "";
            const createdTs = new Date(createdRaw).getTime();

            return {
                id: record.id,
                businessName: safeText(fields["Business Name"]),
                created: safeText(createdRaw),
                createdTs: Number.isFinite(createdTs) ? createdTs : 0,
                nicheTags: niches,
                niches: niches.join(", "),
                source: safeText(fields["Source"]),
                location: safeText(fields["Location"]),
                status: safeText(fields["Status"]),
                discoveryStatus: safeText(fields["Discovery Status"])
            };
        }

        function formatCreated(isoValue) {
            if (!isoValue) return "—";
            const d = new Date(isoValue);
            if (Number.isNaN(d.getTime())) return "—";
            return d.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function sortRows(rows) {
            rows.sort((a, b) => {
                const key = state.sortKey;
                const av = a[key] == null ? "" : a[key];
                const bv = b[key] == null ? "" : b[key];

                let cmp = 0;
                if (typeof av === "number" && typeof bv === "number") {
                    cmp = av - bv;
                } else {
                    cmp = String(av).localeCompare(String(bv), undefined, { sensitivity: "base" });
                }
                return state.sortDir === "asc" ? cmp : -cmp;
            });
        }

        function renderLeadRowsHtml(rows, opts = {}) {
            const includeDiscovery = opts.includeDiscovery !== false;
            return rows.map((row) => {
                const discCell = includeDiscovery
                    ? `<td class="p-3">${escapeHtml(row.discoveryStatus || "—")}</td>`
                    : "";
                return `
                <tr class="hover:bg-gray-50 align-top">
                    <td class="p-3 font-medium text-gray-900">${escapeHtml(row.businessName || "—")}</td>
                    <td class="p-3 whitespace-nowrap">${escapeHtml(formatCreated(row.created))}</td>
                    <td class="p-3">${escapeHtml(row.niches || "—")}</td>
                    <td class="p-3">${escapeHtml(row.source || "—")}</td>
                    <td class="p-3">${escapeHtml(row.location || "—")}</td>
                    <td class="p-3">${escapeHtml(row.status || "—")}</td>
                    ${discCell}
                </tr>`;
            }).join("");
        }

        function updateDisclosureSummaries() {
            if (els.allLeadsSummaryMeta) {
                els.allLeadsSummaryMeta.textContent = `${state.filteredRows.length} shown · ${state.allRows.length} total`;
            }
        }

        function renderDiscoveryCalls() {
            const container = els.discoveryCallsContainer;
            if (!container) return;

            const withDisc = state.allRows.filter((r) => safeText(r.discoveryStatus));
            if (els.discoveryCallsSummaryMeta) {
                els.discoveryCallsSummaryMeta.textContent = withDisc.length
                    ? `${withDisc.length} with discovery status`
                    : "None with discovery status";
            }

            if (!withDisc.length) {
                container.innerHTML = '<p class="text-gray-500 py-2">No leads with a discovery status yet.</p>';
                return;
            }

            const groups = new Map();
            for (const row of withDisc) {
                const k = row.discoveryStatus;
                if (!groups.has(k)) groups.set(k, []);
                groups.get(k).push(row);
            }

            const statuses = [...groups.keys()].sort((a, b) => a.localeCompare(b));

            const subHead = `
                <thead class="bg-gray-50 border-b border-gray-200 text-left text-xs font-semibold text-gray-600 uppercase tracking-wide">
                    <tr>
                        <th class="p-2">Business Name</th>
                        <th class="p-2">Created</th>
                        <th class="p-2">Niche(s)</th>
                        <th class="p-2">Source</th>
                        <th class="p-2">Location</th>
                        <th class="p-2">Status</th>
                    </tr>
                </thead>`;

            container.innerHTML = statuses.map((status) => {
                const rows = [...groups.get(status)];
                sortRows(rows);
                const esc = escapeHtml(status);
                return `
                    <details class="lead-disclosure border border-gray-200 rounded-lg overflow-hidden">
                        <summary class="px-3 py-2.5 font-medium text-gray-900 bg-gray-50 hover:bg-gray-100 flex items-center justify-between gap-2">
                            <span>${esc}</span>
                            <span class="text-sm font-normal text-gray-500">${rows.length}</span>
                        </summary>
                        <div class="overflow-x-auto max-h-[40vh] border-t border-gray-100">
                            <table class="min-w-full text-sm">
                                ${subHead}
                                <tbody class="divide-y divide-gray-100">${renderLeadRowsHtml(rows, { includeDiscovery: false })}</tbody>
                            </table>
                        </div>
                    </details>`;
            }).join("");
        }

        async function fetchAllB2BLeads() {
            const rows = [];
            let offset = "";

            do {
                const qp = new URLSearchParams({
                    pageSize: String(CONFIG.pageSize)
                });
                if (offset) qp.set("offset", offset);
                const url = `/api/airtable/v0/${CONFIG.baseId}/${CONFIG.tableId}?` + qp.toString();

                const response = await fetch(url);
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`Airtable fetch failed (${response.status}): ${text || response.statusText}`);
                }
                const data = await response.json();
                rows.push(...(data.records || []));
                offset = data.offset || "";
            } while (offset);

            return rows;
        }

        function readSelectedNichesFromDom() {
            const sel = els.nicheMulti;
            if (!sel) return [];
            return [...sel.selectedOptions].map((o) => o.value).filter(Boolean);
        }

        function updateNicheMultiOptions(rows) {
            const selected = new Set(readSelectedNichesFromDom());
            const tags = new Set();
            rows.forEach((row) => {
                (row.nicheTags || []).forEach((t) => tags.add(t));
            });
            const sorted = [...tags].sort((a, b) => a.localeCompare(b));
            els.nicheMulti.innerHTML = sorted.map((v) => {
                const esc = escapeHtml(v);
                const sel = selected.has(v) ? " selected" : "";
                return `<option value="${esc}"${sel}>${esc}</option>`;
            }).join("");
            state.selectedNiches = readSelectedNichesFromDom();
        }

        function updateSelectOptions(rows) {
            const optionTargets = [
                { key: "source", element: document.querySelector('select[data-filter="source"]') },
                { key: "status", element: document.querySelector('select[data-filter="status"]') },
                { key: "discoveryStatus", element: document.querySelector('select[data-filter="discoveryStatus"]') }
            ];

            optionTargets.forEach(({ key, element }) => {
                const previous = state.filters[key] || "";
                const values = [...new Set(rows.map((row) => row[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
                element.innerHTML = '<option value="">All</option>' + values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
                element.value = previous;
            });

            updateNicheMultiOptions(rows);
        }

        function applyFiltersAndSort() {
            const nicheFilter = state.selectedNiches;

            const filtered = state.allRows.filter((row) => {
                if (state.filters.businessName && !row.businessName.toLowerCase().includes(state.filters.businessName.toLowerCase())) return false;
                if (nicheFilter.length > 0) {
                    const tags = row.nicheTags || [];
                    const any = nicheFilter.some((n) => tags.includes(n));
                    if (!any) return false;
                }
                if (state.filters.source && row.source !== state.filters.source) return false;
                if (state.filters.location && !row.location.toLowerCase().includes(state.filters.location.toLowerCase())) return false;
                if (state.filters.status && row.status !== state.filters.status) return false;
                if (state.filters.discoveryStatus && row.discoveryStatus !== state.filters.discoveryStatus) return false;

                return true;
            });

            sortRows(filtered);

            state.filteredRows = filtered;
            renderTable();
            renderSortIndicators();
            updateDisclosureSummaries();
            renderDiscoveryCalls();
            els.resultCount.textContent = `${filtered.length} of ${state.allRows.length} leads shown`;
        }

        function renderSortIndicators() {
            document.querySelectorAll("[id^='sort-']").forEach((el) => { el.textContent = ""; });
            const active = document.getElementById(`sort-${state.sortKey}`);
            if (active) active.textContent = state.sortDir === "asc" ? "▲" : "▼";
        }

        function renderTable() {
            if (!state.filteredRows.length) {
                els.tableBody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-500">No leads match current filters.</td></tr>';
                return;
            }

            els.tableBody.innerHTML = renderLeadRowsHtml(state.filteredRows, { includeDiscovery: true });
        }

        function showError(message) {
            els.errorBox.textContent = message;
            els.errorBox.classList.remove("hidden");
        }

        function hideError() {
            els.errorBox.classList.add("hidden");
            els.errorBox.textContent = "";
        }

        async function loadData() {
            hideError();
            els.statusText.textContent = "Loading leads from Airtable...";
            try {
                const raw = await fetchAllB2BLeads();
                state.allRows = raw.map(normalizeRecord);
                updateSelectOptions(state.allRows);
                applyFiltersAndSort();
                els.statusText.textContent = "Loaded successfully";
            } catch (error) {
                showError(error.message || "Failed to load Airtable data.");
                els.statusText.textContent = "Load failed";
                els.resultCount.textContent = "";
                if (els.discoveryCallsContainer) {
                    els.discoveryCallsContainer.innerHTML = '<p class="text-gray-500 py-2">Could not load discovery data.</p>';
                }
                if (els.discoveryCallsSummaryMeta) els.discoveryCallsSummaryMeta.textContent = "";
            }
        }

        function wireEvents() {
            els.clearFiltersBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.filters = {
                    businessName: "",
                    source: "",
                    location: "",
                    status: "",
                    discoveryStatus: ""
                };
                state.selectedNiches = [];

                document.querySelectorAll("[data-filter]").forEach((input) => { input.value = ""; });
                if (els.nicheMulti) {
                    [...els.nicheMulti.options].forEach((opt) => { opt.selected = false; });
                }
                applyFiltersAndSort();
            });

            document.querySelectorAll("[data-filter]").forEach((input) => {
                input.addEventListener("input", () => {
                    const key = input.getAttribute("data-filter");
                    state.filters[key] = input.value || "";
                    applyFiltersAndSort();
                });
                input.addEventListener("change", () => {
                    const key = input.getAttribute("data-filter");
                    state.filters[key] = input.value || "";
                    applyFiltersAndSort();
                });
            });

            if (els.nicheMulti) {
                els.nicheMulti.addEventListener("change", () => {
                    state.selectedNiches = readSelectedNichesFromDom();
                    applyFiltersAndSort();
                });
            }

            document.querySelectorAll("th.sortable").forEach((th) => {
                th.addEventListener("click", () => {
                    const key = th.getAttribute("data-sort-key");
                    if (!key) return;
                    if (state.sortKey === key) {
                        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
                    } else {
                        state.sortKey = key;
                        state.sortDir = key === "createdTs" ? "desc" : "asc";
                    }
                    applyFiltersAndSort();
                });
            });
        }

        wireEvents();
        loadData();
    </script>
</body>
</html>
