    <script>
        const CONFIG = {
            baseId: "appmBb0lzqRK9dI8v",
            tableId: "tbldNpwtCN9y5Pkiy",
            pageSize: 100
        };

        /** Known Niche(s) options from schema; merged with values present in loaded data. */
        const SCHEMA_NICHE_OPTIONS = [
            "Bathroom remodeling",
            "Sprinkler & irrigation",
            "Concrete polishing",
            "Fencing",
            "Line striping",
            "Commercial roof coating",
            "Patios",
            "Basement & attic finishing",
            "EV charging",
            "Decks",
            "Custom closets",
            "Restoration",
            "Foundation repair",
            "Pools",
            "Hardwood flooring",
            "Kitchen remodeling"
        ];

        /** Discovery Calls subsection order (must match Airtable single-select option text). */
        const DISCOVERY_STATUS_ORDER = [
            "Upcoming",
            "Agreement Pending",
            "No Show",
            "Close Won",
            "Close Lost",
            "Unqualified"
        ];
        const DISCOVERY_STATUS_ORDER_INDEX = new Map(
            DISCOVERY_STATUS_ORDER.map((label, i) => [label.toLowerCase(), i])
        );

        function sortDiscoveryStatusKeys(keys) {
            return [...keys].sort((a, b) => {
                const ia = DISCOVERY_STATUS_ORDER_INDEX.has(a.toLowerCase())
                    ? DISCOVERY_STATUS_ORDER_INDEX.get(a.toLowerCase())
                    : 1000;
                const ib = DISCOVERY_STATUS_ORDER_INDEX.has(b.toLowerCase())
                    ? DISCOVERY_STATUS_ORDER_INDEX.get(b.toLowerCase())
                    : 1000;
                if (ia !== ib) return ia - ib;
                return a.localeCompare(b);
            });
        }

        const state = {
            allRows: [],
            filteredRows: [],
            sortKey: "createdTs",
            sortDir: "desc",
            filters: {
                businessName: "",
                source: "",
                location: "",
                status: "",
                discoveryStatus: ""
            },
            /** Individual niche tags selected in checkbox dropdown; empty = no niche filter */
            selectedNiches: [],
            dataLoaded: false,
            loadPromise: null,
            nichePanelOpen: false,
            leadAutosaveTimer: null,
            leadModalHydrating: false,
            leadSaveInFlight: false,
            leadAutosavePending: false
        };

        const els = {
            clearFiltersBtn: document.getElementById("clearFiltersBtn"),
            tableBody: document.getElementById("tableBody"),
            statusText: document.getElementById("statusText"),
            resultCount: document.getElementById("resultCount"),
            errorBox: document.getElementById("errorBox"),
            discoveryCallsContainer: document.getElementById("discoveryCallsContainer"),
            allLeadsSummaryMeta: document.getElementById("allLeadsSummaryMeta"),
            discoveryCallsSummaryMeta: document.getElementById("discoveryCallsSummaryMeta"),
            allLeadsDetails: document.getElementById("allLeadsDetails"),
            discoveryCallsDetails: document.getElementById("discoveryCallsDetails"),
            nicheDropdownWrap: document.getElementById("nicheDropdownWrap"),
            nicheDropdownBtn: document.getElementById("nicheDropdownBtn"),
            nicheDropdownPanel: document.getElementById("nicheDropdownPanel"),
            nicheDropdownLabel: document.getElementById("nicheDropdownLabel"),
            nicheCheckboxList: document.getElementById("nicheCheckboxList"),
            createLeadBtn: document.getElementById("createLeadBtn"),
            leadEditModal: document.getElementById("leadEditModal"),
            leadEditModalBackdrop: document.getElementById("leadEditModalBackdrop"),
            leadEditModalClose: document.getElementById("leadEditModalClose"),
            leadEditModalError: document.getElementById("leadEditModalError"),
            leadEditForm: document.getElementById("leadEditForm"),
            leadEditCancel: document.getElementById("leadEditCancel"),
            leadSaveStatus: document.getElementById("leadSaveStatus"),
            leadEditModalTitle: document.getElementById("leadEditModalTitle"),
            leadEditModalRecordId: document.getElementById("leadEditModalRecordId"),
            leadFieldBusinessName: document.getElementById("leadFieldBusinessName"),
            leadFieldCreatedDisplay: document.getElementById("leadFieldCreatedDisplay"),
            leadFieldSource: document.getElementById("leadFieldSource"),
            leadFieldLocation: document.getElementById("leadFieldLocation"),
            leadFieldStatus: document.getElementById("leadFieldStatus"),
            leadFieldDiscoveryStatus: document.getElementById("leadFieldDiscoveryStatus"),
            leadFieldPhone: document.getElementById("leadFieldPhone"),
            leadFieldWebsite: document.getElementById("leadFieldWebsite"),
            leadFieldContactName: document.getElementById("leadFieldContactName"),
            leadFieldContactEmail: document.getElementById("leadFieldContactEmail"),
            leadFieldNotes: document.getElementById("leadFieldNotes"),
            leadFieldNiches: document.getElementById("leadFieldNiches")
        };

        function safeText(v) {
            return (v == null ? "" : String(v)).trim();
        }

        function asList(v) {
            if (Array.isArray(v)) {
                return v.map((x) => {
                    if (x && typeof x === "object" && x.name != null) return safeText(x.name);
                    return safeText(x);
                }).filter(Boolean);
            }
            if (!v) return [];
            return [safeText(v)].filter(Boolean);
        }

        function normalizeRecord(record) {
            const fields = record.fields || {};
            const niches = asList(fields["Niche(s)"]);
            const createdRaw = fields["Created"] || record.createdTime || "";
            const createdTs = new Date(createdRaw).getTime();

            return {
                id: record.id,
                businessName: safeText(fields["Business Name"]),
                created: safeText(createdRaw),
                createdTs: Number.isFinite(createdTs) ? createdTs : 0,
                nicheTags: niches,
                niches: niches.join(", "),
                source: safeText(fields["Source"]),
                location: safeText(fields["Location"]),
                status: safeText(fields["Status"]),
                discoveryStatus: safeText(fields["Discovery Status"]),
                phoneNumber: safeText(fields["Phone Number"]),
                website: safeText(fields["Website"]),
                contactName: safeText(fields["Contact Name"]),
                contactEmail: safeText(fields["Contact Email"]),
                notes: fields["Notes"] == null ? "" : String(fields["Notes"])
            };
        }

        function formatCreated(isoValue) {
            if (!isoValue) return "â€”";
            const d = new Date(isoValue);
            if (Number.isNaN(d.getTime())) return "â€”";
            return d.toLocaleString("en-US", { dateStyle: "medium", timeStyle: "short" });
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function getAllNicheOptionStrings() {
            const set = new Set(SCHEMA_NICHE_OPTIONS);
            if (state.dataLoaded) {
                state.allRows.forEach((r) => {
                    (r.nicheTags || []).forEach((t) => set.add(t));
                });
            }
            return [...set].sort((a, b) => a.localeCompare(b));
        }

        function sortedUniqueRowField(rowKey) {
            return [...new Set(state.allRows.map((r) => safeText(r[rowKey])).filter(Boolean))].sort((a, b) => a.localeCompare(b));
        }

        function alphaSelectOptionsWithCurrent(rowKey, currentValue) {
            const set = new Set(sortedUniqueRowField(rowKey));
            const cur = safeText(currentValue);
            if (cur) set.add(cur);
            return [...set].sort((a, b) => a.localeCompare(b));
        }

        function discoverySelectOptionsWithCurrent(currentValue) {
            const keys = new Set(DISCOVERY_STATUS_ORDER);
            state.allRows.forEach((r) => {
                const v = safeText(r.discoveryStatus);
                if (v) keys.add(v);
            });
            const cur = safeText(currentValue);
            if (cur) keys.add(cur);
            return sortDiscoveryStatusKeys(keys);
        }

        function setLeadModalSelectOptions(selectEl, optionStrings, currentValue) {
            if (!selectEl) return;
            const cur = safeText(currentValue);
            selectEl.innerHTML = '<option value="">â€”</option>'
                + optionStrings.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
            selectEl.value = cur;
        }

        /** Populate single-select dropdowns from loaded data (Airtable single-select fields). */
        function fillLeadModalSingleSelects(row) {
            const src = row ? row.source : "";
            const loc = row ? row.location : "";
            const st = row ? row.status : "";
            const disc = row ? row.discoveryStatus : "";
            setLeadModalSelectOptions(els.leadFieldSource, alphaSelectOptionsWithCurrent("source", src), src);
            setLeadModalSelectOptions(els.leadFieldLocation, alphaSelectOptionsWithCurrent("location", loc), loc);
            setLeadModalSelectOptions(els.leadFieldStatus, alphaSelectOptionsWithCurrent("status", st), st);
            setLeadModalSelectOptions(els.leadFieldDiscoveryStatus, discoverySelectOptionsWithCurrent(disc), disc);
        }

        function buildLeadModalNicheCheckboxes(selectedTags) {
            const sel = new Set(selectedTags || []);
            const opts = getAllNicheOptionStrings();
            return opts.map((tag, idx) => {
                const esc = escapeHtml(tag);
                const id = `lead-niche-cb-${idx}`;
                const checked = sel.has(tag) ? " checked" : "";
                return `<label for="${id}" class="flex cursor-pointer items-center gap-2 rounded px-1 py-0.5 hover:bg-white">
                    <input type="checkbox" id="${id}" class="lead-niche-cb rounded border-gray-300 text-blue-600" value="${esc}"${checked}>
                    <span class="text-xs">${esc}</span>
                </label>`;
            }).join("");
        }

        function getRowById(recordId) {
            return state.allRows.find((r) => r.id === recordId);
        }

        function hideLeadModalError() {
            if (els.leadEditModalError) {
                els.leadEditModalError.textContent = "";
                els.leadEditModalError.classList.add("hidden");
            }
        }

        function showLeadModalError(message) {
            if (!els.leadEditModalError) return;
            els.leadEditModalError.textContent = message;
            els.leadEditModalError.classList.remove("hidden");
        }

        function clearLeadAutosaveTimer() {
            if (state.leadAutosaveTimer) {
                clearTimeout(state.leadAutosaveTimer);
                state.leadAutosaveTimer = null;
            }
        }

        function setLeadSaveStatus(text, isError) {
            if (!els.leadSaveStatus) return;
            els.leadSaveStatus.textContent = text || "";
            els.leadSaveStatus.className = "text-sm text-right min-w-0 " + (isError ? "text-red-600" : "text-gray-500");
        }

        function scheduleLeadAutosave() {
            if (!els.leadEditModal || els.leadEditModal.classList.contains("hidden")) return;
            if (state.leadModalHydrating) return;
            clearLeadAutosaveTimer();
            state.leadAutosaveTimer = setTimeout(() => {
                state.leadAutosaveTimer = null;
                void flushLeadAutosave();

        async function patchLeadRecord(recordId, fields) {
            const url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableId)}/${recordId}`;
            const response = await fetch(url, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ fields })
            });
            const raw = await response.text();
            let data = {};
            try {
                data = raw ? JSON.parse(raw) : {};
            } catch {
                data = {};
            }
            if (!response.ok) {
                const msg = (data && data.error && data.error.message) || raw || `${response.status} ${response.statusText}`;
                throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
            }
            return data;
        }

        async function createLeadRecord(fields) {
            const url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableId)}`;
            const response = await fetch(url, {

                body: JSON.stringify({ fields })
            });

            } catch {
                data = {};
            }
            if (!response.ok) {
                const msg = (data && data.error && data.error.message) || raw || `${response.status} ${response.statusText}`;
                throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
            }
            return data;
        }

        function mergeLeadPatchIntoRow(row, patchFields) {
            if (!row) return patchFields || {};
            const base = {
                "Business Name": row.businessName,
                Source: row.source,
                Location: row.location,
                Status: row.status,
                "Discovery Status": row.discoveryStatus,
                "Phone Number": row.phoneNumber,
                Website: row.website,
                "Contact Name": row.contactName,
                "Contact Email": row.contactEmail,
                Notes: row.notes,
                "Niche(s)": [...(row.nicheTags || [])],
                Created: row.created || undefined
            };
            return Object.assign({}, base, patchFields || {});
        }

        async function flushLeadAutosave() {
            if (!els.leadEditModal || els.leadEditModal.classList.contains("hidden")) return;
            if (state.leadModalHydrating) return;
            if (state.leadSaveInFlight) {
                state.leadAutosavePending = true;
                return;
            }

            state.leadSaveInFlight = true;
            hideLeadModalError();
            setLeadSaveStatus("Savingâ€¦");

            const mode = els.leadEditModal.dataset.modalMode || "edit";
            try {
                let recordId = els.leadEditModal.dataset.recordId || "";

                if (mode === "create" && !recordId) {
                    const fields = collectLeadFieldsFromForm();
                    const created = await createLeadRecord(fields);
                    const normalized = normalizeRecord(created);
                    state.allRows.push(normalized);
                    if (!state.dataLoaded) state.dataLoaded = true;
                    recordId = created.id || normalized.id;
                    els.leadEditModal.dataset.modalMode = "edit";
                    els.leadEditModal.dataset.recordId = recordId;
                    if (els.leadEditModalRecordId) els.leadEditModalRecordId.textContent = recordId;
                    if (els.leadEditModalTitle) els.leadEditModalTitle.textContent = normalized.businessName || "Lead";
                    if (els.leadFieldCreatedDisplay) {
                        els.leadFieldCreatedDisplay.textContent = formatCreated(normalized.created);
                    }
                    fillLeadModalSingleSelects(normalized);
                    updateSelectOptions(state.allRows);
                    applyFiltersAndSort();
                    setLeadSaveStatus("Saved");
                    return;
                }

                if (!recordId) {
                    setLeadSaveStatus("");
                    return;
                }

                const fields = collectLeadFieldsFromForm();
                const updated = await patchLeadRecord(recordId, fields);
                const prev = getRowById(recordId);
                const normalized = normalizeRecord({
                    id: updated.id || recordId,
                    createdTime: updated.createdTime,
                    fields: mergeLeadPatchIntoRow(prev, updated.fields)
                });
                const idx = state.allRows.findIndex((r) => r.id === recordId);
                if (idx >= 0) state.allRows[idx] = normalized;
                else state.allRows.push(normalized);

                updateSelectOptions(state.allRows);
                applyFiltersAndSort();
                setLeadSaveStatus("Saved");
            } catch (err) {
                showLeadModalError(err.message || (mode === "create" ? "Create failed." : "Save failed."));
                setLeadSaveStatus("Save failed", true);
            } finally {
                state.leadSaveInFlight = false;
                if (state.leadAutosavePending) {
                    state.leadAutosavePending = false;
                    scheduleLeadAutosave();
                }
            }
        }

        function sortRows(rows) {
            rows.sort((a, b) => {
                const key = state.sortKey;
                const av = a[key] == null ? "" : a[key];
                const bv = b[key] == null ? "" : b[key];

                let cmp = 0;
                if (typeof av === "number" && typeof bv === "number") {
                    cmp = av - bv;
                } else {
                    cmp = String(av).localeCompare(String(bv), undefined, { sensitivity: "base" });
                }
                return state.sortDir === "asc" ? cmp : -cmp;
            });
        }

            for (const row of withDisc) {
                const k = row.discoveryStatus;

            const statuses = sortDiscoveryStatusKeys(groups.keys());

        async function fetchAllB2BLeads() {
            const rows = [];
            let offset = "";

            do {
                const qp = new URLSearchParams({
                    pageSize: String(CONFIG.pageSize)
                });
                if (offset) qp.set("offset", offset);
                const url = `/api/airtable/v0/${CONFIG.baseId}/${CONFIG.tableId}?` + qp.toString();

                const response = await fetch(url);
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`Airtable fetch failed (${response.status}): ${text || response.statusText}`);
                }
                const data = await response.json();
                rows.push(...(data.records || []));
                offset = data.offset || "";
            } while (offset);

            return rows;
        }

        function updateNicheCheckboxOptions(rows) {

            rows.forEach((row) => {

            els.nicheCheckboxList.innerHTML = sorted.map((tag, idx) => {

                const id = `niche-cb-${idx}`;

                return `<label for="${id}" class="flex cursor-pointer items-center gap-2 rounded px-1 py-0.5 hover:bg-gray-50 text-xs">
                    <input type="checkbox" id="${id}" class="niche-cb rounded border-gray-300 text-blue-600" value="${esc}"${checked}>
                    <span class="truncate">${esc}</span>

        function updateSelectOptions(rows) {
            const optionTargets = [
                { key: "source", element: document.querySelector('select[data-filter="source"]') },
                { key: "status", element: document.querySelector('select[data-filter="status"]') },
                { key: "discoveryStatus", element: document.querySelector('select[data-filter="discoveryStatus"]') }
            ];

            optionTargets.forEach(({ key, element }) => {
                const previous = state.filters[key] || "";
                const values = [...new Set(rows.map((row) => row[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b));
                element.innerHTML = '<option value="">All</option>' + values.map((v) => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
                element.value = previous;
            });

            updateNicheCheckboxOptions(rows);
        }

        function applyFiltersAndSort() {
            if (!state.dataLoaded) {
                state.filteredRows = [];
                updateDisclosureSummaries();
                if (els.resultCount) els.resultCount.textContent = "";
                renderTable();
                renderSortIndicators();
                return;
            }

            const nicheFilter = state.selectedNiches;

            const filtered = state.allRows.filter((row) => {
                if (state.filters.businessName && !row.businessName.toLowerCase().includes(state.filters.businessName.toLowerCase())) return false;
                if (nicheFilter.length > 0) {
                    const tags = row.nicheTags || [];
                    const any = nicheFilter.some((n) => tags.includes(n));
                    if (!any) return false;
                }
                if (state.filters.source && row.source !== state.filters.source) return false;
                if (state.filters.location && !row.location.toLowerCase().includes(state.filters.location.toLowerCase())) return false;
                if (state.filters.status && row.status !== state.filters.status) return false;
                if (state.filters.discoveryStatus && row.discoveryStatus !== state.filters.discoveryStatus) return false;

                return true;
            });

            sortRows(filtered);

            state.filteredRows = filtered;
            renderTable();
            renderSortIndicators();
            updateDisclosureSummaries();
            renderDiscoveryCalls();
            if (els.resultCount) els.resultCount.textContent = `${filtered.length} of ${state.allRows.length} leads shown`;
        }

        function renderSortIndicators() {
            document.querySelectorAll("[id^='sort-']").forEach((el) => { el.textContent = ""; });
            const active = document.getElementById(`sort-${state.sortKey}`);
            if (active) active.textContent = state.sortDir === "asc" ? "â–²" : "â–¼";

                els.tableBody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-500 whitespace-normal">Loading leads from Airtableâ€¦</td></tr>';

        function showError(message) {

        async function loadData() {
            hideError();
            els.statusText.textContent = "Loading leads from Airtableâ€¦";
            els.tableBody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-500 whitespace-normal">Loadingâ€¦</td></tr>';
            try {
                const raw = await fetchAllB2BLeads();
                state.allRows = raw.map(normalizeRecord);
                state.dataLoaded = true;
                updateSelectOptions(state.allRows);
                applyFiltersAndSort();
                els.statusText.textContent = "Loaded successfully";
            } catch (error) {
                state.dataLoaded = false;
                state.allRows = [];
                showError(error.message || "Failed to load Airtable data.");
                els.statusText.textContent = "Load failed â€” fix the error and expand All Leads again (or refresh) to retry.";
                if (els.resultCount) els.resultCount.textContent = "";
                if (els.discoveryCallsContainer) {
                    els.discoveryCallsContainer.innerHTML = '<p class="text-gray-500 py-2">Could not load discovery data.</p>';
                }
                if (els.discoveryCallsSummaryMeta) els.discoveryCallsSummaryMeta.textContent = "";
                renderTable();
                updateDisclosureSummaries();
            }
        }

        async function ensureLeadsLoaded() {
            if (state.dataLoaded) {
                applyFiltersAndSort();
                return;
            }
            if (state.loadPromise) {
                await state.loadPromise;
                return;
            }
            state.loadPromise = loadData().finally(() => {
                state.loadPromise = null;
            });
            await state.loadPromise;
        }

        function wireEvents() {
            if (els.createLeadBtn) {
                els.createLeadBtn.addEventListener("click", () => openCreateLeadEditor());
            }

            els.clearFiltersBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                state.filters = {
                    businessName: "",
                    source: "",
                    location: "",
                    status: "",
                    discoveryStatus: ""
                };
                state.selectedNiches = [];

                document.querySelectorAll("[data-filter]").forEach((input) => { input.value = ""; });
                if (els.nicheCheckboxList) {
                    els.nicheCheckboxList.querySelectorAll("input.niche-cb").forEach((cb) => { cb.checked = false; });
                }
                state.selectedNiches = [];
                updateNicheDropdownLabel();
                applyFiltersAndSort();
            });

            document.querySelectorAll("[data-filter]").forEach((input) => {
                input.addEventListener("input", () => {
                    const key = input.getAttribute("data-filter");
                    state.filters[key] = input.value || "";
                    applyFiltersAndSort();
                });
                input.addEventListener("change", () => {
                    const key = input.getAttribute("data-filter");
                    state.filters[key] = input.value || "";
                    applyFiltersAndSort();
                });
            });

            if (els.nicheDropdownBtn && els.nicheDropdownPanel) {
                els.nicheDropdownBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const willOpen = els.nicheDropdownPanel.classList.contains("hidden");
                    setNichePanelOpen(willOpen);
                });
            }

            if (els.nicheCheckboxList) {
                els.nicheCheckboxList.addEventListener("change", () => {
                    state.selectedNiches = syncNichesFromCheckboxList();
                    updateNicheDropdownLabel();
                    applyFiltersAndSort();
                });
            }

            document.addEventListener("mousedown", (e) => {
                if (!state.nichePanelOpen || !els.nicheDropdownWrap) return;
                if (!els.nicheDropdownWrap.contains(e.target)) setNichePanelOpen(false);
            });

            if (els.allLeadsDetails) {
                els.allLeadsDetails.addEventListener("toggle", () => {
                    if (els.allLeadsDetails.open) void ensureLeadsLoaded();
                });
            }
            if (els.discoveryCallsDetails) {
                els.discoveryCallsDetails.addEventListener("toggle", () => {
                    if (els.discoveryCallsDetails.open) void ensureLeadsLoaded();
                });
            }

            document.querySelectorAll("th.sortable").forEach((th) => {
                th.addEventListener("click", () => {
                    const key = th.getAttribute("data-sort-key");
                    if (!key) return;
                    if (state.sortKey === key) {
                        state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
                    } else {
                        state.sortKey = key;
                        state.sortDir = key === "createdTs" ? "desc" : "asc";
                    }
                    applyFiltersAndSort();
                });
            });

            function onLeadRowClick(e) {
                const tr = e.target.closest("tr.lead-row[data-record-id]");
                if (!tr || !tr.dataset.recordId) return;
                openLeadEditor(tr.dataset.recordId);
            }
            if (els.allLeadsDetails) {
                els.allLeadsDetails.addEventListener("click", onLeadRowClick);
            }
            if (els.discoveryCallsDetails) {
                els.discoveryCallsDetails.addEventListener("click", onLeadRowClick);
            }

            if (els.leadEditForm) {
                els.leadEditForm.addEventListener("submit", (e) => e.preventDefault());
                els.leadEditForm.addEventListener("input", () => scheduleLeadAutosave());
                els.leadEditForm.addEventListener("change", () => scheduleLeadAutosave());
            }
            if (els.leadEditModalClose) els.leadEditModalClose.addEventListener("click", closeLeadEditor);
            if (els.leadEditCancel) els.leadEditCancel.addEventListener("click", closeLeadEditor);
            if (els.leadEditModalBackdrop) els.leadEditModalBackdrop.addEventListener("click", closeLeadEditor);

            document.addEventListener("keydown", (e) => {
                if (e.key !== "Escape") return;
                if (els.leadEditModal && !els.leadEditModal.classList.contains("hidden")) closeLeadEditor();
            });
        }

        wireEvents();
        applyFiltersAndSort();
        if (els.allLeadsDetails && els.allLeadsDetails.open) void ensureLeadsLoaded();
    </script>
</body>
</html>
