<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Good News — Your Area is Open</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #333;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 2rem;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  h1 { font-size: 1.8rem; margin-bottom: 1rem; }
  p  { font-size: 1rem; color: #555; margin-bottom: 2rem; }

  .btn {
    display: block;
    border-radius: 5px;
    text-decoration: none;
    transition: background 0.3s;
    text-align: center;
    padding: 1rem 1.5rem;
    max-width: 350px;
    margin: 0 auto 1.5rem auto;
    font-weight: bold;
  }
  .lockin-btn { background: #4a6fa5; color: white; }
  .lockin-btn:hover { background: #3a5f95; }
  .lockin-btn .main-text { display:block; font-size:1.1rem; font-weight:700; }
  .lockin-btn .sub-text  { display:block; font-size:.8rem; font-weight:400; opacity:.9; margin-top:.2rem; line-height:1.3; }

  .btn-secondary { background:#ddd; color:#333; }
  .btn-secondary:hover { background:#ccc; }
</style>

<script>
(function () {
  const WEBHOOK = 'https://hook.us2.make.com/s6ffnemla3z1wvkhtmx5y3c2uyrfdnkv';
  const LEAD_KEYS = ['name','email','phone'];
  const params = new URLSearchParams(location.search);

  // 1) Save incoming values to sessionStorage
  LEAD_KEYS.forEach(k => {
    const v = params.get(k);
    if (v) sessionStorage.setItem('lead_' + k, v);
  });

  // 2) Build "out" values (from URL or storage)
  const out = new URLSearchParams();
  LEAD_KEYS.forEach(k => {
    const v = params.get(k) || sessionStorage.getItem('lead_' + k);
    if (v) out.set(k, v);
  });

  // Phone normalization for Cal.com
  function normalizePhone(v){
    if(!v) return '';
    const plus = v.trim().startsWith('+');
    const digits = (v.match(/\d+/g)||[]).join('');
    if(!digits) return '';
    if(!plus && digits.length === 10) return '+1' + digits; // tweak if non-US
    return (plus ? '+' : '') + digits;
  }
  const phoneRaw  = out.get('phone') || '';
  const phoneNorm = normalizePhone(phoneRaw);

  // 3) On DOM ready, append params to links
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('a.carry').forEach(a => {
      try {
        const url = new URL(a.href, location.origin);
        const qs  = new URLSearchParams(url.search);

        // Always pass these forward
        if (out.get('name'))  qs.set('name',  out.get('name'));
        if (out.get('email')) qs.set('email', out.get('email'));

        // For non-Cal pages, keep the original phone param as "phone"
        if (!url.hostname.endsWith('cal.com') && phoneRaw) {
          qs.set('phone', phoneRaw);
        }

        // For Cal.com, use the booking question slug
        if (url.hostname.endsWith('cal.com') && phoneNorm) {
          qs.set('attendeePhoneNumber', phoneNorm);
        }

        url.search = qs.toString();
        a.href = url.toString();
      } catch {}
    });

    // Webhook on click (use sendBeacon so it still fires during navigation)
    document.querySelectorAll('a.carry').forEach(a => {
      a.addEventListener('click', () => {
        const payload = {
          email: out.get('email') || '',
          page: document.title || location.pathname,
          button: a.textContent.trim(),
          ts: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(payload)], {type: 'application/json'});
        if (!navigator.sendBeacon || !navigator.sendBeacon(WEBHOOK, blob)) {
          // Fallback if sendBeacon not available
          fetch(WEBHOOK, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
            .catch(()=>{});
        }
      });
    });
  });

  // 4) Hide PII in address bar after capture
  if ([...params.keys()].some(k => LEAD_KEYS.includes(k))) {
    history.replaceState({}, '', location.pathname);
  }
})();
</script>
</head>
<body>
  <div class="card">
    <h1>✅ We Are Accepting 1 Contractor in Your Area</h1>
    <p>Secure your spot now before it’s taken.</p>

    <a href="https://peakleadsgroup.com/B2BReserveNow.html" class="btn lockin-btn carry">
      <span class="main-text">Lock In Your Zip Code</span>
      <span class="sub-text">⚠ Only select if you're ready to start receiving leads in the next 48 hours</span>
    </a>

    <a href="https://cal.com/bennett-hair-mpzude/discovery-session" class="btn btn-secondary carry">
      Book a Call With Our Team
    </a>
  </div>
</body>
</html>
