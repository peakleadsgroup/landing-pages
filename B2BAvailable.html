<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Good News — Your Area is Open</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #333;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 2rem;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  h1 { font-size: 1.8rem; margin-bottom: 1rem; }
  p  { font-size: 1rem; color: #555; margin-bottom: 2rem; }

  .btn {
    display: block;
    border-radius: 5px;
    text-decoration: none;
    transition: background 0.3s;
    text-align: center;
    padding: 1rem 1.5rem;
    max-width: 350px;
    margin: 0 auto 1.5rem auto;
    font-weight: bold;
  }
  .lockin-btn { background: #4a6fa5; color: white; }
  .lockin-btn:hover { background: #3a5f95; }
  .lockin-btn .main-text { display:block; font-size:1.1rem; font-weight:700; }
  .lockin-btn .sub-text  { display:block; font-size:.8rem; font-weight:400; opacity:.9; margin-top:.2rem; line-height:1.3; }

  .btn-secondary { background:#ddd; color:#333; }
  .btn-secondary:hover { background:#ccc; }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ We Are Accepting 1 Contractor in Your Area</h1>
    <p>Secure your spot now before it’s taken.</p>

    <a href="https://peakleadsgroup.com/B2BReserveNow.html" class="btn lockin-btn carry">
      <span class="main-text">Lock In Your Zip Code</span>
      <span class="sub-text">⚠ Only select if you're ready to start receiving leads in the next 48 hours</span>
    </a>

    <a href="https://cal.com/bennett-hair-mpzude/discovery-session" class="btn btn-secondary carry">
      Book a Call With Our Team
    </a>
  </div>

<script>
(function () {
  const WEBHOOK = 'https://hook.us2.make.com/s6ffnemla3z1wvkhtmx5y3c2uyrfdnkv';
  const KEYS = ['name','email','phone'];
  const params = new URLSearchParams(location.search);

  // Save incoming values
  KEYS.forEach(k => {
    const v = params.get(k);
    if (v) sessionStorage.setItem('lead_' + k, v);
  });

  // Get lead values (from URL or storage)
  function getLead() {
    const out = {};
    KEYS.forEach(k => {
      out[k] = params.get(k) || sessionStorage.getItem('lead_' + k) || '';
    });
    return out;
  }

  // Normalize phone for Cal.com
  function normalizePhone(v){
    if(!v) return '';
    const plus = v.trim().startsWith('+');
    const digits = (v.match(/\d+/g)||[]).join('');
    if(!digits) return '';
    if(!plus && digits.length === 10) return '+1' + digits; // tweak for non-US
    return (plus ? '+' : '') + digits;
  }

  // Merge params into a URL (without duplicating)
  function mergeParams(href, extra = {}) {
    const url = new URL(href, location.origin);
    const qs  = new URLSearchParams(url.search);
    Object.entries(extra).forEach(([k,v]) => { if(v) qs.set(k, v); });
    url.search = qs.toString();
    return url.toString();
  }

  // Send webhook (use sendBeacon for reliability during navigation)
  function sendWebhook(payload){
    try {
      const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
      if (!navigator.sendBeacon || !navigator.sendBeacon(WEBHOOK, blob)) {
        fetch(WEBHOOK, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload),
          keepalive: true
        }).catch(()=>{});
      }
    } catch (e) {}
  }

  // Intercept clicks, build final href just-in-time, fire webhook, then continue
  document.addEventListener('click', function(e){
    const a = e.target.closest('a.carry');
    if (!a) return;

    const lead = getLead();
    const isCal = /^([^:]+:\/\/)?([^\/]+\.)?cal\.com(\/|$)/i.test(a.href);

    // Build outgoing params
    let finalHref;
    if (isCal) {
      finalHref = mergeParams(a.href, {
        name:  lead.name,
        email: lead.email,
        attendeePhoneNumber: normalizePhone(lead.phone)
      });
    } else {
      finalHref = mergeParams(a.href, {
        name:  lead.name,
        email: lead.email,
        phone: lead.phone
      });
    }

    // Fire webhook
    sendWebhook({
      email: lead.email || '',
      page: document.title || location.pathname,
      button: a.textContent.trim(),
      ts: new Date().toISOString()
    });

    // Swap the href to our finalized one so the nav carries params
    a.href = finalHref;
  }, true);

  // Clean URL bar after we captured PII
  if ([...params.keys()].some(k => KEYS.includes(k))) {
    history.replaceState({}, '', location.pathname);
  }
})();
</script>
</body>
</html>
