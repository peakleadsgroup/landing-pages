<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Good News — Your Area is Open</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #333;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 2rem;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 1rem;
  }
  p {
    font-size: 1rem;
    color: #555;
    margin-bottom: 2rem;
  }
  .btn {
    display: block;
    border-radius: 5px;
    text-decoration: none;
    transition: background 0.3s;
    text-align: center;
    padding: 1rem 1.5rem;
    max-width: 350px;
    margin: 0 auto 1.5rem auto;
    font-weight: bold;
  }
  /* Primary button with stacked text */
  .lockin-btn {
    background: #4a6fa5;
    color: white;
  }
  .lockin-btn:hover {
    background: #3a5f95;
  }
  .lockin-btn .main-text {
    display: block;
    font-size: 1.1rem;
    font-weight: 700;
  }
  .lockin-btn .sub-text {
    display: block;
    font-size: 0.8rem;
    font-weight: normal;
    opacity: 0.9;
    margin-top: 0.2rem;
    line-height: 1.3;
  }
  /* Secondary button */
  .btn-secondary {
    background: #ddd;
    color: #333;
  }
  .btn-secondary:hover {
    background: #ccc;
  }
</style>

<script>
/* Carry name/email/phone into all links with class="carry" */
(function () {
  const KEYS = ['name','email','phone'];
  const params = new URLSearchParams(location.search);

  // Keep values in sessionStorage so we still have them if a user reloads without query
  KEYS.forEach(k => {
    const v = params.get(k);
    if (v) sessionStorage.setItem('lead_' + k, v);
  });

  // Build the outgoing query
  const out = new URLSearchParams();
  KEYS.forEach(k => {
    const v = params.get(k) || sessionStorage.getItem('lead_' + k);
    if (v) out.set(k, v);
  });

  // When DOM is ready, append to links
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('a.carry').forEach(a => {
      try {
        const url = new URL(a.href, location.origin);
        const merged = new URLSearchParams(url.search);
        out.forEach((v, k) => merged.set(k, v));
        url.search = merged.toString();
        a.href = url.toString();
      } catch {}
    });
  });

  // Optional: remove PII from the address bar after capture
  if ([...params.keys()].some(k => KEYS.includes(k))) {
    history.replaceState({}, '', location.pathname);
  }
})();
</script>
</head>
<body>
  <div class="card">
    <h1>✅ We Are Accepting 1 Contractor in Your Area</h1>
    <p>Secure your spot now before it’s taken.</p>

    <!-- Add class="carry" so parameters are appended -->
    <a href="https://peakleadsgroup.com/B2BReserveNow.html" class="btn lockin-btn carry">
      <span class="main-text">Lock In Your Zip Code</span>
      <span class="sub-text">⚠ Only select if you're ready to start receiving leads in the next 48 hours</span>
    </a>

    <a href="https://yourcalendarlink.com" class="btn btn-secondary carry">Book a Call With Our Team</a>
  </div>
</body>
</html>
