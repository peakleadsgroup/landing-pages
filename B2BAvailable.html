<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Good News — Your Area is Open</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5f7fa;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: #333;
  }
  .card {
    background: white;
    border-radius: 10px;
    padding: 2rem;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 1rem;
  }
  p {
    font-size: 1rem;
    color: #555;
    margin-bottom: 2rem;
  }
  .btn {
    display: inline-block;
    padding: 0.8rem 1.5rem;
    margin: 0.5rem;
    border-radius: 5px;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
  }
  .btn-primary {
    background: #4a6fa5;
    color: white;
  }
  .btn-primary:hover {
    background: #3a5f95;
  }
  .btn-secondary {
    background: #ddd;
    color: #333;
  }
  .btn-secondary:hover {
    background: #ccc;
  }
  .note {
    font-size: 0.95rem;
    margin-top: 0.6rem;
    margin-bottom: 1.8rem;
    line-height: 1.4;
  }
  .note.important {
    color: #b35700; /* warm orange/brown to draw attention */
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>✅ Good News — We Are Accepting Contractors in Your Area</h1>
    <p>We only work with one company per ZIP code. Secure your spot now before it’s taken.</p>

    <a href="https://yourpaymentlink.com" class="btn btn-primary">Lock In Your Spot Now</a>
    <div class="note important">⚠ Only select this option if you're ready to start receiving leads in the next 48 hours.</div>

    <a href="https://yourcalendarlink.com" class="btn btn-secondary">Book a Call With Our Team</a>
  </div>
</body>
</html>
