<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Utility Bill</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .upload-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .logo-container p {
            color: #666;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #4CAF50;
            border-radius: 15px;
            padding: 40px 20px;
            margin: 30px 0;
            background: #f8f9fa;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .upload-area:hover {
            border-color: #45a049;
            background: #e8f5e9;
        }

        .upload-area.dragover {
            border-color: #4CAF50;
            background: #e8f5e9;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 64px;
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #e3f2fd;
            border-radius: 10px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            color: #1976d2;
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .file-size {
            color: #666;
            font-size: 12px;
        }

        .upload-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
            width: 100%;
        }

        .upload-btn:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.4);
        }

        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 4px;
            transition: width 0.3s;
            width: 0%;
        }

        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .success-message.active {
            display: block;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .loading {
            display: none;
            color: #666;
            margin-top: 15px;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 600px) {
            .upload-container {
                padding: 25px;
            }

            .upload-area {
                padding: 30px 15px;
            }

            .upload-icon {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="upload-container">
        <div class="logo-container">
            <h1>Upload Utility Bill</h1>
            <p>Please upload your utility bill document</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Click to upload or drag and drop</div>
            <div class="upload-subtext">Supports PDF, JPG, PNG, DOC, DOCX, and more</div>
            <input type="file" id="fileInput" class="file-input" accept="*/*">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="loading" id="loading">Uploading...</div>

        <button class="upload-btn" id="uploadBtn" onclick="uploadFile()" disabled>Upload File</button>

        <div class="success-message" id="successMessage">
            ✓ File uploaded successfully! Thank you.
        </div>

        <div class="error-message" id="errorMessage">
            ✗ An error occurred. Please try again.
        </div>
    </div>

    <script>
        // Airtable Configuration
        const AIRTABLE_API_KEY = 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589';
        const AIRTABLE_BASE_ID = 'appmBb0lzqRK9dI8v';
        const AIRTABLE_TABLE_ID = 'tbleru0SBQwlXgojx';

        // Get record ID from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const recordId = urlParams.get('id') || urlParams.get('recordId') || urlParams.get('record');

        if (!recordId) {
            document.getElementById('errorMessage').textContent = '✗ Missing record ID. Please use a valid link.';
            document.getElementById('errorMessage').classList.add('active');
            document.querySelector('.upload-area').style.pointerEvents = 'none';
        }

        let selectedFile = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const loading = document.getElementById('loading');
        const successMessage = document.getElementById('successMessage');
        const errorMessage = document.getElementById('errorMessage');

        // Click to upload
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files[0]);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                handleFileSelect(file);
            }
        });

        function handleFileSelect(file) {
            if (!file) return;

            selectedFile = file;
            
            // Display file info
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('active');
            
            // Enable upload button
            uploadBtn.disabled = false;
            
            // Hide previous messages
            successMessage.classList.remove('active');
            errorMessage.classList.remove('active');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        async function uploadFile() {
            if (!selectedFile || !recordId) {
                errorMessage.textContent = '✗ Please select a file and ensure you have a valid link.';
                errorMessage.classList.add('active');
                return;
            }

            // Disable button and show progress
            uploadBtn.disabled = true;
            loading.classList.add('active');
            progressBar.classList.add('active');
            errorMessage.classList.remove('active');
            successMessage.classList.remove('active');

            try {
                // Step 1: Convert file to base64
                progressFill.style.width = '30%';
                loading.textContent = 'Processing file...';

                const base64Data = await fileToBase64(selectedFile);
                progressFill.style.width = '60%';
                loading.textContent = 'Uploading to Airtable...';

                // Step 2: Update Airtable record with the base64 file
                // Airtable accepts base64 data URLs for attachments
                const attachment = [{
                    url: base64Data,
                    filename: selectedFile.name
                }];

                const response = await fetch(
                    `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE_ID}/${recordId}`,
                    {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${AIRTABLE_API_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            fields: {
                                'Utility Bill': attachment
                            }
                        })
                    }
                );

                progressFill.style.width = '100%';

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('Airtable API Error:', errorData);
                    throw new Error(errorData.error?.message || `Upload failed: ${response.status}`);
                }

                // Success!
                setTimeout(() => {
                    progressBar.classList.remove('active');
                    loading.classList.remove('active');
                    successMessage.classList.add('active');
                    uploadArea.style.pointerEvents = 'none';
                    uploadBtn.style.display = 'none';
                }, 500);

            } catch (error) {
                console.error('Upload error:', error);
                progressBar.classList.remove('active');
                loading.classList.remove('active');
                errorMessage.textContent = `✗ ${error.message || 'Upload failed. Please try again.'}`;
                errorMessage.classList.add('active');
                uploadBtn.disabled = false;
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }
    </script>
</body>
</html>
