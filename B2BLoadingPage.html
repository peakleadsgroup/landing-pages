<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Checking Your Zip Code...</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<script>
/* Capture name/email/phone from Tally and stash for later pages */
(function () {
  const KEYS = ['name','email','phone'];
  const urlParams = new URLSearchParams(location.search);

  // 1) Save incoming values to sessionStorage
  KEYS.forEach(k => {
    const v = urlParams.get(k);
    if (v) sessionStorage.setItem('lead_' + k, v);
  });

  // 2) Also make sure we can add them to links on this page if needed
  const out = new URLSearchParams();
  KEYS.forEach(k => {
    const v = sessionStorage.getItem('lead_' + k);
    if (v) out.set(k, v);
  });

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('a.carry').forEach(a => {
      try {
        const url = new URL(a.href, location.origin);
        const merged = new URLSearchParams(url.search);
        out.forEach((v, k) => merged.set(k, v));
        url.search = merged.toString();
        a.href = url.toString();
      } catch {}
    });
  });

  // 3) Remove PII from the address bar once we’ve captured it
  if ([...urlParams.keys()].some(k => KEYS.includes(k))) {
    history.replaceState({}, '', location.pathname);
  }
})();
</script>
