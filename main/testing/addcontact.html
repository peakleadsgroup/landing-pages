<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Add Contact Test</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://raw.githubusercontent.com/peakleadsgroup/landing-pages/main/images/windowback.png') center/cover no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
            transform: translateZ(0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .add-contact-card {
            padding: 20px 0;
        }

        .main-heading {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .sub-heading {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .add-contact-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .add-contact-button:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
        }

        .add-contact-button:active {
            transform: translateY(0);
        }

        .person-icon {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="add-contact-card">
            <h1 class="main-heading">Add us as a contact</h1>
            <p class="sub-heading">We'll give you a call soon to schedule your free estimate. Tap the button below to save our number.</p>
            <button type="button" class="add-contact-button" id="addContactBtn" onclick="addContact()">
                <svg class="person-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                Add Contact
            </button>
        </div>
    </div>

    <script>
        function addContact() {
            const contactName = 'HomeFix';
            const phoneNumber = '1234567890'; // (123) 456-7890 without formatting for vCard

            // Create vCard 3.0 format - works on iOS and Android
            const vcard = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                'FN:' + contactName,
                'N:' + contactName + ';;;',
                'TEL;TYPE=work,voice:' + phoneNumber,
                'END:VCARD'
            ].join('\r\n');

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = contactName + '.vcf';
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
