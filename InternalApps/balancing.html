    <script>
        // Same approach as Dashboards/recordID.html: table names and filter by client name
        const AIRTABLE_BASE_ID = 'appmBb0lzqRK9dI8v';
        const AIRTABLE_BASE_URL = '/api/airtable/v0/' + AIRTABLE_BASE_ID;
        const TABLE_NAMES = {
            ADSET: 'tblee61crNCoSfurx',
            B2C_LEADS: 'B2C Leads',
            CAMPAIGNS: 'Campaigns'
        };
        // Campaigns table: name can 403; use table ID (same as bathrooms.html etc.)
        const CAMPAIGNS_TABLE_ID = 'tbl6uhtOFzGzA7EMu';
        const ADSET_NAME_FIELD = 'Adset Name';
        const ADSET_CLIENT_STATUS_FIELD = 'Client Status';
        const ADSET_B2C_LEADS_FIELD = 'B2C Leads';
        const ADSET_CAMPAIGNS_FIELD = 'Campaign';
        const CAMPAIGN_ID_FIELD = 'Campaign ID';
        const MAKE_WEBHOOK_3DAY = 'https://hook.us2.make.com/d4eoxhqbbblt5qqm6ft3rbeg5pv3ubed';
        const MAKE_WEBHOOK_7DAY = 'https://hook.us2.make.com/vbcc13xqt1yd1vmj1rseyokjptr4hadm';
        const MAKE_WEBHOOK_14DAY = 'https://hook.us2.make.com/fqdn72zbj58fwmc3gao851owopri9cvm';
        const CLIENT_STATUS_GROUPS = ['Active', 'Paused', 'Closed', 'Setup'];

        async function fetchAirtable(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Airtable ' + res.status);
            return res.json();
        }

        function fetchAllRecords(tableName, filterFormula) {
            let url = AIRTABLE_BASE_URL + '/' + encodeURIComponent(tableName);
            if (filterFormula) url += '?filterByFormula=' + encodeURIComponent(filterFormula);
            const records = [];
            const get = async (offset) => {
                const pageUrl = offset ? url + (url.includes('?') ? '&' : '?') + 'offset=' + offset : url;
                const data = await fetchAirtable(pageUrl);
                records.push(...(data.records || []));
                if (data.offset) await get(data.offset);
            };
            return get(null).then(() => {
                if (tableName === TABLE_NAMES.B2C_LEADS) {
                    console.log('[Balancing] fetchAllRecords B2C Leads', { filterFormula: filterFormula || null, recordCount: records.length });
                }
                return records;
            });
        }

        var clientList = [];
        function loadClients() {
            console.log('[Balancing] loadClients', { tableName: TABLE_NAMES.ADSET });
            document.getElementById('client-list-loading').style.display = 'block';
            document.getElementById('client-list-empty').style.display = 'none';
            document.getElementById('client-tbody').innerHTML = '';
            return fetchAllRecords(TABLE_NAMES.ADSET).then(function (records) {
                document.getElementById('client-list-loading').style.display = 'none';
                console.log('[Balancing] Adsets loaded', { count: records.length });
                clientList = records.map(function (r) {
                    var f = r.fields || {};
                    var name = (f[ADSET_NAME_FIELD] || f['Name'] || 'Unnamed').toString().trim();
                    var rawStatus = f[ADSET_CLIENT_STATUS_FIELD];
                    var status = (rawStatus == null ? '' : String(rawStatus)).trim();
                    var row = { id: r.id, name: name, status: status, fields: f };
                    return row;
                });
                if (clientList.length === 0) {
                    document.getElementById('client-list-empty').style.display = 'block';
                    return;
                }
                renderClientTable(clientList);
            }).catch(function (e) {
                document.getElementById('client-list-loading').style.display = 'none';
                document.getElementById('client-list-empty').style.display = 'block';
                document.getElementById('client-list-empty').textContent = 'Failed to load adsets: ' + (e && e.message) || 'Error';
            });
        }

        function renderClientTable(clients) {
            var tbody = document.getElementById('client-tbody');
            var groupsMap = CLIENT_STATUS_GROUPS.reduce(function (acc, status) {
                acc[status] = [];
                return acc;
            }, {});
            clients.forEach(function (c) {
                var normalizedStatus = CLIENT_STATUS_GROUPS.find(function (status) {
                    return status.toLowerCase() === String(c.status || '').toLowerCase();
                });
                if (normalizedStatus) groupsMap[normalizedStatus].push(c);
            });

            tbody.innerHTML = CLIENT_STATUS_GROUPS.map(function (status) {
                var adsets = groupsMap[status] || [];
                var groupKey = encodeURIComponent(status);
                var rows = adsets.map(function (c) {
                    return '<tr class="client-row" data-client-id="' + escapeHtml(c.id) + '" data-group="' + groupKey + '" style="display: none;">' +
                        '<td class="client-expand-cell"><button type="button" class="client-expand-btn" aria-expanded="false" title="Expand">&#9656;</button></td>' +
                        '<td class="name-cell">' + escapeHtml(c.name) + '</td>' +
                        '</tr>' +
                        '<tr class="client-detail-row" id="client-detail-' + escapeHtml(c.id) + '" style="display: none;" data-client-id="' + escapeHtml(c.id) + '" data-group="' + groupKey + '">' +
                        '<td colspan="2"><div class="client-detail-content" data-client-id="' + escapeHtml(c.id) + '"></div></td>' +
                        '</tr>';
                }).join('');
                var emptyRow = adsets.length === 0
                    ? '<tr class="client-row empty-group-row" data-group="' + groupKey + '" style="display: none;"><td class="client-expand-cell"></td><td class="name-cell" style="color: #5f6368;">No adsets in this status.</td></tr>'
                    : '';
                return '<tr class="group-row" data-group="' + groupKey + '">' +
                    '<td colspan="2">' +
                    '<div class="group-summary">' +
                    '<button type="button" class="group-expand-btn" data-group="' + groupKey + '" aria-expanded="false" title="Expand group">&#9656;</button>' +
                    '<span>' + escapeHtml(status) + '</span>' +
                    '<span class="group-count">(' + adsets.length + ')</span>' +
                    '</div>' +
                    '</td>' +
                    '</tr>' +
                    rows +
                    emptyRow;
            }).join('');

            tbody.addEventListener('click', function (e) {
                var groupBtn = e.target.closest('.group-expand-btn');
                if (groupBtn) {
                    toggleStatusGroup(groupBtn);
                    return;
                }
                var adsetBtn = e.target.closest('.client-expand-btn');
                if (!adsetBtn) return;
                var row = adsetBtn.closest('tr.client-row');
                var clientId = row.getAttribute('data-client-id');
                var detailRow = document.getElementById('client-detail-' + clientId);
                var content = detailRow.querySelector('.client-detail-content');
                var isExpanded = detailRow.style.display !== 'none';
                if (isExpanded) {
                    detailRow.style.display = 'none';
                    adsetBtn.classList.remove('expanded');
                    adsetBtn.setAttribute('aria-expanded', 'false');
                } else {
                    detailRow.style.display = 'table-row';
                    adsetBtn.classList.add('expanded');
                    adsetBtn.setAttribute('aria-expanded', 'true');
                    if (!content.getAttribute('data-loaded')) {
                        loadClientDetail(clientId, content, adsetBtn);
                    }
                }
            });
        }

        function toggleStatusGroup(groupBtn) {
            var groupKey = groupBtn.getAttribute('data-group');
            var shouldExpand = groupBtn.getAttribute('aria-expanded') !== 'true';
            groupBtn.setAttribute('aria-expanded', shouldExpand ? 'true' : 'false');
            groupBtn.classList.toggle('expanded', shouldExpand);
            var groupRows = document.querySelectorAll('tr[data-group="' + groupKey + '"]');
            groupRows.forEach(function (row) {
                if (row.classList.contains('group-row')) return;
                if (shouldExpand) {
                    if (row.classList.contains('client-row') || row.classList.contains('empty-group-row')) {
                        row.style.display = 'table-row';
                    }
                } else {
                    row.style.display = 'none';
                    if (row.classList.contains('client-row')) {
                        var adsetBtn = row.querySelector('.client-expand-btn');
                        if (adsetBtn) {
                            adsetBtn.classList.remove('expanded');
                            adsetBtn.setAttribute('aria-expanded', 'false');
                        }
                    }
                }
            });
        }

        function escapeHtml(s) {
            const div = document.createElement('div');
            div.textContent = s == null ? '' : s;
            return div.innerHTML;
        }

        function parsePeriodResponse(text, period) {
            var prefix = period === '7' ? '7day' : period === '14' ? '14day' : '3day';
            var spendKey = prefix, startKey = prefix + 'start', stopKey = prefix + 'stop';
            const out = { spend: 0, start: '', stop: '' };
            if (!text || typeof text !== 'string') return out;
            try {
                const parsed = JSON.parse(text);
                if (parsed[spendKey] != null) out.spend = Number(parsed[spendKey]) || 0;
                if (parsed[startKey] != null) out.start = String(parsed[startKey]).trim();
                if (parsed[stopKey] != null) out.stop = String(parsed[stopKey]).trim();
                if ((out.spend || out.start || out.stop) || (period === '3')) return out;
                if (period === '7' || period === '14') {
                    if (parsed['3day'] != null) out.spend = Number(parsed['3day']) || 0;
                    if (parsed['3daystart'] != null) out.start = String(parsed['3daystart']).trim();
                    if (parsed['3daystop'] != null) out.stop = String(parsed['3daystop']).trim();
                }
                return out;
            } catch (_) {}
            const regex = /(\w+)\s*:\s*([^\n]+)/g;
            let m;
            while ((m = regex.exec(text)) !== null) {
                const key = m[1].toLowerCase();
                const val = m[2].trim();
                if (key === spendKey) out.spend = Number(val) || 0;
                else if (key === startKey) out.start = val;
                else if (key === stopKey) out.stop = val;
            }
            if ((out.spend || out.start || out.stop) || (period === '3')) return out;
            if (period === '7' || period === '14') {
                out.spend = 0; out.start = ''; out.stop = '';
                regex.lastIndex = 0;
                while ((m = regex.exec(text)) !== null) {
                    if (m[1].toLowerCase() === '3day') out.spend = Number(m[2].trim()) || 0;
                    else if (m[1].toLowerCase() === '3daystart') out.start = m[2].trim();
                    else if (m[1].toLowerCase() === '3daystop') out.stop = m[2].trim();
                }
            }
            return out;
        }

        async function fetchWebhookPeriod(url, campaignId, period) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ campaignId: campaignId })
                });
                if (!res.ok) return { spend: 0, start: '', stop: '' };
                const text = await res.text();
                return parsePeriodResponse(text, period);
            } catch (e) {
                console.warn('[Balancing] Webhook failed', campaignId, e);
                return { spend: 0, start: '', stop: '' };
            }
        }

        function formatDateEST(val) {
            if (val == null || val === '') return '';
            var d = typeof val === 'string' ? new Date(val) : val;
            if (!d.getTime || isNaN(d.getTime())) return val;
            return d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', timeZone: 'America/New_York' });
        }

        function formatSpend(val) {
            if (val == null || val === '') return '-';
            const n = Number(val);
            return isNaN(n) ? val : '$' + n.toFixed(2);
        }

        async function loadCampaignsForClient(clientId, listEl) {
            try {
                const adsetUrl = AIRTABLE_BASE_URL + '/' + encodeURIComponent(TABLE_NAMES.ADSET) + '/' + clientId;
                const adsetRecord = await fetchAirtable(adsetUrl);
                const campaignRecordIds = adsetRecord.fields && adsetRecord.fields[ADSET_CAMPAIGNS_FIELD];
                if (!campaignRecordIds || !Array.isArray(campaignRecordIds) || campaignRecordIds.length === 0) {
                    if (listEl) listEl.innerHTML = '';
                    return { totalSpend3: 0, totalSpend7: 0, totalSpend14: 0 };
                }
                const campaigns = [];
                for (let i = 0; i < campaignRecordIds.length; i++) {
                    const recId = campaignRecordIds[i];
                    try {
                        const campaignUrl = AIRTABLE_BASE_URL + '/' + CAMPAIGNS_TABLE_ID + '/' + recId;
                        const campaignRecord = await fetchAirtable(campaignUrl);
                        const f = campaignRecord.fields || {};
                        const cid = f[CAMPAIGN_ID_FIELD];
                        if (cid == null || cid === '') continue;
                        const campaignName = (f['Name'] || f['Campaign Name'] || f['Campaign'] || String(cid)).trim();
                        campaigns.push({ id: String(cid), name: campaignName });
                    } catch (e) {
                        console.warn('[Balancing] Failed to fetch campaign', recId, e);
                    }
                }
                if (campaigns.length === 0) {
                    if (listEl) listEl.innerHTML = '';
                    return { totalSpend3: 0, totalSpend7: 0, totalSpend14: 0 };
                }
                if (listEl) listEl.innerHTML = '<div class="loading">Loading campaign spend...</div>';

                const campaignResults = await Promise.all(campaigns.map(async function (c) {
                    const [r3, r7, r14] = await Promise.all([
                        fetchWebhookPeriod(MAKE_WEBHOOK_3DAY, c.id, '3'),
                        fetchWebhookPeriod(MAKE_WEBHOOK_7DAY, c.id, '7'),
                        fetchWebhookPeriod(MAKE_WEBHOOK_14DAY, c.id, '14')
                    ]);
                    return { id: c.id, name: c.name, r3, r7, r14 };
                }));
                let totalSpend3 = 0, totalSpend7 = 0, totalSpend14 = 0;
                const row = function (label, spend, start, stop) {
                    var range = (start || stop) ? ' <span class="dates">(' + escapeHtml(formatDateEST(start)) + (start && stop ? ' - ' : '') + escapeHtml(formatDateEST(stop)) + ')</span>' : '';
                    return '<div class="campaign-period"><strong>' + escapeHtml(label) + '</strong> <span class="spend">' + escapeHtml(formatSpend(spend)) + '</span>' + range + '</div>';
                };
                const cards = campaignResults.map(function (o) {
                    totalSpend3 += (o.r3 && o.r3.spend) || 0;
                    totalSpend7 += (o.r7 && o.r7.spend) || 0;
                    totalSpend14 += (o.r14 && o.r14.spend) || 0;
                    return '<div class="campaign-card">' +
                        '<div class="campaign-card-header">' + escapeHtml(o.name) + '</div>' +
                        '<div class="campaign-card-id">' + escapeHtml(o.id) + '</div>' +
                        row('3 day:', o.r3 && o.r3.spend, o.r3 && o.r3.start, o.r3 && o.r3.stop) +
                        row('7 day:', o.r7 && o.r7.spend, o.r7 && o.r7.start, o.r7 && o.r7.stop) +
                        row('14 day:', o.r14 && o.r14.spend, o.r14 && o.r14.start, o.r14 && o.r14.stop) +
                        '</div>';
                });
                if (listEl) listEl.innerHTML = '<div class="campaign-id-list">' + cards.join('') + '</div>';
                return { totalSpend3: totalSpend3, totalSpend7: totalSpend7, totalSpend14: totalSpend14 };
            } catch (e) {
                console.warn('[Balancing] loadCampaignsForClient failed', e);
                if (listEl) listEl.innerHTML = '<div class="empty">Failed to load campaigns.</div>';
                return { totalSpend3: 0, totalSpend7: 0, totalSpend14: 0 };
            }
        }

        function getTodayEST() {
            var d = new Date();
            var f = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
            var parts = f.formatToParts(d);
            return {
                year: parseInt(parts.find(function (p) { return p.type === 'year'; }).value, 10),
                month: parseInt(parts.find(function (p) { return p.type === 'month'; }).value, 10),
                day: parseInt(parts.find(function (p) { return p.type === 'day'; }).value, 10)
            };
        }
        function getPeriodBoundsEST(daysBack) {
            var today = getTodayEST();
            var startD = new Date(today.year, today.month - 1, today.day - daysBack);
            var startMs = Date.UTC(startD.getFullYear(), startD.getMonth(), startD.getDate(), 5, 0, 0, 0);
            var endMs = Date.UTC(today.year, today.month - 1, today.day, 5, 0, 0, 0);
            return { startMs: startMs, endMs: endMs, startDate: new Date(startMs), endDate: new Date(endMs) };
        }

        async function loadLeadsForClient(clientId, containerEl, spendTotals) {
            if (!containerEl) return;
            containerEl.innerHTML = '<div class="loading">Loading leads...</div>';
            const adsetUrl = AIRTABLE_BASE_URL + '/' + encodeURIComponent(TABLE_NAMES.ADSET) + '/' + clientId;
            const adsetRecord = await fetchAirtable(adsetUrl);
            const linkedLeadIds = adsetRecord.fields && adsetRecord.fields[ADSET_B2C_LEADS_FIELD];
            if (!linkedLeadIds || !Array.isArray(linkedLeadIds) || linkedLeadIds.length === 0) {
                containerEl.innerHTML = '<div class="empty">No leads for this adset.</div>';
                return;
            }
            const records = [];
            for (let i = 0; i < linkedLeadIds.length; i++) {
                const leadId = linkedLeadIds[i];
                try {
                    const leadUrl = AIRTABLE_BASE_URL + '/' + encodeURIComponent(TABLE_NAMES.B2C_LEADS) + '/' + leadId;
                    const leadRecord = await fetchAirtable(leadUrl);
                    if (leadRecord && leadRecord.id) records.push(leadRecord);
                } catch (e) {
                    console.warn('[Balancing] Failed to fetch lead', leadId, e);
                }
            }

            var bounds3 = getPeriodBoundsEST(3);
            var bounds7 = getPeriodBoundsEST(7);
            var bounds14 = getPeriodBoundsEST(14);

            var leads = records.map(function (r) {
                var f = r.fields || {};
                var created = r.createdTime ? new Date(r.createdTime) : null;
                var status = (f['Status'] != null && f['Status'] !== '') ? String(f['Status']).trim() : '';
                var name = (f['Full Name'] || (f['First Name'] || '') + ' ' + (f['Last Name'] || '')).trim() || '-';
                var phone = (f['Phone'] || '').trim() || '-';
                var summary = (f['Full Summary'] || '').trim();
                var summaryShort = summary ? (summary.length > 120 ? summary.substring(0, 120) + '...' : summary) : '-';
                return { created: created, createdTime: r.createdTime, status: status, name: name, phone: phone, summary: summaryShort };
            });

            function qualifiedInPeriod(lead, bounds) {
                if (!lead.created || lead.status !== 'Qualified') return false;
                var t = lead.created.getTime();
                return t >= bounds.startMs && t < bounds.endMs;
            }
            function leadRow(l) {
                var createdStr = l.created ? l.created.toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' }) : '-';
                return '<tr><td>' + escapeHtml(createdStr) + '</td><td>' + escapeHtml(l.name) + '</td><td>' + escapeHtml(l.phone) + '</td><td>' + escapeHtml(l.summary) + '</td></tr>';
            }

            var q3 = leads.filter(function (l) { return qualifiedInPeriod(l, bounds3); });
            var q7 = leads.filter(function (l) { return qualifiedInPeriod(l, bounds7); });
            var q14 = leads.filter(function (l) { return qualifiedInPeriod(l, bounds14); });

            var s3 = (spendTotals && spendTotals.totalSpend3) || 0;
            var s7 = (spendTotals && spendTotals.totalSpend7) || 0;
            var s14 = (spendTotals && spendTotals.totalSpend14) || 0;
            var cpl3 = q3.length > 0 && typeof s3 === 'number' ? s3 / q3.length : null;
            var cpl7 = q7.length > 0 && typeof s7 === 'number' ? s7 / q7.length : null;
            var cpl14 = q14.length > 0 && typeof s14 === 'number' ? s14 / q14.length : null;

            function formatDateWithTimeEST(d) {
                if (!d || !d.getTime) return '';
                return d.toLocaleString('en-US', { month: 'numeric', day: 'numeric', year: '2-digit', hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'America/New_York' }) + ' EST';
            }
            function periodSummary(days, spend, count, cpl, dateStart, dateEnd) {
                var range = (dateStart && dateEnd) ? (' (' + formatDateWithTimeEST(dateStart) + ' - ' + formatDateWithTimeEST(dateEnd) + ')') : '';
                return days + ' day' + range + ' - Spend: ' + formatSpend(spend) + ' | Qualified: ' + count + ' | CPL: ' + (cpl != null ? formatSpend(cpl) : '-');
            }
            var dateStart3 = bounds3.startDate, dateEnd3 = bounds3.endDate;
            var dateStart7 = bounds7.startDate, dateEnd7 = bounds7.endDate;
            var dateStart14 = bounds14.startDate, dateEnd14 = bounds14.endDate;

            var periodHtml =
                '<details class="period-section">' +
                '<summary><span class="period-stats">' + escapeHtml(periodSummary(3, s3, q3.length, cpl3, dateStart3, dateEnd3)) + '</span></summary>' +
                '<div class="panel-body"><div class="overflow-x-auto"><table><thead><tr><th>Created</th><th>Name</th><th>Phone</th><th>Summary</th></tr></thead><tbody id="leads-tbody-3-' + escapeHtml(clientId) + '"></tbody></table></div></div>' +
                '</details>' +
                '<details class="period-section">' +
                '<summary><span class="period-stats">' + escapeHtml(periodSummary(7, s7, q7.length, cpl7, dateStart7, dateEnd7)) + '</span></summary>' +
                '<div class="panel-body"><div class="overflow-x-auto"><table><thead><tr><th>Created</th><th>Name</th><th>Phone</th><th>Summary</th></tr></thead><tbody id="leads-tbody-7-' + escapeHtml(clientId) + '"></tbody></table></div></div>' +
                '</details>' +
                '<details class="period-section">' +
                '<summary><span class="period-stats">' + escapeHtml(periodSummary(14, s14, q14.length, cpl14, dateStart14, dateEnd14)) + '</span></summary>' +
                '<div class="panel-body"><div class="overflow-x-auto"><table><thead><tr><th>Created</th><th>Name</th><th>Phone</th><th>Summary</th></tr></thead><tbody id="leads-tbody-14-' + escapeHtml(clientId) + '"></tbody></table></div></div>' +
                '</details>';

            if (records.length === 0) {
                containerEl.innerHTML = '<div class="empty">No leads for this adset.</div>';
                return;
            }

            containerEl.innerHTML = '<div class="period-sections-wrap">' + periodHtml + '</div>';
            var t3 = document.getElementById('leads-tbody-3-' + clientId);
            var t7 = document.getElementById('leads-tbody-7-' + clientId);
            var t14 = document.getElementById('leads-tbody-14-' + clientId);
            if (t3) t3.innerHTML = q3.sort(function (a, b) { return (b.created || 0) - (a.created || 0); }).map(leadRow).join('');
            if (t7) t7.innerHTML = q7.sort(function (a, b) { return (b.created || 0) - (a.created || 0); }).map(leadRow).join('');
            if (t14) t14.innerHTML = q14.sort(function (a, b) { return (b.created || 0) - (a.created || 0); }).map(leadRow).join('');
        }

        function loadClientDetail(clientId, contentEl, btn) {
            contentEl.innerHTML = '<div class="panel-header" style="padding: 0 0 0.5rem 0; font-weight: 600; color: #202124;">Spend summary</div><div class="campaigns-placeholder"></div><div class="panel-header" style="padding: 1rem 0 0.5rem 0; font-weight: 600; color: #202124;">Leads by period (Qualified only)</div><div class="leads-placeholder"></div>';
            var campaignsPlaceholder = contentEl.querySelector('.campaigns-placeholder');
            var leadsPlaceholder = contentEl.querySelector('.leads-placeholder');
            loadCampaignsForClient(clientId, campaignsPlaceholder).then(function (spendTotals) {
                return loadLeadsForClient(clientId, leadsPlaceholder, spendTotals);
            }).then(function () {
                contentEl.setAttribute('data-loaded', 'true');
            }).catch(function (e) {
                contentEl.innerHTML = '<div class="empty">Error: ' + escapeHtml(e && e.message ? e.message : 'Failed to load') + '</div>';
            });
        }

        loadClients();
    </script>
</body>
</html>
