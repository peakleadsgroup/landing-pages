<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Daily Gross Profit – Total Spend</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: #f8f9fa;
        }
        .spinner {
            border: 3px solid #e5e7eb;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <div class="flex items-center gap-3 mb-6">
                    <img src="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" alt="Logo" class="h-10 w-auto">
                    <h1 class="text-2xl font-bold text-gray-800">Daily Gross Profit</h1>
                </div>
                <p class="text-gray-600 mb-6">Gross revenue, Facebook spend, and gross profit for today.</p>

                <div class="space-y-4">
                    <button
                        id="load-data-btn"
                        type="button"
                        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2"
                    >
                        <span id="btn-text">Load Data</span>
                        <span id="btn-spinner" class="spinner hidden"></span>
                    </button>

                    <div id="result-area" class="hidden mt-6 space-y-4">
                        <div class="p-4 bg-green-50 rounded-lg border border-green-200">
                            <p class="text-sm text-gray-600 mb-1">Gross Revenue</p>
                            <p id="gross-revenue-value" class="text-3xl font-bold text-green-700">—</p>
                            <p class="text-xs text-gray-500 mt-1">Sum from B2C Leads (today EST)</p>
                        </div>
                        <div class="p-4 bg-blue-50 rounded-lg border border-blue-200">
                            <p class="text-sm text-gray-600 mb-1">Facebook Spend</p>
                            <p id="spend-value" class="text-3xl font-bold text-blue-700">—</p>
                            <p class="text-xs text-gray-500 mt-1">Total spend across account (today EST)</p>
                        </div>
                        <div class="p-4 bg-purple-50 rounded-lg border border-purple-200">
                            <p class="text-sm text-gray-600 mb-1">Gross Profit</p>
                            <p id="gross-profit-value" class="text-3xl font-bold text-purple-700">—</p>
                            <p class="text-xs text-gray-500 mt-1">Gross Revenue − Facebook Spend</p>
                        </div>
                        <div class="p-4 bg-amber-50 rounded-lg border border-amber-200">
                            <p class="text-sm text-gray-600 mb-1">Margin %</p>
                            <p id="margin-value" class="text-3xl font-bold text-amber-700">—</p>
                            <p class="text-xs text-gray-500 mt-1">Gross Profit ÷ Gross Revenue</p>
                        </div>
                        <p id="result-date" class="text-xs text-gray-500"></p>
                    </div>

                    <div id="error-area" class="hidden mt-6 p-4 bg-red-50 rounded-lg border border-red-200">
                        <p class="text-sm font-medium text-red-800">Error loading data</p>
                        <p id="error-message" class="text-sm text-red-700 mt-1"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://hook.us2.make.com/o6fd582de7ovwb1wpo6abj4t39w7wbe1';
        const AIRTABLE_BASE_ID = 'appmBb0lzqRK9dI8v';
        const AIRTABLE_API_KEY = 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589';
        const AIRTABLE_BASE_URL = 'https://api.airtable.com/v0/' + AIRTABLE_BASE_ID;
        const B2C_LEADS_TABLE = 'B2C Leads';
        const GROSS_REVENUE_FIELD = 'Gross Revenue';

        const btn = document.getElementById('load-data-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const resultArea = document.getElementById('result-area');
        const grossRevenueValue = document.getElementById('gross-revenue-value');
        const spendValue = document.getElementById('spend-value');
        const grossProfitValue = document.getElementById('gross-profit-value');
        const marginValue = document.getElementById('margin-value');
        const resultDate = document.getElementById('result-date');
        const errorArea = document.getElementById('error-area');
        const errorMessage = document.getElementById('error-message');

        function setLoading(loading) {
            btn.disabled = loading;
            btnText.textContent = loading ? 'Loading...' : 'Load Data';
            btnSpinner.classList.toggle('hidden', !loading);
        }

        function formatCurrency(n) {
            return '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function parseSpendFromResponse(text) {
            if (text == null || text === '') return null;
            const trimmed = String(text).trim();
            try {
                const parsed = JSON.parse(trimmed);
                if (typeof parsed === 'number') return parsed;
                const spend = parsed.spend ?? parsed.totalSpend ?? parsed.Spend ?? parsed.TotalSpend ?? parsed.amount ?? parsed.value;
                if (spend != null) return Number(spend);
            } catch (_) {}
            const num = parseFloat(trimmed.replace(/[$,]/g, ''));
            return isNaN(num) ? null : num;
        }

        function getESTDateRange() {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
            const parts = formatter.formatToParts(now);
            const year = parseInt(parts.find(p => p.type === 'year').value);
            const month = parseInt(parts.find(p => p.type === 'month').value);
            const day = parseInt(parts.find(p => p.type === 'day').value);
            const noonUTC = new Date(Date.UTC(year, month - 1, day, 12, 0, 0));
            const etHour = parseInt(noonUTC.toLocaleString('en-US', { timeZone: 'America/New_York', hour: 'numeric', hour12: false }));
            const offsetHours = String(12 - etHour).padStart(2, '0');
            const startUTC = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T${offsetHours}:00:00.000Z`;
            const nextDay = new Date(Date.UTC(year, month - 1, day + 1));
            const ny = nextDay.getUTCFullYear(), nm = nextDay.getUTCMonth() + 1, nd = nextDay.getUTCDate();
            const endUTC = `${ny}-${String(nm).padStart(2, '0')}-${String(nd).padStart(2, '0')}T${offsetHours}:00:00.000Z`;
            return { startUTC, endUTC };
        }

        async function fetchB2CLeadsGrossRevenue() {
            const { startUTC, endUTC } = getESTDateRange();
            const formula = 'AND(IS_AFTER({Created}, "' + startUTC + '"), IS_BEFORE({Created}, "' + endUTC + '"))';
            let allRecords = [];
            let offset = null;

            do {
                let url = AIRTABLE_BASE_URL + '/' + encodeURIComponent(B2C_LEADS_TABLE) + '?filterByFormula=' + encodeURIComponent(formula);
                if (offset) url += '&offset=' + offset;

                const res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + AIRTABLE_API_KEY }
                });
                if (!res.ok) throw new Error('Airtable B2C Leads: ' + res.status);

                const data = await res.json();
                allRecords = allRecords.concat(data.records || []);
                offset = data.offset;
            } while (offset);

            let sum = 0;
            for (const rec of allRecords) {
                const val = rec.fields?.[GROSS_REVENUE_FIELD];
                if (val != null && val !== '') {
                    const n = typeof val === 'number' ? val : parseFloat(String(val).replace(/[$,]/g, ''));
                    if (!isNaN(n)) sum += n;
                }
            }
            return sum;
        }

        async function fetchFacebookSpend() {
            const res = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            const text = await res.text();
            const spend = parseSpendFromResponse(text);
            if (spend != null) return spend;
            if (!res.ok) throw new Error('Webhook failed: ' + res.status + ' ' + res.statusText);
            throw new Error('Could not parse spend from response');
        }

        async function loadData() {
            setLoading(true);
            resultArea.classList.add('hidden');
            errorArea.classList.add('hidden');

            try {
                const [grossRevenue, facebookSpend] = await Promise.all([
                    fetchB2CLeadsGrossRevenue(),
                    fetchFacebookSpend()
                ]);

                const grossProfit = grossRevenue - facebookSpend;

                const marginPct = grossRevenue > 0 ? (grossProfit / grossRevenue) * 100 : 0;

                grossRevenueValue.textContent = formatCurrency(grossRevenue);
                spendValue.textContent = formatCurrency(facebookSpend);
                grossProfitValue.textContent = formatCurrency(grossProfit);
                marginValue.textContent = marginPct.toFixed(1) + '%';
                resultDate.textContent = 'As of ' + new Date().toLocaleDateString('en-US', { dateStyle: 'medium', timeZone: 'America/New_York' }) + ' (EST/EDT)';
                resultArea.classList.remove('hidden');
            } catch (err) {
                errorMessage.textContent = err.message || 'Unknown error';
                errorArea.classList.remove('hidden');
            } finally {
                setLoading(false);
            }
        }

        btn.addEventListener('click', loadData);
    </script>
</body>
</html>
