<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Sales Voicemails – PeakLeads</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; background: #f8f9fa; }
        .spinner { border: 3px solid #e5e7eb; border-top: 3px solid #1a73e8; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        audio { height: 36px; max-width: 100%; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6">
        <div class="max-w-4xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg p-8">
                <div class="flex items-center gap-3 mb-6">
                    <img src="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" alt="Logo" class="h-10 w-auto">
                    <h1 class="text-2xl font-bold text-gray-800">Sales Voicemails</h1>
                </div>
                <p class="text-gray-600 mb-6">Voicemail recordings from your Twilio number. Click Load to fetch the latest.</p>

                <div class="flex flex-wrap items-center gap-4 mb-6">
                    <div class="flex items-center gap-2">
                        <label for="days" class="text-sm font-medium text-gray-700">Show last</label>
                        <select id="days" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="7">7 days</option>
                            <option value="14">14 days</option>
                            <option value="30" selected>30 days</option>
                            <option value="60">60 days</option>
                            <option value="90">90 days</option>
                        </select>
                    </div>
                    <button
                        id="load-btn"
                        type="button"
                        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2"
                    >
                        <span id="btn-text">Load Voicemails</span>
                        <span id="btn-spinner" class="spinner hidden"></span>
                    </button>
                </div>

                <div id="error-area" class="hidden mb-6 p-4 bg-red-50 rounded-lg border border-red-200">
                    <p class="text-sm font-medium text-red-800">Error</p>
                    <p id="error-message" class="text-sm text-red-700 mt-1"></p>
                </div>

                <div id="recordings-area" class="hidden">
                    <p id="recordings-summary" class="text-sm text-gray-500 mb-4"></p>
                    <ul id="recordings-list" class="space-y-4 divide-y divide-gray-200"></ul>
                </div>

                <div id="empty-state" class="hidden text-center py-12 text-gray-500">
                    <p class="text-lg">No voicemails found for the selected period.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loadBtn = document.getElementById('load-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const daysSelect = document.getElementById('days');
        const errorArea = document.getElementById('error-area');
        const errorMessage = document.getElementById('error-message');
        const recordingsArea = document.getElementById('recordings-area');
        const recordingsSummary = document.getElementById('recordings-summary');
        const recordingsList = document.getElementById('recordings-list');
        const emptyState = document.getElementById('empty-state');

        function setLoading(loading) {
            loadBtn.disabled = loading;
            btnText.textContent = loading ? 'Loading...' : 'Load Voicemails';
            btnSpinner.classList.toggle('hidden', !loading);
        }

        function formatPhone(p) {
            if (!p) return '—';
            const digits = p.replace(/\D/g, '');
            if (digits.length === 10) return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
            if (digits.length === 11 && digits[0] === '1') return `(${digits.slice(1,4)}) ${digits.slice(4,7)}-${digits.slice(7)}`;
            return p;
        }

        function formatDuration(sec) {
            if (sec == null) return '—';
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `0:${String(s).padStart(2, '0')}`;
        }

        function formatDate(iso) {
            if (!iso) return '—';
            const d = new Date(iso);
            return d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function normalizePhoneKey(p) {
            if (!p || typeof p !== 'string') return '__unknown__';
            const digits = p.replace(/\D/g, '');
            return digits.length >= 10 ? digits.slice(-10) : digits;
        }

        function parseDate(d) {
            if (!d) return 0;
            const t = new Date(d).getTime();
            return isNaN(t) ? 0 : t;
        }

        function groupByPhone(recordings) {
            const groups = new Map();
            for (const r of recordings) {
                const key = normalizePhoneKey(r.from);
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(r);
            }
            // Sort each group by date (newest first)
            for (const arr of groups.values()) {
                arr.sort((a, b) => parseDate(b.date_created) - parseDate(a.date_created));
            }
            return groups;
        }

        function renderRecording(r) {
            return `
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 py-3 px-3 rounded-lg hover:bg-gray-50">
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-gray-500">${formatDate(r.date_created)} · ${r.status === 'processing' ? 'Processing…' : formatDuration(r.duration)}</p>
                        ${r.to ? `<p class="text-xs text-gray-400 mt-0.5">To: ${formatPhone(r.to)}</p>` : ''}
                    </div>
                    <div class="flex-shrink-0">
                        ${r.status === 'processing' ? '<p class="text-sm text-amber-600">Audio available when processing completes</p>' : `<audio controls preload="metadata" class="w-full sm:w-64" src="/api/recordings/${r.sid}/audio"></audio>`}
                    </div>
                </div>
            `;
        }

        async function loadRecordings() {
            setLoading(true);
            errorArea.classList.add('hidden');
            recordingsArea.classList.add('hidden');
            emptyState.classList.add('hidden');

            const days = parseInt(daysSelect.value, 10);
            try {
                const [recordingsRes, notesRes] = await Promise.all([
                    fetch('/api/recordings?days=' + days),
                    fetch('/api/notes').catch(() => ({ ok: false }))
                ]);
                const data = await recordingsRes.json();

                if (!recordingsRes.ok) throw new Error(data.error || 'Failed to load recordings');

                const recordings = data.recordings || [];
                let notesByPhone = {};
                if (notesRes.ok) {
                    const notesData = await notesRes.json();
                    notesByPhone = notesData.notesByPhone || {};
                }

                recordingsSummary.textContent = recordings.length + ' voicemail(s) from ' + new Set(recordings.map(r => normalizePhoneKey(r.from))).size + ' caller(s)';

                if (recordings.length === 0) {
                    emptyState.classList.remove('hidden');
                } else {
                    const groups = groupByPhone(recordings);
                    const sortedGroups = [...groups.entries()].sort((a, b) => {
                        const aLatest = parseDate(a[1][0]?.date_created);
                        const bLatest = parseDate(b[1][0]?.date_created);
                        return bLatest - aLatest; // newest first
                    });

                    recordingsList.innerHTML = sortedGroups.map(([key, recs]) => {
                        const displayPhone = key === '__unknown__' ? 'Unknown' : formatPhone(recs[0]?.from);
                        const rawPhone = recs[0]?.from || '';
                        const count = recs.length;
                        const notes = (notesByPhone[key]?.notes || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        const notesSection = key !== '__unknown__' ? `
                            <div class="mt-3 pt-3 border-t border-gray-100">
                                <label class="block text-xs font-medium text-gray-500 mb-1">Notes</label>
                                <textarea data-phone="${rawPhone.replace(/"/g, '&quot;')}" class="notes-input w-full px-3 py-2 border border-gray-300 rounded-lg text-sm resize-y min-h-[60px] focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Add notes about this caller...">${notes}</textarea>
                                <button type="button" class="mt-2 px-3 py-1.5 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700 save-notes-btn" data-phone="${rawPhone.replace(/"/g, '&quot;')}">Save Notes</button>
                            </div>
                        ` : '';

                        return `
                        <li class="pt-4 first:pt-0 border-b border-gray-200 last:border-b-0">
                            <details class="group">
                                <summary class="flex items-center justify-between cursor-pointer list-none py-2 hover:bg-gray-50 -mx-2 px-2 rounded-lg">
                                    <span class="font-medium text-gray-900">${displayPhone}</span>
                                    <span class="text-sm text-gray-500">${count} voicemail${count !== 1 ? 's' : ''}</span>
                                    <svg class="w-5 h-5 text-gray-400 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                                </summary>
                                <div class="mt-2 ml-2 space-y-1 border-l-2 border-gray-200 pl-4">
                                    ${recs.map(r => renderRecording(r)).join('')}
                                    ${notesSection}
                                </div>
                            </details>
                        </li>
                        `;
                    }).join('');
                    recordingsArea.classList.remove('hidden');

                    recordingsList.querySelectorAll('.save-notes-btn').forEach(btn => {
                        btn.addEventListener('click', async () => {
                            const phone = btn.dataset.phone;
                            const textarea = btn.closest('li')?.querySelector('textarea.notes-input');
                            if (!textarea || !phone) return;
                            btn.disabled = true;
                            btn.textContent = 'Saving...';
                            try {
                                const res = await fetch('/api/notes', {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ phone, notes: textarea.value })
                                });
                                const data = await res.json();
                                if (!res.ok) throw new Error(data.error || 'Failed to save');
                                btn.textContent = 'Saved';
                                setTimeout(() => { btn.textContent = 'Save Notes'; btn.disabled = false; }, 1500);
                            } catch (err) {
                                btn.textContent = 'Error';
                                alert(err.message);
                                btn.disabled = false;
                            }
                        });
                    });
                }
            } catch (err) {
                errorMessage.textContent = err.message || 'Unknown error';
                errorArea.classList.remove('hidden');
            } finally {
                setLoading(false);
            }
        }

        loadBtn.addEventListener('click', loadRecordings);
    </script>
</body>
</html>
