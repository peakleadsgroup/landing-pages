<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" />
  <title>Open Ads - PeakLeads</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: #f8f9fa;
      color: #202124;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #dadce0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    header img { width: 36px; height: 36px; }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    #status {
      color: #5f6368;
      font-size: 0.9375rem;
      margin-bottom: 1rem;
    }

    #status.error { color: #c5221f; }

    #cards {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .niche-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .niche-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid #e0e3e7;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      position: sticky;
      top: 0;
      z-index: 1;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
    }

    .niche-header:hover {
      background: #f1f3f4;
      border-color: #d0d5db;
    }

    .niche-header:focus-visible {
      outline: 2px solid #1a73e8;
      outline-offset: 2px;
    }

    .niche-header-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      min-width: 0;
    }

    .niche-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1rem;
      color: #5f6368;
      font-size: 0.75rem;
      transition: transform 0.15s ease;
      flex: 0 0 auto;
    }

    .niche-section.is-collapsed .niche-chevron {
      transform: rotate(-90deg);
    }

    .niche-header h2 {
      font-size: 1.05rem;
      font-weight: 650;
      color: #202124;
      letter-spacing: -0.01em;
    }

    .niche-count {
      font-size: 0.8125rem;
      color: #5f6368;
      font-weight: 500;
      white-space: nowrap;
    }

    .niche-cards {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .niche-section.is-collapsed .niche-cards {
      display: none;
    }

    .card {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.9375rem;
    }

    .card a {
      color: #1a73e8;
      text-decoration: underline;
      word-break: break-all;
    }

    .card a:hover { color: #1557b0; }

    .empty {
      color: #5f6368;
      font-size: 0.9375rem;
      padding: 2rem;
      text-align: center;
      background: #fff;
      border: 1px dashed #dadce0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" alt="" />
    <h1>Open Ads</h1>
  </header>

  <main>
    <p id="status">Loading scripts…</p>
    <div id="cards"></div>
  </main>

  <script>
    (function () {
      "use strict";

      var AIRTABLE_BASE_ID = "appmBb0lzqRK9dI8v";
      var TABLE_ID = "tblnyzakoO67vFwhZ"; // Recordings
      var BASE_URL = "/api/airtable/v0/" + AIRTABLE_BASE_ID + "/" + TABLE_ID;

      // Preferred niche order; anything else sorts alphabetically after these.
      var NICHE_ORDER = [
        "Bathrooms",
        "Kitchens",
        "Kitchen Reface",
        "Floor Coating",
        "Windows",
        "Fencing",
        "Sealcoating/Striping",
        "Concrete Polishing",
        "Roofing",
        "Solar"
      ];

      var statusEl = document.getElementById("status");
      var cardsEl = document.getElementById("cards");

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function linkifyText(text) {
        var escaped = escapeHtml(text);
        return escaped.replace(/\b(https?:\/\/[^\s<]+)/gi, function (match) {
          var url = match;
          var trail = "";
          while (/[.,;:!?)\\]]$/.test(url)) {
            trail = url.slice(-1) + trail;
            url = url.slice(0, -1);
          }
          return (
            '<a href="' +
            url +
            '" target="_blank" rel="noopener noreferrer">' +
            url +
            "</a>" +
            trail
          );
        });
      }

      function buildListUrl(offset) {
        var url =
          BASE_URL +
          "?filterByFormula=" +
          encodeURIComponent("{Active}") +
          "&fields[]=" +
          encodeURIComponent("Script") +
          "&fields[]=" +
          encodeURIComponent("Niche");
        if (offset) {
          url += "&offset=" + encodeURIComponent(offset);
        }
        return url;
      }

      async function fetchAllActiveRecords() {
        var records = [];
        var url = buildListUrl(null);

        while (url) {
          var res = await fetch(url, { headers: { Accept: "application/json" } });
          var data = await res.json().catch(function () {
            return {};
          });

          if (!res.ok) {
            var msg =
              (data.error && (data.error.message || data.error)) ||
              data.message ||
              "Failed to load (" + res.status + ")";
            throw new Error(typeof msg === "string" ? msg : "Failed to load");
          }

          if (data.records && data.records.length) {
            records = records.concat(data.records);
          }

          url = data.offset ? buildListUrl(data.offset) : null;
        }

        return records;
      }

      function shuffleArray(arr) {
        var shuffled = arr.slice();
        for (var i = shuffled.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = shuffled[i];
          shuffled[i] = shuffled[j];
          shuffled[j] = tmp;
        }
        return shuffled;
      }

      function nicheLabel(value) {
        var niche = value == null ? "" : String(value).trim();
        return niche || "Uncategorized";
      }

      function nicheSortKey(label) {
        var idx = NICHE_ORDER.indexOf(label);
        if (idx >= 0) return { bucket: 0, idx: idx, name: label.toLowerCase() };
        if (label === "Uncategorized") return { bucket: 2, idx: 999, name: label.toLowerCase() };
        return { bucket: 1, idx: 999, name: label.toLowerCase() };
      }

      function compareNiches(a, b) {
        var ka = nicheSortKey(a);
        var kb = nicheSortKey(b);
        if (ka.bucket !== kb.bucket) return ka.bucket - kb.bucket;
        if (ka.idx !== kb.idx) return ka.idx - kb.idx;
        if (ka.name < kb.name) return -1;
        if (ka.name > kb.name) return 1;
        return 0;
      }

      function groupByNiche(records) {
        var groups = {};
        records.forEach(function (rec) {
          var label = nicheLabel(rec.fields && rec.fields.Niche);
          if (!groups[label]) groups[label] = [];
          groups[label].push(rec);
        });

        return Object.keys(groups)
          .sort(compareNiches)
          .map(function (label) {
            return {
              niche: label,
              records: shuffleArray(groups[label])
            };
          });
      }

      function render(records) {
        var withScript = records.filter(function (rec) {
          var script = rec.fields && rec.fields.Script;
          return script != null && String(script).trim() !== "";
        });

        if (!withScript.length) {
          statusEl.textContent = "No active scripts found.";
          cardsEl.innerHTML = '<p class="empty">No active scripts with content.</p>';
          return;
        }

        var groups = groupByNiche(withScript);
        var nicheCount = groups.length;

        statusEl.textContent =
          withScript.length +
          " active script" +
          (withScript.length === 1 ? "" : "s") +
          " · " +
          nicheCount +
          " niche" +
          (nicheCount === 1 ? "" : "s");

        cardsEl.innerHTML = groups
          .map(function (group) {
            var cards = group.records
              .map(function (rec) {
                return (
                  '<article class="card">' +
                  linkifyText(rec.fields.Script) +
                  "</article>"
                );
              })
              .join("");

            var sectionId =
              "niche-" +
              String(group.niche)
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/(^-|-$)/g, "");

            return (
              '<section class="niche-section" data-niche="' +
              escapeHtml(group.niche) +
              '">' +
              '<button type="button" class="niche-header" aria-expanded="true" aria-controls="' +
              sectionId +
              '-cards" id="' +
              sectionId +
              '-header">' +
              '<span class="niche-header-left">' +
              '<span class="niche-chevron" aria-hidden="true">▾</span>' +
              "<h2>" +
              escapeHtml(group.niche) +
              "</h2>" +
              "</span>" +
              '<span class="niche-count">' +
              group.records.length +
              " script" +
              (group.records.length === 1 ? "" : "s") +
              "</span>" +
              "</button>" +
              '<div class="niche-cards" id="' +
              sectionId +
              '-cards" role="region" aria-labelledby="' +
              sectionId +
              '-header">' +
              cards +
              "</div>" +
              "</section>"
            );
          })
          .join("");

        // Click a niche header to collapse/expand that section.
        Array.prototype.forEach.call(
          cardsEl.querySelectorAll(".niche-header"),
          function (btn) {
            btn.addEventListener("click", function () {
              var section = btn.closest(".niche-section");
              if (!section) return;
              var collapsed = section.classList.toggle("is-collapsed");
              btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
            });
          }
        );
      }

      fetchAllActiveRecords()
        .then(render)
        .catch(function (err) {
          statusEl.textContent = err.message || "Something went wrong.";
          statusEl.classList.add("error");
          cardsEl.innerHTML = "";
        });
    })();
  </script>
</body>
</html>
