<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18128405900"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "AW-18128405900");
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" />
  <title>Open Ads - PeakLeads</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: #f8f9fa;
      color: #202124;
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem 1.5rem;
      background: #fff;
      border-bottom: 1px solid #dadce0;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    header img { width: 36px; height: 36px; }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    #status {
      color: #5f6368;
      font-size: 0.9375rem;
      margin-bottom: 1rem;
    }

    #status.error { color: #c5221f; }

    #cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.9375rem;
    }

    .empty {
      color: #5f6368;
      font-size: 0.9375rem;
      padding: 2rem;
      text-align: center;
      background: #fff;
      border: 1px dashed #dadce0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" alt="" />
    <h1>Open Ads</h1>
  </header>

  <main>
    <p id="status">Loading scripts…</p>
    <div id="cards"></div>
  </main>

  <script>
    (function () {
      "use strict";

      var AIRTABLE_BASE_ID = "appmBb0lzqRK9dI8v";
      var TABLE_ID = "tblnyzakoO67vFwhZ";
      var BASE_URL = "/api/airtable/v0/" + AIRTABLE_BASE_ID + "/" + TABLE_ID;

      var statusEl = document.getElementById("status");
      var cardsEl = document.getElementById("cards");

      function escapeHtml(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function fetchAllActiveRecords() {
        var records = [];
        var url =
          BASE_URL +
          "?filterByFormula=" +
          encodeURIComponent("{Active}") +
          "&fields[]=" +
          encodeURIComponent("Script");

        while (url) {
          var res = await fetch(url, { headers: { Accept: "application/json" } });
          var data = await res.json().catch(function () {
            return {};
          });

          if (!res.ok) {
            var msg =
              (data.error && (data.error.message || data.error)) ||
              data.message ||
              "Failed to load (" + res.status + ")";
            throw new Error(typeof msg === "string" ? msg : "Failed to load");
          }

          if (data.records && data.records.length) {
            records = records.concat(data.records);
          }

          url = data.offset
            ? BASE_URL +
              "?filterByFormula=" +
              encodeURIComponent("{Active}") +
              "&fields[]=" +
              encodeURIComponent("Script") +
              "&offset=" +
              encodeURIComponent(data.offset)
            : null;
        }

        return records;
      }

      function render(records) {
        var withScript = records.filter(function (rec) {
          var script = rec.fields && rec.fields.Script;
          return script != null && String(script).trim() !== "";
        });

        if (!withScript.length) {
          statusEl.textContent = "No active scripts found.";
          cardsEl.innerHTML = '<p class="empty">No active scripts with content.</p>';
          return;
        }

        statusEl.textContent =
          withScript.length +
          " active script" +
          (withScript.length === 1 ? "" : "s");

        cardsEl.innerHTML = withScript
          .map(function (rec) {
            return (
              '<article class="card">' +
              escapeHtml(rec.fields.Script) +
              "</article>"
            );
          })
          .join("");
      }

      fetchAllActiveRecords()
        .then(render)
        .catch(function (err) {
          statusEl.textContent = err.message || "Something went wrong.";
          statusEl.classList.add("error");
          cardsEl.innerHTML = "";
        });
    })();
  </script>
</body>
</html>
