<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18128405900"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());
    gtag("config", "AW-18128405900");
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" />
  <title>Ads Tool — Swipe File - PeakLeads</title>
  <link rel="stylesheet" href="adstool.css?v=7" />
</head>
<body class="ads-body">
  <header class="ads-header">
    <div class="ads-header-left">
      <img src="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png" alt="" width="36" height="36" />
      <h1>Ads Tool</h1>
      <span class="ads-header-tag">Swipe file</span>
    </div>
    <label class="ads-dev-toggle" title="Log full OpenRouter request/response payloads on screen">
      <input type="checkbox" id="dev-mode-toggle" />
      Developer mode
    </label>
  </header>

  <div id="toast-area" class="ads-toast-area" aria-live="polite"></div>

  <main class="ads-main">
    <section id="status-panel" class="ads-card ads-status-card hidden" aria-live="polite">
      <p id="status-text" class="ads-status-text"></p>
      <div class="ads-progress-track" aria-hidden="true">
        <div id="status-progress" class="ads-progress-bar"></div>
      </div>
    </section>

    <section id="swipe-panel" class="ads-card ads-swipe-card hidden" aria-label="Swipe file viewer">
      <div class="ads-swipe-top">
        <div>
          <h2 id="swipe-keyword" class="ads-swipe-title"></h2>
          <p id="swipe-counter" class="ads-muted"></p>
        </div>
        <a id="swipe-library-link" class="ads-btn ads-btn-ghost" href="#" target="_blank" rel="noopener noreferrer">
          Open in Ads Library
        </a>
      </div>

      <div class="ads-carousel">
        <button type="button" id="prev-btn" class="ads-nav-btn" aria-label="Previous ad">‹</button>

        <div class="ads-carousel-body">
          <div id="swipe-media-stack" class="ads-media-stack" aria-live="polite"></div>

          <details id="swipe-details" class="ads-details">
            <summary class="ads-details-summary">Ad details</summary>
            <dl id="swipe-meta" class="ads-meta"></dl>
          </details>

          <details id="swipe-scripts" class="ads-details ads-scripts-details">
            <summary class="ads-details-summary">Scripts</summary>
            <div class="ads-scripts-root">
              <div id="scripts-list" class="ads-scripts-list"></div>
              <div class="ads-scripts-actions">
                <button type="button" id="scripts-add-btn" class="ads-btn ads-btn-ghost">+ New script record</button>
                <p id="scripts-status" class="ads-muted ads-scripts-hint">Auto-saves every few seconds</p>
              </div>
            </div>
          </details>

          <details id="swipe-ai" class="ads-details ads-ai-details">
            <summary class="ads-details-summary">AI Script Lab</summary>
            <div class="ads-ai-root">
              <div class="ads-ai-actions">
                <button type="button" id="ai-transcribe-btn" class="ads-btn ads-btn-primary">
                  Transcribe &amp; analyze
                </button>
              </div>

              <div class="ads-ai-field">
                <label class="ads-label" for="ai-transcript">Transcript</label>
                <textarea id="ai-transcript" class="ads-input ads-ai-transcript" readonly rows="4" placeholder="Transcript appears here…"></textarea>
                <p id="ai-transcript-source" class="ads-muted ads-ai-source"></p>
              </div>

              <div id="ai-structure" class="ads-ai-structure"></div>

              <div class="ads-ai-generate-row">
                <div class="ads-ai-field ads-ai-niche-field">
                  <label class="ads-label" for="ai-niche-select">Niche (context for generation)</label>
                  <select id="ai-niche-select" class="ads-select"></select>
                </div>
                <button type="button" id="ai-hooks-btn" class="ads-btn ads-btn-ghost">Generate 5 hooks</button>
                <button type="button" id="ai-next-btn" class="ads-btn ads-btn-ghost">Generate 5 next sentences</button>
              </div>

              <div class="ads-ai-field">
                <label class="ads-label">Hook ideas <span class="ads-muted">(click to add to script)</span></label>
                <div id="ai-hook-ideas" class="ads-idea-list"></div>
              </div>

              <div class="ads-ai-field">
                <label class="ads-label">Next sentence ideas <span class="ads-muted">(click to append)</span></label>
                <div id="ai-next-ideas" class="ads-idea-list"></div>
              </div>
            </div>
          </details>
        </div>

        <button type="button" id="next-btn" class="ads-nav-btn" aria-label="Next ad">›</button>
      </div>
    </section>

    <section id="empty-panel" class="ads-card ads-empty-card">
      <p id="empty-panel-text" class="ads-muted">Loading random ads…</p>
    </section>
  </main>

  <aside id="dev-console" class="ads-dev-console hidden" aria-label="Developer console">
    <div class="ads-dev-console-head">
      <strong>Developer console</strong>
      <span class="ads-muted">Full API payloads when developer mode is on</span>
      <button type="button" id="dev-clear-btn" class="ads-btn ads-btn-ghost ads-dev-clear">Clear</button>
    </div>
    <div id="dev-log" class="ads-dev-log"></div>
  </aside>

  <script src="adstool-app.js?v=17"></script>
  <script src="adstool-ai.js?v=1"></script>
</body>
</html>
