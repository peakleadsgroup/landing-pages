<input id="testAddress" placeholder="Start typing an address…" style="width:300px;padding:8px" />
<script>
  function initTestAC(){
    new google.maps.places.Autocomplete(document.getElementById('testAddress'), { types: ['address'], componentRestrictions:{country:'us'} });
  }
</script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places&callback=initTestAC"></script>
