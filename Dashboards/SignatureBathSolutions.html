<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://github.com/peakleadsgroup/landing-pages/blob/main/Images/PLG%20FAVICON%20(3).png?raw=true">
    <title>Client Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
        .hover-border:hover { outline: 2px solid #e5e7eb; outline-offset: -2px; }
        .notes-column { min-width: 300px; max-width: 400px; }
        .created-column { min-width: 180px; }
        .appointment-column { min-width: 200px; }
        .phone-column { min-width: 150px; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-4">
                        <img src="https://github.com/peakleadsgroup/landing-pages/blob/main/Images/Peak%20Leads%20Flattened%20Logo.png?raw=true" alt="Peak Leads Logo" class="h-10 w-auto">
                        <h1 class="text-2xl font-bold text-gray-900">Client Dashboard</h1>
                    </div>
                    <button onclick="fetchRecords()" id="refreshBtn" class="flex items-center justify-center p-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                    </button>
                </div>

                <!-- Search Bar -->
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search records..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        oninput="filterRecords()"
                    />
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <div class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <div>
                        <h3 class="font-semibold text-red-900 mb-1">Error Loading Records</h3>
                        <p class="text-sm text-red-800" id="errorText"></p>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600">Loading records...</p>
            </div>

            <!-- Records Container -->
            <div id="recordsContainer" class="hidden">
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="p-4 bg-gray-50 border-b border-gray-200 flex items-center gap-2">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                        </svg>
                        <span class="font-semibold text-gray-700" id="recordCount">0 records found</span>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead class="bg-gray-50 border-b border-gray-200" id="tableHead"></thead>
                            <tbody class="bg-white divide-y divide-gray-200" id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- No Records State -->
            <div id="noRecordsState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-12 h-12 text-gray-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                </svg>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">No Records Found</h3>
                <p class="text-gray-600">No records match the specified filter criteria.</p>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-4xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Edit Record</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="editModalContent" class="max-h-96 overflow-y-auto">
                <!-- Content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Configuration - Replace these with your actual values (do NOT expose real keys in production)
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            tableName: 'B2C Leads',
            apiKey: 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589',
            linkedFieldName: 'Linked Client',
            // Using client name for efficient server-side filtering
            filterValue: 'Signature Bath Solutions',
            useRecordId: false,
            // Columns to display (in order)
            displayColumns: [
                'Full Name',
                'Stage',
                'Status',
                'Created',
                'Phone',
                'Address',
                'Price',
                'Appointment (Respective Timezone)',
                'Notes'
            ]
        };

        let allRecords = [];
        let filteredRecords = [];

        async function fetchRecords() {
            const refreshBtn = document.getElementById('refreshBtn');
            const refreshIcon = document.getElementById('refreshIcon');
            const loadingState = document.getElementById('loadingState');
            const errorMessage = document.getElementById('errorMessage');
            const recordsContainer = document.getElementById('recordsContainer');
            const noRecordsState = document.getElementById('noRecordsState');

            // Hide all states
            errorMessage.classList.add('hidden');
            recordsContainer.classList.add('hidden');
            noRecordsState.classList.add('hidden');

            // Show loading
            loadingState.classList.remove('hidden');
            refreshBtn.disabled = true;
            refreshIcon.classList.add('animate-spin');

            try {
                // Build filter formula
                let filterFormula;
                if (CONFIG.useRecordId) {
                    filterFormula = null;
                } else {
                    filterFormula = `FIND("${CONFIG.filterValue}", ARRAYJOIN({${CONFIG.linkedFieldName}}))`;
                }

                // Fetch all records with pagination
                allRecords = [];
                let offset = null;
                let pageCount = 0;

                do {
                    pageCount++;
                    let url;
                    if (filterFormula) {
                        url = `https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}?filterByFormula=${encodeURIComponent(filterFormula)}`;
                    } else {
                        url = `https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}`;
                    }

                    if (offset) {
                        url += `&offset=${offset}`;
                    }

                    const response = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${CONFIG.apiKey}` }
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Response error:', errorText);
                        throw new Error(`Failed to fetch: ${response.status} ${response.statusText}`);
                    }

                    const data = await response.json();
                    allRecords = allRecords.concat(data.records || []);
                    offset = data.offset;

                } while (offset);

                // If using record ID, filter client-side
                if (CONFIG.useRecordId) {
                    filteredRecords = allRecords.filter(record => {
                        const linkedField = record.fields[CONFIG.linkedFieldName];
                        if (!linkedField) return false;
                        if (Array.isArray(linkedField)) {
                            return linkedField.includes(CONFIG.filterValue);
                        }
                        return false;
                    });
                } else {
                    filteredRecords = [...allRecords];
                }

                // Sort by Created date (newest first)
                filteredRecords.sort((a, b) => {
                    const dateA = new Date(a.fields['Created'] || 0);
                    const dateB = new Date(b.fields['Created'] || 0);
                    return dateB - dateA;
                });

                displayRecords();
            } catch (err) {
                document.getElementById('errorText').textContent = err.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loadingState.classList.add('hidden');
                refreshBtn.disabled = false;
                refreshIcon.classList.remove('animate-spin');
            }
        }

        function displayRecords() {
            const recordsContainer = document.getElementById('recordsContainer');
            const noRecordsState = document.getElementById('noRecordsState');
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');
            const recordCount = document.getElementById('recordCount');

            if (filteredRecords.length === 0) {
                recordsContainer.classList.add('hidden');
                noRecordsState.classList.remove('hidden');
                return;
            }

            recordsContainer.classList.remove('hidden');
            noRecordsState.classList.add('hidden');

            // Update count
            recordCount.textContent = filteredRecords.length + ' record' + (filteredRecords.length !== 1 ? 's' : '') + ' found';

            // Use configured display columns
            const fieldKeys = CONFIG.displayColumns;

            // Create table header
            const headerRow = document.createElement('tr');

            const editHeader = document.createElement('th');
            editHeader.className = 'px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider';
            editHeader.textContent = 'Edit';
            headerRow.appendChild(editHeader);

            for (let i = 0; i < fieldKeys.length; i++) {
                const th = document.createElement('th');
                th.className = 'px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider';
                if (fieldKeys[i] === 'Notes') {
                    th.className += ' notes-column';
                } else if (fieldKeys[i] === 'Created') {
                    th.className += ' created-column';
                } else if (fieldKeys[i] === 'Appointment (Respective Timezone)') {
                    th.className += ' appointment-column';
                } else if (fieldKeys[i] === 'Phone') {
                    th.className += ' phone-column';
                }
                th.textContent = fieldKeys[i];
                headerRow.appendChild(th);
            }

            tableHead.innerHTML = '';
            tableHead.appendChild(headerRow);

            // Clear table body
            tableBody.innerHTML = '';

            // Create table body with special formatting
            tableBody.innerHTML = filteredRecords.map(record => {
                // Edit button cell
                const editCell = '<td class="px-6 py-4"><button onclick="openEditModal(\'' + record.id + '\')" class="text-blue-600 hover:text-blue-800"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button></td>';

                const cells = fieldKeys.map(key => {
                    let value = record.fields[key];

                    // Handle different value types
                    if (value === null || value === undefined) {
                        value = '';
                    } else if (Array.isArray(value)) {
                        value = value.join(', ');
                    } else {
                        value = String(value);
                    }

                    // Stage column with colored badge
                    if (key === 'Stage' && value) {
                        const stageLower = value.toLowerCase();
                        let badgeColor = 'bg-gray-100 text-gray-800';

                        if (stageLower === 'uncontacted') {
                            badgeColor = 'bg-slate-100 text-slate-800';
                        } else if (stageLower === 'contacted') {
                            badgeColor = 'bg-blue-100 text-blue-800';
                        } else if (stageLower === 'no show') {
                            badgeColor = 'bg-orange-100 text-orange-800';
                        } else if (stageLower === 'appointment ran') {
                            badgeColor = 'bg-purple-100 text-purple-800';
                        } else if (stageLower === 'close lost') {
                            badgeColor = 'bg-red-100 text-red-800';
                        } else if (stageLower === 'close won') {
                            badgeColor = 'bg-green-100 text-green-800';
                        }

                        return '<td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ' + badgeColor + '">' + value + '</span></td>';
                    }

                    // Status column with colored badge
                    if (key === 'Status' && value) {
                        const statusLower = value.toLowerCase();
                        let badgeColor = 'bg-gray-100 text-gray-800';

                        if (statusLower === 'qualified') {
                            badgeColor = 'bg-green-100 text-green-800';
                        } else if (statusLower === 'pending') {
                            badgeColor = 'bg-yellow-100 text-yellow-800';
                        } else if (statusLower === 'unqualified') {
                            badgeColor = 'bg-red-100 text-red-800';
                        }

                        return '<td class="px-6 py-4"><span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ' + badgeColor + '">' + value + '</span></td>';
                    }

                    // Format phone numbers
                    if (key === 'Phone' && value && value.trim() !== '') {
                        const cleaned = value.replace(/\D/g, '');
                        if (cleaned.length === 10) {
                            value = `(${cleaned.slice(0, 3)}) ${cleaned.slice(3, 6)}-${cleaned.slice(6)}`;
                        }
                    }

                    // Format Price as currency
                    if (key === 'Price') {
                        if (!value || value.trim() === '') {
                            value = '$0.00';
                        } else {
                            const cleanValue = value.replace(/[\$,]/g, '');
                            const num = Number(cleanValue);
                            value = Number.isFinite(num)
                                ? `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                                : '$0.00';
                        }
                    }

                    // Format Created date to user's timezone
                    if (key === 'Created' && value && value.trim() !== '') {
                        try {
                            const date = new Date(value);
                            if (!isNaN(date.getTime())) {
                                const timeString = date.toLocaleString('en-US', {
                                    month: 'short',
                                    day: 'numeric',
                                    year: 'numeric',
                                    hour: 'numeric',
                                    minute: '2-digit',
                                    hour12: true
                                });
                                const timezone = date.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ').pop();
                                value = timeString + ' ' + timezone;
                            }
                        } catch (e) {
                            // Keep original value if parsing fails
                        }
                    }

                    // Add column width helpers
                    let cellClass = 'px-6 py-4 text-sm text-gray-900';
                    if (key === 'Notes') {
                        cellClass += ' notes-column';
                    } else if (key === 'Created') {
                        cellClass += ' created-column';
                    } else if (key === 'Appointment (Respective Timezone)') {
                        cellClass += ' appointment-column';
                    } else if (key === 'Phone') {
                        cellClass += ' phone-column';
                    }

                    return '<td class="' + cellClass + '">' + value + '</td>';
                }).join('');

                return '<tr class="hover-border">' + editCell + cells + '</tr>';
            }).join('');
        }

        function filterRecords() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredRecords = allRecords.filter(record => {
                return Object.values(record.fields).some(value => {
                    if (value === null || value === undefined) return false;
                    return String(value).toLowerCase().includes(searchTerm);
                });
            });

            displayRecords();
        }

        // Modal functions
        function openEditModal(recordId) {
            const record = allRecords.find(r => r.id === recordId);
            if (!record) return;

            const modal = document.getElementById('editModal');
            const content = document.getElementById('editModalContent');

            // Clear previous content
            content.innerHTML = '';

            // Create container
            const container = document.createElement('div');
            container.className = 'space-y-4';

            // Show Full Summary field (read-only)
            const fullSummary = record.fields['Full Summary'];
            let summaryDisplayValue = '';

            if (fullSummary === null || fullSummary === undefined || fullSummary === '') {
                summaryDisplayValue = 'No data';
            } else if (Array.isArray(fullSummary)) {
                summaryDisplayValue = fullSummary.join(', ');
            } else {
                summaryDisplayValue = String(fullSummary);
            }

            const summaryDiv = document.createElement('div');
            summaryDiv.className = 'border-b border-gray-200 pb-3';

            const summaryLabel = document.createElement('label');
            summaryLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
            summaryLabel.textContent = 'Full Summary';

            const summaryValueDiv = document.createElement('div');
            summaryValueDiv.className = 'text-sm text-gray-900 whitespace-pre-wrap';

            if (summaryDisplayValue === 'No data') {
                const emptySpan = document.createElement('span');
                emptySpan.className = 'text-gray-400';
                emptySpan.textContent = summaryDisplayValue;
                summaryValueDiv.appendChild(emptySpan);
            } else {
                summaryValueDiv.textContent = summaryDisplayValue;
            }

            summaryDiv.appendChild(summaryLabel);
            summaryDiv.appendChild(summaryValueDiv);
            container.appendChild(summaryDiv);

            // Show Notes field (editable)
            const notes = record.fields['Notes'];
            let notesValue = '';

            if (notes !== null && notes !== undefined) {
                if (Array.isArray(notes)) {
                    notesValue = notes.join(', ');
                } else {
                    notesValue = String(notes);
                }
            }

            const notesDiv = document.createElement('div');
            notesDiv.className = 'pb-3';

            const notesLabel = document.createElement('label');
            notesLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
            notesLabel.textContent = 'Notes';

            const notesTextarea = document.createElement('textarea');
            notesTextarea.id = 'editNotesField';
            notesTextarea.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent';
            notesTextarea.rows = 6;
            notesTextarea.value = notesValue;
            notesTextarea.placeholder = 'Enter notes here...';

            // Store original value for comparison
            const originalNotes = notesValue;

            const unsavedMessage = document.createElement('div');
            unsavedMessage.id = 'unsavedMessage';
            unsavedMessage.className = 'text-sm text-gray-400 mt-1 hidden';
            unsavedMessage.textContent = 'Unsaved changes';

            notesDiv.appendChild(notesLabel);
            notesDiv.appendChild(notesTextarea);
            notesDiv.appendChild(unsavedMessage);
            container.appendChild(notesDiv);

            // Add save button (initially hidden)
            const saveBtn = document.createElement('button');
            saveBtn.id = 'saveNotesBtn';
            saveBtn.className = 'px-4 py-2 bg-green-700 text-white rounded-lg hover:bg-green-800 transition-colors hidden';
            saveBtn.textContent = 'Save Notes';
            saveBtn.onclick = function() { saveNotes(recordId); };
            container.appendChild(saveBtn);

            // Add event listener to detect changes
            notesTextarea.addEventListener('input', function() {
                if (notesTextarea.value !== originalNotes) {
                    saveBtn.classList.remove('hidden');
                    unsavedMessage.classList.remove('hidden');
                } else {
                    saveBtn.classList.add('hidden');
                    unsavedMessage.classList.add('hidden');
                }
            });

            // Add Report as Unqualified button
            const reportBtn = document.createElement('button');
            reportBtn.className = 'flex items-center gap-2 px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors mt-4';
            reportBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path></svg>Report as Unqualified';
            reportBtn.onclick = function() { showUnqualifiedReport(recordId); };
            container.appendChild(reportBtn);

            content.appendChild(container);
            modal.classList.remove('hidden');
        }

        function showUnqualifiedReport(recordId) {
            const record = allRecords.find(r => r.id === recordId);
            if (!record) return;

            const fullName = record.fields['Full Name'] || 'Unknown';
            const whyUnqualified = record.fields['Why Unqualified'] || '';
            const unqualifiedReasoning = record.fields['Unqualified Reasoning'] || '';
            const approvalStatus = record.fields['Unqualified Approval Status'] || '';
            const approvalReasoning = record.fields['Unqualified Approval Reasoning'] || '';
            const isAlreadyReported = whyUnqualified !== '';

            const content = document.getElementById('editModalContent');
            content.innerHTML = '';

            const container = document.createElement('div');
            container.className = 'space-y-4';

            const heading = document.createElement('h2');
            heading.className = 'text-2xl font-bold text-gray-900 mb-6';
            heading.textContent = `Report ${fullName} as unqualified`;
            container.appendChild(heading);

            const explanationDiv = document.createElement('div');
            explanationDiv.className = 'bg-blue-50 border border-blue-200 rounded-lg p-4 mb-4';
            explanationDiv.innerHTML = '<p class="text-sm text-gray-700">We provide replacements for duplicates, phone numbers that are out of service, or zip codes that are out of your area. While we understand there may be other situations where you are not able to sell a lead, we built our pricing knowing that some of these edge cases will exist, and therefore can only replace leads for the previously listed reasons. This allows us to keep costs as low as possible. We work on an extremely thin margin so replacing every single lead that is an edge case would make us unprofitable, and we too need to make some money to survive as a business and continue providing you leads.</p>';
            container.appendChild(explanationDiv);

            if (isAlreadyReported) {
                const alreadyReportedDiv = document.createElement('div');
                alreadyReportedDiv.className = 'bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4';
                alreadyReportedDiv.innerHTML = '<p class="text-yellow-800">You\'ve already reported this lead as unqualified</p>';
                container.appendChild(alreadyReportedDiv);
            }

            const whyDiv = document.createElement('div');
            whyDiv.className = 'mb-4';

            const whyLabel = document.createElement('label');
            whyLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
            whyLabel.textContent = 'Why is this lead unqualified?';

            const whySelect = document.createElement('select');
            whySelect.id = 'whyUnqualifiedSelect';
            whySelect.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent';
            if (isAlreadyReported) {
                whySelect.className += ' bg-gray-100 cursor-not-allowed';
                whySelect.disabled = true;
            }

            const options = ['', 'Out of area', 'Phone is out of service', 'Duplicate lead'];
            options.forEach(opt => {
                const option = document.createElement('option');
                option.value = opt;
                option.textContent = opt || '-- Select --';
                if (opt === whyUnqualified) { option.selected = true; }
                whySelect.appendChild(option);
            });

            whyDiv.appendChild(whyLabel);
            whyDiv.appendChild(whySelect);
            container.appendChild(whyDiv);

            const reasoningDiv = document.createElement('div');
            reasoningDiv.className = 'mb-4';

            const reasoningLabel = document.createElement('label');
            reasoningLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
            reasoningLabel.textContent = 'Leave a note for our team for when they review this request';

            const reasoningTextarea = document.createElement('textarea');
            reasoningTextarea.id = 'unqualifiedReasoningField';
            reasoningTextarea.className = 'w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent';
            if (isAlreadyReported) {
                reasoningTextarea.className += ' bg-gray-100 cursor-not-allowed';
                reasoningTextarea.disabled = true;
            }
            reasoningTextarea.rows = 4;
            reasoningTextarea.value = unqualifiedReasoning;
            reasoningTextarea.placeholder = 'Enter detailed reasoning...';

            reasoningDiv.appendChild(reasoningLabel);
            reasoningDiv.appendChild(reasoningTextarea);
            container.appendChild(reasoningDiv);

            if (isAlreadyReported) {
                const approvalStatusDiv = document.createElement('div');
                approvalStatusDiv.className = 'mb-4 border-t border-gray-200 pt-4';

                const approvalStatusLabel = document.createElement('label');
                approvalStatusLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
                approvalStatusLabel.textContent = 'Unqualified Approval Status';

                const approvalStatusValue = document.createElement('div');
                approvalStatusValue.className = 'text-sm text-gray-900 px-3 py-2 bg-gray-50 rounded-md';
                approvalStatusValue.textContent = approvalStatus || 'Pending review';

                approvalStatusDiv.appendChild(approvalStatusLabel);
                approvalStatusDiv.appendChild(approvalStatusValue);
                container.appendChild(approvalStatusDiv);

                const approvalReasoningDiv = document.createElement('div');
                approvalReasoningDiv.className = 'mb-4';

                const approvalReasoningLabel = document.createElement('label');
                approvalReasoningLabel.className = 'block text-sm font-medium text-gray-700 mb-1';
                approvalReasoningLabel.textContent = 'Unqualified Approval Reasoning';

                const approvalReasoningValue = document.createElement('div');
                approvalReasoningValue.className = 'text-sm text-gray-900 px-3 py-2 bg-gray-50 rounded-md whitespace-pre-wrap';
                approvalReasoningValue.textContent = approvalReasoning || 'No reasoning provided yet';

                approvalReasoningDiv.appendChild(approvalReasoningLabel);
                approvalReasoningDiv.appendChild(approvalReasoningValue);
                container.appendChild(approvalReasoningDiv);
            }

            if (!isAlreadyReported) {
                const checkboxDiv = document.createElement('div');
                checkboxDiv.className = 'flex items-start gap-2 mb-4';

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.id = 'confirmCheckbox';
                checkbox.className = 'mt-1 w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500';

                const checkboxLabel = document.createElement('label');
                checkboxLabel.htmlFor = 'confirmCheckbox';
                checkboxLabel.className = 'text-sm text-gray-700 cursor-pointer';
                checkboxLabel.textContent = 'I understand that the only reasons leads will be replaced is if they meet one of the 3 selected criteria';

                checkboxDiv.appendChild(checkbox);
                checkboxDiv.appendChild(checkboxLabel);
                container.appendChild(checkboxDiv);

                const submitBtn = document.createElement('button');
                submitBtn.id = 'submitUnqualifiedBtn';
                submitBtn.className = 'px-4 py-2 bg-gray-400 text-white rounded-lg cursor-not-allowed transition-colors';
                submitBtn.textContent = 'Submit';
                submitBtn.disabled = true;
                submitBtn.onclick = function() { submitUnqualifiedReport(recordId); };
                container.appendChild(submitBtn);

                function checkSubmitEnabled() {
                    const whyValue = whySelect.value;
                    const reasoningValue = reasoningTextarea.value.trim();
                    const isChecked = checkbox.checked;

                    if (whyValue && reasoningValue && isChecked) {
                        submitBtn.disabled = false;
                        submitBtn.className = 'px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer transition-colors';
                    } else {
                        submitBtn.disabled = true;
                        submitBtn.className = 'px-4 py-2 bg-gray-400 text-white rounded-lg cursor-not-allowed transition-colors';
                    }
                }

                whySelect.addEventListener('change', checkSubmitEnabled);
                reasoningTextarea.addEventListener('input', checkSubmitEnabled);
                checkbox.addEventListener('change', checkSubmitEnabled);
            }

            content.appendChild(container);
        }

        async function submitUnqualifiedReport(recordId) {
            const whySelect = document.getElementById('whyUnqualifiedSelect');
            const reasoningField = document.getElementById('unqualifiedReasoningField');

            const whyValue = whySelect.value;
            const reasoningValue = reasoningField.value;

            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${recordId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fields: {
                            'Why Unqualified': whyValue,
                            'Unqualified Reasoning': reasoningValue
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to submit report');
                }

                // Update the record in our local array
                const record = allRecords.find(r => r.id === recordId);
                if (record) {
                    record.fields['Why Unqualified'] = whyValue;
                    record.fields['Unqualified Reasoning'] = reasoningValue;
                }

                // Refresh the display
                displayRecords();

                // Close modal
                closeEditModal();

                alert('Unqualified report submitted successfully!');
            } catch (err) {
                alert('Error submitting report: ' + err.message);
            }
        }

        async function saveNotes(recordId) {
            const notesField = document.getElementById('editNotesField');
            const newNotes = notesField.value;

            try {
                const response = await fetch(`https://api.airtable.com/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${recordId}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `Bearer ${CONFIG.apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ fields: { 'Notes': newNotes } })
                });

                if (!response.ok) {
                    throw new Error('Failed to save notes');
                }

                // Update the record in our local array
                const record = allRecords.find(r => r.id === recordId);
                if (record) { record.fields['Notes'] = newNotes; }

                // Refresh the display
                displayRecords();

                // Close modal
                closeEditModal();

                alert('Notes saved successfully!');
            } catch (err) {
                alert('Error saving notes: ' + err.message);
            }
        }

        function closeEditModal() {
            const modal = document.getElementById('editModal');
            modal.classList.add('hidden');
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) { closeEditModal(); }
        });

        // Initial load
        fetchRecords();
    </script>
</body>
</html>
