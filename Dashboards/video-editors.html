<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Video Editors - Productivity Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AIRTABLE_CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            timeTrackingTable: 'Time Tracking',
            b2cAdsTable: 'B2C Ads',
            staffTable: 'Staff'
        };

        function formatDateOnly(dateValue) {
            if (!dateValue) return null;
            try {
                const date = new Date(dateValue);
                if (isNaN(date.getTime())) return null;
                return date.toISOString().split('T')[0];
            } catch {
                return null;
            }
        }

        function VideoEditorsDashboard() {
            const [chartData, setChartData] = useState([]);
            const selectedUser = 'Julian Astacio';
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [rawTimeRecords, setRawTimeRecords] = useState([]);
            const [rawAdsRecords, setRawAdsRecords] = useState([]);
            const [staffMap, setStaffMap] = useState({});
            const [userToStaffMap, setUserToStaffMap] = useState({});
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const fetchAirtableRecords = async (tableName) => {
                let allRecords = [];
                let offset = null;

                do {
                    let url = `/api/airtable/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(tableName)}`;
                    if (offset) url += `?offset=${offset}`;

                    const response = await fetch(url);

                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${tableName}: ${response.status}`);
                    }

                    const data = await response.json();
                    allRecords = allRecords.concat(data.records || []);
                    offset = data.offset;
                } while (offset);

                return allRecords;
            };

            const fetchMetaCollaborators = async () => {
                try {
                    const response = await fetch(
                        `/api/airtable/v0/meta/bases/${AIRTABLE_CONFIG.baseId}`,
                        { headers: {} }
                    );
                    if (!response.ok) return {};
                    const data = await response.json();
                    const collabMap = {};
                    (data.collaborators || []).forEach(c => {
                        collabMap[c.id] = { email: c.email || '', name: c.name || c.email || c.id };
                    });
                    return collabMap;
                } catch {
                    return {};
                }
            };

            const fetchData = async () => {
                setLoading(true);
                setError(null);

                try {
                    const [timeRecords, adsRecords, staffRecords] = await Promise.all([
                        fetchAirtableRecords(AIRTABLE_CONFIG.timeTrackingTable),
                        fetchAirtableRecords(AIRTABLE_CONFIG.b2cAdsTable),
                        fetchAirtableRecords(AIRTABLE_CONFIG.staffTable)
                    ]);

                    const collaborators = await fetchMetaCollaborators();

                    const staffById = {};
                    staffRecords.forEach(r => {
                        const name = r.fields['Name'] || r.fields['Editor'] || 'Unknown';
                        staffById[r.id] = { id: r.id, name, email: (r.fields['Email'] || '').toLowerCase().trim() };
                    });
                    setStaffMap(staffById);

                    const userToStaff = {};
                    Object.entries(collaborators).forEach(([userId, collab]) => {
                        const email = (collab.email || '').toLowerCase().trim();
                        const staffMatch = Object.values(staffById).find(s => s.email && s.email === email);
                        if (staffMatch) userToStaff[userId] = staffMatch.id;
                    });
                    setUserToStaffMap(userToStaff);

                    setRawTimeRecords(timeRecords);
                    setRawAdsRecords(adsRecords);

                    processAndSetChartData(timeRecords, adsRecords, staffById, userToStaff, collaborators);

                } catch (err) {
                    console.error(err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const processAndSetChartData = (timeRecords, adsRecords, staffById, userToStaff, collaborators) => {
                const hoursByStaffDate = {};
                const videosByStaffDate = {};

                const getHours = (fields) => parseFloat(fields['Hours'] || fields['Hours Worked'] || fields['Duration']) || 0;
                const getStartDate = (fields) => formatDateOnly(fields['Start'] || fields['Start Date'] || fields['Date']);

                timeRecords.forEach(record => {
                    const fields = record.fields;
                    const userField = fields['User'] || fields['Editor'] || fields['Staff'] || fields['Assigned To'];
                    const startDate = getStartDate(fields);
                    const hours = getHours(fields);

                    if (!startDate) return;

                    let staffName = null;

                    if (userField) {
                        const arr = Array.isArray(userField) ? userField : [userField];
                        const first = arr[0];
                        const rawVal = typeof first === 'object' && first ? first : first;

                        if (typeof rawVal === 'string' && rawVal.startsWith('rec')) {
                            staffName = staffById[rawVal]?.name;
                        } else {
                            const userId = typeof first === 'object' && first && first.id ? first.id : first;
                            const userEmail = typeof first === 'object' && first && first.email ? (first.email || '').toLowerCase().trim() : null;
                            const userName = typeof first === 'object' && first && first.name ? (first.name || '').trim() : null;
                            if (userId) {
                                if (userId.startsWith('rec')) {
                                    staffName = staffById[userId]?.name;
                                } else {
                                    const staffId = userToStaff[userId];
                                    if (staffId) {
                                        staffName = staffById[staffId]?.name;
                                    } else if (userEmail) {
                                        const staffByEmail = Object.values(staffById).find(s => s.email && s.email === userEmail);
                                        staffName = staffByEmail?.name;
                                    }
                                    if (!staffName && userName) {
                                        const staffByName = Object.values(staffById).find(s => s.name && s.name.toLowerCase() === userName.toLowerCase());
                                        staffName = staffByName?.name;
                                    }
                                    if (!staffName) {
                                        staffName = collaborators[userId]?.name || collaborators[userId]?.email || userEmail || userName || userId;
                                    }
                                }
                            }
                        }
                    }

                    if (!staffName) return;

                    const key = `${staffName}|${startDate}`;
                    hoursByStaffDate[key] = (hoursByStaffDate[key] || 0) + hours;
                });

                adsRecords.forEach(record => {
                    const dateFinished = record.fields['Date Finished'];
                    if (!dateFinished) return;

                    const date = formatDateOnly(dateFinished);
                    if (!date) return;

                    const editorField = record.fields['Editor'];
                    if (!editorField) return;

                    const editorIds = Array.isArray(editorField) ? editorField : [editorField];
                    editorIds.forEach(editorId => {
                        const staff = staffById[editorId];
                        if (!staff) return;
                        const key = `${staff.name}|${date}`;
                        videosByStaffDate[key] = (videosByStaffDate[key] || 0) + 1;
                    });
                });

                const allKeys = new Set([...Object.keys(hoursByStaffDate), ...Object.keys(videosByStaffDate)]);
                const byStaff = {};

                allKeys.forEach(key => {
                    const [staffName, date] = key.split('|');
                    if (!byStaff[staffName]) byStaff[staffName] = {};
                    byStaff[staffName][date] = {
                        date,
                        hours: hoursByStaffDate[key] || 0,
                        videos: videosByStaffDate[key] || 0
                    };
                });

                setChartData(byStaff);
            };

            const getFilteredData = () => {
                if (!selectedUser || !chartData[selectedUser]) return [];

                const days = chartData[selectedUser];
                const sorted = Object.values(days).sort((a, b) => a.date.localeCompare(b.date));

                return sorted.map(d => {
                    const vph = d.hours > 0 ? d.videos / d.hours : null;
                    const isNA = d.hours === 0 && d.videos > 0;
                    return {
                        ...d,
                        videosPerHour: vph,
                        isNA
                    };
                });
            };

            const filteredData = getFilteredData();

            useEffect(() => {
                if (filteredData.length > 0 && chartRef.current) {
                    if (chartInstance.current) chartInstance.current.destroy();

                    const ctx = chartRef.current.getContext('2d');
                    const labels = filteredData.map(d => d.date);
                    const values = filteredData.map(d => d.isNA ? 0 : (d.videosPerHour !== null ? d.videosPerHour : 0));
                    const naIndices = filteredData.map((d, i) => d.isNA ? i : -1).filter(i => i >= 0);

                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels,
                            datasets: [{
                                label: 'Videos per hour',
                                data: values,
                                backgroundColor: values.map((v, i) =>
                                    naIndices.includes(i) ? 'rgba(156, 163, 175, 0.5)' : 'rgba(59, 130, 246, 0.7)'
                                ),
                                borderColor: values.map((v, i) =>
                                    naIndices.includes(i) ? 'rgb(156, 163, 175)' : 'rgb(59, 130, 246)'
                                ),
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        afterLabel: function(context) {
                                            const pt = filteredData[context.dataIndex];
                                            if (pt && pt.isNA) {
                                                return 'No hours logged for this day. Videos finished but time not tracked.';
                                            }
                                            if (pt) {
                                                return `Hours: ${pt.hours.toFixed(1)} | Videos: ${pt.videos}`;
                                            }
                                            return '';
                                        },
                                        label: function(context) {
                                            const pt = filteredData[context.dataIndex];
                                            if (pt && pt.isNA) return 'N/A';
                                            return `Videos/hour: ${context.parsed.y != null ? context.parsed.y.toFixed(2) : '0'}`;
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            if (value === 0) return '0';
                                            return value % 1 === 0 ? value : value.toFixed(1);
                                        }
                                    },
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { maxRotation: 45, minRotation: 45 }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [filteredData, selectedUser]);

            const hasData = Object.keys(chartData).length > 0;

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">Video Editors Productivity</h1>
                            <p className="text-gray-600 mb-6">Videos completed per hour worked by date (Time Tracking × B2C Ads)</p>

                            {error && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex items-start gap-3">
                                        <svg className="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                                        </svg>
                                        <div>
                                            <h3 className="font-semibold text-red-900 mb-1">Error Loading Data</h3>
                                            <p className="text-sm text-red-800">{error}</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!hasData ? (
                                <div className="text-center py-12">
                                    <svg className="w-16 h-16 text-blue-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                    </svg>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-3">Load Data from Airtable</h3>
                                    <p className="text-gray-600 mb-6">Click the button below to fetch Time Tracking and B2C Ads data</p>
                                    <button
                                        onClick={fetchData}
                                        disabled={loading}
                                        className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2 mx-auto"
                                    >
                                        {loading ? (
                                            <>
                                                <svg className="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                                </svg>
                                                Loading...
                                            </>
                                        ) : (
                                            <>
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                                </svg>
                                                Load Data from Airtable
                                            </>
                                        )}
                                    </button>
                                </div>
                            ) : (
                                <>
                                    <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 mb-6">
                                        <div className="flex items-center justify-between flex-wrap gap-2">
                                            <span className="text-sm text-purple-800">
                                                Showing data for Julian Astacio
                                            </span>
                                            <button
                                                onClick={fetchData}
                                                disabled={loading}
                                                className="text-sm text-blue-600 hover:text-blue-800 font-medium disabled:text-gray-400"
                                            >
                                                {loading ? 'Refreshing...' : 'Refresh Data'}
                                            </button>
                                        </div>
                                    </div>

                                    {filteredData.length > 0 && (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                                <div className="bg-blue-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Hours</p>
                                                    <p className="text-2xl font-bold text-blue-600">
                                                        {filteredData.reduce((s, d) => s + d.hours, 0).toFixed(1)}
                                                    </p>
                                                </div>
                                                <div className="bg-green-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Videos</p>
                                                    <p className="text-2xl font-bold text-green-600">
                                                        {filteredData.reduce((s, d) => s + d.videos, 0)}
                                                    </p>
                                                </div>
                                                <div className="bg-purple-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Avg Videos/Hour</p>
                                                    <p className="text-2xl font-bold text-purple-600">
                                                        {(() => {
                                                            const withHours = filteredData.filter(d => d.hours > 0);
                                                            const totalV = withHours.reduce((s, d) => s + d.videos, 0);
                                                            const totalH = withHours.reduce((s, d) => s + d.hours, 0);
                                                            return totalH > 0 ? (totalV / totalH).toFixed(2) : 'N/A';
                                                        })()}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="bg-gray-50 rounded-lg p-6 mb-6" style={{ height: '450px' }}>
                                                <p className="text-xs text-gray-500 mb-2">Gray bars = N/A (videos finished but no hours logged that day)</p>
                                                <canvas ref={chartRef}></canvas>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-sm">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-4 py-3 text-left font-semibold">Date</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Hours</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Videos</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Videos/Hour</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredData.map((row, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-gray-50">
                                                                <td className="px-4 py-3">{row.date}</td>
                                                                <td className="px-4 py-3 text-right">{row.hours.toFixed(1)}</td>
                                                                <td className="px-4 py-3 text-right">{row.videos}</td>
                                                                <td className="px-4 py-3 text-right" title={row.isNA ? 'No hours logged for this day' : ''}>
                                                                    {row.isNA ? (
                                                                        <span className="text-gray-500 italic">N/A</span>
                                                                    ) : (
                                                                        row.videosPerHour != null ? row.videosPerHour.toFixed(2) : '-'
                                                                    )}
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </>
                                    )}

                                    {filteredData.length === 0 && (
                                        <p className="text-gray-600 py-8 text-center">No data for Julian Astacio.</p>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<VideoEditorsDashboard />, document.getElementById('root'));
    </script>
</body>
</html>
