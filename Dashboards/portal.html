        function scheduleSubmitScreenSave(adsetId) {
            const prev = submitScreenSaveTimers.get(adsetId);
            if (prev) clearTimeout(prev);
            const t = setTimeout(async () => {
                submitScreenSaveTimers.delete(adsetId);
                try {
                    await saveSubmitScreenSettings(adsetId);
                } catch (err) {
                    alert(err.message);
                }
            }, 500);
            submitScreenSaveTimers.set(adsetId, t);
        }

        async function saveSubmitScreenSettings(adsetId) {
            const modeInput = document.getElementById(`submitScreenMode-${adsetId}`);
            if (!modeInput) return;
            const mode = modeInput.value || 'None';
            const timezoneEl = document.getElementById(`submitTimezone-${adsetId}`);
            const callEl = document.getElementById(`submitCall-${adsetId}`);
            const textEl = document.getElementById(`submitText-${adsetId}`);

            const fields = {
                'Submit Screen': mode
            };

            // Only patch fields that are relevant/visible to avoid Airtable 422s from null/invalid updates.
            if (mode === 'Calendar') {
                if (timezoneEl && timezoneEl.value) {
                    fields['Timezone'] = timezoneEl.value;
                }
            }
            if (mode === 'Phone' || mode === 'Phone/Text') {
                if (callEl) fields['Call'] = callEl.value || '';
            }
            if (mode === 'Text' || mode === 'Phone/Text') {
                if (textEl) fields['Text'] = textEl.value || '';
            }

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            if (mode === 'Calendar') {
                days.forEach((day) => {
                    const boxes = document.querySelectorAll(`input.submit-screen-time-slot[data-submit-day="${day}"][data-adset-id="${adsetId}"]:checked`);
                    fields[day] = Array.from(boxes).map((b) => b.getAttribute('data-time-slot')).filter(Boolean);
                });
            }

            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields })
            });
            if (!response.ok) {
                let detail = '';
                try {
                    const err = await response.json();
                    detail = err?.error?.message || JSON.stringify(err);
                } catch {
                    detail = await response.text();
                }
                throw new Error(`Failed to save submit screen settings${detail ? `: ${detail}` : ''}`);
            }
        }

        function bindSubmitScreenEditor(adsetId) {
            const modeButtons = document.querySelectorAll(`[data-submit-mode-btn][data-adset-id="${adsetId}"]`);
            modeButtons.forEach((btn) => {
                btn.addEventListener('click', () => {
                    const mode = btn.getAttribute('data-submit-mode-btn');
                    const modeInput = document.getElementById(`submitScreenMode-${adsetId}`);
                    if (!modeInput) return;
                    modeInput.value = mode;
                    applySubmitScreenModeUI(adsetId);
                    scheduleSubmitScreenSave(adsetId);
                });
            });

            const inputs = document.querySelectorAll(`.submit-screen-input[data-adset-id="${adsetId}"]`);
            inputs.forEach((el) => {
                const tag = el.tagName.toLowerCase();
                const isCheck = tag === 'input' && el.type === 'checkbox';
                const evt = tag === 'select' || isCheck ? 'change' : 'input';
                el.addEventListener(evt, () => scheduleSubmitScreenSave(adsetId));
            });
        }

                host.innerHTML = `

                        </div>
                        <input type="hidden" id="submitScreenMode-${adsetId}" value="${mode}">
                        <p id="submitScreenHelper-${adsetId}" class="text-xs text-gray-600"></p>

                                <select id="submitTimezone-${adsetId}" data-adset-id="${adsetId}" class="submit-screen-input w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
                                    ${['America/Chicago', 'America/New_York', 'America/Denver', 'America/Los_Angeles', 'America/Phoenix'].map((tz) => `<option value="${tz}" ${tz === timezone ? 'selected' : ''}>${tz}</option>`).join('')}
                                </select>

                        </div>

                        <div id="submitScreenText-${adsetId}" class="hidden">
                            <label class="block text-sm font-medium text-gray-700 mb-1">Text</label>
                            <input id="submitText-${adsetId}" data-adset-id="${adsetId}" class="submit-screen-input w-full px-3 py-2 border border-gray-300 rounded-md text-sm" value="${textValue}" placeholder="Enter text phone number">

                    </div>
                `;

                applySubmitScreenModeUI(adsetId);
                bindSubmitScreenEditor(adsetId);
            } catch (err) {
                host.innerHTML = `<p class="text-sm text-red-600">Unable to load submit screen settings: ${err.message}</p>`;
            }
        }

        async function patchAdsetContacts(adsetId, contactsFieldName, contactIds) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields: { [contactsFieldName]: contactIds } })
            });
            if (!response.ok) throw new Error('Failed to update location contacts');
            return response.json();
        }

        async function loadLocationContacts(adsetId) {
            const contactsEl = document.getElementById(`location-contacts-${adsetId}`);
            if (!contactsEl) return;
            contactsEl.innerHTML = '<p class="text-sm text-gray-600">Loading contacts...</p>';

            try {
                const adset = await fetchAdsetById(adsetId);
                if (!adset) {
                    contactsEl.innerHTML = '<p class="text-sm text-red-600">Unable to load contacts for this location.</p>';
                    return;
                }

                const contactsFieldName = getAdsetContactsFieldName(adset);
                const contactIds = Array.isArray(adset.fields[contactsFieldName]) ? adset.fields[contactsFieldName] : [];
                const contacts = [];
                for (const contactId of contactIds) {
                    const c = await fetchContactById(contactId);
                    if (c) contacts.push(c);
                }

                const rows = contacts.map((c) => {
                    const n = c.fields.Name || '';
                    const e = c.fields.Email || '';
                    const p = c.fields.Phone || '';
                    return `
                    <div class="border border-gray-200 rounded-lg p-3 flex items-center justify-between gap-3">
                        <div class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_1fr] gap-2 flex-1">
                            <input type="text" value="${escapeHtmlAttr(n)}" data-saved-value="${escapeHtmlAttr(n)}" data-contact-id="${c.id}" data-contact-field="Name" class="location-contact-input px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50" disabled>
                            <input type="email" value="${escapeHtmlAttr(e)}" data-saved-value="${escapeHtmlAttr(e)}" data-contact-id="${c.id}" data-contact-field="Email" class="location-contact-input px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50" disabled>
                            <input type="text" value="${escapeHtmlAttr(p)}" data-saved-value="${escapeHtmlAttr(p)}" data-contact-id="${c.id}" data-contact-field="Phone" class="location-contact-input px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50" disabled>
                        </div>
                        <div class="flex items-center gap-2">
                            <button class="location-contact-edit p-2 text-blue-600 hover:bg-blue-50 rounded-md" data-contact-id="${c.id}" title="Edit contact">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            </button>
                            <button class="location-contact-remove p-2 text-red-600 hover:bg-red-50 rounded-md" data-adset-id="${adsetId}" data-contacts-field="${contactsFieldName}" data-contact-id="${c.id}" title="Remove contact">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7h6m-1-2a1 1 0 00-1-1h-2a1 1 0 00-1 1l-1 2h6l-1-2z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `;
                }).join('');

                contactsEl.innerHTML = `
                    <div class="space-y-2">
                        ${rows || '<p class="text-sm text-gray-500">No linked contacts for this location.</p>'}
                    </div>
                    <div class="border border-dashed border-gray-300 rounded-lg p-3 mt-3">
                        <div class="text-sm font-medium text-gray-800 mb-2">Add Contact to Location</div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <input id="locationNewContactName-${adsetId}" type="text" class="px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Name">
                            <input id="locationNewContactEmail-${adsetId}" type="email" class="px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Email">
                            <input id="locationNewContactPhone-${adsetId}" type="text" class="px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Phone">
                        </div>
                        <button class="location-contact-add mt-3 px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm" data-adset-id="${adsetId}" data-contacts-field="${contactsFieldName}">Add Contact</button>
                    </div>
                `;

                contactsEl.querySelectorAll('.location-contact-remove').forEach((btn) => {
                    btn.addEventListener('click', async () => {
                        try {
                            const contactId = btn.getAttribute('data-contact-id');
                            const fieldName = btn.getAttribute('data-contacts-field');
                            const latest = await fetchAdsetById(adsetId);
                            const ids = Array.isArray(latest.fields[fieldName]) ? latest.fields[fieldName] : [];
                            const updated = ids.filter((id) => id !== contactId);
                            await patchAdsetContacts(adsetId, fieldName, updated);

                        } catch (err) {
                            alert(err.message);

                        const inputs = row.querySelectorAll('.location-contact-input');

                        const fieldName = input.getAttribute('data-contact-field');
                        scheduleContactFieldSave(contactId, fieldName, input.value, input);

                        const contactId = input.getAttribute('data-contact-id');
                        const fieldName = input.getAttribute('data-contact-field');
                        flushContactFieldSave(contactId, fieldName, input.value, input);
                    });

                const addBtn = contactsEl.querySelector('.location-contact-add');

                            const email = (document.getElementById(`locationNewContactEmail-${adsetId}`)?.value || '').trim();
                            const phone = (document.getElementById(`locationNewContactPhone-${adsetId}`)?.value || '').trim();
                            if (!name && !email && !phone) return;

                            const createRes = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ fields: { Name: name, Email: email, Phone: phone } })
                            });
                            if (!createRes.ok) throw new Error('Failed to create contact');
                            const newContact = await createRes.json();

                            const latest = await fetchAdsetById(adsetId);
                            const ids = Array.isArray(latest.fields[fieldName]) ? latest.fields[fieldName] : [];
                            const updated = Array.from(new Set([...ids, newContact.id]));
                            await patchAdsetContacts(adsetId, fieldName, updated);
                            await loadLocationContacts(adsetId);
                        } catch (err) {
                            alert(err.message);
                        }
                    });
                }
            } catch (err) {
                contactsEl.innerHTML = `<p class="text-sm text-red-600">Unable to load contacts: ${err.message}</p>`;
            }
        }

        function setupLocationDropdowns(adsetValues) {
            if (!adsetValues.length) return;
            adsetValues.forEach((adsetId) => {
                const wrapper = document.querySelector(`details[data-location-adset-id="${adsetId}"]`);
                if (!wrapper) return;

                loadLocationHeader(adsetId);

                const bindInnerSections = function() {
                    if (wrapper.dataset.bound === 'true') return;
                    const leadsSection = wrapper.querySelector(`details[data-location-leads-section="${adsetId}"]`);
                    const zipsSection = wrapper.querySelector(`details[data-location-zips-section="${adsetId}"]`);
                    const contactsSection = wrapper.querySelector(`details[data-location-contacts-section="${adsetId}"]`);
                    const submitSection = wrapper.querySelector(`details[data-location-submit-screen-section="${adsetId}"]`);

                    if (leadsSection) {
                        leadsSection.addEventListener('toggle', function() {
                            if (!leadsSection.open || leadsSection.dataset.loaded === 'true') return;
                            leadsSection.dataset.loaded = 'true';
                            loadLocationAdsetAndLeads(adsetId);
                        });
                    }
                    if (zipsSection) {
                        zipsSection.addEventListener('toggle', function() {
                            if (!zipsSection.open || zipsSection.dataset.loaded === 'true') return;
                            zipsSection.dataset.loaded = 'true';
                            loadLocationZipCodes(adsetId);
                        });
                    }
                    if (contactsSection) {
                        contactsSection.addEventListener('toggle', function() {
                            if (!contactsSection.open || contactsSection.dataset.loaded === 'true') return;
                            contactsSection.dataset.loaded = 'true';
                            loadLocationContacts(adsetId);
                        });
                    }
                    if (submitSection) {
                        submitSection.addEventListener('toggle', function() {
                            if (!submitSection.open || submitSection.dataset.loaded === 'true') return;
                            submitSection.dataset.loaded = 'true';
                            loadLocationSubmitScreen(adsetId);
                        });
                    }
                    wrapper.dataset.bound = 'true';
                    if (leadsSection && leadsSection.open && leadsSection.dataset.loaded !== 'true') {
                        leadsSection.dataset.loaded = 'true';
                        loadLocationAdsetAndLeads(adsetId);
                    }
                };

                wrapper.addEventListener('toggle', function() {
                    if (!wrapper.open) return;
                    bindInnerSections();
                });

                if (wrapper.open) {
                    bindInnerSections();
                }
            });
        }

        function getMultiSelectValues(selectEl) {
            return Array.from(selectEl.selectedOptions).map(option => option.value);
        }

        function scheduleAutoSave() {
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
            }
            autoSaveTimer = setTimeout(function() {
                autoSaveTimer = null;
                savePortalFields();
            }, 500);
        }

        async function savePortalFields() {
            if (!currentRecordId) return;
            captureDetailsOpenState();
            const nameInput = document.getElementById('nameInput');
            const name = nameInput ? nameInput.value.trim() : fieldDisplay(currentRecord, 'Name', '');
            const statusInput = document.getElementById('statusValue');
            const rawStatus = fieldDisplay(currentRecord, 'Status', '');
            const status = statusInput ? statusInput.value : rawStatus;
            const chargingInput = document.getElementById('chargingValue');
            const chargingUi = chargingInput ? chargingInput.value : (String(currentRecord.fields.Charging || '').toLowerCase() === 'pause' ? 'Paused' : 'Active');
            const charging = chargingUi === 'Paused' ? 'Pause' : 'Charging';

            const fields = {
                Name: name,
                Status: status,
                Charging: charging
            };

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields })
                });
                if (!response.ok) throw new Error('Failed to save changes');
                const updated = await response.json();
                currentRecord = updated;
                if (status === 'Paused') {
                    await pauseAllLinkedAdsets();
                }
                currentContacts = await fetchContactsForAccount(currentRecord);
                renderPortalCard(currentRecord);
                await loadBillingSection();
                document.querySelector('h1').textContent = `${currentRecord.fields.Name || 'Account'}`;
            } catch (err) {
                alert(`Error saving portal fields: ${err.message}`);
            }
        }

        async function pauseAllLinkedAdsets() {
            const adsetIds = Array.isArray(currentRecord.fields.Adsets) ? currentRecord.fields.Adsets : [];
            if (!adsetIds.length) return;

            for (const adsetId of adsetIds) {
                try {
                    await updateAdsetCampaignStatus(adsetId, 'Paused');
                } catch (e) {
                    // Best effort; continue pausing remaining locations.
                }
            }
        }

        async function openBillingModal() {
            const modal = document.getElementById('billingModal');
            const content = document.getElementById('billingModalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '<p class="text-gray-600">Loading billing info...</p>';

            try {
                if (!currentRecord) {
                    currentRecord = await fetchRecordById(currentRecordId);
                }
                const customerIds = currentRecord.fields.Customers;
                if (!Array.isArray(customerIds) || !customerIds.length) {
                    content.innerHTML = '<p class="text-gray-600">No linked customers.</p>';
                    return;
                }

                const customerCards = [];
                for (const customerId of customerIds) {
                    const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.customersTableName)}/${customerId}`);
                    if (!response.ok) continue;
                    const customer = await response.json();
                    const fields = customer.fields || {};
                    customerCards.push(`
                        <div class="border border-gray-200 rounded-lg p-4 mb-4">
                            <h4 class="text-lg font-semibold text-gray-900 mb-2">${fields.Name || 'Customer'}</h4>
                            <div class="text-sm text-gray-700 space-y-1">
                                <p><strong>Email:</strong> ${fields.Email || '—'}</p>
                                <p><strong>Phone:</strong> ${fields.Phone || '—'}</p>
                                <p><strong>Address:</strong> ${fields.Address || '—'}</p>
                            </div>
                        </div>
                    `);
                }

                content.innerHTML = customerCards.length ? customerCards.join('') : '<p class="text-gray-600">No readable customer records found.</p>';
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function closeBillingModal() {
            document.getElementById('billingModal').classList.add('hidden');
        }

        async function openBillingContactsModal() {
            const modal = document.getElementById('billingContactsModal');
            const content = document.getElementById('billingContactsModalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '<p class="text-gray-600">Loading billing contacts...</p>';

            try {
                if (!currentRecord) {
                    currentRecord = await fetchRecordById(currentRecordId);
                }

                const currentContactIds = Array.isArray(currentRecord.fields[CONFIG.billingContactsField])
                    ? currentRecord.fields[CONFIG.billingContactsField]
                    : [];

                const allContacts = await fetchAllContacts();
                const currentContacts = [];
                for (const contactId of currentContactIds) {
                    const contact = allContacts.find(c => c.id === contactId);
                    if (contact) {
                        currentContacts.push(contact);
                    }
                }

                content.innerHTML = `
                    <div class="mb-4">
                        <h4 class="text-sm font-semibold text-gray-800 mb-2">Current Linked Contacts</h4>
                        <div class="space-y-2">
                            ${currentContacts.length ? currentContacts.map(contact => `<div class="text-sm text-gray-700">${contact.fields.Name || 'Unnamed'} - ${contact.fields.Email || 'No email'}</div>`).join('') : '<div class="text-sm text-gray-500">No contacts linked.</div>'}
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="billingContactsSelect">Edit Billing Contacts</label>
                        <select id="billingContactsSelect" multiple class="w-full px-3 py-2 border border-gray-300 rounded-md h-48">
                            ${allContacts.map(contact => {
                                const isSelected = currentContactIds.includes(contact.id);
                                const label = `${contact.fields.Name || 'Unnamed'} - ${contact.fields.Email || 'No email'}`;
                                return `<option value="${contact.id}" ${isSelected ? 'selected' : ''}>${label}</option>`;
                            }).join('')}
                        </select>
                        <p class="mt-1 text-xs text-gray-500">Hold Ctrl/Cmd to select multiple contacts.</p>
                    </div>
                    <button onclick="saveBillingContacts()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Contacts</button>
                `;
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function closeBillingContactsModal() {
            document.getElementById('billingContactsModal').classList.add('hidden');
        }

        async function fetchAllContacts() {
            const contacts = [];
            let offset = null;

            do {
                let url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}`;
                if (offset) url += `?offset=${offset}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch contacts list.');
                const data = await response.json();
                contacts.push(...(data.records || []));
                offset = data.offset;
            } while (offset);

            return contacts;
        }

        async function saveBillingContacts() {
            const selectEl = document.getElementById('billingContactsSelect');
            if (!selectEl || !currentRecordId) return;
            const selectedContactIds = getMultiSelectValues(selectEl);

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            [CONFIG.billingContactsField]: selectedContactIds
                        }
                    })
                });
                if (!response.ok) throw new Error('Failed to save billing contacts');
                currentRecord = await fetchRecordById(currentRecordId);
                alert('Billing contacts updated.');
                await openBillingContactsModal();
            } catch (err) {
                alert(`Error saving billing contacts: ${err.message}`);
            }
        }

        document.getElementById('billingModal').addEventListener('click', function(e) {
            if (e.target === this) closeBillingModal();
        });

        document.getElementById('billingContactsModal').addEventListener('click', function(e) {
            if (e.target === this) closeBillingContactsModal();
        });

        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this && confirmResolver) {
                const resolve = confirmResolver;
                confirmResolver = null;
                this.classList.add('hidden');
                resolve(false);
            }
        });

        document.getElementById('editLeadModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLeadEditModal();
            }
        });

        (function init() {
            const atid = getURLParameter('ATID');
            if (!atid) {
                showEmailGateError('Invalid link. Please add ?ATID=your_record_id to the URL.');
            }
        })();
    </script>
</body>
</html>
