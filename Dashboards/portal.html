<body class="bg-gray-50">

    <div id="editLeadModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">

            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Edit Lead</h3>
                <button onclick="closeLeadEditModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div id="editLeadModalContent" class="max-h-[70vh] overflow-y-auto"></div>

    <script>
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            tableName: 'tblH2nVfmGNG8pAjC',
            contactsTableName: 'Contacts',
            contactsLinkedField: 'Contacts',
            customersTableName: 'Customers',
            adsetsTableName: 'tblee61crNCoSfurx',
            adsetZipTrackingTableName: 'Adset Zip Tracking',
            usZipsTableName: 'US Zips',
            leadsTableName: 'B2C Leads',
            chargesTableName: 'Charges',
            billingContactsField: 'Billing Contacts'
        };

        let currentRecordId = null;
        let currentRecord = null;
        let currentContacts = [];
        let autoSaveTimer = null;
        let confirmResolver = null;
        let detailsOpenState = null;
        const zipMapInstances = new Map();
        const zipGeocodeCache = new Map();
        const loadedLeadsById = new Map();
        const leadToAdsetMap = new Map();
        const submitScreenSaveTimers = new Map();
        const contactAutoSaveTimers = new Map();
        let currentLeadEditRecordId = null;
        const adsetLeadPaginationState = new Map();

        function getURLParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
            try {
                return await fetch(url, { ...options, signal: controller.signal });
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        async function fetchRecordById(recordId, attempt = 1) {
            const response = await fetchWithTimeout(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${recordId}`);
            if (response.ok) return response.json();

            // Cloudflare 524 is transient; retry once before failing.
            if (response.status === 524 && attempt < 2) {
                await wait(1000);
                return fetchRecordById(recordId, attempt + 1);
            }

            const err = new Error(`Failed to fetch portal record: ${response.status}`);
            err.status = response.status;
            throw err;
        }

        async function fetchContactById(contactId) {
            const response = await fetchWithTimeout(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}/${contactId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchAdsetById(adsetId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchLeadById(leadId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}/${leadId}`);
            if (!response.ok) return null;
            return response.json();
        }

        function chunkArray(items, size) {
            const chunks = [];
            for (let i = 0; i < items.length; i += size) {
                chunks.push(items.slice(i, i + size));
            }
            return chunks;
        }

        async function fetchLeadsByIds(leadIds, onProgress) {
            const uniqueIds = Array.from(new Set(leadIds || []));
            if (!uniqueIds.length) return [];

            const chunks = chunkArray(uniqueIds, 25);
            let completed = 0;
            const allRecords = [];

            await Promise.all(chunks.map(async (idChunk) => {
                const formula = `OR(${idChunk.map((id) => `RECORD_ID()='${id}'`).join(',')})`;
                const url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}?pageSize=100&filterByFormula=${encodeURIComponent(formula)}`;
                const response = await fetchWithTimeout(url, {}, 20000);
                if (!response.ok) {
                    throw new Error(`Failed to fetch linked leads (${response.status})`);
                }
                const data = await response.json();
                allRecords.push(...(data.records || []));
                completed += idChunk.length;
                if (typeof onProgress === 'function') {
                    onProgress(Math.min(completed, uniqueIds.length), uniqueIds.length);
                }
            }));

            return allRecords;
        }

        async function fetchTableRecordsByIds(tableName, recordIds, chunkSize = 20) {
            const uniqueIds = Array.from(new Set((recordIds || []).filter(Boolean)));
            if (!uniqueIds.length) return [];
            const chunks = chunkArray(uniqueIds, chunkSize);
            const allRecords = [];
            await Promise.all(chunks.map(async (idChunk) => {
                const formula = `OR(${idChunk.map((id) => `RECORD_ID()='${id}'`).join(',')})`;
                const url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(tableName)}?pageSize=100&filterByFormula=${encodeURIComponent(formula)}`;
                const response = await fetchWithTimeout(url, {}, 25000);
                if (!response.ok) {
                    throw new Error(`Failed to fetch ${tableName} (${response.status})`);
                }
                const data = await response.json();
                allRecords.push(...(data.records || []));
            }));
            return allRecords;
        }

        async function fetchAdsetZipJunctionById(junctionId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetZipTrackingTableName)}/${junctionId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchUSZipById(zipId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.usZipsTableName)}/${zipId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function getBillingContactEmails(record) {
            const billingContactIds = Array.isArray(record.fields[CONFIG.billingContactsField]) ? record.fields[CONFIG.billingContactsField] : [];
            const adsetIds = Array.isArray(record.fields.Adsets) ? record.fields.Adsets : [];
            const adsetLeadContactIds = [];
            if (adsetIds.length) {
                const adsetResults = await Promise.allSettled(adsetIds.map((adsetId) => fetchAdsetById(adsetId)));
                adsetResults.forEach((result) => {
                    if (result.status !== 'fulfilled') return;
                    const adset = result.value;
                    const ids = Array.isArray(adset && adset.fields ? adset.fields['Lead Contacts'] : null)
                        ? adset.fields['Lead Contacts']
                        : [];
                    adsetLeadContactIds.push(...ids);
                });
            }

            const contactIds = Array.from(new Set([...billingContactIds, ...adsetLeadContactIds]));
            if (!Array.isArray(contactIds) || contactIds.length === 0) return [];
            const results = await Promise.allSettled(contactIds.map((contactId) => fetchContactById(contactId)));
            const emails = [];
            results.forEach((result) => {
                if (result.status !== 'fulfilled') return;
                const contact = result.value;
                const email = contact && contact.fields ? contact.fields.Email : null;
                if (!email) return;
                if (Array.isArray(email)) {
                    email.forEach((value) => {
                        const normalized = String(value || '').trim().toLowerCase();
                        if (normalized) emails.push(normalized);
                    });
                    return;
                }
                const normalized = String(email).trim().toLowerCase();
                if (normalized) emails.push(normalized);
            });
            return Array.from(new Set(emails));
        }

        async function verifyEmail(event) {
            event.preventDefault();
            const atid = getURLParameter('ATID');
            if (!atid) {
                showEmailGateError('Invalid link. No record identifier found.');
                return false;
            }

            const emailInput = document.getElementById('emailInput');
            const submitBtn = document.getElementById('emailGateSubmit');
            const enteredEmail = (emailInput.value || '').trim().toLowerCase();
            if (!enteredEmail) return false;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';
            hideEmailGateError();

            try {
                const record = await fetchRecordById(atid);
                const allowedEmails = await getBillingContactEmails(record);
                if (!allowedEmails.length) {
                    throw new Error('No billing contacts are linked to this account.');
                }
                if (!allowedEmails.includes(enteredEmail)) {
                    throw new Error('This email is not associated with this account.');
                }

                document.getElementById('emailGate').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                currentRecordId = atid;
                await initializeDashboard();
            } catch (err) {
                let message = 'Unable to verify this account.';
                if (err && err.name === 'AbortError') {
                    message = 'Verification timed out. Please try again.';
                } else if (err && err.status === 524) {
                    message = 'The server timed out while verifying this account (524). Please try again in a moment.';
                } else if (err && err.message) {
                    message = err.message;
                }
                showEmailGateError(message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue';
            }

            return false;
        }

        function showEmailGateError(message) {
            const errorEl = document.getElementById('emailGateError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function hideEmailGateError() {
            document.getElementById('emailGateError').classList.add('hidden');
        }

        async function initializeDashboard() {
            if (!currentRecordId) return;
            setLoading(true);
            hideError();
            try {
                currentRecord = await fetchRecordById(currentRecordId);
                currentContacts = await fetchContactsForAccount(currentRecord);
                renderPortalCard(currentRecord);
                await loadBillingSection();
                document.querySelector('h1').textContent = `${currentRecord.fields.Name || 'Account'}`;
                document.getElementById('portalCard').classList.remove('hidden');
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            const loading = document.getElementById('loadingState');
            if (isLoading) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function fieldDisplay(record, fieldName, fallback = '—') {
            const value = record.fields[fieldName];
            if (value === null || value === undefined || value === '') return fallback;
            if (Array.isArray(value)) return value.join(', ');
            return String(value);
        }

        function moneyDisplay(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '$0.00';
            return `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function formatLeadCount(value) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fieldDisplay({ fields: { temp: value } }, 'temp');
            return Math.abs(parsed).toLocaleString('en-US');
        }

        function createReadOnlyRow(label, value) {
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                    <div class="text-sm font-medium text-gray-700">${label}</div>
                    <div class="sm:col-span-2 text-sm text-gray-900">${value}</div>
                </div>
            `;
        }

        function renderChevronToggle() {
            return `
                <span class="text-gray-500 shrink-0">
                    <svg class="w-5 h-5 chevron-closed" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                    <svg class="w-5 h-5 chevron-open" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </span>
            `;
        }

        async function fetchContactsForAccount(record) {
            const billingIds = Array.isArray(record.fields[CONFIG.billingContactsField]) ? record.fields[CONFIG.billingContactsField] : [];
            const contactIds = Array.from(new Set([...billingIds]));
            if (!contactIds.length) return [];

            const contacts = [];
            for (const id of contactIds) {
                const contact = await fetchContactById(id);
                if (contact) contacts.push(contact);
            }
            return contacts;
        }

        function getNumericField(record, fieldName) {
            const rawValue = record && record.fields ? record.fields[fieldName] : null;
            const value = Array.isArray(rawValue) ? rawValue[0] : rawValue;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function statusChip(status) {
            const normalized = String(status || '').toLowerCase();
            if (normalized === 'active') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 border border-green-200">Active</span>';
            if (normalized === 'paused') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800 border border-red-200">Paused</span>';
            if (normalized === 'setup') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 border border-blue-200">Setup</span>';
            if (normalized === 'closed') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-800 border border-gray-300">Closed</span>';
            return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-700 border border-gray-200">Unknown</span>';
        }

        function renderStatusControl(status) {
            const normalized = String(status || '').toLowerCase();
            const isLocked = normalized === 'setup' || normalized === 'closed';

            if (isLocked) {
                return `
                    <div class="space-y-2">
                        ${statusChip(status)}
                        <p class="text-xs text-gray-500">This status is managed internally and cannot be changed here.</p>
                    </div>
                `;
            }

            const effectiveStatus = normalized === 'paused' ? 'Paused' : 'Active';
            const activeClasses = effectiveStatus === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = effectiveStatus === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';

            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="statusBtnActive" type="button" onclick="setPortalStatus('Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">
                        Active
                    </button>
                    <button id="statusBtnPaused" type="button" onclick="setPortalStatus('Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">
                        Paused
                    </button>
                </div>
                <input type="hidden" id="statusValue" value="${effectiveStatus}">
            `;
        }

        function renderChargingControl(charging) {
            const normalized = String(charging || '').toLowerCase();
            const effectiveCharging = normalized === 'pause' ? 'Paused' : 'Active';
            const activeClasses = effectiveCharging === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = effectiveCharging === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';

            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="chargingBtnActive" type="button" onclick="setPortalCharging('Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">
                        Active
                    </button>
                    <button id="chargingBtnPaused" type="button" onclick="setPortalCharging('Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">
                        Paused
                    </button>
                </div>
                <input type="hidden" id="chargingValue" value="${effectiveCharging}">
            `;
        }

        function escapeHtmlAttr(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/</g, '&lt;');
        }

        function renderBillingContactsManager() {
            const rows = currentContacts.map((contact) => {
                const name = contact.fields.Name || '';
                const email = contact.fields.Email || '';
                const phone = contact.fields.Phone || '';
                return `
                    <div class="border border-gray-200 rounded-lg p-3 space-y-2" data-billing-contact-row="${contact.id}">
                        <div class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_1fr_auto] gap-2 items-center">

        function captureDetailsOpenState() {
            const state = {};
            const detailEls = document.querySelectorAll('#portalCard details');
            detailEls.forEach((el) => {
                const sectionId = el.getAttribute('data-section-id');
                const locationId = el.getAttribute('data-location-adset-id');
                const key = sectionId ? `section:${sectionId}` : (locationId ? `location:${locationId}` : null);
                if (key) {
                    state[key] = el.open;
                }
            });
            detailsOpenState = state;
        }

        function restoreDetailsOpenState() {
            if (!detailsOpenState) return;
            const detailEls = document.querySelectorAll('#portalCard details');
            detailEls.forEach((el) => {
                const sectionId = el.getAttribute('data-section-id');
                const locationId = el.getAttribute('data-location-adset-id');
                const key = sectionId ? `section:${sectionId}` : (locationId ? `location:${locationId}` : null);
                if (key && Object.prototype.hasOwnProperty.call(detailsOpenState, key)) {
                    el.open = !!detailsOpenState[key];
                }
            });
        }

        async function loadBillingSection() {
            const content = document.getElementById('billingSectionContent');
            if (!content) return;
            content.innerHTML = '<p class="text-gray-600">Loading billing info...</p>';

            try {
                if (!currentRecord) {
                    content.innerHTML = '<p class="text-gray-600">No account loaded.</p>';
                    return;
                }

                const customerIds = currentRecord.fields.Customers;
                if (!Array.isArray(customerIds) || !customerIds.length) {
                    content.innerHTML = '<p class="text-gray-600">No linked customers.</p>';
                    return;
                }

                const customerCards = [];
                for (const customerId of customerIds) {
                    const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.customersTableName)}/${customerId}`);
                    if (!response.ok) continue;
                    const customer = await response.json();
                    const fields = customer.fields || {};

                    const amountCharged = Number(fields['Amount Charged']);
                    const formattedAmount = Number.isFinite(amountCharged)
                        ? `$${amountCharged.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                        : '$0.00';

                    const paymentLinks = Array.isArray(fields['Payments']) ? fields['Payments'] : [];
                    const charges = [];
                    for (const chargeId of paymentLinks) {
                        const chargeResponse = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.chargesTableName)}/${chargeId}`);
                        if (!chargeResponse.ok) continue;
                        const charge = await chargeResponse.json();
                        if (charge && charge.fields) charges.push(charge);
                    }

                    charges.sort((a, b) => {
                        const dateA = new Date((a.fields || {})['Created'] || 0);
                        const dateB = new Date((b.fields || {})['Created'] || 0);
                        return dateB - dateA;
                    });

                    const chargesRows = charges.map((charge) => {
                        const c = charge.fields || {};
                        const created = c['Created'] ? formatLeadCreated(c['Created']) : '';
                        const model = c['Model'] || '';
                        const status = c['Status'] || '';
                        const price = Number(c['Price']);
                        const number = c['Number'] || '';
                        const formattedPrice = Number.isFinite(price)
                            ? `$${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                            : '$0.00';
                        const statusBadge = renderChargeStatusBadge(status);

                        return `
                            <tr class="border-t border-gray-200">
                                <td class="px-3 py-2 text-sm text-gray-900">${model}</td>
                                <td class="px-3 py-2 text-sm text-gray-700 whitespace-nowrap">${created}</td>
                                <td class="px-3 py-2 text-sm">${statusBadge}</td>
                                <td class="px-3 py-2 text-sm text-gray-900 whitespace-nowrap">${formattedPrice}</td>
                                <td class="px-3 py-2 text-sm text-gray-700 whitespace-nowrap">${number}</td>
                            </tr>
                        `;
                    }).join('');

                    const chargesSection = charges.length ? `
                        <div class="mt-4">
                            <h5 class="text-sm font-semibold text-gray-800 mb-2">Payment History</h5>
                            <div class="overflow-x-auto border border-gray-200 rounded-lg">
                                <table class="w-full bg-white">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Model</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Created</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Status</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Price</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Number</th>
                                        </tr>
                                    </thead>
                                    <tbody>${chargesRows}</tbody>
                                </table>
                            </div>
                        </div>
                    ` : '<div class="mt-4 text-sm text-gray-500">No payment history found.</div>';

                    customerCards.push(`
                        <div class="border border-gray-200 rounded-lg p-4 mb-4">
                            <h4 class="text-lg font-semibold text-gray-900 mb-2">${fields.Name || 'Customer'}</h4>
                            <div class="mt-3 rounded-md bg-gray-50 px-3 py-2">
                                <div class="text-xs text-gray-500">Total Amount Charged</div>
                                <div class="text-lg font-semibold text-gray-900">${formattedAmount}</div>
                            </div>
                            ${chargesSection}
                        </div>
                    `);
                }

                const billingCardsHtml = customerCards.length ? customerCards.join('') : '<p class="text-gray-600">No readable customer records found.</p>';
                content.innerHTML = `${billingCardsHtml}${renderBillingContactsManager()}`;
                attachBillingContactEditorListeners();
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function scheduleContactFieldSave(contactId, fieldName, value, inputEl) {
            const key = `${contactId}:${fieldName}`;
            const prev = contactAutoSaveTimers.get(key);
            if (prev) clearTimeout(prev);
            const t = setTimeout(async () => {
                contactAutoSaveTimers.delete(key);
                try {
                    await saveContactField(contactId, fieldName, value, inputEl);
                } catch (err) {
                    alert(err.message);
                }
            }, 450);
            contactAutoSaveTimers.set(key, t);
        }

        async function flushContactFieldSave(contactId, fieldName, value, inputEl) {
            const key = `${contactId}:${fieldName}`;
            const prev = contactAutoSaveTimers.get(key);
            if (prev) {
                clearTimeout(prev);
                contactAutoSaveTimers.delete(key);
            }
            try {
                await saveContactField(contactId, fieldName, value, inputEl);
            } catch (err) {
                alert(err.message);
            }
        }

        function attachBillingContactEditorListeners() {
            const inputs = document.querySelectorAll('.billing-contact-input');
            inputs.forEach((input) => {
                input.addEventListener('input', function() {
                    const contactId = input.getAttribute('data-contact-id');
                    const fieldName = input.getAttribute('data-contact-field');
                    scheduleContactFieldSave(contactId, fieldName, input.value, input);
                });
                input.addEventListener('blur', function() {
                    const contactId = input.getAttribute('data-contact-id');
                    const fieldName = input.getAttribute('data-contact-field');
                    flushContactFieldSave(contactId, fieldName, input.value, input);
                });
            });

            const editBtns = document.querySelectorAll('.billing-contact-edit');
            editBtns.forEach((btn) => {
                btn.addEventListener('click', function() {
                    const contactId = btn.getAttribute('data-contact-id');
                    const row = document.querySelector(`[data-billing-contact-row="${contactId}"]`);
                    if (!row) return;
                    const rowInputs = row.querySelectorAll('.billing-contact-input');
                    rowInputs.forEach((input) => {
                        input.disabled = false;
                        input.classList.remove('bg-gray-50');
                    });
                    if (rowInputs.length) rowInputs[0].focus();
                });
            });

            const addBtn = document.getElementById('addContactBtn');
            if (addBtn) {
                addBtn.addEventListener('click', async function() {
                    try {
                        await addNewContactAndLink();
                    } catch (err) {
                        alert(err.message);
                    }
                });
            }

            const removeBtns = document.querySelectorAll('.billing-contact-remove');
            removeBtns.forEach((btn) => {
                btn.addEventListener('click', async function() {
                    try {
                        const contactId = btn.getAttribute('data-contact-id');
                        await removeBillingContact(contactId);
                    } catch (err) {
                        alert(err.message);
                    }
                });
            });
        }

        async function saveContactField(contactId, fieldName, value, inputEl) {
            if (!contactId || !fieldName) return;
            let baseline = '';
            if (inputEl && Object.prototype.hasOwnProperty.call(inputEl.dataset, 'savedValue')) {
                baseline = inputEl.dataset.savedValue;
            } else {
                const contact = currentContacts.find((c) => c.id === contactId);
                baseline = contact && contact.fields ? (contact.fields[fieldName] || '') : '';
            }
            if (String(baseline) === String(value ?? '')) return;

            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}/${contactId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields: { [fieldName]: value || '' } })
            });
            if (!response.ok) {
                throw new Error(`Failed to update contact ${fieldName}`);
            }
            const updatedContact = await response.json();
            const idx = currentContacts.findIndex((c) => c.id === contactId);
            if (idx >= 0) currentContacts[idx] = updatedContact;
            if (inputEl) inputEl.dataset.savedValue = value ?? '';
        }

        async function addNewContactAndLink() {
            if (!currentRecordId || !currentRecord) return;
            const nameInput = document.getElementById('newContactName');
            const emailInput = document.getElementById('newContactEmail');
            const phoneInput = document.getElementById('newContactPhone');
            const name = (nameInput && nameInput.value ? nameInput.value.trim() : '');
            const email = (emailInput && emailInput.value ? emailInput.value.trim() : '');
            const phone = (phoneInput && phoneInput.value ? phoneInput.value.trim() : '');

            if (!name && !email && !phone) return;

            const createRes = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields: { Name: name, Email: email, Phone: phone } })
            });
            if (!createRes.ok) {
                throw new Error('Failed to create contact');
            }
            const newContact = await createRes.json();

            const existingBillingContacts = Array.isArray(currentRecord.fields[CONFIG.billingContactsField]) ? currentRecord.fields[CONFIG.billingContactsField] : [];
            const updatedBillingContacts = Array.from(new Set([...existingBillingContacts, newContact.id]));

            const linkRes = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fields: {
                        [CONFIG.billingContactsField]: updatedBillingContacts
                    }
                })
            });
            if (!linkRes.ok) {
                throw new Error('Failed to link new contact');
            }

            currentRecord = await linkRes.json();
            currentContacts = await fetchContactsForAccount(currentRecord);
            await loadBillingSection();
        }

        async function removeBillingContact(contactId) {
            if (!currentRecordId || !contactId || !currentRecord) return;
            const existingBillingContacts = Array.isArray(currentRecord.fields[CONFIG.billingContactsField]) ? currentRecord.fields[CONFIG.billingContactsField] : [];
            const updatedBillingContacts = existingBillingContacts.filter((id) => id !== contactId);

            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fields: {
                        [CONFIG.billingContactsField]: updatedBillingContacts
                    }
                })
            });
            if (!response.ok) {
                throw new Error('Failed to remove billing contact');
            }
            currentRecord = await response.json();
            currentContacts = await fetchContactsForAccount(currentRecord);
            await loadBillingSection();
        }

        function renderChargeStatusBadge(status) {
            if (!status) return '';
            const lower = String(status).toLowerCase();
            let badgeColor = 'bg-gray-100 text-gray-800';
            if (lower === 'succeeded' || lower === 'paid') {
                badgeColor = 'bg-green-100 text-green-800';
            } else if (lower === 'pending') {
                badgeColor = 'bg-yellow-100 text-yellow-800';
            } else if (lower === 'failed' || lower === 'declined') {
                badgeColor = 'bg-red-100 text-red-800';
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${status}</span>`;
        }

        async function setPortalStatus(status) {
            const input = document.getElementById('statusValue');
            if (!input) return;
            const currentStatus = input.value;
            if (currentStatus === 'Active' && status === 'Paused') {
                const confirmed = await openConfirmModal(
                    'Are you sure you want to pause all of your campaigns?',
                    'This will immediately pause all of your areas and campaigns.',
                    'If done it can take multiple days to start seeing new leads once re-activated',
                    'Yes, pause all of my campaigns'
                );
                if (!confirmed) return;
            }
            if (currentStatus === 'Paused' && status === 'Active') {
                const chosenAdsets = await openLocationActivationModal();
                if (chosenAdsets === null) return;
                if (chosenAdsets.length) {
                    try {
                        await activateSelectedAdsets(chosenAdsets);

                        alert(`Unable to update selected locations: ${err.message}`);

            input.value = status;

            const pausedBtn = document.getElementById('statusBtnPaused');

            if (status === 'Active') {

                pausedBtn.className = 'px-4 py-2 text-sm font-semibold transition-colors bg-white text-red-700 border-red-300 hover:bg-red-50';

                activeBtn.className = 'px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors bg-white text-green-700 border-green-300 hover:bg-green-50';

        async function openLocationActivationModal() {
            const modal = document.getElementById('locationSelectModal');
            const listEl = document.getElementById('locationSelectList');
            const cancelBtn = document.getElementById('locationSelectCancelBtn');
            const confirmBtn = document.getElementById('locationSelectConfirmBtn');
            if (!modal || !listEl || !cancelBtn || !confirmBtn) return null;

            const adsetIds = Array.isArray(currentRecord && currentRecord.fields ? currentRecord.fields.Adsets : [])
                ? currentRecord.fields.Adsets
                : [];
            if (!adsetIds.length) {
                return [];
            }

            listEl.innerHTML = '<p class="text-sm text-gray-600">Loading locations...</p>';
            modal.classList.remove('hidden');

            const adsetRecords = await Promise.allSettled(adsetIds.map((id) => fetchAdsetById(id)));
            const options = adsetRecords.map((result, idx) => {
                const adsetId = adsetIds[idx];
                const adset = result.status === 'fulfilled' ? result.value : null;
                const name = adset && adset.fields ? (adset.fields['Adset Name'] || adset.fields.Name || adsetId) : adsetId;
                return { adsetId, name };
            });

            listEl.innerHTML = options.map((opt) => `
                <label class="flex items-center gap-3 p-2 rounded-md hover:bg-gray-50 cursor-pointer">
                    <input type="checkbox" class="location-activate-checkbox h-4 w-4" value="${opt.adsetId}" checked>
                    <span class="text-sm text-gray-800">${opt.name}</span>
                </label>
            `).join('');

            return await new Promise((resolve) => {
                const cleanup = () => {
                    cancelBtn.onclick = null;
                    confirmBtn.onclick = null;
                    modal.classList.add('hidden');
                };
                cancelBtn.onclick = () => {
                    cleanup();
                    resolve(null);
                };
                confirmBtn.onclick = () => {
                    const selected = Array.from(listEl.querySelectorAll('.location-activate-checkbox:checked')).map((el) => el.value);
                    cleanup();
                    resolve(selected);
                };
            });
        }

        async function activateSelectedAdsets(adsetIds) {

        async function updateAdsetCampaignStatus(adsetId, nextStatus) {
            const url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`;
            const normalizedStatus = String(nextStatus || '').toLowerCase() === 'paused' ? 'Paused' : 'Active';
            const response = await fetch(url, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fields: { 'Adset Status': normalizedStatus },
                    typecast: true
                })
            });
            if (response.ok) return await response.json();

            let errText = '';
            try {
                const rawText = await response.text();
                try {
                    const errJson = rawText ? JSON.parse(rawText) : null;
                    errText = errJson && errJson.error ? (errJson.error.message || errJson.error.type || '') : rawText;
                } catch (e) {
                    errText = rawText || '';
                }
            } catch (e) {
                errText = '';
            }

            throw new Error(`Failed to update location ${adsetId}: ${errText || `status ${response.status}`}`);
        }

        function formatLeadCreated(value) {
            if (!value) return '';
            try {
                const date = new Date(value);
                if (!isNaN(date.getTime())) {
                    return date.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });
                }
            } catch (e) {}
            return String(value);
        }

        function formatLeadPhone(value) {
            if (!value) return '';
            const cleaned = String(value).replace(/\D/g, '');
            if (cleaned.length === 10) {
                return `(${cleaned.slice(0, 3)}) ${cleaned.slice(3, 6)}-${cleaned.slice(6)}`;
            }
            return String(value);
        }

        function formatLeadPrice(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '';
            return `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function renderBadge(value, kind) {
            if (!value) return '';
            const lower = String(value).toLowerCase();
            let badgeColor = 'bg-gray-100 text-gray-800';
            if (kind === 'stage') {
                if (['close won'].includes(lower)) badgeColor = 'bg-green-100 text-green-800';
                else if (['close lost', 'not interested', 'cancelled'].includes(lower)) badgeColor = 'bg-red-100 text-red-800';
                else if (['follow up', '2nd follow up', 'final follow up'].includes(lower)) badgeColor = 'bg-yellow-100 text-yellow-800';
                else if (['appointment ran'].includes(lower)) badgeColor = 'bg-purple-100 text-purple-800';
                else if (['contacted', 'first contact'].includes(lower)) badgeColor = 'bg-blue-100 text-blue-800';
            } else if (kind === 'status') {
                if (lower === 'qualified') badgeColor = 'bg-green-100 text-green-800';
                else if (lower === 'pending') badgeColor = 'bg-yellow-100 text-yellow-800';
                else if (lower === 'unqualified') badgeColor = 'bg-red-100 text-red-800';
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${value}</span>`;
        }

        function getLinkedB2CLeadIds(adsetRecord) {
            const fields = adsetRecord.fields || {};
            const possibleFields = ['B2C Leads', 'Leads', 'Linked Leads', 'B2C Lead', 'B2C'];
            for (const key of possibleFields) {
                if (Array.isArray(fields[key])) return fields[key];
            }
            return [];
        }

        async function fetchB2CLeadsByAdsetPage(adsetId, offsetToken = null) {
            const filterFormula = `FIND("${adsetId}", ARRAYJOIN({Adsets}))`;

            let url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}?pageSize=10&filterByFormula=${encodeURIComponent(filterFormula)}`;
            if (offsetToken) {
                url += `&offset=${offsetToken}`;
            }
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Failed to fetch leads by adset (${response.status})`);
            }
            const data = await response.json();
            return { records: data.records || [], nextOffset: data.offset || null };
        }

        async function fetchAllLeadsForAdset(adsetId) {
            const adset = await fetchAdsetById(adsetId);
            if (!adset) return [];

            const leadIds = getLinkedB2CLeadIds(adset);
            if (leadIds.length) {
                const out = [];
                for (const leadId of leadIds) {
                    const lead = await fetchLeadById(leadId);
                    if (lead) out.push(lead);
                }
                return out;
            }

            const all = [];
            let offsetToken = null;
            do {
                const page = await fetchB2CLeadsByAdsetPage(adsetId, offsetToken);
                all.push(...page.records);
                offsetToken = page.nextOffset;
            } while (offsetToken);
            return all;
        }

        function formatLeadExportValue(value, key) {
            if (value === null || value === undefined) return '';
            if (Array.isArray(value)) return value.join(', ');
            if (key === 'Created') return formatLeadCreated(value);
            if (key === 'Phone') return formatLeadPhone(value);
            if (key === 'Price') return formatLeadPrice(value);
            return String(value);
        }

        async function exportLocationReport(adsetId) {
            try {
                const leads = await fetchAllLeadsForAdset(adsetId);
                if (!leads.length) {
                    alert('No leads found for this location.');
                    return;
                }

                leads.sort((a, b) => new Date((b.fields || {})['Created'] || 0) - new Date((a.fields || {})['Created'] || 0));
                const columns = ['Full Name', 'Stage', 'Status', 'Created', 'Phone', 'Email', 'Address', 'Price', 'Appt', 'Notes', 'Full Summary'];
                const header = columns.slice();
                const rows = leads.map((lead) => columns.map((col) => formatLeadExportValue((lead.fields || {})[col], col)));
                const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
                ws['!cols'] = columns.map((c, idx) => {
                    const maxLen = Math.max(c.length, ...rows.map((r) => String(r[idx] || '').length));
                    return { wch: Math.min(Math.max(12, maxLen + 2), c === 'Full Summary' ? 80 : 50) };
                });
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Leads');
                const safeAdset = String(document.getElementById(`location-summary-name-${adsetId}`)?.textContent || adsetId).replace(/[^\w\-]+/g, '_');
                XLSX.writeFile(wb, `${safeAdset}_leads_report.xlsx`);
            } catch (err) {
                alert(`Unable to export location report: ${err.message}`);
            }
        }

        function getLeadPaginationStateForAdset(adsetId) {
            if (!adsetLeadPaginationState.has(adsetId)) {
                adsetLeadPaginationState.set(adsetId, {
                    mode: null,
                    ids: [],
                    idsSignature: '',
                    total: 0,
                    page: 1,
                    formulaOffsets: { 1: null },
                    formulaHasNextByPage: {}
                });
            }
            return adsetLeadPaginationState.get(adsetId);
        }

        async function loadLocationAdsetAndLeads(adsetId, targetPage = null) {
            const leadsEl = document.getElementById(`location-leads-${adsetId}`);
            if (!leadsEl) return;

            leadsEl.innerHTML = '<p class="text-sm text-gray-600">Loading linked leads...</p>';

            try {
                const adset = await fetchAdsetById(adsetId);
                if (!adset) {
                    applyLocationSummaryFromAdset(adsetId, null);
                    leadsEl.innerHTML = '<p class="text-sm text-red-600">Unable to load this location.</p>';
                    return;
                }

                applyLocationSummaryFromAdset(adsetId, adset);

                const state = getLeadPaginationStateForAdset(adsetId);
                const leadIds = getLinkedB2CLeadIds(adset);
                if (leadIds.length) {
                    const signature = leadIds.join('|');
                    const shouldReloadIds = state.mode !== 'ids' || state.idsSignature !== signature || !state.ids.length;
                    state.mode = 'ids';
                    if (shouldReloadIds) {
                        leadsEl.innerHTML = `<p class="text-sm text-gray-600">Loading 0/${leadIds.length} leads...</p>`;
                        const fetchedLeads = await fetchLeadsByIds(leadIds, (loaded, total) => {
                            leadsEl.innerHTML = `<p class="text-sm text-gray-600">Loading ${loaded}/${total} leads...</p>`;
                        });
                        fetchedLeads.forEach((lead) => {
                            loadedLeadsById.set(lead.id, lead);
                            leadToAdsetMap.set(lead.id, adsetId);
                        });
                        fetchedLeads.sort((a, b) => new Date((b.fields || {})['Created'] || 0) - new Date((a.fields || {})['Created'] || 0));
                        state.ids = fetchedLeads.map((lead) => lead.id);
                        state.idsSignature = signature;
                        state.total = state.ids.length;
                    } else {
                        state.total = state.ids.length;
                    }
                } else if (!state.mode || state.mode !== 'formula') {
                    state.mode = 'formula';
                    state.ids = [];
                    state.idsSignature = '';
                    state.total = leadIds.length || 0;
                    state.formulaOffsets = { 1: null };
                    state.formulaHasNextByPage = {};
                } else if (leadIds.length && !state.total) {
                    state.total = leadIds.length;
                }

                const pageSize = 10;
                let leadRecords = [];
                let page = targetPage || state.page || 1;
                if (page < 1) page = 1;

                if (state.mode === 'ids') {
                    const totalPages = Math.max(1, Math.ceil(state.total / pageSize));
                    if (page > totalPages) page = totalPages;
                    const start = (page - 1) * pageSize;
                    const pageLeadIds = state.ids.slice(start, start + pageSize);
                    leadRecords = pageLeadIds
                        .map((id) => loadedLeadsById.get(id))
                        .filter(Boolean);
                } else {
                    const offsetToken = state.formulaOffsets[page] ?? null;
                    const result = await fetchB2CLeadsByAdsetPage(adsetId, offsetToken);
                    leadRecords = result.records || [];
                    state.formulaHasNextByPage[page] = !!result.nextOffset;
                    if (result.nextOffset) {
                        state.formulaOffsets[page + 1] = result.nextOffset;
                    }
                    if (leadRecords.length === 0 && page > 1) {
                        page = page - 1;
                        const prevOffset = state.formulaOffsets[page] ?? null;
                        const prevResult = await fetchB2CLeadsByAdsetPage(adsetId, prevOffset);
                        leadRecords = prevResult.records || [];
                        state.formulaHasNextByPage[page] = !!prevResult.nextOffset;
                        if (prevResult.nextOffset) state.formulaOffsets[page + 1] = prevResult.nextOffset;
                    }
                }

                leadRecords.sort((a, b) => new Date((b.fields || {})['Created'] || 0) - new Date((a.fields || {})['Created'] || 0));
                leadRecords.forEach((lead) => {
                    loadedLeadsById.set(lead.id, lead);
                    leadToAdsetMap.set(lead.id, adsetId);
                });
                state.page = page;

                const hasPrev = page > 1;
                const hasNext = state.mode === 'ids'
                    ? page < Math.max(1, Math.ceil(state.total / pageSize))
                    : !!state.formulaHasNextByPage[page];
                const totalText = state.total
                    ? `${state.total} total leads`
                    : `${leadRecords.length} leads on this page`;

                leadsEl.innerHTML = renderLeadsTable(leadRecords, {
                    adsetId,
                    page,
                    hasPrev,
                    hasNext,
                    totalText
                });
            } catch (err) {
                leadsEl.innerHTML = `<p class="text-sm text-red-600">Unable to load linked leads: ${err.message}</p>`;
            }
        }

        function parseApptToDatetime(apptStr) {
            if (!apptStr || apptStr.trim() === '') return null;
            const match = apptStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (!match) return null;
            const [, month, day, year, hour, min, ampm] = match;
            let h = parseInt(hour, 10);
            if (ampm.toUpperCase() === 'PM' && h !== 12) h += 12;
            if (ampm.toUpperCase() === 'AM' && h === 12) h = 0;
            return { date: `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`, time: `${String(h).padStart(2, '0')}:${min}` };
        }

        function formatAppointmentForAirtable(dateStr, timeStr) {
            if (!dateStr || !timeStr) return '';
            const [y, m, d] = dateStr.split('-');
            const [hour, min] = timeStr.split(':');
            let h = parseInt(hour, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${m}/${d}/${y} at ${String(h).padStart(2, '0')}:${min} ${ampm}`;
        }

        function getBaseSummaryWithoutAppt(fullSummary) {
            if (!fullSummary || typeof fullSummary !== 'string') return fullSummary || '';
            const match = fullSummary.match(/^Appointment:\s*[^\n]+\n\n?/i);
            if (match) return fullSummary.slice(match[0].length).trim();
            return fullSummary;
        }

        function getBaseSummaryHTMLWithoutAppt(fullSummaryHTML) {
            if (!fullSummaryHTML || typeof fullSummaryHTML !== 'string') return fullSummaryHTML || '';
            const match = fullSummaryHTML.match(/^Appointment:\s*[^<]+<BR>\s*<BR>\s*/i);
            if (match) return fullSummaryHTML.slice(match[0].length).trim();
            return fullSummaryHTML;
        }

        function extractZipCodeFromUSZipRecord(zipRecord) {
            const fields = zipRecord && zipRecord.fields ? zipRecord.fields : {};
            const candidates = ['Zip', 'ZIP', 'Zip Code', 'ZIP Code', 'Name'];
            for (const key of candidates) {
                const raw = fields[key];
                if (raw === null || raw === undefined || raw === '') continue;
                const digits = String(raw).replace(/\D/g, '').slice(0, 5);
                if (digits.length === 5) return digits;
            }
            return null;
        }

        function extractLatLonFromUSZipRecord(zipRecord) {
            const fields = zipRecord && zipRecord.fields ? zipRecord.fields : {};
            const lat = Number(fields.Lat ?? fields.lat ?? fields.Latitude);
            const lon = Number(fields.Long ?? fields.long ?? fields.Lng ?? fields.Lon ?? fields.Longitude);
            if (Number.isFinite(lat) && Number.isFinite(lon)) return { lat, lon };
            return null;
        }

        function normalizeZipMapInputs(zipInput) {
            if (!zipInput || !zipInput.length) return [];
            const byZip = new Map();
            const consider = (zip, lat, lon) => {
                if (!zip) return;
                let latN = NaN;
                let lonN = NaN;
                if (lat != null && lat !== '') latN = Number(lat);
                if (lon != null && lon !== '') lonN = Number(lon);
                const hasCoords = Number.isFinite(latN) && Number.isFinite(lonN);
                const prev = byZip.get(zip);
                if (!prev || (hasCoords && !prev.hasCoords)) {
                    byZip.set(zip, hasCoords ? { zip, lat: latN, lon: lonN, hasCoords: true } : { zip, hasCoords: false });
                }
            };
            for (const item of zipInput) {
                if (typeof item === 'string') consider(item, null, null);
                else if (item && item.zip) consider(item.zip, item.lat, item.lon);
            }
            return Array.from(byZip.values()).map((row) => {
                if (row.hasCoords) return { zip: row.zip, lat: row.lat, lon: row.lon };
                return { zip: row.zip };
            });
        }

        function getAdsetJunctionIds(adsetRecord) {
            const fields = adsetRecord && adsetRecord.fields ? adsetRecord.fields : {};
            const keys = ['Adset Zip Tracking', 'Ad Set Zip Tracking'];
            for (const key of keys) {
                if (Array.isArray(fields[key])) return fields[key];
            }
            return [];
        }

        function getJunctionZipId(junctionRecord) {
            const fields = junctionRecord && junctionRecord.fields ? junctionRecord.fields : {};
            const keys = ['US Zips', 'US Zip', 'Zip'];
            for (const key of keys) {
                const v = fields[key];
                if (Array.isArray(v) && v.length) return v[0];
                if (typeof v === 'string' && v.startsWith('rec')) return v;
            }
            return null;
        }

        async function geocodeZip(zip) {
            if (!zip) return null;
            if (zipGeocodeCache.has(zip)) return zipGeocodeCache.get(zip);
            const p = (async () => {
                try {
                    const res = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip)}`);
                    if (!res.ok) return null;
                    const data = await res.json();
                    const place = data.places && data.places[0];
                    if (!place) return null;
                    const lat = Number(place.latitude);
                    const lon = Number(place.longitude);
                    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
                    return { lat, lon };
                } catch {
                    return null;
                }
            })();
            zipGeocodeCache.set(zip, p);
            return p;
        }

        async function geocodeZipsForMap(zipCodes, batchSize = 12) {
            const unique = Array.from(new Set((zipCodes || []).filter(Boolean)));
            const points = [];
            for (let i = 0; i < unique.length; i += batchSize) {
                const batch = unique.slice(i, i + batchSize);
                const part = await Promise.all(batch.map(async (zip) => {
                    const pt = await geocodeZip(zip);
                    return pt ? { zip, lat: pt.lat, lon: pt.lon } : null;
                }));
                points.push(...part.filter(Boolean));
            }
            return points;
        }

        async function renderZipMap(containerId, zipInput) {
            const mapContainer = document.getElementById(containerId);
            if (!mapContainer) return;
            if (typeof L === 'undefined') {
                mapContainer.innerHTML = '<p class="text-sm text-red-600">Map library failed to load.</p>';
                return;
            }

            const existingMap = zipMapInstances.get(containerId);
            if (existingMap) {
                existingMap.remove();
                zipMapInstances.delete(containerId);
            }

            const rows = normalizeZipMapInputs(zipInput);
            const fromTable = [];
            const needGeocode = [];
            for (const r of rows) {
                if (r.lat != null && r.lon != null && Number.isFinite(r.lat) && Number.isFinite(r.lon)) {
                    fromTable.push({ zip: r.zip, lat: r.lat, lon: r.lon });
                } else {
                    needGeocode.push(r.zip);
                }
            }
            const geoPoints = needGeocode.length ? await geocodeZipsForMap(needGeocode) : [];
            const points = [...fromTable, ...geoPoints];

            if (!points.length) {
                mapContainer.innerHTML = '<p class="text-sm text-gray-500">Unable to plot zip map for these zip codes.</p>';
                return;
            }

            mapContainer.innerHTML = '';
            const map = L.map(containerId, { scrollWheelZoom: false });
            zipMapInstances.set(containerId, map);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const bounds = [];
            points.forEach((p) => {
                L.marker([p.lat, p.lon]).addTo(map).bindPopup(`ZIP ${p.zip}`);
                bounds.push([p.lat, p.lon]);
            });
            if (bounds.length === 1) {
                map.setView(bounds[0], 9);
            } else {
                map.fitBounds(bounds, { padding: [20, 20] });
            }

            // When initialized inside expanding <details>, Leaflet may need a reflow to render tiles.
            requestAnimationFrame(() => {
                setTimeout(() => {
                    map.invalidateSize();
                    if (bounds.length === 1) {
                        map.setView(bounds[0], 9);
                    } else {
                        map.fitBounds(bounds, { padding: [20, 20] });
                    }
                }, 120);
            });
        }

        async function loadLocationZipCodes(adsetId) {
            const zipEl = document.getElementById(`location-zips-${adsetId}`);
            if (!zipEl) return;
            zipEl.innerHTML = '<p class="text-sm text-gray-600">Loading zip codes...</p>';

            try {
                const adset = await fetchAdsetById(adsetId);
                if (!adset) {
                    zipEl.innerHTML = '<p class="text-sm text-red-600">Unable to load zip codes for this location.</p>';
                    return;
                }

                const junctionIds = getAdsetJunctionIds(adset);
                if (!junctionIds.length) {
                    zipEl.innerHTML = '<p class="text-sm text-gray-500">No linked zip codes found for this location.</p>';
                    return;
                }

                const junctionRecords = await fetchTableRecordsByIds(CONFIG.adsetZipTrackingTableName, junctionIds);
                const junctionById = new Map(junctionRecords.map((r) => [r.id, r]));
                const zipRecordIds = [];
                for (const junctionId of junctionIds) {
                    const junction = junctionById.get(junctionId);
                    if (!junction) continue;
                    const zipRecordId = getJunctionZipId(junction);
                    if (zipRecordId) zipRecordIds.push(zipRecordId);
                }
                const zipRecords = await fetchTableRecordsByIds(CONFIG.usZipsTableName, zipRecordIds);
                const zipById = new Map(zipRecords.map((r) => [r.id, r]));
                const zipCodes = [];
                const zipMapRows = [];
                for (const junctionId of junctionIds) {
                    const junction = junctionById.get(junctionId);
                    if (!junction) continue;
                    const zipRecordId = getJunctionZipId(junction);
                    if (!zipRecordId) continue;
                    const zipRecord = zipById.get(zipRecordId);
                    const zipCode = extractZipCodeFromUSZipRecord(zipRecord);
                    if (zipCode) {
                        zipCodes.push(zipCode);
                        const ll = extractLatLonFromUSZipRecord(zipRecord);
                        zipMapRows.push(ll ? { zip: zipCode, lat: ll.lat, lon: ll.lon } : { zip: zipCode });
                    }
                }

                const uniqueZipCodes = Array.from(new Set(zipCodes)).sort((a, b) => a.localeCompare(b));
                if (!uniqueZipCodes.length) {
                    zipEl.innerHTML = '<p class="text-sm text-gray-500">No linked zip codes found for this location.</p>';
                    return;
                }

                const mapId = `zip-map-${adsetId}`;
                zipEl.innerHTML = `
                    <div id="${mapId}" class="zip-map border border-gray-200 rounded-lg mb-3"></div>
                    <div class="border border-gray-200 rounded-lg p-3 bg-white">
                        <div class="text-sm font-medium text-gray-800 mb-2">Linked Zip Codes</div>
                        <div class="text-sm text-gray-700">${uniqueZipCodes.join(', ')}</div>
                    </div>
                `;
                await renderZipMap(mapId, zipMapRows);
            } catch (err) {
                zipEl.innerHTML = `<p class="text-sm text-red-600">Unable to load zip codes: ${err.message}</p>`;
            }
        }

        function getAdsetContactsFieldName(adsetRecord) {
            return 'Lead Contacts';
        }

        function getLocationCampaignStatus(adsetRecord) {
            const fields = adsetRecord && adsetRecord.fields ? adsetRecord.fields : {};
            const raw = fields['Adset Status'] !== undefined
                ? fields['Adset Status']
                : fields['Location Campaign Status'] !== undefined
                ? fields['Location Campaign Status']
                : fields['Status'];
            const value = Array.isArray(raw) ? raw[0] : raw;
            const normalized = String(value || '').toLowerCase();
            if (normalized === 'paused' || normalized === 'off' || normalized === 'disabled' || normalized === 'false' || normalized === '0') return 'Paused';
            return 'Active';
        }

        function renderLocationCampaignStatusToggle(adsetId, status) {
            const activeClasses = status === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = status === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';
            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button type="button" onclick="setLocationCampaignStatus('${adsetId}', 'Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">Active</button>
                    <button type="button" onclick="setLocationCampaignStatus('${adsetId}', 'Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">Paused</button>
                </div>
                <input type="hidden" id="locationStatusValue-${adsetId}" value="${status}">
            `;
        }

        async function setLocationCampaignStatus(adsetId, nextStatus) {
            const hidden = document.getElementById(`locationStatusValue-${adsetId}`);
            const currentStatus = hidden ? hidden.value : 'Active';
            if (currentStatus === nextStatus) return;

            if (currentStatus === 'Active' && nextStatus === 'Paused') {
                const confirmed = await openConfirmModal(
                    'Are you sure you want to pause this location?',
                    'If you are running multiple locations this will only pause this one - not every location.  If you want to pause every location go to the settings dropdown or pause each location individually',
                    'If you choose to pause this location, it can take multiple days to start producing leads again after being re-activated',
                    'Yes, pause this location'
                );
                if (!confirmed) return;
            }

            try {
                await updateAdsetCampaignStatus(adsetId, nextStatus);
            } catch (err) {
                alert(err.message || 'Failed to update location status');
                return;
            }
            await loadLocationHeader(adsetId);
        }

        function formatAdsetNumericStat(value) {
            if (value === null || value === undefined || value === '') return null;
            if (Array.isArray(value)) {
                if (!value.length) return null;
                return formatAdsetNumericStat(value[0]);
            }
            const n = Number(value);
            if (Number.isFinite(n)) return Number.isInteger(n) ? String(n) : String(n);
            const s = String(value).trim();
            return s || null;
        }

        function formatLocationSummaryStatsLine(adsetRecord) {
            const fields = adsetRecord && adsetRecord.fields ? adsetRecord.fields : {};
            const ql = formatAdsetNumericStat(fields['Qualified Leads']);
            const ltm = formatAdsetNumericStat(fields['Leads This Month']);
            const cap = formatAdsetNumericStat(fields['Monthly Cap']);
            const dash = '—';
            const qlPart = ql !== null ? ql : dash;
            if (cap === null) {
                return `Total Qualified Leads: ${qlPart} | No monthly cap`;
            }
            const monthPart = ltm !== null ? `${ltm}/${cap}` : `${dash}/${cap}`;
            return `Total Qualified Leads: ${qlPart} | ${monthPart} leads this month`;
        }

        function applyLocationSummaryFromAdset(adsetId, adset) {
            const summaryNameEl = document.getElementById(`location-summary-name-${adsetId}`);
            const statsEl = document.getElementById(`location-summary-stats-${adsetId}`);
            if (!adset || !adset.fields) {
                if (summaryNameEl) summaryNameEl.textContent = `Location (${adsetId})`;
                if (statsEl) statsEl.textContent = '';
                return;
            }
            const adsetName = adset.fields['Adset Name'] || adset.fields['Name'] || `Location (${adsetId})`;
            if (summaryNameEl) summaryNameEl.textContent = adsetName;
            if (statsEl) statsEl.textContent = formatLocationSummaryStatsLine(adset);
        }

        async function loadLocationHeader(adsetId) {
            const summaryNameEl = document.getElementById(`location-summary-name-${adsetId}`);
            const statsEl = document.getElementById(`location-summary-stats-${adsetId}`);
            const statusHost = document.getElementById(`location-status-toggle-${adsetId}`);
            if (!summaryNameEl && !statsEl && !statusHost) return;
            const adset = await fetchAdsetById(adsetId);
            applyLocationSummaryFromAdset(adsetId, adset);
            if (statusHost) {
                const status = getLocationCampaignStatus(adset);
                statusHost.innerHTML = renderLocationCampaignStatusToggle(adsetId, status);
            }
        }

        function getSubmitScreenMode(adsetRecord) {
            const raw = adsetRecord && adsetRecord.fields ? adsetRecord.fields['Submit Screen'] : null;
            const values = Array.isArray(raw) ? raw : (raw ? [raw] : []);
            const valid = ['Calendar', 'Phone', 'Text', 'Phone/Text', 'None'];
            for (const v of values) {
                if (valid.includes(v)) return v;
            }
            return 'None';
        }

        function submitScreenTimeOptions() {
            const out = [];
            for (let hour = 6; hour <= 21; hour++) {
                const ampm = hour >= 12 ? 'PM' : 'AM';
                const hour12 = hour % 12 === 0 ? 12 : hour % 12;
                out.push(`${hour12}:00 ${ampm}`);
            }
            return out;
        }

        function renderDayTimeSelect(dayName, selectedValues, adsetId) {
            const options = submitScreenTimeOptions();
            const selectedSet = new Set(Array.isArray(selectedValues) ? selectedValues : []);
            return `
                <div class="border border-gray-200 rounded-lg p-3 bg-gray-50/50">
                    <div class="text-xs font-medium text-gray-700 mb-2">${dayName}</div>
                    <p class="text-[11px] text-gray-500 mb-2">Select all times you are available (multiple allowed).</p>
                    <div class="flex flex-wrap gap-x-3 gap-y-1.5 max-h-36 overflow-y-auto pr-1">
                        ${options.map((opt) => `
                            <label class="inline-flex items-center gap-1.5 text-xs text-gray-800 cursor-pointer select-none">
                                <input type="checkbox" class="submit-screen-input submit-screen-time-slot rounded border-gray-300 text-blue-600 focus:ring-blue-500" data-submit-day="${dayName}" data-adset-id="${adsetId}" data-time-slot="${escapeHtmlAttr(opt)}" ${selectedSet.has(opt) ? 'checked' : ''}>
                                <span>${opt}</span>
                            </label>

        function applySubmitScreenModeUI(adsetId) {
            const modeInput = document.getElementById(`submitScreenMode-${adsetId}`);
            if (!modeInput) return;
            const mode = modeInput.value || 'None';
            const helperEl = document.getElementById(`submitScreenHelper-${adsetId}`);
            const calendarEl = document.getElementById(`submitScreenCalendar-${adsetId}`);
            const phoneEl = document.getElementById(`submitScreenPhone-${adsetId}`);
            const textEl = document.getElementById(`submitScreenText-${adsetId}`);

            if (helperEl) {
                if (mode === 'Calendar') {
                    helperEl.textContent = 'Leads will see a calendar to request an in home estimate appointment time after they submit their information';
                } else if (mode === 'Phone') {
                    helperEl.textContent = 'Leads will see a button that says "Call Now" after they submit a lead which gets routed to the phone number below';
                } else if (mode === 'Text') {
                    helperEl.textContent = 'Leads will see a button that says "Text Now" after they submit a lead which gets routed to the phone number below';
                } else if (mode === 'Phone/Text') {
                    helperEl.textContent = 'Leads will see options to call or text after they submit their information, using the numbers below';
                } else {
                    helperEl.textContent = 'Leads will see a message that says "we will reach out soon to schedule your free in home estimate" after submitting their information';
                }
            }

            if (calendarEl) calendarEl.classList.toggle('hidden', mode !== 'Calendar');
            if (phoneEl) phoneEl.classList.toggle('hidden', !(mode === 'Phone' || mode === 'Phone/Text'));
            if (textEl) textEl.classList.toggle('hidden', !(mode === 'Text' || mode === 'Phone/Text'));

                const btnMode = btn.getAttribute('data-submit-mode-btn');
                const isActive = btnMode === mode;
                btn.className = isActive
                    ? 'px-3 py-1.5 text-sm font-semibold rounded-md bg-blue-600 text-white'
                    : 'px-3 py-1.5 text-sm font-semibold rounded-md bg-white text-blue-700 border border-blue-300 hover:bg-blue-50';
            });
