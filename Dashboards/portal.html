<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Portal Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <style>
        details > summary .chevron-open { display: none; }
        details[open] > summary .chevron-open { display: inline; }
        details[open] > summary .chevron-closed { display: none; }
        .zip-map { height: 260px; }
    </style>
</head>
<body class="bg-gray-50">
    <div id="emailGate" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads Logo" class="h-10 w-auto mx-auto mb-4">
                <h2 class="text-xl font-semibold text-gray-900 mb-2">Access Your Portal</h2>
                <p class="text-gray-600 text-sm">Enter an email associated with this account.</p>
            </div>
            <form id="emailGateForm" onsubmit="return verifyEmail(event)" class="space-y-4">
                <div>
                    <label for="emailInput" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="emailInput" required placeholder="you@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div id="emailGateError" class="hidden text-sm text-red-600"></div>
                <button type="submit" id="emailGateSubmit" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardContent" class="hidden min-h-screen p-6">
        <div class="max-w-5xl mx-auto">
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads Logo" class="h-10 w-auto">
                        <h1 class="text-2xl font-bold text-gray-900">Portal Dashboard</h1>
                    </div>
                    <div class="flex flex-wrap gap-2">
                    </div>
                </div>
            </div>

            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <p class="text-sm text-red-800" id="errorText"></p>
            </div>

            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600">Loading portal...</p>
            </div>

            <div id="portalCard" class="hidden bg-white rounded-lg shadow-sm p-6 space-y-6"></div>
        </div>
    </div>

    <div id="billingModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-3xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Billing Information</h3>
                <button onclick="closeBillingModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div id="billingModalContent" class="max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="billingContactsModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-2xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Billing Contacts</h3>
                <button onclick="closeBillingContactsModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div id="billingContactsModalContent" class="max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="confirmModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-24 mx-auto p-6 border w-11/12 max-w-xl shadow-lg rounded-md bg-white">
            <h3 id="confirmModalTitle" class="text-xl font-semibold text-gray-900 mb-3"></h3>
            <div id="confirmModalBody" class="text-sm text-gray-700 space-y-2 mb-6"></div>
            <div class="flex items-center justify-end gap-3">
                <button id="confirmModalCancelBtn" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                <button id="confirmModalConfirmBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"></button>
            </div>
        </div>
    </div>

    <div id="editLeadModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-4xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Edit Lead</h3>
                <button onclick="closeLeadEditModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div id="editLeadModalContent" class="max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <script>
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            tableName: 'tblH2nVfmGNG8pAjC',
            contactsTableName: 'Contacts',
            contactsLinkedField: 'Contacts',
            customersTableName: 'Customers',
            adsetsTableName: 'tblee61crNCoSfurx',
            adsetZipTrackingTableName: 'Adset Zip Tracking',
            usZipsTableName: 'US Zips',
            leadsTableName: 'B2C Leads',
            chargesTableName: 'Charges',
            billingContactsField: 'Billing Contacts'
        };

        let currentRecordId = null;
        let currentRecord = null;
        let currentContacts = [];
        let autoSaveTimer = null;
        let confirmResolver = null;
        let detailsOpenState = null;
        const zipMapInstances = new Map();
        const loadedLeadsById = new Map();
        const leadToAdsetMap = new Map();
        const submitScreenSaveTimers = new Map();
        let currentLeadEditRecordId = null;

        function getURLParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function fetchRecordById(recordId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${recordId}`);
            if (!response.ok) throw new Error(`Failed to fetch portal record: ${response.status}`);
            return response.json();
        }

        async function fetchContactById(contactId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}/${contactId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchAdsetById(adsetId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchLeadById(leadId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}/${leadId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchAdsetZipJunctionById(junctionId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetZipTrackingTableName)}/${junctionId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchUSZipById(zipId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.usZipsTableName)}/${zipId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function getBillingContactEmails(record) {
            const contactIds = record.fields[CONFIG.billingContactsField];
            if (!Array.isArray(contactIds) || contactIds.length === 0) return [];
            const emails = [];
            for (const contactId of contactIds) {
                const contact = await fetchContactById(contactId);
                if (contact && contact.fields && contact.fields.Email) {
                    emails.push(String(contact.fields.Email).trim().toLowerCase());
                }
            }
            return emails;
        }

        async function verifyEmail(event) {
            event.preventDefault();
            const atid = getURLParameter('ATID');
            if (!atid) {
                showEmailGateError('Invalid link. No record identifier found.');
                return false;
            }

            const emailInput = document.getElementById('emailInput');
            const submitBtn = document.getElementById('emailGateSubmit');
            const enteredEmail = (emailInput.value || '').trim().toLowerCase();
            if (!enteredEmail) return false;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';
            hideEmailGateError();

            try {
                const record = await fetchRecordById(atid);
                const allowedEmails = await getBillingContactEmails(record);
                if (!allowedEmails.length) {
                    throw new Error('No billing contacts are linked to this account.');
                }
                if (!allowedEmails.includes(enteredEmail)) {
                    throw new Error('This email is not associated with this account.');
                }

                document.getElementById('emailGate').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                currentRecordId = atid;
                await initializeDashboard();
            } catch (err) {
                showEmailGateError(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue';
            }

            return false;
        }

        function showEmailGateError(message) {
            const errorEl = document.getElementById('emailGateError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function hideEmailGateError() {
            document.getElementById('emailGateError').classList.add('hidden');
        }

        async function initializeDashboard() {
            if (!currentRecordId) return;
            setLoading(true);
            hideError();
            try {
                currentRecord = await fetchRecordById(currentRecordId);
                currentContacts = await fetchContactsForAccount(currentRecord);
                renderPortalCard(currentRecord);
                await loadBillingSection();
                document.querySelector('h1').textContent = `${currentRecord.fields.Name || 'Account'}`;
                document.getElementById('portalCard').classList.remove('hidden');
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            const loading = document.getElementById('loadingState');
            if (isLoading) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function fieldDisplay(record, fieldName, fallback = '—') {
            const value = record.fields[fieldName];
            if (value === null || value === undefined || value === '') return fallback;
            if (Array.isArray(value)) return value.join(', ');
            return String(value);
        }

        function moneyDisplay(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '$0.00';
            return `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function formatLeadCount(value) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fieldDisplay({ fields: { temp: value } }, 'temp');
            return Math.abs(parsed).toLocaleString('en-US');
        }

        function createReadOnlyRow(label, value) {
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                    <div class="text-sm font-medium text-gray-700">${label}</div>
                    <div class="sm:col-span-2 text-sm text-gray-900">${value}</div>
                </div>
            `;
        }

        function renderChevronToggle() {
            return `
                <span class="text-gray-500">
                    <svg class="w-5 h-5 chevron-closed" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                    <svg class="w-5 h-5 chevron-open" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path>
                    </svg>
                </span>
            `;
        }

        async function fetchContactsForAccount(record) {
            const billingIds = Array.isArray(record.fields[CONFIG.billingContactsField]) ? record.fields[CONFIG.billingContactsField] : [];
            const contactIds = Array.from(new Set([...billingIds]));
            if (!contactIds.length) return [];

            const contacts = [];
            for (const id of contactIds) {
                const contact = await fetchContactById(id);
                if (contact) contacts.push(contact);
            }
            return contacts;
        }

        function getNumericField(record, fieldName) {
            const rawValue = record && record.fields ? record.fields[fieldName] : null;
            const value = Array.isArray(rawValue) ? rawValue[0] : rawValue;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function statusChip(status) {
            const normalized = String(status || '').toLowerCase();
            if (normalized === 'active') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 border border-green-200">Active</span>';
            if (normalized === 'paused') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800 border border-red-200">Paused</span>';
            if (normalized === 'setup') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 border border-blue-200">Setup</span>';
            if (normalized === 'closed') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-800 border border-gray-300">Closed</span>';
            return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-700 border border-gray-200">Unknown</span>';
        }

        function renderStatusControl(status) {
            const normalized = String(status || '').toLowerCase();
            const isLocked = normalized === 'setup' || normalized === 'closed';

            if (isLocked) {
                return `
                    <div class="space-y-2">
                        ${statusChip(status)}
                        <p class="text-xs text-gray-500">This status is managed internally and cannot be changed here.</p>
                    </div>
                `;
            }

            const effectiveStatus = normalized === 'paused' ? 'Paused' : 'Active';
            const activeClasses = effectiveStatus === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = effectiveStatus === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';

            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="statusBtnActive" type="button" onclick="setPortalStatus('Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">
                        Active
                    </button>
                    <button id="statusBtnPaused" type="button" onclick="setPortalStatus('Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">
                        Paused
                    </button>
                </div>
                <input type="hidden" id="statusValue" value="${effectiveStatus}">
            `;
        }

        function renderChargingControl(charging) {
            const normalized = String(charging || '').toLowerCase();
            const effectiveCharging = normalized === 'pause' ? 'Paused' : 'Active';
            const activeClasses = effectiveCharging === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = effectiveCharging === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';

            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="chargingBtnActive" type="button" onclick="setPortalCharging('Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">
                        Active
                    </button>
                    <button id="chargingBtnPaused" type="button" onclick="setPortalCharging('Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">
                        Paused
                    </button>
                </div>
                <input type="hidden" id="chargingValue" value="${effectiveCharging}">
            `;
        }

        function renderBillingContactsManager() {
            const rows = currentContacts.map((contact) => {
                const name = contact.fields.Name || '';
                const email = contact.fields.Email || '';
                const phone = contact.fields.Phone || '';
                return `
                    <div class="border border-gray-200 rounded-lg p-3 space-y-2" data-billing-contact-row="${contact.id}">
                        <div class="grid grid-cols-1 sm:grid-cols-[1fr_1fr_1fr_auto] gap-2 items-center">
                            <input type="text" value="${name}" data-contact-id="${contact.id}" data-contact-field="Name" class="billing-contact-input px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50" placeholder="Name" disabled>
                            <input type="email" value="${email}" data-contact-id="${contact.id}" data-contact-field="Email" class="billing-contact-input px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50" placeholder="Email" disabled>
                            <input type="text" value="${phone}" data-contact-id="${contact.id}" data-contact-field="Phone" class="billing-contact-input px-3 py-2 border border-gray-300 rounded-md text-sm bg-gray-50" placeholder="Phone" disabled>
                            <div class="flex items-center gap-2">
                                <button class="billing-contact-edit p-2 text-blue-600 hover:bg-blue-50 rounded-md" data-contact-id="${contact.id}" title="Edit contact">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                    </svg>
                                </button>
                                <button class="billing-contact-remove p-2 text-red-600 hover:bg-red-50 rounded-md" data-contact-id="${contact.id}" title="Remove billing contact">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7h6m-1-2a1 1 0 00-1-1h-2a1 1 0 00-1 1l-1 2h6l-1-2z"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="mt-4">
                    <h5 class="text-sm font-semibold text-gray-800 mb-1">Billing Contacts</h5>
                    <p class="text-xs text-gray-500 mb-2">Billing updates and receipts will be sent to the people listed below</p>
                    <div class="space-y-2">
                        ${rows || '<p class="text-sm text-gray-500">No contacts linked yet.</p>'}
                    </div>
                    <div class="border border-dashed border-gray-300 rounded-lg p-3 mt-3">
                        <div class="text-sm font-medium text-gray-800 mb-2">Add New Contact</div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                            <input id="newContactName" type="text" class="px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Name">
                            <input id="newContactEmail" type="email" class="px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Email">
                            <input id="newContactPhone" type="text" class="px-3 py-2 border border-gray-300 rounded-md text-sm" placeholder="Phone">
                        </div>
                        <button id="addContactBtn" class="mt-3 px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 text-sm">Add Contact</button>
                    </div>
                </div>
            `;
        }

        function renderPortalCard(record) {
            const container = document.getElementById('portalCard');
            const adsetValues = Array.isArray(record.fields.Adsets) ? record.fields.Adsets : [];
            const leadsOwedValue = getNumericField(record, 'TBC Leads');
            const leadsOwedLabel = leadsOwedValue !== null && leadsOwedValue < 0 ? 'Leads We Owe You' : 'Leads You Owe Us';
            const leadsOwedDisplay = formatLeadCount(record.fields['TBC Leads']);
            const leadsOwedHelper = leadsOwedValue !== null && leadsOwedValue < 0
                ? '<p class="mt-1 text-xs text-gray-500">Leads we\'ve billed for but haven\'t sent yet</p>'
                : '';

            container.innerHTML = `
                <div>
                    <details class="border border-gray-200 rounded-lg mb-4" data-section-id="account-settings">
                        <summary class="px-4 py-3 cursor-pointer list-none flex items-center justify-between hover:bg-gray-50">
                            <span class="text-lg font-semibold text-gray-900 inline-flex items-center gap-2">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.427 1.756 2.925 0 3.352a1.724 1.724 0 00-1.066 2.572c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.427 1.756-2.925 1.756-3.352 0a1.724 1.724 0 00-2.572-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.427-1.756-2.925 0-3.352a1.724 1.724 0 001.066-2.572c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                <span>Account Settings</span>
                            </span>
                            ${renderChevronToggle()}
                        </summary>
                        <div class="px-4 pb-4 border-t border-gray-100">
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-3">
                                <label class="text-sm font-medium text-gray-700" for="nameInput">Name</label>
                                <div class="sm:col-span-2">
                                    <input
                                        id="nameInput"
                                        type="text"
                                        value="${fieldDisplay(record, 'Name', '')}"

        function captureDetailsOpenState() {
            const state = {};
            const detailEls = document.querySelectorAll('#portalCard details');
            detailEls.forEach((el) => {
                const sectionId = el.getAttribute('data-section-id');
                const locationId = el.getAttribute('data-location-adset-id');
                const key = sectionId ? `section:${sectionId}` : (locationId ? `location:${locationId}` : null);
                if (key) {
                    state[key] = el.open;
                }
            });
            detailsOpenState = state;
        }

        function restoreDetailsOpenState() {
            if (!detailsOpenState) return;
            const detailEls = document.querySelectorAll('#portalCard details');
            detailEls.forEach((el) => {
                const sectionId = el.getAttribute('data-section-id');
                const locationId = el.getAttribute('data-location-adset-id');
                const key = sectionId ? `section:${sectionId}` : (locationId ? `location:${locationId}` : null);
                if (key && Object.prototype.hasOwnProperty.call(detailsOpenState, key)) {
                    el.open = !!detailsOpenState[key];
                }
            });
        }

        async function loadBillingSection() {
            const content = document.getElementById('billingSectionContent');
            if (!content) return;
            content.innerHTML = '<p class="text-gray-600">Loading billing info...</p>';

            try {
                if (!currentRecord) {
                    content.innerHTML = '<p class="text-gray-600">No account loaded.</p>';
                    return;
                }

                const customerIds = currentRecord.fields.Customers;
                if (!Array.isArray(customerIds) || !customerIds.length) {
                    content.innerHTML = '<p class="text-gray-600">No linked customers.</p>';
                    return;
                }

                const customerCards = [];
                for (const customerId of customerIds) {
                    const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.customersTableName)}/${customerId}`);
                    if (!response.ok) continue;
                    const customer = await response.json();
                    const fields = customer.fields || {};

                    const amountCharged = Number(fields['Amount Charged']);
                    const formattedAmount = Number.isFinite(amountCharged)
                        ? `$${amountCharged.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                        : '$0.00';

                    const paymentLinks = Array.isArray(fields['Payments']) ? fields['Payments'] : [];
                    const charges = [];
                    for (const chargeId of paymentLinks) {
                        const chargeResponse = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.chargesTableName)}/${chargeId}`);
                        if (!chargeResponse.ok) continue;
                        const charge = await chargeResponse.json();
                        if (charge && charge.fields) charges.push(charge);
                    }

                    charges.sort((a, b) => {
                        const dateA = new Date((a.fields || {})['Created'] || 0);
                        const dateB = new Date((b.fields || {})['Created'] || 0);
                        return dateB - dateA;
                    });

                    const chargesRows = charges.map((charge) => {
                        const c = charge.fields || {};
                        const created = c['Created'] ? formatLeadCreated(c['Created']) : '';
                        const model = c['Model'] || '';
                        const status = c['Status'] || '';
                        const price = Number(c['Price']);
                        const number = c['Number'] || '';
                        const formattedPrice = Number.isFinite(price)
                            ? `$${price.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`
                            : '$0.00';
                        const statusBadge = renderChargeStatusBadge(status);

                        return `
                            <tr class="border-t border-gray-200">
                                <td class="px-3 py-2 text-sm text-gray-900">${model}</td>
                                <td class="px-3 py-2 text-sm text-gray-700 whitespace-nowrap">${created}</td>
                                <td class="px-3 py-2 text-sm">${statusBadge}</td>
                                <td class="px-3 py-2 text-sm text-gray-900 whitespace-nowrap">${formattedPrice}</td>
                                <td class="px-3 py-2 text-sm text-gray-700 whitespace-nowrap">${number}</td>
                            </tr>
                        `;
                    }).join('');

                    const chargesSection = charges.length ? `
                        <div class="mt-4">
                            <h5 class="text-sm font-semibold text-gray-800 mb-2">Payment History</h5>
                            <div class="overflow-x-auto border border-gray-200 rounded-lg">
                                <table class="w-full bg-white">
                                    <thead class="bg-gray-50 border-b border-gray-200">
                                        <tr>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Model</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Created</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Status</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Price</th>
                                            <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Number</th>
                                        </tr>
                                    </thead>
                                    <tbody>${chargesRows}</tbody>
                                </table>
                            </div>
                        </div>
                    ` : '<div class="mt-4 text-sm text-gray-500">No payment history found.</div>';

                    customerCards.push(`
                        <div class="border border-gray-200 rounded-lg p-4 mb-4">
                            <h4 class="text-lg font-semibold text-gray-900 mb-2">${fields.Name || 'Customer'}</h4>
                            <div class="mt-3 rounded-md bg-gray-50 px-3 py-2">
                                <div class="text-xs text-gray-500">Total Amount Charged</div>
                                <div class="text-lg font-semibold text-gray-900">${formattedAmount}</div>
                            </div>
                            ${chargesSection}
                        </div>
                    `);
                }

                const billingCardsHtml = customerCards.length ? customerCards.join('') : '<p class="text-gray-600">No readable customer records found.</p>';
                content.innerHTML = `${billingCardsHtml}${renderBillingContactsManager()}`;
                attachBillingContactEditorListeners();
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function attachBillingContactEditorListeners() {
            const inputs = document.querySelectorAll('.billing-contact-input');
            inputs.forEach((input) => {
                input.addEventListener('blur', async function() {
                    try {
                        const contactId = input.getAttribute('data-contact-id');
                        const fieldName = input.getAttribute('data-contact-field');
                        await saveContactField(contactId, fieldName, input.value);
                    } catch (err) {
                        alert(err.message);
                    }
                });
            });

            const editBtns = document.querySelectorAll('.billing-contact-edit');
            editBtns.forEach((btn) => {
                btn.addEventListener('click', function() {
                    const contactId = btn.getAttribute('data-contact-id');
                    const row = document.querySelector(`[data-billing-contact-row="${contactId}"]`);
                    if (!row) return;
                    const rowInputs = row.querySelectorAll('.billing-contact-input');
                    rowInputs.forEach((input) => {
                        input.disabled = false;
                        input.classList.remove('bg-gray-50');
                    });
                    if (rowInputs.length) rowInputs[0].focus();
                });
            });

            const addBtn = document.getElementById('addContactBtn');
            if (addBtn) {
                addBtn.addEventListener('click', async function() {
                    try {
                        await addNewContactAndLink();
                    } catch (err) {
                        alert(err.message);
                    }
                });
            }

            const removeBtns = document.querySelectorAll('.billing-contact-remove');
            removeBtns.forEach((btn) => {
                btn.addEventListener('click', async function() {
                    try {
                        const contactId = btn.getAttribute('data-contact-id');
                        await removeBillingContact(contactId);
                    } catch (err) {
                        alert(err.message);
                    }
                });
            });
        }

        async function saveContactField(contactId, fieldName, value) {
            if (!contactId || !fieldName) return;
            const contact = currentContacts.find((c) => c.id === contactId);
            const existingValue = contact && contact.fields ? (contact.fields[fieldName] || '') : '';
            if (String(existingValue) === String(value || '')) return;

            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}/${contactId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields: { [fieldName]: value || '' } })
            });
            if (!response.ok) {
                throw new Error(`Failed to update contact ${fieldName}`);
            }
            const updatedContact = await response.json();
            const idx = currentContacts.findIndex((c) => c.id === contactId);
            if (idx >= 0) currentContacts[idx] = updatedContact;
        }

        async function addNewContactAndLink() {
            if (!currentRecordId || !currentRecord) return;
            const nameInput = document.getElementById('newContactName');
            const emailInput = document.getElementById('newContactEmail');
            const phoneInput = document.getElementById('newContactPhone');
            const name = (nameInput && nameInput.value ? nameInput.value.trim() : '');
            const email = (emailInput && emailInput.value ? emailInput.value.trim() : '');
            const phone = (phoneInput && phoneInput.value ? phoneInput.value.trim() : '');

            if (!name && !email && !phone) return;

            const createRes = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields: { Name: name, Email: email, Phone: phone } })
            });
            if (!createRes.ok) {
                throw new Error('Failed to create contact');
            }
            const newContact = await createRes.json();

            const existingBillingContacts = Array.isArray(currentRecord.fields[CONFIG.billingContactsField]) ? currentRecord.fields[CONFIG.billingContactsField] : [];
            const updatedBillingContacts = Array.from(new Set([...existingBillingContacts, newContact.id]));

            const linkRes = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fields: {
                        [CONFIG.billingContactsField]: updatedBillingContacts
                    }
                })
            });
            if (!linkRes.ok) {
                throw new Error('Failed to link new contact');
            }

            currentRecord = await linkRes.json();
            currentContacts = await fetchContactsForAccount(currentRecord);
            await loadBillingSection();
        }

        async function removeBillingContact(contactId) {
            if (!currentRecordId || !contactId || !currentRecord) return;
            const existingBillingContacts = Array.isArray(currentRecord.fields[CONFIG.billingContactsField]) ? currentRecord.fields[CONFIG.billingContactsField] : [];
            const updatedBillingContacts = existingBillingContacts.filter((id) => id !== contactId);

            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fields: {
                        [CONFIG.billingContactsField]: updatedBillingContacts
                    }
                })
            });
            if (!response.ok) {
                throw new Error('Failed to remove billing contact');
            }
            currentRecord = await response.json();
            currentContacts = await fetchContactsForAccount(currentRecord);
            await loadBillingSection();
        }

        function renderChargeStatusBadge(status) {
            if (!status) return '';
            const lower = String(status).toLowerCase();
            let badgeColor = 'bg-gray-100 text-gray-800';
            if (lower === 'succeeded' || lower === 'paid') {
                badgeColor = 'bg-green-100 text-green-800';
            } else if (lower === 'pending') {
                badgeColor = 'bg-yellow-100 text-yellow-800';
            } else if (lower === 'failed' || lower === 'declined') {
                badgeColor = 'bg-red-100 text-red-800';
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${status}</span>`;
        }

        async function setPortalStatus(status) {
            const input = document.getElementById('statusValue');
            if (!input) return;
            const currentStatus = input.value;
            if (currentStatus === 'Active' && status === 'Paused') {
                const confirmed = await openConfirmModal(
                    'Are you sure you want to pause all of your campaigns?',
                    'This will immediately pause all of your areas and campaigns.',
                    'If done it can take multiple days to start seeing new leads once re-activated',
                    'Yes, pause all of my campaigns'
                );
                if (!confirmed) return;
            }
            input.value = status;
            const activeBtn = document.getElementById('statusBtnActive');
            const pausedBtn = document.getElementById('statusBtnPaused');
            if (!activeBtn || !pausedBtn) return;

            if (status === 'Active') {
                activeBtn.className = 'px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors bg-green-600 text-white border-green-600 shadow-sm';
                pausedBtn.className = 'px-4 py-2 text-sm font-semibold transition-colors bg-white text-red-700 border-red-300 hover:bg-red-50';
            } else {
                activeBtn.className = 'px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors bg-white text-green-700 border-green-300 hover:bg-green-50';
                pausedBtn.className = 'px-4 py-2 text-sm font-semibold transition-colors bg-red-600 text-white border-red-600 shadow-sm';
            }

            scheduleAutoSave();
        }

        async function setPortalCharging(charging) {
            const input = document.getElementById('chargingValue');
            if (!input) return;
            const currentCharging = input.value;
            if (currentCharging === 'Active' && charging === 'Paused') {
                const confirmed = await openConfirmModal(
                    'Are you sure you want to pause charging?',
                    'Your campaigns will automatically pause once the current leads we owe you are all sent.',
                    'If campaigns are paused it can take multiple days to start seeing new leads once re-activated',
                    'Yes, pause charging after this set of leads'
                );
                if (!confirmed) return;
            }
            input.value = charging;
            const activeBtn = document.getElementById('chargingBtnActive');
            const pausedBtn = document.getElementById('chargingBtnPaused');
            if (!activeBtn || !pausedBtn) return;

            if (charging === 'Active') {
                activeBtn.className = 'px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors bg-green-600 text-white border-green-600 shadow-sm';
                pausedBtn.className = 'px-4 py-2 text-sm font-semibold transition-colors bg-white text-red-700 border-red-300 hover:bg-red-50';
            } else {
                activeBtn.className = 'px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors bg-white text-green-700 border-green-300 hover:bg-green-50';
                pausedBtn.className = 'px-4 py-2 text-sm font-semibold transition-colors bg-red-600 text-white border-red-600 shadow-sm';
            }

            scheduleAutoSave();
        }

        function openConfirmModal(title, line1, boldLine, confirmLabel) {
            const modal = document.getElementById('confirmModal');
            const titleEl = document.getElementById('confirmModalTitle');
            const bodyEl = document.getElementById('confirmModalBody');
            const confirmBtn = document.getElementById('confirmModalConfirmBtn');
            const cancelBtn = document.getElementById('confirmModalCancelBtn');

            titleEl.textContent = title;
            bodyEl.innerHTML = `
                <p>${line1}</p>
                <p><strong>${boldLine}</strong></p>
            `;
            confirmBtn.textContent = confirmLabel;
            modal.classList.remove('hidden');

            return new Promise((resolve) => {
                confirmResolver = resolve;

                const cleanup = () => {
                    modal.classList.add('hidden');
                    confirmBtn.onclick = null;
                    cancelBtn.onclick = null;
                    confirmResolver = null;
                };

                confirmBtn.onclick = () => {
                    cleanup();
                    resolve(true);
                };

                cancelBtn.onclick = () => {
                    cleanup();
                    resolve(false);
                };
            });
        }

        function formatLeadCreated(value) {
            if (!value) return '';
            try {
                const date = new Date(value);
                if (!isNaN(date.getTime())) {
                    return date.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });
                }
            } catch (e) {}
            return String(value);
        }

        function formatLeadPhone(value) {
            if (!value) return '';
            const cleaned = String(value).replace(/\D/g, '');
            if (cleaned.length === 10) {
                return `(${cleaned.slice(0, 3)}) ${cleaned.slice(3, 6)}-${cleaned.slice(6)}`;
            }
            return String(value);
        }

        function formatLeadPrice(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '';
            return `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function renderBadge(value, kind) {
            if (!value) return '';
            const lower = String(value).toLowerCase();
            let badgeColor = 'bg-gray-100 text-gray-800';
            if (kind === 'stage') {
                if (['close won'].includes(lower)) badgeColor = 'bg-green-100 text-green-800';
                else if (['close lost', 'not interested', 'cancelled'].includes(lower)) badgeColor = 'bg-red-100 text-red-800';
                else if (['follow up', '2nd follow up', 'final follow up'].includes(lower)) badgeColor = 'bg-yellow-100 text-yellow-800';
                else if (['appointment ran'].includes(lower)) badgeColor = 'bg-purple-100 text-purple-800';
                else if (['contacted', 'first contact'].includes(lower)) badgeColor = 'bg-blue-100 text-blue-800';
            } else if (kind === 'status') {
                if (lower === 'qualified') badgeColor = 'bg-green-100 text-green-800';
                else if (lower === 'pending') badgeColor = 'bg-yellow-100 text-yellow-800';
                else if (lower === 'unqualified') badgeColor = 'bg-red-100 text-red-800';
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${value}</span>`;
        }

                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Email</th>
                                <th class="px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wide">Address</th>

        function getLinkedB2CLeadIds(adsetRecord) {
            const fields = adsetRecord.fields || {};
            const possibleFields = ['B2C Leads', 'Leads', 'Linked Leads', 'B2C Lead', 'B2C'];
            for (const key of possibleFields) {
                if (Array.isArray(fields[key])) return fields[key];
            }
            return [];
        }

        async function fetchB2CLeadsByAdset(adsetId) {
            const allLeads = [];
            let offset = null;
            const filterFormula = `FIND("${adsetId}", ARRAYJOIN({Adsets}))`;

            do {
                let url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}?filterByFormula=${encodeURIComponent(filterFormula)}`;
                if (offset) {
                    url += `&offset=${offset}`;
                }
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Failed to fetch leads by adset (${response.status})`);
                }
                const data = await response.json();
                allLeads.push(...(data.records || []));
                offset = data.offset;
            } while (offset);

            return allLeads;
        }

        async function loadLocationAdsetAndLeads(adsetId) {
            const summaryNameEl = document.getElementById(`location-summary-name-${adsetId}`);
            const leadsEl = document.getElementById(`location-leads-${adsetId}`);
            if (!leadsEl) return;

            leadsEl.innerHTML = '<p class="text-sm text-gray-600">Loading linked leads...</p>';

            try {
                const adset = await fetchAdsetById(adsetId);
                if (!adset) {
                    if (summaryNameEl) summaryNameEl.textContent = `Location (${adsetId})`;
                    leadsEl.innerHTML = '<p class="text-sm text-red-600">Unable to load this location.</p>';
                    return;
                }

                const adsetName = adset.fields['Adset Name'] || adset.fields['Name'] || `Location (${adsetId})`;
                if (summaryNameEl) summaryNameEl.textContent = adsetName;

                const leadIds = getLinkedB2CLeadIds(adset);
                let leadRecords = [];

                if (leadIds.length) {
                    const total = leadIds.length;
                    for (let i = 0; i < leadIds.length; i++) {
                        const leadId = leadIds[i];
                        leadsEl.innerHTML = `<p class="text-sm text-gray-600">Loading ${i + 1}/${total} leads...</p>`;
                        const lead = await fetchLeadById(leadId);
                        if (lead) leadRecords.push(lead);
                    }
                } else {
                    // Fallback path when adset doesn't expose linked lead IDs directly.
                    leadRecords = await fetchB2CLeadsByAdset(adsetId);
                }

                leadRecords.sort((a, b) => new Date((b.fields || {})['Created'] || 0) - new Date((a.fields || {})['Created'] || 0));
                leadRecords.forEach((lead) => {
                    loadedLeadsById.set(lead.id, lead);
                    leadToAdsetMap.set(lead.id, adsetId);
                });
                leadsEl.innerHTML = renderLeadsTable(leadRecords);
            } catch (err) {
                leadsEl.innerHTML = `<p class="text-sm text-red-600">Unable to load linked leads: ${err.message}</p>`;
            }
        }

        function parseApptToDatetime(apptStr) {
            if (!apptStr || apptStr.trim() === '') return null;
            const match = apptStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+at\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
            if (!match) return null;
            const [, month, day, year, hour, min, ampm] = match;
            let h = parseInt(hour, 10);
            if (ampm.toUpperCase() === 'PM' && h !== 12) h += 12;
            if (ampm.toUpperCase() === 'AM' && h === 12) h = 0;
            return { date: `${year}-${month.padStart(2, '0')}-${day.padStart(2, '0')}`, time: `${String(h).padStart(2, '0')}:${min}` };
        }

        function formatAppointmentForAirtable(dateStr, timeStr) {
            if (!dateStr || !timeStr) return '';
            const [y, m, d] = dateStr.split('-');
            const [hour, min] = timeStr.split(':');
            let h = parseInt(hour, 10);
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            return `${m}/${d}/${y} at ${String(h).padStart(2, '0')}:${min} ${ampm}`;
        }

        function getBaseSummaryWithoutAppt(fullSummary) {
            if (!fullSummary || typeof fullSummary !== 'string') return fullSummary || '';
            const match = fullSummary.match(/^Appointment:\s*[^\n]+\n\n?/i);
            if (match) return fullSummary.slice(match[0].length).trim();
            return fullSummary;
        }

        function getBaseSummaryHTMLWithoutAppt(fullSummaryHTML) {
            if (!fullSummaryHTML || typeof fullSummaryHTML !== 'string') return fullSummaryHTML || '';
            const match = fullSummaryHTML.match(/^Appointment:\s*[^<]+<BR>\s*<BR>\s*/i);
            if (match) return fullSummaryHTML.slice(match[0].length).trim();
            return fullSummaryHTML;
        }

        async function saveLeadApptOnly(recordId, onSuccess) {
            const apptDateField = document.getElementById('leadEditApptDateField');

            const record = loadedLeadsById.get(recordId);
            if (!record) return;
            const newAppt = (apptDateField.value && apptTimeField.value) ? formatAppointmentForAirtable(apptDateField.value, apptTimeField.value) : '';

            let fullSummaryUpdate = null;
            let fullSummaryHTMLUpdate = null;
            if (newAppt || record.fields['Appt']) {
                const baseSummary = getBaseSummaryWithoutAppt(record.fields['Full Summary']);
                const baseSummaryHTML = getBaseSummaryHTMLWithoutAppt(record.fields['Full Summary HTML']);
                if (newAppt) {
                    fullSummaryUpdate = `Appointment: ${newAppt}\n\n${baseSummary}`;
                    fullSummaryHTMLUpdate = `Appointment: ${newAppt}<BR><BR>${baseSummaryHTML}`;
                } else {
                    fullSummaryUpdate = baseSummary;
                    fullSummaryHTMLUpdate = baseSummaryHTML;
                }
            }

            const fieldsToUpdate = { Appt: newAppt };
            if (fullSummaryUpdate !== null) fieldsToUpdate['Full Summary'] = fullSummaryUpdate;
            if (fullSummaryHTMLUpdate !== null) fieldsToUpdate['Full Summary HTML'] = fullSummaryHTMLUpdate;

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}/${recordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields: fieldsToUpdate })
                });
                if (!response.ok) throw new Error('Failed to save appointment');
                const updated = await response.json();
                loadedLeadsById.set(recordId, updated);
                if (onSuccess) onSuccess(updated.fields['Full Summary'] || '');
            } catch (err) {
                alert(`Error saving appointment: ${err.message}`);
                if (onSuccess) onSuccess(null);
            }
        }

                const baseSummary = getBaseSummaryWithoutAppt(record.fields['Full Summary']);
                const baseSummaryHTML = getBaseSummaryHTMLWithoutAppt(record.fields['Full Summary HTML']);
                if (newAppt) {
                    fullSummaryUpdate = `Appointment: ${newAppt}\n\n${baseSummary}`;
                    fullSummaryHTMLUpdate = `Appointment: ${newAppt}<BR><BR>${baseSummaryHTML}`;
                } else {
                    fullSummaryUpdate = baseSummary;
                    fullSummaryHTMLUpdate = baseSummaryHTML;
                }
            }

            const fieldsToUpdate = { Stage: stage, Notes: notes, Appt: newAppt };
            if (fullSummaryUpdate !== null) fieldsToUpdate['Full Summary'] = fullSummaryUpdate;
            if (fullSummaryHTMLUpdate !== null) fieldsToUpdate['Full Summary HTML'] = fullSummaryHTMLUpdate;
            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}/${recordId}`, {

            const apptDateEl = document.getElementById('leadEditApptDateField');

            const oldNotes = record.fields['Notes'] || '';

        function extractZipCodeFromUSZipRecord(zipRecord) {
            const fields = zipRecord && zipRecord.fields ? zipRecord.fields : {};
            const candidates = ['Zip', 'ZIP', 'Zip Code', 'ZIP Code', 'Name'];
            for (const key of candidates) {
                const raw = fields[key];
                if (raw === null || raw === undefined || raw === '') continue;
                const digits = String(raw).replace(/\D/g, '').slice(0, 5);
                if (digits.length === 5) return digits;
            }
            return null;
        }

        function getAdsetJunctionIds(adsetRecord) {
            const fields = adsetRecord && adsetRecord.fields ? adsetRecord.fields : {};
            const keys = ['Adset Zip Tracking', 'Ad Set Zip Tracking'];
            for (const key of keys) {
                if (Array.isArray(fields[key])) return fields[key];
            }
            return [];
        }

        function getJunctionZipId(junctionRecord) {
            const fields = junctionRecord && junctionRecord.fields ? junctionRecord.fields : {};
            const keys = ['US Zips', 'US Zip', 'Zip'];
            for (const key of keys) {
                const v = fields[key];
                if (Array.isArray(v) && v.length) return v[0];
                if (typeof v === 'string' && v.startsWith('rec')) return v;
            }
            return null;
        }

        async function geocodeZip(zip) {
            try {
                const res = await fetch(`https://api.zippopotam.us/us/${encodeURIComponent(zip)}`);
                if (!res.ok) return null;
                const data = await res.json();
                const place = data.places && data.places[0];
                if (!place) return null;
                const lat = Number(place.latitude);
                const lon = Number(place.longitude);
                if (!Number.isFinite(lat) || !Number.isFinite(lon)) return null;
                return { lat, lon };
            } catch {
                return null;
            }
        }

        async function renderZipMap(containerId, zipCodes) {
            const mapContainer = document.getElementById(containerId);
            if (!mapContainer) return;

            const existingMap = zipMapInstances.get(containerId);
            if (existingMap) {
                existingMap.remove();
                zipMapInstances.delete(containerId);
            }

            const points = [];
            for (const zip of zipCodes) {
                const point = await geocodeZip(zip);
                if (point) points.push({ zip, ...point });
            }

            if (!points.length) {
                mapContainer.innerHTML = '<p class="text-sm text-gray-500">Unable to plot zip map for these zip codes.</p>';
                return;
            }

            mapContainer.innerHTML = '';
            const map = L.map(containerId, { scrollWheelZoom: false });
            zipMapInstances.set(containerId, map);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            const bounds = [];
            points.forEach((p) => {
                L.marker([p.lat, p.lon]).addTo(map).bindPopup(`ZIP ${p.zip}`);
                bounds.push([p.lat, p.lon]);
            });
            if (bounds.length === 1) {
                map.setView(bounds[0], 9);
            } else {
                map.fitBounds(bounds, { padding: [20, 20] });
            }
        }

        async function loadLocationZipCodes(adsetId) {
            const zipEl = document.getElementById(`location-zips-${adsetId}`);
            if (!zipEl) return;
            zipEl.innerHTML = '<p class="text-sm text-gray-600">Loading zip codes...</p>';

            try {
                const adset = await fetchAdsetById(adsetId);
                if (!adset) {
                    zipEl.innerHTML = '<p class="text-sm text-red-600">Unable to load zip codes for this location.</p>';
                    return;
                }

                const junctionIds = getAdsetJunctionIds(adset);
                if (!junctionIds.length) {
                    zipEl.innerHTML = '<p class="text-sm text-gray-500">No linked zip codes found for this location.</p>';
                    return;
                }

                const zipCodes = [];
                for (const junctionId of junctionIds) {
                    const junction = await fetchAdsetZipJunctionById(junctionId);
                    if (!junction) continue;
                    const zipRecordId = getJunctionZipId(junction);
                    if (!zipRecordId) continue;
                    const zipRecord = await fetchUSZipById(zipRecordId);
                    const zipCode = extractZipCodeFromUSZipRecord(zipRecord);
                    if (zipCode) zipCodes.push(zipCode);
                }

                const uniqueZipCodes = Array.from(new Set(zipCodes)).sort((a, b) => a.localeCompare(b));
                if (!uniqueZipCodes.length) {
                    zipEl.innerHTML = '<p class="text-sm text-gray-500">No linked zip codes found for this location.</p>';
                    return;
                }

                const mapId = `zip-map-${adsetId}`;
                zipEl.innerHTML = `
                    <div id="${mapId}" class="zip-map border border-gray-200 rounded-lg mb-3"></div>
                    <div class="border border-gray-200 rounded-lg p-3 bg-white">
                        <div class="text-sm font-medium text-gray-800 mb-2">Linked Zip Codes</div>
                        <div class="text-sm text-gray-700">${uniqueZipCodes.join(', ')}</div>
                    </div>
                `;
                await renderZipMap(mapId, uniqueZipCodes);
            } catch (err) {
                zipEl.innerHTML = `<p class="text-sm text-red-600">Unable to load zip codes: ${err.message}</p>`;
            }
        }

            const modeInput = document.getElementById(`submitScreenMode-${adsetId}`);

            const timezoneEl = document.getElementById(`submitTimezone-${adsetId}`);

            const textEl = document.getElementById(`submitText-${adsetId}`);

                'Timezone': timezoneEl ? timezoneEl.value : null,

                'Text': textEl ? (textEl.value || '') : ''
            };

            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            days.forEach((day) => {
                const sel = document.querySelector(`select[data-submit-day="${day}"][data-adset-id="${adsetId}"]`);
                if (sel) {

            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fields })
            });

        }

                    const zipsSection = wrapper.querySelector(`details[data-location-zips-section="${adsetId}"]`);
                    const contactsSection = wrapper.querySelector(`details[data-location-contacts-section="${adsetId}"]`);
                    const submitSection = wrapper.querySelector(`details[data-location-submit-screen-section="${adsetId}"]`);

                    if (leadsSection) {
                        leadsSection.addEventListener('toggle', function() {
                            if (!leadsSection.open || leadsSection.dataset.loaded === 'true') return;
                            leadsSection.dataset.loaded = 'true';
                            loadLocationAdsetAndLeads(adsetId);
                        });
                    }
                    if (zipsSection) {
                        zipsSection.addEventListener('toggle', function() {
                            if (!zipsSection.open || zipsSection.dataset.loaded === 'true') return;
                            zipsSection.dataset.loaded = 'true';
                            loadLocationZipCodes(adsetId);
                        });
                    }
                    if (contactsSection) {
                        contactsSection.addEventListener('toggle', function() {
                            if (!contactsSection.open || contactsSection.dataset.loaded === 'true') return;
                            contactsSection.dataset.loaded = 'true';
                            loadLocationContacts(adsetId);
                        });
                    }
                    if (submitSection) {
                        submitSection.addEventListener('toggle', function() {
                            if (!submitSection.open || submitSection.dataset.loaded === 'true') return;
                            submitSection.dataset.loaded = 'true';
                            loadLocationSubmitScreen(adsetId);
                        });
                    }
                    wrapper.dataset.bound = 'true';
                });
            });
        }

        function getMultiSelectValues(selectEl) {
            return Array.from(selectEl.selectedOptions).map(option => option.value);
        }

        function scheduleAutoSave() {
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
            }
            autoSaveTimer = setTimeout(function() {
                autoSaveTimer = null;
                savePortalFields();
            }, 500);
        }

        async function savePortalFields() {
            if (!currentRecordId) return;
            captureDetailsOpenState();
            const nameInput = document.getElementById('nameInput');
            const name = nameInput ? nameInput.value.trim() : fieldDisplay(currentRecord, 'Name', '');
            const statusInput = document.getElementById('statusValue');
            const rawStatus = fieldDisplay(currentRecord, 'Status', '');
            const status = statusInput ? statusInput.value : rawStatus;
            const chargingInput = document.getElementById('chargingValue');
            const chargingUi = chargingInput ? chargingInput.value : (String(currentRecord.fields.Charging || '').toLowerCase() === 'pause' ? 'Paused' : 'Active');
            const charging = chargingUi === 'Paused' ? 'Pause' : 'Charging';

            const fields = {
                Name: name,
                Status: status,
                Charging: charging
            };

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields })
                });
                if (!response.ok) throw new Error('Failed to save changes');
                const updated = await response.json();
                currentRecord = updated;
                currentContacts = await fetchContactsForAccount(currentRecord);
                renderPortalCard(currentRecord);
                await loadBillingSection();
                document.querySelector('h1').textContent = `${currentRecord.fields.Name || 'Account'}`;
            } catch (err) {
                alert(`Error saving portal fields: ${err.message}`);
            }
        }

        async function openBillingModal() {
            const modal = document.getElementById('billingModal');
            const content = document.getElementById('billingModalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '<p class="text-gray-600">Loading billing info...</p>';

            try {
                if (!currentRecord) {
                    currentRecord = await fetchRecordById(currentRecordId);
                }
                const customerIds = currentRecord.fields.Customers;
                if (!Array.isArray(customerIds) || !customerIds.length) {
                    content.innerHTML = '<p class="text-gray-600">No linked customers.</p>';
                    return;
                }

                const customerCards = [];
                for (const customerId of customerIds) {
                    const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.customersTableName)}/${customerId}`);
                    if (!response.ok) continue;
                    const customer = await response.json();
                    const fields = customer.fields || {};
                    customerCards.push(`
                        <div class="border border-gray-200 rounded-lg p-4 mb-4">
                            <h4 class="text-lg font-semibold text-gray-900 mb-2">${fields.Name || 'Customer'}</h4>
                            <div class="text-sm text-gray-700 space-y-1">
                                <p><strong>Email:</strong> ${fields.Email || '—'}</p>
                                <p><strong>Phone:</strong> ${fields.Phone || '—'}</p>
                                <p><strong>Address:</strong> ${fields.Address || '—'}</p>
                            </div>
                        </div>
                    `);
                }

                content.innerHTML = customerCards.length ? customerCards.join('') : '<p class="text-gray-600">No readable customer records found.</p>';
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function closeBillingModal() {
            document.getElementById('billingModal').classList.add('hidden');
        }

        async function openBillingContactsModal() {
            const modal = document.getElementById('billingContactsModal');
            const content = document.getElementById('billingContactsModalContent');
            modal.classList.remove('hidden');
            content.innerHTML = '<p class="text-gray-600">Loading billing contacts...</p>';

            try {
                if (!currentRecord) {
                    currentRecord = await fetchRecordById(currentRecordId);
                }

                const currentContactIds = Array.isArray(currentRecord.fields[CONFIG.billingContactsField])
                    ? currentRecord.fields[CONFIG.billingContactsField]
                    : [];

                const allContacts = await fetchAllContacts();
                const currentContacts = [];
                for (const contactId of currentContactIds) {
                    const contact = allContacts.find(c => c.id === contactId);
                    if (contact) {
                        currentContacts.push(contact);
                    }
                }

                content.innerHTML = `
                    <div class="mb-4">
                        <h4 class="text-sm font-semibold text-gray-800 mb-2">Current Linked Contacts</h4>
                        <div class="space-y-2">
                            ${currentContacts.length ? currentContacts.map(contact => `<div class="text-sm text-gray-700">${contact.fields.Name || 'Unnamed'} - ${contact.fields.Email || 'No email'}</div>`).join('') : '<div class="text-sm text-gray-500">No contacts linked.</div>'}
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="billingContactsSelect">Edit Billing Contacts</label>
                        <select id="billingContactsSelect" multiple class="w-full px-3 py-2 border border-gray-300 rounded-md h-48">
                            ${allContacts.map(contact => {
                                const isSelected = currentContactIds.includes(contact.id);
                                const label = `${contact.fields.Name || 'Unnamed'} - ${contact.fields.Email || 'No email'}`;
                                return `<option value="${contact.id}" ${isSelected ? 'selected' : ''}>${label}</option>`;
                            }).join('')}
                        </select>
                        <p class="mt-1 text-xs text-gray-500">Hold Ctrl/Cmd to select multiple contacts.</p>
                    </div>
                    <button onclick="saveBillingContacts()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Contacts</button>
                `;
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function closeBillingContactsModal() {
            document.getElementById('billingContactsModal').classList.add('hidden');
        }

        async function fetchAllContacts() {
            const contacts = [];
            let offset = null;

            do {
                let url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}`;
                if (offset) url += `?offset=${offset}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch contacts list.');
                const data = await response.json();
                contacts.push(...(data.records || []));
                offset = data.offset;
            } while (offset);

            return contacts;
        }

        async function saveBillingContacts() {
            const selectEl = document.getElementById('billingContactsSelect');
            if (!selectEl || !currentRecordId) return;
            const selectedContactIds = getMultiSelectValues(selectEl);

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            [CONFIG.billingContactsField]: selectedContactIds
                        }
                    })
                });
                if (!response.ok) throw new Error('Failed to save billing contacts');
                currentRecord = await fetchRecordById(currentRecordId);
                alert('Billing contacts updated.');
                await openBillingContactsModal();
            } catch (err) {
                alert(`Error saving billing contacts: ${err.message}`);
            }
        }

        document.getElementById('billingModal').addEventListener('click', function(e) {
            if (e.target === this) closeBillingModal();
        });

        document.getElementById('billingContactsModal').addEventListener('click', function(e) {
            if (e.target === this) closeBillingContactsModal();
        });

        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this && confirmResolver) {
                const resolve = confirmResolver;
                confirmResolver = null;
                this.classList.add('hidden');
                resolve(false);
            }
        });

        document.getElementById('editLeadModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLeadEditModal();
            }
        });

        (function init() {
            const atid = getURLParameter('ATID');
            if (!atid) {
                showEmailGateError('Invalid link. Please add ?ATID=your_record_id to the URL.');
            }
        })();
    </script>
</body>
</html>
