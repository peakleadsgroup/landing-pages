<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Portal Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="emailGate" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads Logo" class="h-10 w-auto mx-auto mb-4">
                <h2 class="text-xl font-semibold text-gray-900 mb-2">Access Your Portal</h2>
                <p class="text-gray-600 text-sm">Enter an email associated with this account.</p>
            </div>
            <form id="emailGateForm" onsubmit="return verifyEmail(event)" class="space-y-4">
                <div>
                    <label for="emailInput" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="emailInput" required placeholder="you@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div id="emailGateError" class="hidden text-sm text-red-600"></div>
                <button type="submit" id="emailGateSubmit" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-medium">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardContent" class="hidden min-h-screen p-6">
        <div class="max-w-5xl mx-auto">
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads Logo" class="h-10 w-auto">
                        <h1 class="text-2xl font-bold text-gray-900">Portal Dashboard</h1>
                    </div>
                    <div class="flex flex-wrap gap-2">
                    </div>
                </div>
            </div>

            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <p class="text-sm text-red-800" id="errorText"></p>
            </div>

            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600">Loading portal...</p>
            </div>

            <div id="portalCard" class="hidden bg-white rounded-lg shadow-sm p-6 space-y-6"></div>
        </div>
    </div>

    <div id="billingModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-3xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Billing Information</h3>
                <button onclick="closeBillingModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div id="billingModalContent" class="max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="billingContactsModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-11/12 max-w-2xl shadow-lg rounded-md bg-white">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Billing Contacts</h3>
                <button onclick="closeBillingContactsModal()" class="text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div id="billingContactsModalContent" class="max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <div id="confirmModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-24 mx-auto p-6 border w-11/12 max-w-xl shadow-lg rounded-md bg-white">
            <h3 id="confirmModalTitle" class="text-xl font-semibold text-gray-900 mb-3"></h3>
            <div id="confirmModalBody" class="text-sm text-gray-700 space-y-2 mb-6"></div>
            <div class="flex items-center justify-end gap-3">
                <button id="confirmModalCancelBtn" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">Cancel</button>
                <button id="confirmModalConfirmBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"></button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            tableName: 'tblH2nVfmGNG8pAjC',
            contactsTableName: 'Contacts',
            contactsLinkedField: 'Contacts',
            customersTableName: 'Customers',
            adsetsTableName: 'Adsets',
            leadsTableName: 'B2C Leads',
            billingContactsField: 'Billing Contacts'
        };

        let currentRecordId = null;
        let currentRecord = null;
        let currentContacts = [];
        let autoSaveTimer = null;
        let confirmResolver = null;

        function getURLParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        async function fetchRecordById(recordId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${recordId}`);
            if (!response.ok) throw new Error(`Failed to fetch portal record: ${response.status}`);
            return response.json();
        }

        async function fetchContactById(contactId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}/${contactId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchAdsetById(adsetId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.adsetsTableName)}/${adsetId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function fetchLeadById(leadId) {
            const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}/${leadId}`);
            if (!response.ok) return null;
            return response.json();
        }

        async function getBillingContactEmails(record) {
            const contactIds = record.fields[CONFIG.billingContactsField];
            if (!Array.isArray(contactIds) || contactIds.length === 0) return [];
            const emails = [];
            for (const contactId of contactIds) {
                const contact = await fetchContactById(contactId);
                if (contact && contact.fields && contact.fields.Email) {
                    emails.push(String(contact.fields.Email).trim().toLowerCase());
                }
            }
            return emails;
        }

        async function verifyEmail(event) {
            event.preventDefault();
            const atid = getURLParameter('ATID');
            if (!atid) {
                showEmailGateError('Invalid link. No record identifier found.');
                return false;
            }

            const emailInput = document.getElementById('emailInput');
            const submitBtn = document.getElementById('emailGateSubmit');
            const enteredEmail = (emailInput.value || '').trim().toLowerCase();
            if (!enteredEmail) return false;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Verifying...';
            hideEmailGateError();

            try {
                const record = await fetchRecordById(atid);
                const allowedEmails = await getBillingContactEmails(record);
                if (!allowedEmails.length) {
                    throw new Error('No billing contacts are linked to this account.');
                }
                if (!allowedEmails.includes(enteredEmail)) {
                    throw new Error('This email is not associated with this account.');
                }

                document.getElementById('emailGate').classList.add('hidden');
                document.getElementById('dashboardContent').classList.remove('hidden');
                currentRecordId = atid;
                await initializeDashboard();
            } catch (err) {
                showEmailGateError(err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Continue';
            }

            return false;
        }

        function showEmailGateError(message) {
            const errorEl = document.getElementById('emailGateError');
            errorEl.textContent = message;
            errorEl.classList.remove('hidden');
        }

        function hideEmailGateError() {
            document.getElementById('emailGateError').classList.add('hidden');
        }

        async function initializeDashboard() {
            if (!currentRecordId) return;
            setLoading(true);
            hideError();
            try {
                currentRecord = await fetchRecordById(currentRecordId);
                currentContacts = await fetchContactsForAccount(currentRecord);
                renderPortalCard(currentRecord);
                await loadBillingSection();
                document.querySelector('h1').textContent = `Portal Dashboard - ${currentRecord.fields.Name || 'Account'}`;
                document.getElementById('portalCard').classList.remove('hidden');
            } catch (err) {
                showError(err.message);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            const loading = document.getElementById('loadingState');
            if (isLoading) {
                loading.classList.remove('hidden');
            } else {
                loading.classList.add('hidden');
            }
        }

        function showError(message) {
            document.getElementById('errorText').textContent = message;
            document.getElementById('errorMessage').classList.remove('hidden');
        }

        function hideError() {
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function fieldDisplay(record, fieldName, fallback = '—') {
            const value = record.fields[fieldName];
            if (value === null || value === undefined || value === '') return fallback;
            if (Array.isArray(value)) return value.join(', ');
            return String(value);
        }

        function moneyDisplay(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '$0.00';
            return `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function formatLeadCount(value) {
            const parsed = Number(value);
            if (!Number.isFinite(parsed)) return fieldDisplay({ fields: { temp: value } }, 'temp');
            return Math.abs(parsed).toLocaleString('en-US');
        }

        function createReadOnlyRow(label, value) {
            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                    <div class="text-sm font-medium text-gray-700">${label}</div>
                    <div class="sm:col-span-2 text-sm text-gray-900">${value}</div>
                </div>
            `;
        }

        async function fetchContactsForAccount(record) {
            const billingIds = Array.isArray(record.fields[CONFIG.billingContactsField]) ? record.fields[CONFIG.billingContactsField] : [];
            const linkedIds = Array.isArray(record.fields[CONFIG.contactsLinkedField]) ? record.fields[CONFIG.contactsLinkedField] : [];
            const contactIds = Array.from(new Set([ ...billingIds, ...linkedIds ]));
            if (!contactIds.length) return [];

            const contacts = [];
            for (const id of contactIds) {
                const contact = await fetchContactById(id);
                if (contact) contacts.push(contact);
            }
            return contacts;
        }

        function getNumericField(record, fieldName) {
            const rawValue = record && record.fields ? record.fields[fieldName] : null;
            const value = Array.isArray(rawValue) ? rawValue[0] : rawValue;
            const parsed = Number(value);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function statusChip(status) {
            const normalized = String(status || '').toLowerCase();
            if (normalized === 'active') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800 border border-green-200">Active</span>';
            if (normalized === 'paused') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800 border border-red-200">Paused</span>';
            if (normalized === 'setup') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 border border-blue-200">Setup</span>';
            if (normalized === 'closed') return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-200 text-gray-800 border border-gray-300">Closed</span>';
            return '<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gray-100 text-gray-700 border border-gray-200">Unknown</span>';
        }

        function renderStatusControl(status) {
            const normalized = String(status || '').toLowerCase();
            const isLocked = normalized === 'setup' || normalized === 'closed';

            if (isLocked) {
                return `
                    <div class="space-y-2">
                        ${statusChip(status)}
                        <p class="text-xs text-gray-500">This status is managed internally and cannot be changed here.</p>
                    </div>
                `;
            }

            const effectiveStatus = normalized === 'paused' ? 'Paused' : 'Active';
            const activeClasses = effectiveStatus === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = effectiveStatus === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';

            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="statusBtnActive" type="button" onclick="setPortalStatus('Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">
                        Active
                    </button>
                    <button id="statusBtnPaused" type="button" onclick="setPortalStatus('Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">
                        Paused
                    </button>
                </div>
                <input type="hidden" id="statusValue" value="${effectiveStatus}">
            `;
        }

        function renderChargingControl(charging) {
            const normalized = String(charging || '').toLowerCase();
            const effectiveCharging = normalized === 'pause' ? 'Paused' : 'Active';
            const activeClasses = effectiveCharging === 'Active'
                ? 'bg-green-600 text-white border-green-600 shadow-sm'
                : 'bg-white text-green-700 border-green-300 hover:bg-green-50';
            const pausedClasses = effectiveCharging === 'Paused'
                ? 'bg-red-600 text-white border-red-600 shadow-sm'
                : 'bg-white text-red-700 border-red-300 hover:bg-red-50';

            return `
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="chargingBtnActive" type="button" onclick="setPortalCharging('Active')" class="px-4 py-2 text-sm font-semibold border-r border-gray-200 transition-colors ${activeClasses}">
                        Active
                    </button>
                    <button id="chargingBtnPaused" type="button" onclick="setPortalCharging('Paused')" class="px-4 py-2 text-sm font-semibold transition-colors ${pausedClasses}">
                        Paused
                    </button>
                </div>
                <input type="hidden" id="chargingValue" value="${effectiveCharging}">
            `;
        }

        function hasNotification(contact, notificationName) {
            const notifications = Array.isArray(contact.fields.Notifications) ? contact.fields.Notifications : [];
            return notifications.some((n) => String(n).toLowerCase() === notificationName.toLowerCase());
        }

        function renderContactsSection() {
            if (!currentContacts.length) {
                return `
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                        <div class="text-sm font-medium text-gray-700">Contacts</div>
                        <div class="sm:col-span-2 text-sm text-gray-500">No linked contacts found.</div>
                    </div>
                `;
            }

            const billingIds = Array.isArray(currentRecord.fields[CONFIG.billingContactsField]) ? currentRecord.fields[CONFIG.billingContactsField] : [];
            const rows = currentContacts.map((contact) => {
                const name = contact.fields.Name || 'Unnamed';
                const email = contact.fields.Email || 'No email';
                const phone = contact.fields.Phone || 'No phone';
                const billingSelected = billingIds.includes(contact.id) || hasNotification(contact, 'Billing');
                const newLeadsSelected = hasNotification(contact, 'New Leads');

                return `
                    <div class="border border-gray-200 rounded-lg p-3 space-y-2">
                        <div class="text-sm font-medium text-gray-900">${name}</div>
                        <div class="text-xs text-gray-600">${email}</div>
                        <div class="text-xs text-gray-600">${phone}</div>
                        <div class="flex flex-wrap gap-4 pt-1">
                            <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" class="contact-delivery-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500" data-contact-id="${contact.id}" data-delivery="billing" ${billingSelected ? 'checked' : ''}>
                                Billing
                            </label>
                            <label class="inline-flex items-center gap-2 text-sm text-gray-700">
                                <input type="checkbox" class="contact-delivery-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500" data-contact-id="${contact.id}" data-delivery="new-leads" ${newLeadsSelected ? 'checked' : ''}>
                                New Leads
                            </label>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                    <div class="text-sm font-medium text-gray-700">Contacts</div>
                    <div class="sm:col-span-2 space-y-3">
                        ${rows}
                    </div>
                </div>
            `;
        }

        function renderPortalCard(record) {
            const container = document.getElementById('portalCard');
            const adsetValues = Array.isArray(record.fields.Adsets) ? record.fields.Adsets : [];
            const leadsOwedValue = getNumericField(record, 'TBC Leads');
            const leadsOwedLabel = leadsOwedValue !== null && leadsOwedValue < 0 ? 'Leads We Owe You' : 'Leads You Owe Us';
            const leadsOwedDisplay = formatLeadCount(record.fields['TBC Leads']);
            const leadsOwedHelper = leadsOwedValue !== null && leadsOwedValue < 0
                ? '<p class="mt-1 text-xs text-gray-500">Leads we\'ve billed for but haven\'t sent yet</p>'
                : '';

            container.innerHTML = `
                <div>
                    <details class="border border-gray-200 rounded-lg mb-4">
                        <summary class="px-4 py-3 cursor-pointer list-none flex items-center justify-between hover:bg-gray-50">
                            <span class="text-lg font-semibold text-gray-900 inline-flex items-center gap-2">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.427 1.756 2.925 0 3.352a1.724 1.724 0 00-1.066 2.572c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.427 1.756-2.925 1.756-3.352 0a1.724 1.724 0 00-2.572-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.427-1.756-2.925 0-3.352a1.724 1.724 0 001.066-2.572c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                <span>Account Settings</span>
                            </span>
                            <span class="text-sm text-gray-500">Expand</span>
                        </summary>
                        <div class="px-4 pb-4 border-t border-gray-100">
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-3">
                                <label class="text-sm font-medium text-gray-700" for="nameInput">Name</label>
                                <div class="sm:col-span-2">
                                    <input
                                        id="nameInput"
                                        type="text"
                                        value="${fieldDisplay(record, 'Name', '')}"
                                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                        placeholder="Enter account name"
                                    >
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-3">
                                <label class="text-sm font-medium text-gray-700">Status</label>
                                <div class="sm:col-span-2">
                                    ${renderStatusControl(record.fields.Status)}
                                    <p class="mt-2 text-xs text-gray-500">'Active' = one or all of your campaigns are actively running. 'Pause' = all of your campaigns are paused</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                                <label class="text-sm font-medium text-gray-700">Charging</label>
                                <div class="sm:col-span-2">
                                    ${renderChargingControl(record.fields.Charging)}
                                    <p class="mt-2 text-xs text-gray-500">'Charging' = you will automatically be billed when the leads we owe you are all sent so your campaign continues running. 'Pause' = your campaign will pause when the leads we owe you are completed and your campaign will pause</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                                <div class="text-sm font-medium text-gray-700">Charge Cadence</div>
                                <div class="sm:col-span-2 text-sm text-gray-900">
                                    <div>${fieldDisplay(record, 'Charge Cadence')}</div>
                                    <p class="mt-1 text-xs text-gray-500">Number of leads we bill for at a time</p>
                                </div>
                            </div>
                            ${renderContactsSection()}
                        </div>
                    </details>
                    <details class="border border-gray-200 rounded-lg mb-4">
                        <summary class="px-4 py-3 cursor-pointer list-none flex items-center justify-between hover:bg-gray-50">
                            <span class="text-lg font-semibold text-gray-900 inline-flex items-center gap-2">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19V6m-6 13V10m12 9v-4m6 4V4"></path>
                                </svg>
                                <span>Overview</span>
                            </span>
                            <span class="text-sm text-gray-500">Expand</span>
                        </summary>
                        <div class="px-4 pb-4 border-t border-gray-100">
                            ${createReadOnlyRow('Qualified Leads Sent', fieldDisplay(record, 'Qualified Leads'))}
                            ${createReadOnlyRow('Leads Charged', fieldDisplay(record, 'Leads Collected'))}
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-4 py-2">
                                <div class="text-sm font-medium text-gray-700">${leadsOwedLabel}</div>
                                <div class="sm:col-span-2 text-sm text-gray-900">
                                    <div>${leadsOwedDisplay}</div>
                                    ${leadsOwedHelper}
                                </div>
                            </div>
                            ${createReadOnlyRow('Lead Price', moneyDisplay(record.fields['Lead Price']))}
                            ${createReadOnlyRow('Niche', fieldDisplay(record, 'Niche'))}
                        </div>
                    </details>
                    <details class="border border-gray-200 rounded-lg mb-4" open>
                        <summary class="px-4 py-3 cursor-pointer list-none flex items-center justify-between hover:bg-gray-50">
                            <span class="text-lg font-semibold text-gray-900 inline-flex items-center gap-2">
                                <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.828 0l-4.243-4.243a8 8 0 1111.314 0z"></path>

        function formatLeadCreated(value) {
            if (!value) return '';
            try {
                const date = new Date(value);
                if (!isNaN(date.getTime())) {
                    return date.toLocaleString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });
                }
            } catch (e) {}
            return String(value);
        }

        function formatLeadPhone(value) {
            if (!value) return '';
            const cleaned = String(value).replace(/\D/g, '');
            if (cleaned.length === 10) {
                return `(${cleaned.slice(0, 3)}) ${cleaned.slice(3, 6)}-${cleaned.slice(6)}`;
            }
            return String(value);
        }

        function formatLeadPrice(value) {
            const num = Number(value);
            if (!Number.isFinite(num)) return '';
            return `$${num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        function renderBadge(value, kind) {
            if (!value) return '';
            const lower = String(value).toLowerCase();
            let badgeColor = 'bg-gray-100 text-gray-800';
            if (kind === 'stage') {
                if (['close won'].includes(lower)) badgeColor = 'bg-green-100 text-green-800';
                else if (['close lost', 'not interested', 'cancelled'].includes(lower)) badgeColor = 'bg-red-100 text-red-800';
                else if (['follow up', '2nd follow up', 'final follow up'].includes(lower)) badgeColor = 'bg-yellow-100 text-yellow-800';
                else if (['appointment ran'].includes(lower)) badgeColor = 'bg-purple-100 text-purple-800';
                else if (['contacted', 'first contact'].includes(lower)) badgeColor = 'bg-blue-100 text-blue-800';
            } else if (kind === 'status') {
                if (lower === 'qualified') badgeColor = 'bg-green-100 text-green-800';
                else if (lower === 'pending') badgeColor = 'bg-yellow-100 text-yellow-800';
                else if (lower === 'unqualified') badgeColor = 'bg-red-100 text-red-800';
            }
            return `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${value}</span>`;
        }

        function getContactDeliverySelections() {
            const selections = {};

                const contactId = checkbox.getAttribute('data-contact-id');

        async function savePortalFields() {
            if (!currentRecordId) return;
            const nameInput = document.getElementById('nameInput');
            const name = nameInput ? nameInput.value.trim() : fieldDisplay(currentRecord, 'Name', '');
            const statusInput = document.getElementById('statusValue');
            const rawStatus = fieldDisplay(currentRecord, 'Status', '');
            const status = statusInput ? statusInput.value : rawStatus;
            const chargingInput = document.getElementById('chargingValue');
            const chargingUi = chargingInput ? chargingInput.value : (String(currentRecord.fields.Charging || '').toLowerCase() === 'pause' ? 'Paused' : 'Active');
            const charging = chargingUi === 'Paused' ? 'Pause' : 'Charging';
            const contactSelections = getContactDeliverySelections();
            const billingContacts = Object.keys(contactSelections).filter((id) => contactSelections[id].billing);

            const fields = {
                Name: name,
                Status: status,
                Charging: charging,
                [CONFIG.billingContactsField]: billingContacts
            };

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fields })
                });
                if (!response.ok) throw new Error('Failed to save changes');
                const updated = await response.json();
                currentRecord = updated;
                await saveContactNotificationSelections(contactSelections);
                currentContacts = await fetchContactsForAccount(currentRecord);
                renderPortalCard(currentRecord);
                await loadBillingSection();
                document.querySelector('h1').textContent = `Portal Dashboard - ${currentRecord.fields.Name || 'Account'}`;
            } catch (err) {
                alert(`Error saving portal fields: ${err.message}`);
            }
        }

        async function saveContactNotificationSelections(contactSelections) {
            const updates = [];
            for (const contact of currentContacts) {
                const selection = contactSelections[contact.id] || { billing: false, newLeads: false };
                const existingNotifications = Array.isArray(contact.fields.Notifications) ? contact.fields.Notifications : [];
                const notificationsWithoutManaged = existingNotifications.filter((n) => {
                    const lower = String(n).toLowerCase();
                    return lower !== 'billing' && lower !== 'new leads';
                });
                if (selection.billing) notificationsWithoutManaged.push('Billing');
                if (selection.newLeads) notificationsWithoutManaged.push('New Leads');

                const oldNormalized = [...existingNotifications].sort().join('|');
                const newNormalized = [...notificationsWithoutManaged].sort().join('|');
                if (oldNormalized === newNormalized) continue;

                updates.push(
                    fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}/${contact.id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fields: { Notifications: notificationsWithoutManaged } })
                    })
                );
            }

            if (!updates.length) return;
            const results = await Promise.all(updates);
            const failed = results.find((res) => !res.ok);
            if (failed) {
                throw new Error('Failed to update one or more contact delivery preferences');
            }
        }

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-2" for="billingContactsSelect">Edit Billing Contacts</label>
                        <select id="billingContactsSelect" multiple class="w-full px-3 py-2 border border-gray-300 rounded-md h-48">
                            ${allContacts.map(contact => {
                                const isSelected = currentContactIds.includes(contact.id);
                                const label = `${contact.fields.Name || 'Unnamed'} - ${contact.fields.Email || 'No email'}`;
                                return `<option value="${contact.id}" ${isSelected ? 'selected' : ''}>${label}</option>`;
                            }).join('')}
                        </select>
                        <p class="mt-1 text-xs text-gray-500">Hold Ctrl/Cmd to select multiple contacts.</p>
                    </div>
                    <button onclick="saveBillingContacts()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Contacts</button>
                `;
            } catch (err) {
                content.innerHTML = `<p class="text-red-600">${err.message}</p>`;
            }
        }

        function closeBillingContactsModal() {
            document.getElementById('billingContactsModal').classList.add('hidden');
        }

        async function fetchAllContacts() {
            const contacts = [];
            let offset = null;

            do {
                let url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.contactsTableName)}`;
                if (offset) url += `?offset=${offset}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch contacts list.');
                const data = await response.json();
                contacts.push(...(data.records || []));
                offset = data.offset;
            } while (offset);

            return contacts;
        }

        async function saveBillingContacts() {
            const selectEl = document.getElementById('billingContactsSelect');
            if (!selectEl || !currentRecordId) return;
            const selectedContactIds = getMultiSelectValues(selectEl);

            try {
                const response = await fetch(`/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.tableName)}/${currentRecordId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fields: {
                            [CONFIG.billingContactsField]: selectedContactIds
                        }
                    })
                });
                if (!response.ok) throw new Error('Failed to save billing contacts');
                currentRecord = await fetchRecordById(currentRecordId);
                alert('Billing contacts updated.');
                await openBillingContactsModal();
            } catch (err) {
                alert(`Error saving billing contacts: ${err.message}`);
            }
        }

        document.getElementById('billingModal').addEventListener('click', function(e) {
            if (e.target === this) closeBillingModal();
        });

        document.getElementById('billingContactsModal').addEventListener('click', function(e) {
            if (e.target === this) closeBillingContactsModal();
        });

        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this && confirmResolver) {
                const resolve = confirmResolver;
                confirmResolver = null;
                this.classList.add('hidden');
                resolve(false);
            }
        });

        (function init() {
            const atid = getURLParameter('ATID');
            if (!atid) {
                showEmailGateError('Invalid link. Please add ?ATID=your_record_id to the URL.');
            }
        })();
    </script>
</body>
</html>
