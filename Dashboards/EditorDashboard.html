<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editing Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">Video Editing Dashboard</h1>
                        <p class="text-gray-600 mt-1" id="staffName">Loading...</p>
                    </div>
                    <button onclick="fetchAds()" id="refreshBtn" class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <div class="flex items-start gap-3">
                    <svg class="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <div>
                        <h3 class="font-semibold text-red-900 mb-1">Error</h3>
                        <p class="text-sm text-red-800" id="errorText"></p>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600">Loading your assignments...</p>
            </div>

            <!-- Ads Container -->
            <div id="adsContainer" class="hidden">
                <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                        <span class="font-semibold text-gray-700" id="adCount">0 ads assigned</span>
                    </div>
                </div>

                <!-- Ads Grid -->
                <div id="adsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Ads will be populated here -->
                </div>
            </div>

            <!-- No Ads State -->
            <div id="noAdsState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-12 h-12 text-gray-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                </svg>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">No Assignments Yet</h3>
                <p class="text-gray-600">You don't have any ads assigned at the moment. Check back later!</p>
            </div>

            <!-- Invalid Staff ID State -->
            <div id="invalidStaffState" class="bg-white rounded-lg shadow-sm p-12 text-center hidden">
                <svg class="w-12 h-12 text-red-400 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
                <h3 class="text-lg font-semibold text-gray-900 mb-2">Invalid Access</h3>
                <p class="text-gray-600">No staff ID provided in URL. Please use your unique dashboard link.</p>
            </div>
        </div>
    </div>

    <!-- Ad Detail Modal -->
    <div id="adDetailModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-10 mx-auto p-5 border w-11/12 max-w-4xl shadow-lg rounded-md bg-white mb-10">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-semibold text-gray-900">Ad Details</h3>
                <button onclick="closeAdDetailModal()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div id="adDetailContent" class="max-h-[70vh] overflow-y-auto">
                <!-- Content will be populated dynamically -->
            </div>
        </div>
    </div>

    <script>
        // Configuration - UPDATE THESE VALUES
        const CONFIG = {
            BASE_ID: 'appmBb0lzqRK9dI8v',           // Your Airtable base ID
            STAFF_TABLE: 'Staff',                   // Exact table name from Airtable
            ADS_TABLE: 'B2C Ads',                   // Exact table name from Airtable
            API_KEY: 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589'  // Your Airtable Personal Access Token
        };

        // Validate configuration on load
        function validateConfig() {
            const issues = [];
            if (CONFIG.BASE_ID === 'YOUR_BASE_ID' || !CONFIG.BASE_ID.startsWith('app')) {
                issues.push('BASE_ID needs to be set (should start with "app")');
            }
            if (CONFIG.API_KEY === 'YOUR_API_KEY' || CONFIG.API_KEY.length < 10) {
                issues.push('API_KEY needs to be set (Personal Access Token from Airtable)');
            }
            return issues;
        }

        let currentStaffId = null;
        let staffRecord = null;
        let allAds = [];

        // Get staff ID from URL parameter
        function getStaffIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('staffId') || urlParams.get('id');
        }

        // Show/hide UI states
        function showState(state) {
            const states = ['loadingState', 'adsContainer', 'noAdsState', 'invalidStaffState', 'errorMessage'];
            states.forEach(s => {
                document.getElementById(s).classList.add('hidden');
            });
            if (state) {
                document.getElementById(state).classList.remove('hidden');
            }
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.remove('hidden');
        }

        // Fetch staff record
        async function fetchStaffRecord() {
            if (!currentStaffId) {
                showState('invalidStaffState');
                return null;
            }

            try {
                // URL encode the table name in case it has spaces
                const encodedTableName = encodeURIComponent(CONFIG.STAFF_TABLE);
                const url = `https://api.airtable.com/v0/${CONFIG.BASE_ID}/${encodedTableName}/${currentStaffId}`;
                
                console.log('Fetching staff record from:', url);
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${CONFIG.API_KEY}`
                    }
                });

                if (!response.ok) {
                    const errorBody = await response.text();
                    console.error('API Response:', response.status, errorBody);
                    
                    if (response.status === 404) {
                        throw new Error(`Staff record not found. Please check:\n1. Staff ID in URL is correct\n2. BASE_ID is correct\n3. Staff table name is correct\n4. Record exists in Airtable`);
                    } else if (response.status === 401 || response.status === 403) {
                        throw new Error(`Authentication failed. Please check:\n1. API_KEY is correct\n2. API key has access to this base\n3. Using Personal Access Token (not API key)`);
                    }
                    throw new Error(`Failed to fetch staff record: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                console.log('Staff record loaded:', data);
                return data;
            } catch (error) {
                console.error('Error fetching staff record:', error);
                throw error;
            }
        }

        // Fetch ads assigned to this staff member
        async function fetchAds() {
            const refreshIcon = document.getElementById('refreshIcon');
            refreshIcon.classList.add('animate-spin');
            showState('loadingState');

            try {
                // First, get the staff record
                staffRecord = await fetchStaffRecord();
                
                if (!staffRecord) {
                    refreshIcon.classList.remove('animate-spin');
                    return;
                }

                // Update staff name in header
                const staffName = staffRecord.fields['Name'] || 'Unknown Staff';
                document.getElementById('staffName').textContent = `Welcome, ${staffName}`;

                // Get linked ad IDs from staff record
                // The field in Staff table that links to B2C Ads table
                const linkedAdIds = staffRecord.fields['B2C Ads'] || [];
                console.log('Linked ad IDs:', linkedAdIds);

                if (linkedAdIds.length === 0) {
                    showState('noAdsState');
                    refreshIcon.classList.remove('animate-spin');
                    return;
                }

                // Fetch all ads assigned to this staff member
                const encodedAdsTable = encodeURIComponent(CONFIG.ADS_TABLE);
                const adPromises = linkedAdIds.map(adId =>
                    fetch(`https://api.airtable.com/v0/${CONFIG.BASE_ID}/${encodedAdsTable}/${adId}`, {
                        headers: {
                            'Authorization': `Bearer ${CONFIG.API_KEY}`
                        }
                    }).then(res => {
                        if (!res.ok) {
                            console.error(`Failed to fetch ad ${adId}:`, res.status);
                            return null;
                        }
                        return res.json();
                    })
                );

                const adsData = await Promise.all(adPromises);
                
                // Filter out nulls and ads not "In Progress"
                allAds = adsData
                    .filter(ad => ad && ad.id)
                    .filter(ad => {
                        const status = ad.fields['Status'];
                        return status === 'In Progress';
                    });
                
                console.log('Loaded ads (filtered for In Progress):', allAds);

                // Sort by created date - newest first
                allAds.sort((a, b) => {
                    const dateA = new Date(a.fields['Created'] || 0);
                    const dateB = new Date(b.fields['Created'] || 0);
                    return dateB - dateA; // Descending order (newest first)
                });

                if (allAds.length === 0) {
                    showState('noAdsState');
                } else {
                    displayAds(allAds);
                    showState('adsContainer');
                }
                
            } catch (error) {
                console.error('Error fetching ads:', error);
                showError(error.message);
                showState(null);
            } finally {
                refreshIcon.classList.remove('animate-spin');
            }
        }

        // Display ads in grid
        function displayAds(ads) {
            const adsGrid = document.getElementById('adsGrid');
            const adCount = document.getElementById('adCount');
            
            adCount.textContent = `${ads.length} ad${ads.length !== 1 ? 's' : ''} assigned`;

            adsGrid.innerHTML = ads.map(ad => {
                const fields = ad.fields;
                const scriptId = fields['scriptATID'] || 'No ID';
                const niche = fields['Niche'] || 'No Niche';
                const script = fields['Script'] || '';
                const recordings = fields['Recordings'] || [];
                const driveUrl = fields['ElevenLabs Drive URL'] || '';
                const created = fields['Created'] || null;

                // Format created date
                let formattedCreated = 'No date';
                if (created) {
                    try {
                        const date = new Date(created);
                        if (!isNaN(date.getTime())) {
                            formattedCreated = date.toLocaleDateString('en-US', {
                                month: 'short',
                                day: 'numeric',
                                year: 'numeric',
                                hour: 'numeric',
                                minute: '2-digit',
                                hour12: true
                            });
                        }
                    } catch (e) {}
                }

                // Niche badge color
                let nicheColor = 'bg-purple-100 text-purple-800';
                if (niche.toLowerCase().includes('roofing')) {
                    nicheColor = 'bg-blue-100 text-blue-800';
                } else if (niche.toLowerCase().includes('bathroom')) {
                    nicheColor = 'bg-pink-100 text-pink-800';
                }

                // Truncate script for preview
                const scriptPreview = script.length > 150 ? script.substring(0, 150) + '...' : script;

                return `
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition-shadow">
                        <div class="p-6">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex-1">
                                    <div class="text-xs font-mono text-gray-500 mb-1">${scriptId}</div>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${nicheColor}">
                                        ${niche}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="space-y-3 mb-4">
                                <div class="flex items-center text-xs text-gray-500">
                                    <svg class="w-4 h-4 text-gray-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                    </svg>
                                    ${formattedCreated}
                                </div>

                                ${recordings.length > 0 ? `
                                    <div class="flex items-center text-sm text-gray-700">
                                        <svg class="w-4 h-4 text-green-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                                        </svg>
                                        <span class="text-xs font-medium">${recordings.length} recording${recordings.length !== 1 ? 's' : ''}</span>
                                    </div>
                                ` : ''}

                                ${driveUrl ? `
                                    <div class="bg-blue-50 rounded-lg p-3">
                                        <div class="text-xs font-semibold text-gray-700 mb-1">Voiceover Link:</div>
                                        <a href="${driveUrl}" target="_blank" class="text-sm text-blue-600 hover:text-blue-800 break-all flex items-center gap-1">
                                            <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                            </svg>
                                            Open Drive Folder
                                        </a>
                                    </div>
                                ` : ''}
                            </div>

                            ${scriptPreview ? `
                                <div class="mb-3">
                                    <div class="text-xs font-semibold text-gray-700 mb-1">Script:</div>
                                    <p class="text-sm text-gray-600 italic">${scriptPreview}</p>
                                </div>
                            ` : ''}

                            <div class="flex gap-2">
                                <button onclick="viewAdDetails('${ad.id}')" class="flex-1 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">
                                    View Full Details
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View ad details in modal
        function viewAdDetails(adId) {
            const ad = allAds.find(a => a.id === adId);
            if (!ad) return;

            const fields = ad.fields;
            const modal = document.getElementById('adDetailModal');
            const modalContent = document.getElementById('adDetailContent');

            const scriptId = fields['scriptATID'] || 'No ID';
            const niche = fields['Niche'] || 'Not specified';
            const script = fields['Script'] || 'No script provided';
            const recordings = fields['Recordings'] || [];
            const driveUrl = fields['ElevenLabs Drive URL'] || '';
            const created = fields['Created'] || null;

            // Format created date
            let formattedCreated = 'No date';
            if (created) {
                try {
                    const date = new Date(created);
                    if (!isNaN(date.getTime())) {
                        formattedCreated = date.toLocaleDateString('en-US', {
                            month: 'long',
                            day: 'numeric',
                            year: 'numeric',
                            hour: 'numeric',
                            minute: '2-digit',
                            hour12: true
                        });
                    }
                } catch (e) {}
            }

            // Niche badge color
            let nicheColor = 'bg-purple-100 text-purple-800';
            if (niche.toLowerCase().includes('roofing')) {
                nicheColor = 'bg-blue-100 text-blue-800';
            } else if (niche.toLowerCase().includes('bathroom')) {
                nicheColor = 'bg-pink-100 text-pink-800';
            }

            modalContent.innerHTML = `
                <div class="space-y-6">
                    <!-- Header -->
                    <div class="flex items-start justify-between pb-4 border-b">
                        <div>
                            <div class="text-sm font-mono text-gray-500 mb-2">${scriptId}</div>
                            <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium ${nicheColor}">
                                ${niche}
                            </span>
                        </div>
                        <div class="text-sm text-gray-500">${formattedCreated}</div>
                    </div>

                    <!-- Voiceover Link Section -->
                    ${driveUrl ? `
                        <div class="bg-blue-50 rounded-lg p-4">
                            <h4 class="text-sm font-semibold text-gray-700 mb-2 flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                                </svg>
                                Voiceover Link
                            </h4>
                            <a href="${driveUrl}" target="_blank" class="text-sm text-blue-600 hover:text-blue-800 break-all flex items-center gap-2 font-medium">
                                <span>Open Drive Folder</span>
                                <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                                </svg>
                            </a>
                        </div>
                    ` : ''}

                    <!-- Script Section -->
                    <div class="bg-gray-50 rounded-lg p-4">
                        <h4 class="text-sm font-semibold text-gray-700 mb-2 flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                            Video Script
                        </h4>
                        <p class="text-sm text-gray-700 whitespace-pre-wrap leading-relaxed">${script}</p>
                    </div>

                    <!-- Recordings Section -->
                    ${recordings.length > 0 ? `
                        <div class="bg-green-50 rounded-lg p-4">
                            <h4 class="text-sm font-semibold text-gray-700 mb-3 flex items-center">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                                </svg>
                                Voice Recordings (${recordings.length})
                            </h4>
                            <div class="space-y-2">
                                ${recordings.map((rec, index) => `
                                    <div class="text-sm text-gray-700">
                                        <span class="font-medium">Recording ${index + 1}:</span> ${rec}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : `
                        <div class="bg-gray-50 rounded-lg p-4 text-center">
                            <svg class="w-8 h-8 text-gray-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                            </svg>
                            <p class="text-sm text-gray-500">No voice recordings available</p>
                        </div>
                    `}
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function closeAdDetailModal() {
            const modal = document.getElementById('adDetailModal');
            modal.classList.add('hidden');
        }

        // Close modal when clicking outside
        document.getElementById('adDetailModal').addEventListener('click', function(e) {
            if (e.target === this) { closeAdDetailModal(); }
        });

        // Initialize dashboard
        function initializeDashboard() {
            currentStaffId = getStaffIdFromUrl();
            
            if (!currentStaffId) {
                showState('invalidStaffState');
                return;
            }

            fetchAds();
        }

        // Start the dashboard
        initializeDashboard();
    </script>
</body>
</html>
