<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Client management — Adset zips</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        details.cm-client > summary { list-style: none; }
        details.cm-client > summary::-webkit-details-marker { display: none; }
        details.cm-adset > summary { list-style: none; }
        details.cm-adset > summary::-webkit-details-marker { display: none; }
        details.cm-client[open] > summary .cm-chevron-client { transform: rotate(90deg); }
        details.cm-adset[open] > summary .cm-chevron-adset { transform: rotate(90deg); }
        .cm-chevron-client, .cm-chevron-adset { transition: transform 0.15s ease; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="max-w-3xl mx-auto p-6 sm:p-10 pb-16">
        <header class="mb-8 flex items-start gap-4">
            <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads" class="h-10 w-auto shrink-0">
            <div>
                <h1 class="text-2xl font-bold tracking-tight">Client management</h1>
                <p class="text-sm text-slate-600 mt-1">Expand a client, then an ad set. Add or remove zip links in Adset Zip Tracking.</p>
            </div>
        </header>

        <div id="globalStatus" class="hidden mb-4 rounded-lg border p-3 text-sm"></div>

        <div id="clientTreeHost" class="space-y-2">
            <div class="rounded-xl border border-slate-200 bg-white p-8 text-center text-slate-500 text-sm">Loading…</div>
        </div>

        <p class="mt-8 text-xs text-slate-500">
            <code class="bg-slate-100 px-1 rounded">CONFIG</code>: US Zips <strong>Zip</strong>; junction writes use <strong>Adset</strong> / <strong>US Zips</strong>. Reads also use <strong>ADSET_JUNCTION_LINK_FIELDS</strong> (reverse link on the Ad set).
        </p>
    </div>

    <script>
        const CONFIG = {
            BASE_ID: 'appmBb0lzqRK9dI8v',
            CLIENT_TABLE: 'tblH2nVfmGNG8pAjC',
            ADSET_TABLE: 'tblee61crNCoSfurx',
            ADSET_ZIPS_TABLE: 'tbl87JqHAdJwgq1GL',
            US_ZIPS_TABLE: 'tblieaHIf6rDfFZFl',

            CLIENT_NAME_FIELD: 'Name',
            CLIENT_ADSET_FIELDS: ['Adsets'],

            /** Writing new junction rows — must match your junction table */
            JUNCTION_ADSET_FIELD: 'Adset',
            JUNCTION_ZIP_FIELD: 'US Zips',

            /**
             * Reading links: Adset record often has a reverse link to the junction (e.g. “Adset Zip Tracking”).
             * Tried first — finds rows even if the junction’s Adset column wasn’t back-filled.
             */
            ADSET_JUNCTION_LINK_FIELDS: ['Adset Zip Tracking', 'Ad Set Zip Tracking'],

            /** If no reverse link: filter junction with {Field}=adsetId — try each name */
            JUNCTION_ADSET_FILTER_FIELDS: ['Adset', 'Ad Set', 'Adsets'],

            /** Which junction column points at US Zips (try in order when reading) */
            JUNCTION_ZIP_LINK_FIELDS: ['US Zips', 'Zip'],

            US_ZIPS_MATCH_FIELD: 'Zip',
            US_ZIPS_MATCH_AS_NUMBER: true,
            US_ZIPS_MATCH_FIELD_CANDIDATES: [],
        };

        const BUILTIN_ZIP_FIELD_CANDIDATES = [
            'ZIP', 'Zip', 'zip', 'Name', 'ZCTA', 'Zcta', 'GEOID', 'Zip Code', 'ZIP Code',
        ];

        let usZipsMatchField = null;
        let usZipsMatchAsNumber = false;

        /** @type {Map<string, string>} zip record id → display code (5 digits) */
        const zipRecordIdToCode = new Map();

        const airtableUrl = (table) =>
            `/api/airtable/v0/${CONFIG.BASE_ID}/${encodeURIComponent(table)}`;

        function airtableStringForFormula(s) {
            return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
        }

        async function fetchJson(url, options) {
            const res = await fetch(url, options);
            const text = await res.text();
            let data;
            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                throw new Error(text || `Invalid JSON (${res.status})`);
            }
            if (!res.ok) {
                throw new Error(data.error?.message || data.error || text || `Request failed (${res.status})`);
            }
            return data;
        }

        async function fetchAllRecords(table, params = {}) {
            const records = [];
            let offset = null;
            do {
                const u = new URL(airtableUrl(table), window.location.origin);
                if (params.formula) u.searchParams.set('filterByFormula', params.formula);
                if (offset) u.searchParams.set('offset', offset);
                if (params.fields) {
                    for (const f of params.fields) u.searchParams.append('fields[]', f);
                }
                const data = await fetchJson(u.toString());
                records.push(...(data.records || []));
                offset = data.offset || null;
            } while (offset);
            return records;
        }

        function getClientAdsetIds(fields) {
            const ids = new Set();
            for (const fname of CONFIG.CLIENT_ADSET_FIELDS) {
                const v = fields[fname];
                if (!v) continue;
                if (Array.isArray(v)) v.forEach((id) => ids.add(id));
                else ids.add(v);
            }
            return [...ids];
        }

        function adsetLabel(fields) {
            if (!fields) return 'Ad set';
            return (
                fields['Name'] ||
                fields['Adset Name'] ||
                (fields['Adset ID'] != null ? String(fields['Adset ID']) : '') ||
                'Ad set'
            );
        }

        function parseZipInput(raw) {
            if (!raw || !String(raw).trim()) return [];
            const parts = String(raw)
                .split(/[\s,;\n\r]+/)
                .map((z) => z.trim())
                .filter(Boolean);
            const out = [];
            const seen = new Set();
            for (const p of parts) {
                const m = p.match(/\d{5}/);
                if (!m) continue;
                const five = m[0];
                if (seen.has(five)) continue;
                seen.add(five);
                out.push(five);
            }
            return out;
        }

        function zipMatchFormula(fiveDigit) {
            if (!usZipsMatchField) throw new Error('Zip match field not ready.');
            const n = parseInt(fiveDigit, 10);
            if (usZipsMatchAsNumber) return `{${usZipsMatchField}}=${n}`;
            const z = airtableStringForFormula(fiveDigit);
            return `{${usZipsMatchField}}="${z}"`;
        }

        async function resolveUsZipsMatchField() {
            const data = await fetchJson(`${airtableUrl(CONFIG.US_ZIPS_TABLE)}?maxRecords=1`);
            const rec = data.records && data.records[0];
            if (!rec) {
                throw new Error('US Zips table has no rows. Check CONFIG.US_ZIPS_TABLE.');
            }
            const fields = rec.fields || {};
            const keys = Object.keys(fields);
            const preferred = (CONFIG.US_ZIPS_MATCH_FIELD || '').trim();

            if (preferred) {
                if (!keys.includes(preferred)) {
                    throw new Error(`US Zips has no field "${preferred}".`);
                }
                usZipsMatchField = preferred;
                if (typeof CONFIG.US_ZIPS_MATCH_AS_NUMBER === 'boolean') {
                    usZipsMatchAsNumber = CONFIG.US_ZIPS_MATCH_AS_NUMBER;
                } else {
                    usZipsMatchAsNumber = typeof fields[preferred] === 'number';
                }
                return;
            }

            const tryOrder = [...(CONFIG.US_ZIPS_MATCH_FIELD_CANDIDATES || []), ...BUILTIN_ZIP_FIELD_CANDIDATES];
            usZipsMatchField = null;
            usZipsMatchAsNumber = false;
            for (const c of tryOrder) {
                if (c && keys.includes(c)) {
                    usZipsMatchField = c;
                    break;
                }
            }
            if (!usZipsMatchField) {
                for (const k of keys) {
                    const v = fields[k];
                    if (typeof v === 'number' && Number.isFinite(v) && v >= 10000 && v <= 99999) {
                        usZipsMatchField = k;
                        usZipsMatchAsNumber = true;
                        break;
                    }
                    if (typeof v === 'string' && /^\d{5}$/.test(v.trim())) {
                        usZipsMatchField = k;
                        usZipsMatchAsNumber = false;
                        break;
                    }
                }
            }
            if (!usZipsMatchField) {
                throw new Error('Set CONFIG.US_ZIPS_MATCH_FIELD.');
            }
            if (typeof fields[usZipsMatchField] === 'number') usZipsMatchAsNumber = true;
        }

        async function findZipRecordId(fiveDigit) {
            const formula = encodeURIComponent(zipMatchFormula(fiveDigit));
            const url = `${airtableUrl(CONFIG.US_ZIPS_TABLE)}?maxRecords=1&filterByFormula=${formula}`;
            const data = await fetchJson(url);
            const rec = data.records && data.records[0];
            return rec ? rec.id : null;
        }

        async function getZipCodeForRecordId(zipRecordId) {
            if (zipRecordIdToCode.has(zipRecordId)) return zipRecordIdToCode.get(zipRecordId);
            const url = `${airtableUrl(CONFIG.US_ZIPS_TABLE)}/${encodeURIComponent(zipRecordId)}`;
            const data = await fetchJson(url);
            const raw = data.fields && data.fields[usZipsMatchField];
            let s;
            if (typeof raw === 'number') s = String(Math.floor(raw)).padStart(5, '0');
            else if (raw != null) s = String(raw).trim().replace(/\D/g, '').slice(0, 5).padStart(5, '0');
            else s = zipRecordId;
            zipRecordIdToCode.set(zipRecordId, s);
            return s;
        }

        function normalizeLinkIds(v) {
            if (!v) return [];
            return Array.isArray(v) ? v : [v];
        }

        function zipRecordIdFromJunctionFields(fields) {
            const keys = CONFIG.JUNCTION_ZIP_LINK_FIELDS || [CONFIG.JUNCTION_ZIP_FIELD];
            for (const k of keys) {
                const z = fields[k];
                const id = Array.isArray(z) ? z[0] : z;
                if (id && typeof id === 'string' && id.startsWith('rec')) return id;
            }
            return null;
        }

        function mapJunctionRecordsToRows(records) {
            return records
                .map((r) => {
                    const zipId = zipRecordIdFromJunctionFields(r.fields || {});
                    return zipId ? { junctionId: r.id, zipRecordId: zipId } : null;
                })
                .filter(Boolean);
        }

        async function loadJunctionRowsByJunctionIds(junctionIds) {
            const rows = [];
            for (const jid of junctionIds) {
                try {
                    const data = await fetchJson(
                        `${airtableUrl(CONFIG.ADSET_ZIPS_TABLE)}/${encodeURIComponent(jid)}`
                    );
                    const zipId = zipRecordIdFromJunctionFields(data.fields || {});
                    if (zipId) rows.push({ junctionId: data.id, zipRecordId: zipId });
                } catch (e) {
                    console.warn('Junction row fetch failed', jid, e);
                }
            }
            return rows;
        }

        function junctionFieldsReferenceAdset(fields, adsetId) {
            if (!fields) return false;
            for (const k of Object.keys(fields)) {
                const v = fields[k];
                if (Array.isArray(v)) {
                    if (v.includes(adsetId)) return true;
                } else if (v === adsetId) {
                    return true;
                }
            }
            return false;
        }

        /**
         * Finds junction rows for an ad set: reverse link on Adset → filter/FIND on junction → full scan fallback.
         */
        async function fetchJunctionRowsForAdset(adsetId) {
            let adsetRecord = null;
            try {
                adsetRecord = await fetchJson(
                    `${airtableUrl(CONFIG.ADSET_TABLE)}/${encodeURIComponent(adsetId)}`
                );
            } catch (e) {
                console.warn('Could not load ad set for link discovery', e);
            }

            if (adsetRecord && adsetRecord.fields) {
                for (const linkField of CONFIG.ADSET_JUNCTION_LINK_FIELDS || []) {
                    const juncIds = normalizeLinkIds(adsetRecord.fields[linkField]);
                    if (juncIds.length > 0) {
                        const rows = await loadJunctionRowsByJunctionIds(juncIds);
                        if (rows.length > 0) return rows;
                    }
                }
            }

            const adsetFieldNames = CONFIG.JUNCTION_ADSET_FILTER_FIELDS || [CONFIG.JUNCTION_ADSET_FIELD];
            const zipFields = [...(CONFIG.JUNCTION_ZIP_LINK_FIELDS || []), CONFIG.JUNCTION_ZIP_FIELD].filter(
                (x, i, a) => x && a.indexOf(x) === i
            );

            for (const af of adsetFieldNames) {
                try {
                    const records = await fetchAllRecords(CONFIG.ADSET_ZIPS_TABLE, {
                        formula: `{${af}}="${adsetId}"`,
                        fields: zipFields,
                    });
                    const mapped = mapJunctionRecordsToRows(records);
                    if (mapped.length > 0) return mapped;
                } catch (e) {
                    /* unknown field name in formula */
                }
            }

            const esc = airtableStringForFormula(adsetId);
            for (const af of adsetFieldNames) {
                try {
                    const records = await fetchAllRecords(CONFIG.ADSET_ZIPS_TABLE, {
                        formula: `FIND("${esc}", ARRAYJOIN({${af}}))`,
                        fields: zipFields,
                    });
                    const mapped = mapJunctionRecordsToRows(records);
                    if (mapped.length > 0) return mapped;
                } catch (e) {
                    /* invalid formula for this field type */
                }
            }

            const all = await fetchAllRecords(CONFIG.ADSET_ZIPS_TABLE);
            const scanned = [];
            for (const r of all) {
                if (!junctionFieldsReferenceAdset(r.fields, adsetId)) continue;
                const zipId = zipRecordIdFromJunctionFields(r.fields);
                if (zipId) scanned.push({ junctionId: r.id, zipRecordId: zipId });
            }
            return scanned;
        }

        async function commaSeparatedZipsForAdset(adsetId) {
            const rows = await fetchJunctionRowsForAdset(adsetId);
            if (rows.length === 0) return '';
            const codes = await Promise.all(rows.map((r) => getZipCodeForRecordId(r.zipRecordId)));
            codes.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            return codes.join(', ');
        }

        async function createJunctionRows(adsetId, zipRecordIds) {
            const fieldAdset = CONFIG.JUNCTION_ADSET_FIELD;
            const fieldZip = CONFIG.JUNCTION_ZIP_FIELD;
            const batchSize = 10;
            for (let i = 0; i < zipRecordIds.length; i += batchSize) {
                const chunk = zipRecordIds.slice(i, i + batchSize);
                const body = {
                    records: chunk.map((zipRecId) => ({
                        fields: {
                            [fieldAdset]: [adsetId],
                            [fieldZip]: [zipRecId],
                        },
                    })),
                };
                await fetchJson(airtableUrl(CONFIG.ADSET_ZIPS_TABLE), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                    body: JSON.stringify(body),
                });
            }
        }

        async function deleteJunctionRecord(junctionRecordId) {
            const url = `${airtableUrl(CONFIG.ADSET_ZIPS_TABLE)}/${encodeURIComponent(junctionRecordId)}`;
            await fetchJson(url, { method: 'DELETE', headers: { Accept: 'application/json' } });
        }

        let clientRecords = [];
        const adsetById = new Map();

        async function loadAdsets() {
            const records = await fetchAllRecords(CONFIG.ADSET_TABLE);
            adsetById.clear();
            for (const r of records) adsetById.set(r.id, r);
        }

        async function loadClients() {
            clientRecords = await fetchAllRecords(CONFIG.CLIENT_TABLE, {
                fields: [CONFIG.CLIENT_NAME_FIELD, ...CONFIG.CLIENT_ADSET_FIELDS],
            });
            clientRecords.sort((a, b) => {
                const na = (a.fields[CONFIG.CLIENT_NAME_FIELD] || '').toString();
                const nb = (b.fields[CONFIG.CLIENT_NAME_FIELD] || '').toString();
                return na.localeCompare(nb, undefined, { sensitivity: 'base' });
            });
        }

        function setGlobalStatus(type, message) {
            const el = document.getElementById('globalStatus');
            el.classList.remove('hidden', 'border-green-200', 'bg-green-50', 'text-green-900', 'border-red-200', 'bg-red-50', 'text-red-900', 'border-slate-200', 'bg-slate-50', 'text-slate-800');
            if (type === 'ok') el.classList.add('border-green-200', 'bg-green-50', 'text-green-900');
            else if (type === 'err') el.classList.add('border-red-200', 'bg-red-50', 'text-red-900');
            else el.classList.add('border-slate-200', 'bg-slate-50', 'text-slate-800');
            el.textContent = message;
            el.classList.remove('hidden');
        }

        function renderClientTree() {
            const host = document.getElementById('clientTreeHost');
            host.innerHTML = '';

            if (clientRecords.length === 0) {
                host.innerHTML = '<div class="rounded-xl border border-slate-200 bg-white p-8 text-center text-slate-500 text-sm">No clients found.</div>';
                return;
            }

            for (const client of clientRecords) {
                const cname = client.fields[CONFIG.CLIENT_NAME_FIELD] || '(unnamed)';
                const adsetIds = getClientAdsetIds(client.fields);

                const details = document.createElement('details');
                details.className = 'cm-client group rounded-xl border border-slate-200 bg-white shadow-sm';

                const summary = document.createElement('summary');
                summary.className =
                    'flex cursor-pointer select-none items-center gap-2 px-4 py-3 text-left text-base font-semibold text-slate-900 hover:bg-slate-50 rounded-xl';
                summary.innerHTML = `<span class="inline-block w-4 text-slate-400 cm-chevron-client">▸</span><span class="flex-1">${escapeHtml(cname)}</span><span class="text-xs font-normal text-slate-500">${adsetIds.length} ad set${adsetIds.length !== 1 ? 's' : ''}</span>`;

                const body = document.createElement('div');
                body.className = 'border-t border-slate-100 px-3 pb-3 pt-1 space-y-1';

                if (adsetIds.length === 0) {
                    body.innerHTML = '<p class="px-2 py-2 text-sm text-slate-500">No ad sets linked on this client.</p>';
                } else {
                    for (const aid of adsetIds) {
                        const ar = adsetById.get(aid);
                        const label = ar ? adsetLabel(ar.fields) : aid;

                        const adDetails = document.createElement('details');
                        adDetails.className = 'cm-adset rounded-lg border border-slate-100 bg-slate-50/80';
                        adDetails.dataset.adsetId = aid;

                        const adSum = document.createElement('summary');
                        adSum.className =
                            'flex cursor-pointer select-none items-center gap-2 px-3 py-2.5 text-sm font-medium text-slate-800 hover:bg-slate-100/80 rounded-lg';
                        adSum.innerHTML = `<span class="inline-block w-3.5 text-slate-400 text-xs cm-chevron-adset">▸</span><span class="flex-1">${escapeHtml(label)}</span>`;

                        const adPanel = document.createElement('div');
                        adPanel.className = 'border-t border-slate-200/80 p-3 space-y-3 bg-white rounded-b-lg';
                        adPanel.innerHTML = `
                            <div>
                                <p class="text-xs font-medium text-slate-600 mb-1">Linked zips</p>
                                <p class="text-sm text-slate-700 font-mono leading-relaxed min-h-[1.25rem] break-words" data-role="zip-line">—</p>
                            </div>
                            <div>
                                <label class="text-xs font-medium text-slate-600">Paste zips to add or remove</label>
                                <textarea rows="3" placeholder="Comma or line-separated 5-digit zips"
                                    class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm font-mono focus:ring-2 focus:ring-amber-500 focus:border-transparent" data-role="zip-input"></textarea>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button type="button" data-action="add" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700 disabled:opacity-50">Add Zips</button>
                                <button type="button" data-action="remove" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700 disabled:opacity-50">Remove Zips</button>
                            </div>
                        `;

                        adDetails.appendChild(adSum);
                        adDetails.appendChild(adPanel);

                        adDetails.addEventListener('toggle', () => {
                            if (adDetails.open) refreshAdsetPanel(adDetails);
                        });

                        const btnAdd = adPanel.querySelector('[data-action="add"]');
                        const btnRemove = adPanel.querySelector('[data-action="remove"]');
                        btnAdd.addEventListener('click', () => onAddZips(adDetails));
                        btnRemove.addEventListener('click', () => onRemoveZips(adDetails));

                        body.appendChild(adDetails);
                    }
                }

                details.appendChild(summary);
                details.appendChild(body);
                host.appendChild(details);
            }
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function refreshAdsetPanel(adDetails) {
            const adsetId = adDetails.dataset.adsetId;
            const zipLine = adDetails.querySelector('[data-role="zip-line"]');
            zipLine.textContent = 'Loading…';
            try {
                const line = await commaSeparatedZipsForAdset(adsetId);
                zipLine.textContent = line || '(none)';
            } catch (e) {
                console.error(e);
                zipLine.textContent = 'Error loading zips.';
            }
        }

        async function onAddZips(adDetails) {
            const adsetId = adDetails.dataset.adsetId;
            const input = adDetails.querySelector('[data-role="zip-input"]');
            const raw = input.value;
            const zips = parseZipInput(raw);
            if (zips.length === 0) {
                setGlobalStatus('err', 'Enter at least one valid 5-digit zip.');
                return;
            }

            const btnAdd = adDetails.querySelector('[data-action="add"]');
            const btnRemove = adDetails.querySelector('[data-action="remove"]');
            btnAdd.disabled = true;
            btnRemove.disabled = true;
            setGlobalStatus('info', 'Adding zips…');

            try {
                const existingRows = await fetchJunctionRowsForAdset(adsetId);
                const existingZipIds = new Set(existingRows.map((r) => r.zipRecordId));

                const notFound = [];
                const duplicate = [];
                const toCreate = [];

                for (const five of zips) {
                    const zipRecId = await findZipRecordId(five);
                    if (!zipRecId) {
                        notFound.push(five);
                        continue;
                    }
                    if (existingZipIds.has(zipRecId)) {
                        duplicate.push(five);
                        continue;
                    }
                    toCreate.push(zipRecId);
                    existingZipIds.add(zipRecId);
                }

                if (toCreate.length > 0) await createJunctionRows(adsetId, toCreate);

                const parts = [`Added ${toCreate.length} link${toCreate.length !== 1 ? 's' : ''}.`];
                if (duplicate.length) parts.push(`Skipped ${duplicate.length} already linked: ${duplicate.join(', ')}.`);
                if (notFound.length) parts.push(`No US Zips row for: ${notFound.join(', ')}.`);

                setGlobalStatus(
                    notFound.length && toCreate.length === 0 && duplicate.length === 0 ? 'err' : 'ok',
                    parts.join(' ')
                );

                if (toCreate.length > 0) input.value = '';
                await refreshAdsetPanel(adDetails);
            } catch (e) {
                console.error(e);
                setGlobalStatus('err', e.message || String(e));
            } finally {
                btnAdd.disabled = false;
                btnRemove.disabled = false;
            }
        }

        async function onRemoveZips(adDetails) {
            const adsetId = adDetails.dataset.adsetId;
            const input = adDetails.querySelector('[data-role="zip-input"]');
            const raw = input.value;
            const zips = parseZipInput(raw);
            if (zips.length === 0) {
                setGlobalStatus('err', 'Enter at least one valid 5-digit zip to remove.');
                return;
            }

            const btnAdd = adDetails.querySelector('[data-action="add"]');
            const btnRemove = adDetails.querySelector('[data-action="remove"]');
            btnAdd.disabled = true;
            btnRemove.disabled = true;
            setGlobalStatus('info', 'Removing links…');

            try {
                const rows = await fetchJunctionRowsForAdset(adsetId);
                const zipIdToJunction = new Map();
                for (const r of rows) zipIdToJunction.set(r.zipRecordId, r.junctionId);

                const notFound = [];
                const notLinked = [];
                const toDelete = [];

                for (const five of zips) {
                    const zipRecId = await findZipRecordId(five);
                    if (!zipRecId) {
                        notFound.push(five);
                        continue;
                    }
                    const jId = zipIdToJunction.get(zipRecId);
                    if (!jId) {
                        notLinked.push(five);
                        continue;
                    }
                    toDelete.push({ five, junctionId: jId });
                }

                for (const { junctionId } of toDelete) {
                    await deleteJunctionRecord(junctionId);
                }

                const parts = [`Removed ${toDelete.length} link${toDelete.length !== 1 ? 's' : ''}.`];
                if (notLinked.length) parts.push(`Not linked for this ad set: ${notLinked.join(', ')}.`);
                if (notFound.length) parts.push(`No US Zips row for: ${notFound.join(', ')}.`);

                setGlobalStatus(
                    toDelete.length === 0 && (notFound.length || notLinked.length) ? 'err' : 'ok',
                    parts.join(' ')
                );

                if (toDelete.length > 0) input.value = '';
                await refreshAdsetPanel(adDetails);
            } catch (e) {
                console.error(e);
                setGlobalStatus('err', e.message || String(e));
            } finally {
                btnAdd.disabled = false;
                btnRemove.disabled = false;
            }
        }

        async function init() {
            const host = document.getElementById('clientTreeHost');
            try {
                await Promise.all([loadClients(), loadAdsets()]);
                await resolveUsZipsMatchField();
                renderClientTree();
            } catch (e) {
                console.error(e);
                host.innerHTML = `<div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-900">Could not load: ${escapeHtml(e.message || String(e))}</div>`;
            }
        }

        init();
    </script>
</body>
</html>
