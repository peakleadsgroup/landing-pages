<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <title>Five Star Bath Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
        .pay-details > summary {
            list-style: none;
        }
        .pay-details > summary::-webkit-details-marker {
            display: none;
        }
        .pay-details[open] > summary .pay-chevron {
            transform: rotate(90deg);
        }
        .section-fold > summary {
            list-style: none;
        }
        .section-fold > summary::-webkit-details-marker {
            display: none;
        }
        .section-fold[open] > summary .section-fold-chevron {
            transform: rotate(90deg);
        }
        .lead-month-details > summary {
            list-style: none;
        }
        .lead-month-details > summary::-webkit-details-marker {
            display: none;
        }
        .lead-month-details[open] > summary .lead-month-chevron {
            transform: rotate(90deg);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div id="emailGate" class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full border border-slate-200">
            <div class="text-center mb-6">
                <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads" class="h-10 w-auto mx-auto mb-4">
                <h2 class="text-xl font-semibold text-slate-900 mb-2">Five Star Bath Solutions</h2>
                <p class="text-slate-600 text-sm">Enter your authorized email to view client data.</p>
            </div>
            <form id="emailGateForm" class="space-y-4">
                <div>
                    <label for="emailInput" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="emailInput" required autocomplete="email" placeholder="you@fivestarbathsolutions.com" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent">
                </div>
                <div id="emailGateError" class="hidden text-sm text-red-600"></div>
                <button type="submit" id="emailGateSubmit" class="w-full px-4 py-3 bg-slate-900 text-white rounded-lg hover:bg-slate-800 font-medium transition-colors">
                    Continue
                </button>
            </form>
        </div>
    </div>

    <div id="dashboardRoot" class="hidden min-h-screen p-4 sm:p-8">
        <div class="max-w-5xl mx-auto">
            <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
                <div class="flex items-center gap-4">
                    <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads" class="h-10 w-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Five Star Bath Solutions</h1>
                        <p class="text-sm text-slate-600">Clients, contacts, payments, and lead spend by month</p>
                    </div>
                </div>
                <button type="button" id="signOutBtn" class="text-sm text-slate-600 hover:text-slate-900 underline self-start sm:self-center">Sign out</button>
            </header>

            <div id="dashError" class="hidden mb-6 rounded-lg border border-red-200 bg-red-50 p-4 text-sm text-red-800"></div>
            <div id="dashLoading" class="rounded-xl border border-slate-200 bg-white p-12 text-center text-slate-600">
                <svg class="w-8 h-8 text-amber-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Loading clients…
            </div>
            <div id="accordionHost" class="hidden space-y-3"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'fivestar_dashboard_email';
        const BASE_ID = 'appmBb0lzqRK9dI8v';
        const AIRTABLE = (path) => `/api/airtable/v0/${BASE_ID}/${path}`;

        const TABLES = {
            CLIENTS: 'Clients',
            CONTACTS: 'Contacts',
            B2C_LEADS: 'B2C Leads',
            CUSTOMERS: 'Customers',
            CHARGES: 'Charges'
        };

        const LINKED_CLIENT_FIELD = 'Linked Client';
        const CLIENT_CONTACTS_FIELD = 'Contacts';
        const STRIPE_CUSTOMER_FIELD = 'Stripe Customer';
        const CLIENT_NAME_FIELD = 'Name';
        const FIELD_TBC_LEAD_MODEL = 'TBC Lead Model';
        const QUALIFIED_STATUS = 'Qualified';

        const ALLOWED_EMAILS = new Set([
            'giselle@fivestarbathsolutions.com',
            'braxtonn@fivestarbathsolutions.com',
            'evan.miller@fivestarbathsolutions.com'
        ]);

        const CLIENT_RECORD_IDS = [
            'recvDE30jZibFc4UE',
            'recmtoPCEKAzOzrRe',
            'reckL5Iuka5gMbnmX',
            'recZlTr6M0c3MFvY4',
            'recx8QNwXOtbtM8tL',
            'recyDXkWA8S8VV12p'
        ];

        const CONTACT_DISPLAY_ORDER = ['Name', 'Email', 'Phone', 'Company', 'Title', 'Role', 'Notifications'];
        const loadedPanels = new Map();

        function normalizeEmail(s) {
            return String(s || '').trim().toLowerCase();
        }

        function airtableStringForFormula(s) {
            return String(s).replace(/"/g, '""');
        }

        async function fetchJson(url) {
            const res = await fetch(url);
            if (!res.ok) {
                const t = await res.text();
                throw new Error(t || `Request failed (${res.status})`);
            }
            return res.json();
        }

        async function fetchAllLeadsForClient(clientRecord) {
            const clientName = clientRecord.fields[CLIENT_NAME_FIELD];
            if (!clientName) return [];
            const formula = `FIND("${airtableStringForFormula(clientName)}", ARRAYJOIN({${LINKED_CLIENT_FIELD}}))`;
            const records = [];
            let offset = null;
            do {
                let url = AIRTABLE(encodeURIComponent(TABLES.B2C_LEADS)) +
                    `?filterByFormula=${encodeURIComponent(formula)}`;
                if (offset) url += `&offset=${offset}`;
                const data = await fetchJson(url);
                records.push(...(data.records || []));
                offset = data.offset || null;
            } while (offset);
            const cid = clientRecord.id;
            return records.filter((r) => {
                const links = r.fields[LINKED_CLIENT_FIELD];
                return Array.isArray(links) && links.includes(cid);
            });
        }

        function parseMoney(val) {
            if (val == null || val === '') return 0;
            const n = Number(String(val).replace(/[\$,]/g, ''));
            return Number.isFinite(n) ? n : 0;
        }

        function monthKeyFromCreated(createdVal) {
            if (!createdVal) return null;
            const d = new Date(createdVal);
            if (isNaN(d.getTime())) return null;
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            return `${y}-${m}`;
        }

        function formatMonthLabel(key) {
            if (!key) return '—';
            const [y, m] = key.split('-').map(Number);
            const d = new Date(y, m - 1, 1);
            return d.toLocaleString('en-US', { month: 'long', year: 'numeric' });
        }

        function formatCurrency(n) {
            return `$${Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        /** Charges: line amount = Price × Number. Uses Number only when it’s a positive quantity; otherwise 1 (e.g. invoice text). */
        function parseChargeNumber(val) {
            if (val == null || val === '') return 1;
            if (typeof val === 'number' && Number.isFinite(val) && val > 0) return val;
            const n = Number(String(val).trim().replace(/,/g, ''));
            if (Number.isFinite(n) && n > 0) return n;
            return 1;
        }

        function chargeLineTotal(fields) {
            const price = parseMoney(fields['Price']);
            const qty = parseChargeNumber(fields['Number']);
            return price * qty;
        }

        /** Sum of Charges "Number" (quantity billed per payment). Non-numeric / empty counts as 0. */
        function parseChargeNumberForSum(val) {
            if (val == null || val === '') return 0;
            if (typeof val === 'number' && Number.isFinite(val) && val >= 0) return val;
            const n = Number(String(val).trim().replace(/,/g, ''));
            return Number.isFinite(n) && n >= 0 ? n : 0;
        }

        function sumChargeNumbersForLeadsBilled(charges) {
            if (!charges || !charges.length) return 0;
            let sum = 0;
            for (const ch of charges) {
                sum += parseChargeNumberForSum(ch.fields && ch.fields['Number']);
            }
            return Math.round(sum);
        }

        function formatContactFieldValue(v) {
            if (v == null) return '—';
            if (Array.isArray(v)) return v.length ? escapeHtml(v.map((x) => String(x)).join(', ')) : '—';
            if (typeof v === 'object') return escapeHtml(JSON.stringify(v));
            return escapeHtml(String(v));
        }

        async function fetchChargeWithRetry(chargeId, retries = 3) {
            for (let attempt = 0; attempt < retries; attempt++) {
                try {
                    const response = await fetch(AIRTABLE(encodeURIComponent(TABLES.CHARGES)) + `/${chargeId}`);
                    if (response.status === 429) {
                        const wait = Math.min(1000 * Math.pow(2, attempt), 10000);
                        if (attempt < retries - 1) await new Promise((r) => setTimeout(r, wait));
                        else return null;
                        continue;
                    }
                    if (!response.ok) return null;
                    const data = await response.json();
                    return data && data.fields ? data : null;
                } catch {
                    if (attempt < retries - 1) {
                        await new Promise((r) => setTimeout(r, Math.min(1000 * Math.pow(2, attempt), 5000)));
                    } else return null;
                }
            }
            return null;
        }

        async function loadPaymentsForClient(clientRecord) {
            const stripeLinks = clientRecord.fields[STRIPE_CUSTOMER_FIELD];
            if (!stripeLinks || !stripeLinks.length) {
                return { html: '<p class="text-sm text-slate-500">No Stripe customer linked to this client.</p>', charges: [] };
            }

            const stripeId = stripeLinks[0];
            const stripeRes = await fetch(AIRTABLE(encodeURIComponent(TABLES.CUSTOMERS)) + `/${stripeId}`);
            if (!stripeRes.ok) {
                return { html: '<p class="text-sm text-red-600">Could not load billing customer record.</p>', charges: [] };
            }
            const stripeData = await stripeRes.json();
            const customerName = stripeData.fields['Name'] || 'Customer';
            const paymentLinks = stripeData.fields['Payments'] || [];

            if (!paymentLinks.length) {
                return {
                    html: `
                        <div class="space-y-4">
                            <div class="rounded-lg bg-slate-50 p-4 border border-slate-100">
                                <div class="text-xs text-slate-500 uppercase tracking-wide">Stripe customer</div>
                                <div class="font-semibold text-slate-900">${escapeHtml(customerName)}</div>
                                <div class="text-sm text-slate-600 mt-2">Total amount charged: <span class="font-medium text-slate-900">${formatCurrency(0)}</span></div>
                            </div>
                            <p class="text-sm text-slate-500">No individual payment records linked.</p>
                        </div>`,
                    charges: []
                };
            }

            const validCharges = [];
            for (let i = 0; i < paymentLinks.length; i++) {
                const ch = await fetchChargeWithRetry(paymentLinks[i]);
                if (ch) validCharges.push(ch);
                if (i < paymentLinks.length - 1) await new Promise((r) => setTimeout(r, 200));
            }

            validCharges.sort((a, b) => {
                const da = new Date(a.fields['Created'] || 0);
                const db = new Date(b.fields['Created'] || 0);
                return db - da;
            });

            if (!validCharges.length) {
                return {
                    html: '<p class="text-sm text-slate-500">Payment links exist but charge details could not be loaded.</p>',
                    charges: []
                };
            }

            function chargeTableRow(charge) {
                const model = escapeHtml(String(charge.fields['Model'] || ''));
                const created = charge.fields['Created'] || '';
                let formattedCreated = escapeHtml(String(created));
                if (created) {
                    const date = new Date(created);
                    if (!isNaN(date.getTime())) {
                        formattedCreated = escapeHtml(
                            date.toLocaleString('en-US', {
                                month: 'short',
                                day: 'numeric',
                                year: 'numeric',
                                hour: 'numeric',
                                minute: '2-digit',
                                hour12: true
                            })
                        );
                    }
                }
                const status = String(charge.fields['Status'] || '');
                const price = formatCurrency(parseMoney(charge.fields['Price']));
                const number = escapeHtml(String(charge.fields['Number'] || ''));
                let statusHtml = escapeHtml(status);
                if (status) {
                    const sl = status.toLowerCase();
                    let cls = 'bg-slate-100 text-slate-800';
                    if (sl === 'succeeded' || sl === 'paid') cls = 'bg-emerald-100 text-emerald-800';
                    else if (sl === 'pending') cls = 'bg-amber-100 text-amber-800';
                    else if (sl === 'failed' || sl === 'declined') cls = 'bg-red-100 text-red-800';
                    statusHtml = `<span class="inline-flex px-2 py-0.5 rounded-full text-xs font-medium ${cls}">${escapeHtml(status)}</span>`;
                }
                return `<tr class="border-t border-slate-200">
                    <td class="px-3 py-2 text-sm">${model}</td>
                    <td class="px-3 py-2 text-sm text-slate-600">${formattedCreated}</td>
                    <td class="px-3 py-2 text-sm">${statusHtml}</td>
                    <td class="px-3 py-2 text-sm font-medium">${price}</td>
                    <td class="px-3 py-2 text-sm text-slate-600">${number}</td>
                </tr>`;
            }

            let grandTotal = 0;
            const byMonth = new Map();
            for (const charge of validCharges) {
                const line = chargeLineTotal(charge.fields);
                grandTotal += line;
                const key = monthKeyFromCreated(charge.fields['Created']) || '_unknown';
                if (!byMonth.has(key)) byMonth.set(key, { charges: [], total: 0 });
                const bucket = byMonth.get(key);
                bucket.charges.push(charge);
                bucket.total += line;
            }
            const totalFmt = formatCurrency(grandTotal);

            const monthKeys = [...byMonth.keys()].sort((a, b) => {
                if (a === '_unknown') return 1;
                if (b === '_unknown') return -1;
                return b.localeCompare(a);
            });

            const monthBlocks = monthKeys
                .map((key) => {
                    const { charges: monthCharges, total } = byMonth.get(key);
                    const label =
                        key === '_unknown' ? 'Unknown date' : formatMonthLabel(key);
                    const count = monthCharges.length;
                    const countLabel = count === 1 ? '1 payment' : `${count} payments`;
                    const rows = monthCharges.map((c) => chargeTableRow(c)).join('');
                    return `
                        <details class="pay-details border border-slate-200 rounded-lg bg-white overflow-hidden">
                            <summary class="px-4 py-3 cursor-pointer flex flex-wrap items-center justify-between gap-3 hover:bg-slate-50 text-left">
                                <div class="flex items-center gap-2 min-w-0">
                                    <svg class="w-4 h-4 text-slate-400 flex-shrink-0 pay-chevron transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    <span class="font-semibold text-slate-900">${escapeHtml(label)}</span>
                                </div>
                                <div class="flex items-center gap-3 flex-shrink-0">
                                    <span class="text-xs text-slate-500">${escapeHtml(countLabel)}</span>
                                    <span class="text-sm font-semibold text-slate-900 tabular-nums">${formatCurrency(total)}</span>
                                </div>
                            </summary>
                            <div class="border-t border-slate-100 overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-xs font-medium text-slate-500 uppercase">
                                        <tr>
                                            <th class="px-3 py-2">Model</th>
                                            <th class="px-3 py-2">Created</th>
                                            <th class="px-3 py-2">Status</th>
                                            <th class="px-3 py-2">Price</th>
                                            <th class="px-3 py-2">Number</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white">${rows}</tbody>
                                </table>
                            </div>
                        </details>`;
                })
                .join('');

            const block = `
                <div class="space-y-4">
                    <div class="rounded-lg bg-slate-50 p-4 border border-slate-100">
                        <div class="text-xs text-slate-500 uppercase tracking-wide">Stripe customer</div>
                        <div class="font-semibold text-slate-900">${escapeHtml(customerName)}</div>
                        <div class="text-sm text-slate-600 mt-2">Total amount charged: <span class="font-medium text-slate-900">${totalFmt}</span></div>
                    </div>
                    <div class="space-y-2">
                        ${monthBlocks}
                    </div>
                </div>`;
            return { html: block, charges: validCharges };
        }

        function escapeHtml(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        function leadDisplayName(fields) {
            const full = fields['Full Name'];
            if (full != null && String(full).trim() !== '') return String(full).trim();
            const fn = String(fields['First Name'] || '').trim();
            const ln = String(fields['Last Name'] || '').trim();
            const combined = `${fn} ${ln}`.trim();
            return combined || '—';
        }

        function sortLeadsByCreatedDesc(leadRecords) {
            return [...leadRecords].sort((a, b) => {
                const da = new Date((a.fields || {})['Created'] || 0);
                const db = new Date((b.fields || {})['Created'] || 0);
                return db - da;
            });
        }

        function buildMonthlyRows(leads) {
            const byMonth = new Map();
            for (const lead of leads) {
                const key = monthKeyFromCreated(lead.fields['Created']);
                if (!key) continue;
                if (!byMonth.has(key)) byMonth.set(key, { leads: [], total: 0 });
                const bucket = byMonth.get(key);
                bucket.leads.push(lead);
                bucket.total += parseMoney(lead.fields['Price']);
            }
            const keys = [...byMonth.keys()].sort((a, b) => b.localeCompare(a));
            if (!keys.length) {
                return '<p class="text-sm text-slate-500">No B2C leads with a created date for this client.</p>';
            }
            const blocks = keys
                .map((k) => {
                    const { leads: monthLeads, total } = byMonth.get(k);
                    const label = formatMonthLabel(k);
                    const sorted = sortLeadsByCreatedDesc(monthLeads);
                    const count = sorted.length;
                    const countLabel = count === 1 ? '1 lead' : `${count} leads`;
                    const leadRows = sorted
                        .map((rec) => {
                            const f = rec.fields || {};
                            const name = escapeHtml(leadDisplayName(f));
                            const phone = escapeHtml(String(f['Phone'] || '—'));
                            const email = escapeHtml(String(f['Email'] || '—'));
                            const price = formatCurrency(parseMoney(f['Price']));
                            return `<tr class="border-t border-slate-200">
                                <td class="px-3 py-2 text-sm font-medium text-slate-900">${name}</td>
                                <td class="px-3 py-2 text-sm text-slate-700">${phone}</td>
                                <td class="px-3 py-2 text-sm text-slate-700">${email}</td>
                                <td class="px-3 py-2 text-sm font-medium tabular-nums">${price}</td>
                            </tr>`;
                        })
                        .join('');
                    return `
                        <details class="lead-month-details border border-slate-200 rounded-lg bg-white overflow-hidden">
                            <summary class="px-4 py-3 cursor-pointer flex flex-wrap items-center justify-between gap-3 hover:bg-slate-50 text-left">
                                <div class="flex items-center gap-2 min-w-0">
                                    <svg class="w-4 h-4 text-slate-400 flex-shrink-0 lead-month-chevron transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    <span class="font-semibold text-slate-900">${escapeHtml(label)}</span>
                                </div>
                                <div class="flex items-center gap-3 flex-shrink-0">
                                    <span class="text-xs text-slate-500">${escapeHtml(countLabel)}</span>
                                    <span class="text-sm font-semibold text-slate-900 tabular-nums">${formatCurrency(total)}</span>
                                </div>
                            </summary>
                            <div class="border-t border-slate-100 overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 text-xs font-medium text-slate-500 uppercase">
                                        <tr>
                                            <th class="px-3 py-2">Name</th>
                                            <th class="px-3 py-2">Phone</th>
                                            <th class="px-3 py-2">Email</th>
                                            <th class="px-3 py-2">Price</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white">${leadRows}</tbody>
                                </table>
                            </div>
                        </details>`;
                })
                .join('');
            return `<div class="space-y-2">${blocks}</div>`;
        }

        function statusIsExactly(fields, value) {
            const s = fields['Status'];
            if (s == null || s === '') return false;
            if (Array.isArray(s)) return s.some((v) => String(v).trim() === value);
            return String(s).trim() === value;
        }

        function leadIsQualifiedDelivered(fields) {
            return statusIsExactly(fields, QUALIFIED_STATUS);
        }

        function countQualifiedDelivered(leads) {
            return leads.filter((r) => leadIsQualifiedDelivered(r.fields || {})).length;
        }

        function formatTotalsScalar(val) {
            if (val == null || val === '') return '—';
            if (typeof val === 'boolean') return val ? 'Yes' : 'No';
            if (Array.isArray(val)) {
                if (!val.length) return '—';
                const parts = val.map((x) =>
                    x != null && typeof x === 'object' && x.name != null ? String(x.name) : String(x)
                );
                return escapeHtml(parts.join(', '));
            }
            return escapeHtml(String(val));
        }

        function buildTotalsSectionHtml(clientRecord, leads, leadsBilledFromPayments) {
            const cf = clientRecord.fields || {};
            const leadsBilled = leadsBilledFromPayments;
            const qualifiedDelivered = countQualifiedDelivered(leads);
            const leadsOwed = formatTotalsScalar(cf[FIELD_TBC_LEAD_MODEL]);
            return `
                        <section class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
                            <h3 class="text-sm font-semibold text-slate-900 uppercase tracking-wide mb-4">Totals</h3>
                            <div class="grid gap-6 sm:grid-cols-3">
                                <div class="rounded-lg border border-slate-100 bg-slate-50/80 p-4">
                                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">Leads Billed</p>
                                    <p class="text-3xl font-bold text-slate-900 tabular-nums">${leadsBilled}</p>
                                    <p class="text-sm text-slate-600 mt-3 leading-relaxed">We bill on an upfront rolling basis 10 leads at a time. This number is the total number of leads we have billed for.</p>
                                </div>
                                <div class="rounded-lg border border-slate-100 bg-slate-50/80 p-4">
                                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">Qualified Leads Delivered</p>
                                    <p class="text-3xl font-bold text-slate-900 tabular-nums">${qualifiedDelivered}</p>
                                    <p class="text-sm text-slate-600 mt-3 leading-relaxed">Leads actually delivered</p>
                                </div>
                                <div class="rounded-lg border border-slate-100 bg-slate-50/80 p-4">
                                    <p class="text-xs font-medium text-slate-500 uppercase tracking-wide mb-2">Leads Owed</p>
                                    <p class="text-2xl sm:text-3xl font-bold text-slate-900 tabular-nums leading-tight">${leadsOwed}</p>
                                    <p class="text-sm text-slate-600 mt-3 leading-relaxed">Number of leads we have billed for but not delivered yet</p>
                                </div>
                            </div>
                        </section>`;
        }

        function wrapSectionFold(title, innerHtml) {
            return `<details class="section-fold border border-slate-200 rounded-lg bg-white overflow-hidden shadow-sm">
                <summary class="px-4 py-3 cursor-pointer flex items-center justify-between gap-3 hover:bg-slate-50 text-left">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400 flex-shrink-0 section-fold-chevron transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        <span class="text-sm font-semibold text-slate-900 uppercase tracking-wide">${escapeHtml(title)}</span>
                    </div>
                </summary>
                <div class="px-4 pb-4 pt-0 border-t border-slate-100 bg-slate-50/40">${innerHtml}</div>
            </details>`;
        }

        function wrapContactsCollapsible(innerHtml) {
            return wrapSectionFold('Contacts', innerHtml);
        }

        async function loadContactsHtml(contactIds) {
            if (!contactIds || !contactIds.length) {
                return wrapContactsCollapsible(
                    '<p class="text-sm text-slate-500">No contacts linked on this client.</p>'
                );
            }
            const cards = [];
            for (const cid of contactIds) {
                try {
                    const data = await fetchJson(AIRTABLE(encodeURIComponent(TABLES.CONTACTS)) + `/${cid}`);
                    const f = data.fields || {};
                    const rows = [];
                    const shown = new Set();
                    for (const key of CONTACT_DISPLAY_ORDER) {
                        if (!(key in f)) continue;
                        shown.add(key);
                        rows.push(
                            `<tr class="border-t border-slate-100"><td class="py-1.5 pr-4 text-xs font-medium text-slate-500 w-36 align-top">${escapeHtml(key)}</td><td class="py-1.5 text-sm text-slate-900">${formatContactFieldValue(f[key])}</td></tr>`
                        );
                    }
                    for (const key of Object.keys(f)) {
                        if (shown.has(key)) continue;
                        const v = f[key];
                        if (v == null || v === '') continue;
                        if (Array.isArray(v) && v.length && typeof v[0] === 'string' && v[0].startsWith('rec')) continue;
                        rows.push(
                            `<tr class="border-t border-slate-100"><td class="py-1.5 pr-4 text-xs font-medium text-slate-500 w-36 align-top">${escapeHtml(key)}</td><td class="py-1.5 text-sm text-slate-900">${formatContactFieldValue(v)}</td></tr>`
                        );
                    }
                    cards.push(`
                        <div class="rounded-lg border border-slate-200 bg-white overflow-hidden">
                            <div class="px-3 py-2 bg-slate-50 border-b border-slate-200 text-sm font-semibold text-slate-800">${escapeHtml(String(f['Name'] || 'Contact'))}</div>
                            <table class="w-full">${rows.join('')}</table>
                        </div>`);
                } catch {
                    cards.push(`<p class="text-sm text-red-600">Could not load contact <code class="text-xs">${escapeHtml(cid)}</code>.</p>`);
                }
            }
            const inner = `<div class="grid gap-3 sm:grid-cols-1">${cards.join('')}</div>`;
            return wrapContactsCollapsible(inner);
        }

        async function hydratePanel(clientId, clientRecord) {
            const panel = document.getElementById(`panel-${clientId}`);
            if (!panel || loadedPanels.get(clientId)) return;

            panel.innerHTML = `<div class="flex items-center gap-2 text-slate-600 text-sm py-4"><svg class="w-5 h-5 animate-spin text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Loading details…</div>`;

            try {
                const contactIds = clientRecord.fields[CLIENT_CONTACTS_FIELD];

                const [contactsHtml, paymentsResult, leads] = await Promise.all([
                    loadContactsHtml(contactIds),
                    loadPaymentsForClient(clientRecord),
                    fetchAllLeadsForClient(clientRecord)
                ]);

                const monthlyHtml = buildMonthlyRows(leads);
                const leadsBilledSum = sumChargeNumbersForLeadsBilled(paymentsResult.charges);
                const totalsHtml = buildTotalsSectionHtml(clientRecord, leads, leadsBilledSum);
                const paymentsInner = `<p class="text-sm text-slate-600 mb-3">Based on the date that we actually charged the owner's card on file</p>${paymentsResult.html}`;
                const paymentsFoldHtml = wrapSectionFold('Payments', paymentsInner);
                const monthlyInner = `<p class="text-sm text-slate-600 mb-3">Based on when the leads were actually delivered</p>${monthlyHtml}`;
                const monthlyFoldHtml = wrapSectionFold('Monthly lead spend', monthlyInner);

                panel.innerHTML = `
                    <div class="space-y-8 pt-2">
                        ${totalsHtml}
                        <section>
                            ${contactsHtml}
                        </section>
                        <section>
                            ${paymentsFoldHtml}
                        </section>
                        <section>
                            ${monthlyFoldHtml}
                        </section>
                    </div>`;
                loadedPanels.set(clientId, true);
            } catch (e) {
                panel.innerHTML = `<p class="text-sm text-red-600">${escapeHtml(e.message || String(e))}</p>`;
            }
        }

        function toggleAccordion(clientId) {
            const panel = document.getElementById(`panel-${clientId}`);
            const btn = document.getElementById(`btn-${clientId}`);
            const chev = document.getElementById(`chev-${clientId}`);
            if (!panel || !btn) return;

            const open = !panel.classList.contains('hidden');
            if (open) {
                panel.classList.add('hidden');
                btn.setAttribute('aria-expanded', 'false');
                if (chev) chev.style.transform = 'rotate(0deg)';
            } else {
                panel.classList.remove('hidden');
                btn.setAttribute('aria-expanded', 'true');
                if (chev) chev.style.transform = 'rotate(180deg)';
                const rec = btn._clientRecord;
                if (rec) hydratePanel(clientId, rec);
            }
        }

        function showDashboard() {
            document.getElementById('emailGate').classList.add('hidden');
            document.getElementById('dashboardRoot').classList.remove('hidden');
        }

        function showGate() {
            document.getElementById('dashboardRoot').classList.add('hidden');
            document.getElementById('emailGate').classList.remove('hidden');
            loadedPanels.clear();
        }

        async function loadClientShells() {
            const host = document.getElementById('accordionHost');
            const loading = document.getElementById('dashLoading');
            const errEl = document.getElementById('dashError');

            errEl.classList.add('hidden');
            loading.classList.remove('hidden');
            host.classList.add('hidden');
            host.innerHTML = '';

            try {
                const clients = await Promise.all(
                    CLIENT_RECORD_IDS.map((id) =>
                        fetchJson(AIRTABLE(encodeURIComponent(TABLES.CLIENTS)) + `/${id}`)
                    )
                );

                for (let i = 0; i < clients.length; i++) {
                    const rec = clients[i];
                    const id = rec.id;
                    const title = rec.fields[CLIENT_NAME_FIELD] || `Client ${i + 1}`;

                    const wrap = document.createElement('div');
                    wrap.className = 'rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden';
                    wrap.innerHTML = `
                        <button type="button" id="btn-${id}" aria-expanded="false" class="w-full flex items-center justify-between gap-4 px-4 py-4 text-left hover:bg-slate-50 transition-colors">
                            <span class="font-semibold text-slate-900">${escapeHtml(title)}</span>
                            <svg id="chev-${id}" class="w-5 h-5 text-slate-500 flex-shrink-0 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <div id="panel-${id}" class="hidden px-4 pb-6 border-t border-slate-100 bg-slate-50/50"></div>`;
                    host.appendChild(wrap);

                    const btn = wrap.querySelector(`#btn-${id}`);
                    btn._clientRecord = rec;
                    btn.addEventListener('click', () => toggleAccordion(id));
                }

                loading.classList.add('hidden');
                host.classList.remove('hidden');
            } catch (e) {
                loading.classList.add('hidden');
                errEl.textContent = e.message || 'Failed to load clients.';
                errEl.classList.remove('hidden');
            }
        }

        document.getElementById('emailGateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('emailInput');
            const submit = document.getElementById('emailGateSubmit');
            const err = document.getElementById('emailGateError');
            const em = normalizeEmail(input.value);

            err.classList.add('hidden');
            if (!ALLOWED_EMAILS.has(em)) {
                err.textContent = 'This email is not authorized for this dashboard.';
                err.classList.remove('hidden');
                return;
            }

            submit.disabled = true;
            submit.textContent = 'Checking…';
            try {
                sessionStorage.setItem(STORAGE_KEY, em);
                showDashboard();
                await loadClientShells();
            } finally {
                submit.disabled = false;
                submit.textContent = 'Continue';
            }
        });

        document.getElementById('signOutBtn').addEventListener('click', () => {
            sessionStorage.removeItem(STORAGE_KEY);
            showGate();
            document.getElementById('emailInput').value = '';
        });

        (function init() {
            const saved = sessionStorage.getItem(STORAGE_KEY);
            if (saved && ALLOWED_EMAILS.has(normalizeEmail(saved))) {
                showDashboard();
                loadClientShells();
            }
        })();
    </script>
</body>
</html>
