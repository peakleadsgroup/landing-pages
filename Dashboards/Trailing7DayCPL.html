<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL Analyzer - Trailing 7-Day Average</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function CPLAnalyzer() {
            const [data, setData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [clients, setClients] = useState([]);
            const [selectedClient, setSelectedClient] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [fileName, setFileName] = useState('');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const parseExcelFile = (file) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        
                        processData(jsonData);
                        setFileName(file.name);
                    } catch (error) {
                        alert('Error reading file: ' + error.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const parseCurrency = (value) => {
                if (!value) return 0;
                const str = String(value).replace(/[$,]/g, '');
                return parseFloat(str) || 0;
            };

            const processData = (rawData) => {
                // Skip header row and process data
                const processed = rawData.slice(1).map(row => {
                    const date = row[1]; // Column B: Date
                    const client = row[2] || 'Unknown'; // Column C: Client
                    const spend = parseCurrency(row[3]); // Column D: Spend
                    const cpl = parseCurrency(row[4]); // Column E: CPL
                    const leads = row[9] ? parseInt(row[9]) : 0; // Column J: Leads
                    
                    return {
                        date: date,
                        client: client,
                        spend: spend,
                        cpl: cpl,
                        leads: leads
                    };
                }).filter(item => item.date);

                // Sort by date
                processed.sort((a, b) => new Date(a.date) - new Date(b.date));

                // Get unique clients
                const uniqueClients = [...new Set(processed.map(item => item.client))].sort();
                setClients(uniqueClients);

                // Set date range
                if (processed.length > 0) {
                    setStartDate(processed[0].date);
                    setEndDate(processed[processed.length - 1].date);
                }

                setData(processed);
            };

            const calculateTrailing7DayCPL = (data) => {
                const dateMap = new Map();
                
                // Group by date and calculate daily totals
                data.forEach(item => {
                    const dateKey = item.date;
                    if (!dateMap.has(dateKey)) {
                        dateMap.set(dateKey, { spend: 0, leads: 0, date: item.date });
                    }
                    const entry = dateMap.get(dateKey);
                    entry.spend += item.spend;
                    entry.leads += item.leads;
                });

                // Convert to array and sort
                const dailyData = Array.from(dateMap.values()).sort((a, b) => 
                    new Date(a.date) - new Date(b.date)
                );

                // Calculate trailing 7-day CPL
                return dailyData.map((day, index) => {
                    const startIdx = Math.max(0, index - 6);
                    const trailing7Days = dailyData.slice(startIdx, index + 1);
                    
                    const totalSpend = trailing7Days.reduce((sum, d) => sum + d.spend, 0);
                    const totalLeads = trailing7Days.reduce((sum, d) => sum + d.leads, 0);
                    const trailing7DayCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;

                    return {
                        date: day.date,
                        spend: day.spend,
                        leads: day.leads,
                        dailyCPL: day.leads > 0 ? day.spend / day.leads : 0,
                        trailing7DayCPL: trailing7DayCPL,
                        daysInWindow: trailing7Days.length
                    };
                });
            };

            useEffect(() => {
                let filtered = data;

                // Filter by client
                if (selectedClient !== 'all') {
                    filtered = filtered.filter(item => item.client === selectedClient);
                }

                // Filter by date range
                if (startDate) {
                    filtered = filtered.filter(item => new Date(item.date) >= new Date(startDate));
                }
                if (endDate) {
                    filtered = filtered.filter(item => new Date(item.date) <= new Date(endDate));
                }

                const calculated = calculateTrailing7DayCPL(filtered);
                setFilteredData(calculated);
            }, [data, selectedClient, startDate, endDate]);

            useEffect(() => {
                if (filteredData.length > 0 && chartRef.current) {
                    // Destroy previous chart
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: filteredData.map(d => d.date),
                            datasets: [
                                {
                                    label: 'Trailing 7-Day CPL',
                                    data: filteredData.map(d => d.trailing7DayCPL),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    borderWidth: 3,
                                    tension: 0.3,
                                    fill: true,
                                    pointRadius: 4,
                                    pointHoverRadius: 6
                                },
                                {
                                    label: 'Daily CPL',
                                    data: filteredData.map(d => d.dailyCPL),
                                    borderColor: 'rgb(156, 163, 175)',
                                    backgroundColor: 'rgba(156, 163, 175, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: false,
                                    pointRadius: 2,
                                    pointHoverRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        usePointStyle: true,
                                        padding: 15,
                                        font: {
                                            size: 12,
                                            weight: 'bold'
                                        }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    titleFont: { size: 14, weight: 'bold' },
                                    bodyFont: { size: 13 },
                                    callbacks: {
                                        label: function(context) {
                                            const dataPoint = filteredData[context.dataIndex];
                                            if (context.datasetIndex === 0) {
                                                return [
                                                    `Trailing 7-Day CPL: $${dataPoint.trailing7DayCPL.toFixed(2)}`,
                                                    `Days in window: ${dataPoint.daysInWindow}`
                                                ];
                                            } else {
                                                return [
                                                    `Daily CPL: $${dataPoint.dailyCPL.toFixed(2)}`,
                                                    `Leads: ${dataPoint.leads}`,
                                                    `Spend: $${dataPoint.spend.toFixed(2)}`
                                                ];
                                            }
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return '$' + value.toFixed(0);
                                        }
                                    },
                                    grid: {
                                        color: 'rgba(0, 0, 0, 0.05)'
                                    }
                                },
                                x: {
                                    grid: {
                                        display: false
                                    },
                                    ticks: {
                                        maxRotation: 45,
                                        minRotation: 45
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [filteredData]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    parseExcelFile(file);
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file) {
                    parseExcelFile(file);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const exportData = () => {
                const csvContent = [
                    ['Date', 'Spend', 'Leads', 'Daily CPL', 'Trailing 7-Day CPL', 'Days in Window'],
                    ...filteredData.map(d => [
                        d.date,
                        d.spend.toFixed(2),
                        d.leads,
                        d.dailyCPL.toFixed(2),
                        d.trailing7DayCPL.toFixed(2),
                        d.daysInWindow
                    ])
                ].map(row => row.join(',')).join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cpl_analysis_${selectedClient}_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">CPL Analyzer</h1>
                            <p className="text-gray-600 mb-6">Analyze trailing 7-day Cost Per Lead trends</p>

                            {!data.length ? (
                                <div 
                                    className="border-4 border-dashed border-blue-300 rounded-lg p-12 text-center bg-blue-50 hover:bg-blue-100 transition-colors cursor-pointer"
                                    onDrop={handleDrop}
                                    onDragOver={handleDragOver}
                                    onClick={() => document.getElementById('file-input').click()}
                                >
                                    <svg className="w-16 h-16 mx-auto mb-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                                    </svg>
                                    <p className="text-xl font-semibold text-gray-700 mb-2">
                                        Drop your Excel file here or click to browse
                                    </p>
                                    <p className="text-gray-500">
                                        Supports .xlsx, .xls files
                                    </p>
                                    <input 
                                        id="file-input"
                                        type="file" 
                                        accept=".xlsx,.xls"
                                        onChange={handleFileUpload}
                                        className="hidden"
                                    />
                                </div>
                            ) : (
                                <>
                                    <div className="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
                                        <div className="flex items-center justify-between">
                                            <div className="flex items-center">
                                                <svg className="w-6 h-6 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                                <span className="font-semibold text-green-800">Loaded: {fileName}</span>
                                            </div>
                                            <button
                                                onClick={() => {
                                                    setData([]);
                                                    setFilteredData([]);
                                                    setFileName('');
                                                }}
                                                className="text-sm text-red-600 hover:text-red-800 font-medium"
                                            >
                                                Clear Data
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Client
                                            </label>
                                            <select
                                                value={selectedClient}
                                                onChange={(e) => setSelectedClient(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            >
                                                <option value="all">All Clients</option>
                                                {clients.map(client => (
                                                    <option key={client} value={client}>{client}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Start Date
                                            </label>
                                            <input
                                                type="date"
                                                value={startDate}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                End Date
                                            </label>
                                            <input
                                                type="date"
                                                value={endDate}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                    </div>

                                    {filteredData.length > 0 && (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                                <div className="bg-blue-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Avg 7-Day CPL</p>
                                                    <p className="text-2xl font-bold text-blue-600">
                                                        ${(filteredData.reduce((sum, d) => sum + d.trailing7DayCPL, 0) / filteredData.length).toFixed(2)}
                                                    </p>
                                                </div>
                                                <div className="bg-green-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Leads</p>
                                                    <p className="text-2xl font-bold text-green-600">
                                                        {filteredData.reduce((sum, d) => sum + d.leads, 0).toLocaleString()}
                                                    </p>
                                                </div>
                                                <div className="bg-purple-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Spend</p>
                                                    <p className="text-2xl font-bold text-purple-600">
                                                        ${filteredData.reduce((sum, d) => sum + d.spend, 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                    </p>
                                                </div>
                                                <div className="bg-orange-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Days Analyzed</p>
                                                    <p className="text-2xl font-bold text-orange-600">
                                                        {filteredData.length}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="bg-gray-50 rounded-lg p-6 mb-6" style={{height: '500px'}}>
                                                <canvas ref={chartRef}></canvas>
                                            </div>

                                            <div className="flex justify-end">
                                                <button
                                                    onClick={exportData}
                                                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold flex items-center"
                                                >
                                                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    Export CSV
                                                </button>
                                            </div>

                                            <div className="mt-6 overflow-x-auto">
                                                <table className="w-full text-sm">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-4 py-3 text-left font-semibold">Date</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Spend</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Leads</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Daily CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">7-Day CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Window</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredData.map((row, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-gray-50">
                                                                <td className="px-4 py-3">{row.date}</td>
                                                                <td className="px-4 py-3 text-right">${row.spend.toFixed(2)}</td>
                                                                <td className="px-4 py-3 text-right">{row.leads}</td>
                                                                <td className="px-4 py-3 text-right">${row.dailyCPL.toFixed(2)}</td>
                                                                <td className="px-4 py-3 text-right font-semibold text-blue-600">
                                                                    ${row.trailing7DayCPL.toFixed(2)}
                                                                </td>
                                                                <td className="px-4 py-3 text-right text-gray-500">
                                                                    {row.daysInWindow} days
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CPLAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
