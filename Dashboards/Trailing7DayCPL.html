<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL Analyzer - Qualified Leads</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function CPLAnalyzer() {
            const [dailyData, setDailyData] = useState([]);
            const [clients, setClients] = useState([]);
            const [selectedClient, setSelectedClient] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [minDate, setMinDate] = useState('');
            const [maxDate, setMaxDate] = useState('');
            const [spendFileName, setSpendFileName] = useState('');
            const [leadFileName, setLeadFileName] = useState('');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const readExcelFile = (file, callback) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1, raw: false });
                        callback(jsonData);
                    } catch (error) {
                        alert('Error reading file: ' + error.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const formatDate = (dateValue) => {
                if (!dateValue) return null;
                try {
                    const date = new Date(dateValue);
                    if (isNaN(date.getTime())) return null;
                    return date.toISOString().split('T')[0];
                } catch {
                    return null;
                }
            };

            const handleLeadFileUpload = (file) => {
                readExcelFile(file, (data) => {
                    setLeadFileName(file.name);
                    processFiles(data, 'leads');
                });
            };

            const handleSpendFileUpload = (file) => {
                readExcelFile(file, (data) => {
                    setSpendFileName(file.name);
                    processFiles(data, 'spend');
                });
            };

            const processFiles = (newData, type) => {
                // Store the raw data temporarily
                window.rawLeadData = type === 'leads' ? newData : (window.rawLeadData || []);
                window.rawSpendData = type === 'spend' ? newData : (window.rawSpendData || []);

                // Only process if both files are loaded
                if (!window.rawLeadData || !window.rawSpendData || 
                    window.rawLeadData.length === 0 || window.rawSpendData.length === 0) {
                    return;
                }

                combineAndProcess();
            };

            const combineAndProcess = () => {
                // Process lead data: Column A: Client, Column B: Status, Column C: Date
                const leadsByDateClient = {};
                window.rawLeadData.forEach(row => {
                    if (!row || row.length < 3) return;
                    const status = row[1];
                    if (status !== 'Qualified') return;
                    
                    const date = formatDate(row[2]);
                    const client = row[0] || 'Unknown';
                    if (!date) return;
                    
                    const key = `${date}|${client}`;
                    leadsByDateClient[key] = (leadsByDateClient[key] || 0) + 1;
                });

                // Process spend data: Column A: ID, Column B: Date, Column C: Client, Column D: Spend
                const spendByDateClient = {};
                window.rawSpendData.forEach(row => {
                    if (!row || row.length < 4) return;
                    const date = formatDate(row[1]);
                    const client = row[2] || 'Unknown';
                    const spend = parseFloat(String(row[3]).replace(/[$,]/g, '')) || 0;
                    if (!date) return;
                    
                    const key = `${date}|${client}`;
                    spendByDateClient[key] = (spendByDateClient[key] || 0) + spend;
                });

                // Combine all unique date-client combinations
                const allKeys = new Set([...Object.keys(leadsByDateClient), ...Object.keys(spendByDateClient)]);
                const combined = [];
                
                allKeys.forEach(key => {
                    const [date, client] = key.split('|');
                    combined.push({
                        date: date,
                        client: client,
                        spend: spendByDateClient[key] || 0,
                        leads: leadsByDateClient[key] || 0
                    });
                });

                // Sort by date
                combined.sort((a, b) => a.date.localeCompare(b.date));

                // Get date range
                if (combined.length > 0) {
                    const allDates = combined.map(d => d.date).sort();
                    const min = allDates[0];
                    const max = allDates[allDates.length - 1];
                    setMinDate(min);
                    setMaxDate(max);
                    setStartDate(min);
                    setEndDate(max);
                }

                // Get unique clients
                const uniqueClients = [...new Set(combined.map(item => item.client))].sort();
                setClients(uniqueClients);

                // Aggregate by date for daily totals
                const dailyMap = {};
                combined.forEach(item => {
                    if (!dailyMap[item.date]) {
                        dailyMap[item.date] = { date: item.date, spend: 0, leads: 0 };
                    }
                    dailyMap[item.date].spend += item.spend;
                    dailyMap[item.date].leads += item.leads;
                });

                const daily = Object.values(dailyMap).sort((a, b) => a.date.localeCompare(b.date));

                // Calculate trailing 7-day CPL
                const withTrailing = daily.map((day, index) => {
                    const startIdx = Math.max(0, index - 6);
                    const window = daily.slice(startIdx, index + 1);
                    
                    const totalSpend = window.reduce((sum, d) => sum + d.spend, 0);
                    const totalLeads = window.reduce((sum, d) => sum + d.leads, 0);
                    const trailing7DayCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;
                    const dailyCPL = day.leads > 0 ? day.spend / day.leads : 0;

                    return {
                        date: day.date,
                        spend: day.spend,
                        leads: day.leads,
                        dailyCPL: dailyCPL,
                        trailing7DayCPL: trailing7DayCPL,
                        daysInWindow: window.length
                    };
                });

                setDailyData(withTrailing);
            };

            // Calculate filtered data based on client and date selections
            const getFilteredData = () => {
                if (dailyData.length === 0) return [];

                // First, filter the raw combined data if we have client filter
                if (selectedClient !== 'all') {
                    // Need to recalculate from raw data with client filter
                    const leadsByDate = {};
                    const spendByDate = {};

                    // Re-aggregate with client filter
                    if (window.rawLeadData && window.rawSpendData) {
                        window.rawLeadData.forEach(row => {
                            if (!row || row.length < 3) return;
                            const status = row[1];
                            if (status !== 'Qualified') return;
                            const client = row[0] || 'Unknown';
                            if (client !== selectedClient) return;
                            
                            const date = formatDate(row[2]);
                            if (!date) return;
                            
                            leadsByDate[date] = (leadsByDate[date] || 0) + 1;
                        });

                        window.rawSpendData.forEach(row => {
                            if (!row || row.length < 4) return;
                            const client = row[2] || 'Unknown';
                            if (client !== selectedClient) return;
                            const date = formatDate(row[1]);
                            const spend = parseFloat(String(row[3]).replace(/[$,]/g, '')) || 0;
                            if (!date) return;
                            
                            spendByDate[date] = (spendByDate[date] || 0) + spend;
                        });

                        // Get all dates
                        const allDates = new Set([...Object.keys(leadsByDate), ...Object.keys(spendByDate)]);
                        const daily = Array.from(allDates).map(date => ({
                            date: date,
                            spend: spendByDate[date] || 0,
                            leads: leadsByDate[date] || 0
                        })).sort((a, b) => a.date.localeCompare(b.date));

                        // Calculate trailing 7-day
                        const withTrailing = daily.map((day, index) => {
                            const startIdx = Math.max(0, index - 6);
                            const window = daily.slice(startIdx, index + 1);
                            
                            const totalSpend = window.reduce((sum, d) => sum + d.spend, 0);
                            const totalLeads = window.reduce((sum, d) => sum + d.leads, 0);
                            const trailing7DayCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;
                            const dailyCPL = day.leads > 0 ? day.spend / day.leads : 0;

                            return {
                                date: day.date,
                                spend: day.spend,
                                leads: day.leads,
                                dailyCPL: dailyCPL,
                                trailing7DayCPL: trailing7DayCPL,
                                daysInWindow: window.length
                            };
                        });

                        // Apply date filter
                        return withTrailing.filter(item => {
                            if (startDate && item.date < startDate) return false;
                            if (endDate && item.date > endDate) return false;
                            return true;
                        });
                    }
                }

                // No client filter, just apply date filter
                return dailyData.filter(item => {
                    if (startDate && item.date < startDate) return false;
                    if (endDate && item.date > endDate) return false;
                    return true;
                });
            };

            const filteredData = getFilteredData();

            useEffect(() => {
                if (filteredData.length > 0 && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: filteredData.map(d => d.date),
                            datasets: [
                                {
                                    label: 'Trailing 7-Day CPL',
                                    data: filteredData.map(d => d.trailing7DayCPL),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    borderWidth: 3,
                                    tension: 0.3,
                                    fill: true,
                                    pointRadius: 3,
                                    pointHoverRadius: 6
                                },
                                {
                                    label: 'Daily CPL',
                                    data: filteredData.map(d => d.dailyCPL),
                                    borderColor: 'rgb(156, 163, 175)',
                                    backgroundColor: 'rgba(156, 163, 175, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: false,
                                    pointRadius: 2,
                                    pointHoverRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        usePointStyle: true,
                                        padding: 15,
                                        font: { size: 12, weight: 'bold' }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    titleFont: { size: 14, weight: 'bold' },
                                    bodyFont: { size: 13 },
                                    callbacks: {
                                        label: function(context) {
                                            const dataPoint = filteredData[context.dataIndex];
                                            if (context.datasetIndex === 0) {
                                                return [
                                                    `Trailing 7-Day CPL: $${dataPoint.trailing7DayCPL.toFixed(2)}`,
                                                    `Window: ${dataPoint.daysInWindow} days`
                                                ];
                                            } else {
                                                return [
                                                    `Daily CPL: $${dataPoint.dailyCPL.toFixed(2)}`,
                                                    `Qualified Leads: ${dataPoint.leads}`,
                                                    `Spend: $${dataPoint.spend.toFixed(2)}`
                                                ];
                                            }
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return '$' + value.toFixed(0);
                                        }
                                    },
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { maxRotation: 45, minRotation: 45 }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [filteredData]);

            const exportData = () => {
                const csvContent = [
                    ['Date', 'Spend', 'Qualified Leads', 'Daily CPL', 'Trailing 7-Day CPL', 'Days in Window'],
                    ...filteredData.map(d => [
                        d.date,
                        d.spend.toFixed(2),
                        d.leads,
                        d.dailyCPL.toFixed(2),
                        d.trailing7DayCPL.toFixed(2),
                        d.daysInWindow
                    ])
                ].map(row => row.join(',')).join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cpl_analysis_${selectedClient}_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            const hasData = dailyData.length > 0;

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">CPL Analyzer</h1>
                            <p className="text-gray-600 mb-6">Trailing 7-Day Cost Per Lead for Qualified Leads</p>

                            {!hasData ? (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <h3 className="text-lg font-semibold mb-3 text-gray-700">1. Upload Lead Data</h3>
                                        <div 
                                            className="border-4 border-dashed border-green-300 rounded-lg p-8 text-center bg-green-50 hover:bg-green-100 transition-colors cursor-pointer"
                                            onDrop={(e) => {
                                                e.preventDefault();
                                                const file = e.dataTransfer.files[0];
                                                if (file) handleLeadFileUpload(file);
                                            }}
                                            onDragOver={(e) => e.preventDefault()}
                                            onClick={() => document.getElementById('lead-file').click()}
                                        >
                                            {leadFileName ? (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <p className="text-sm font-semibold text-green-800">{leadFileName}</p>
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                                    </svg>
                                                    <p className="font-semibold text-gray-700 mb-1">Lead File</p>
                                                    <p className="text-xs text-gray-500">Client, Status, Date</p>
                                                </>
                                            )}
                                            <input 
                                                id="lead-file"
                                                type="file" 
                                                accept=".xlsx,.xls"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) handleLeadFileUpload(file);
                                                }}
                                                className="hidden"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-lg font-semibold mb-3 text-gray-700">2. Upload Spend Data</h3>
                                        <div 
                                            className="border-4 border-dashed border-blue-300 rounded-lg p-8 text-center bg-blue-50 hover:bg-blue-100 transition-colors cursor-pointer"
                                            onDrop={(e) => {
                                                e.preventDefault();
                                                const file = e.dataTransfer.files[0];
                                                if (file) handleSpendFileUpload(file);
                                            }}
                                            onDragOver={(e) => e.preventDefault()}
                                            onClick={() => document.getElementById('spend-file').click()}
                                        >
                                            {spendFileName ? (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <p className="text-sm font-semibold text-blue-800">{spendFileName}</p>
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <p className="font-semibold text-gray-700 mb-1">Spend File</p>
                                                    <p className="text-xs text-gray-500">Date, Client, Spend</p>
                                                </>
                                            )}
                                            <input 
                                                id="spend-file"
                                                type="file" 
                                                accept=".xlsx,.xls"
                                                onChange={(e) => {
                                                    const file = e.target.files[0];
                                                    if (file) handleSpendFileUpload(file);
                                                }}
                                                className="hidden"
                                            />
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 mb-6">
                                        <div className="flex items-center justify-between">
                                            <span className="text-sm text-purple-800">
                                                📊 Data Range: {minDate} to {maxDate} ({dailyData.length} days)
                                            </span>
                                            <button
                                                onClick={() => {
                                                    setDailyData([]);
                                                    setLeadFileName('');
                                                    setSpendFileName('');
                                                    window.rawLeadData = null;
                                                    window.rawSpendData = null;
                                                }}
                                                className="text-sm text-red-600 hover:text-red-800 font-medium"
                                            >
                                                Clear All
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Client</label>
                                            <select
                                                value={selectedClient}
                                                onChange={(e) => setSelectedClient(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            >
                                                <option value="all">All Clients</option>
                                                {clients.map(client => (
                                                    <option key={client} value={client}>{client}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Start Date</label>
                                            <input
                                                type="date"
                                                value={startDate}
                                                min={minDate}
                                                max={maxDate}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">End Date</label>
                                            <input
                                                type="date"
                                                value={endDate}
                                                min={minDate}
                                                max={maxDate}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>

                                    {filteredData.length > 0 && (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                                <div className="bg-blue-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Avg 7-Day CPL</p>
                                                    <p className="text-2xl font-bold text-blue-600">
                                                        ${(filteredData.reduce((sum, d) => sum + d.trailing7DayCPL, 0) / filteredData.length).toFixed(2)}
                                                    </p>
                                                </div>
                                                <div className="bg-green-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Qualified Leads</p>
                                                    <p className="text-2xl font-bold text-green-600">
                                                        {filteredData.reduce((sum, d) => sum + d.leads, 0).toLocaleString()}
                                                    </p>
                                                </div>
                                                <div className="bg-purple-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Spend</p>
                                                    <p className="text-2xl font-bold text-purple-600">
                                                        ${filteredData.reduce((sum, d) => sum + d.spend, 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                    </p>
                                                </div>
                                                <div className="bg-orange-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Days Analyzed</p>
                                                    <p className="text-2xl font-bold text-orange-600">
                                                        {filteredData.length}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="bg-gray-50 rounded-lg p-6 mb-6" style={{height: '500px'}}>
                                                <canvas ref={chartRef}></canvas>
                                            </div>

                                            <div className="flex justify-end mb-6">
                                                <button
                                                    onClick={exportData}
                                                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold flex items-center"
                                                >
                                                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    Export CSV
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-sm">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-4 py-3 text-left font-semibold">Date</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Spend</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Leads</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Daily CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">7-Day CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Window</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredData.map((row, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-gray-50">
                                                                <td className="px-4 py-3">{row.date}</td>
                                                                <td className="px-4 py-3 text-right">${row.spend.toFixed(2)}</td>
                                                                <td className="px-4 py-3 text-right">{row.leads}</td>
                                                                <td className="px-4 py-3 text-right">
                                                                    {row.dailyCPL > 0 ? `$${row.dailyCPL.toFixed(2)}` : '-'}
                                                                </td>
                                                                <td className="px-4 py-3 text-right font-semibold text-blue-600">
                                                                    {row.trailing7DayCPL > 0 ? `$${row.trailing7DayCPL.toFixed(2)}` : '-'}
                                                                </td>
                                                                <td className="px-4 py-3 text-right text-gray-500">
                                                                    {row.daysInWindow} days
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CPLAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
