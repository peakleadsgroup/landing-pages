<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL Analyzer - Dual File Import</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function CPLAnalyzer() {
            const [spendData, setSpendData] = useState([]);
            const [leadData, setLeadData] = useState([]);
            const [combinedData, setCombinedData] = useState([]);
            const [filteredData, setFilteredData] = useState([]);
            const [clients, setClients] = useState([]);
            const [selectedClient, setSelectedClient] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [dateRange, setDateRange] = useState({ min: '', max: '' });
            const [spendFileName, setSpendFileName] = useState('');
            const [leadFileName, setLeadFileName] = useState('');
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const parseExcelFile = (file, isLeadFile) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                        
                        if (isLeadFile) {
                            processLeadData(jsonData);
                            setLeadFileName(file.name);
                        } else {
                            processSpendData(jsonData);
                            setSpendFileName(file.name);
                        }
                    } catch (error) {
                        alert('Error reading file: ' + error.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const parseCurrency = (value) => {
                if (!value) return 0;
                const str = String(value).replace(/[$,]/g, '');
                return parseFloat(str) || 0;
            };

            const formatDate = (date) => {
                if (!date) return null;
                const d = new Date(date);
                return d.toISOString().split('T')[0]; // YYYY-MM-DD
            };

            const processSpendData = (rawData) => {
                // Spend file structure: Column A: ID, Column B: Date, Column C: Client, Column D: Spend
                const processed = rawData.map(row => {
                    if (!row || row.length === 0 || !row[1]) return null;
                    
                    return {
                        date: formatDate(row[1]),
                        client: row[2] || 'Unknown',
                        spend: parseCurrency(row[3])
                    };
                }).filter(item => item && item.date);

                setSpendData(processed);
            };

            const processLeadData = (rawData) => {
                // Lead file structure: Column A: Client, Column B: Status, Column C: Date/Time
                const processed = rawData.map(row => {
                    if (!row || row.length === 0 || !row[2]) return null;
                    
                    const status = row[1];
                    // Only count qualified leads
                    if (status !== 'Qualified') return null;
                    
                    return {
                        date: formatDate(row[2]),
                        client: row[0] || 'Unknown',
                        status: status
                    };
                }).filter(item => item && item.date);

                setLeadData(processed);
            };

            const combineData = () => {
                if (spendData.length === 0 || leadData.length === 0) return;

                // Group spend by date and client
                const spendMap = new Map();
                spendData.forEach(item => {
                    const key = `${item.date}_${item.client}`;
                    if (!spendMap.has(key)) {
                        spendMap.set(key, { date: item.date, client: item.client, spend: 0 });
                    }
                    spendMap.get(key).spend += item.spend;
                });

                // Group qualified leads by date and client
                const leadMap = new Map();
                leadData.forEach(item => {
                    const key = `${item.date}_${item.client}`;
                    if (!leadMap.has(key)) {
                        leadMap.set(key, 0);
                    }
                    leadMap.set(key, leadMap.get(key) + 1);
                });

                // Combine spend and leads - include all dates from both datasets
                const combined = [];
                const allKeys = new Set([...spendMap.keys(), ...Array.from(leadMap.keys()).map(key => {
                    // leadMap keys are just "date_client", need to find matching spend entries
                    return key;
                })]);

                // Get all unique date-client combinations
                const dateClientSet = new Set();
                spendData.forEach(item => {
                    dateClientSet.add(`${item.date}_${item.client}`);
                });
                leadData.forEach(item => {
                    dateClientSet.add(`${item.date}_${item.client}`);
                });

                dateClientSet.forEach(key => {
                    const [date, client] = key.split('_');
                    const spendEntry = spendMap.get(key);
                    const leads = leadMap.get(key) || 0;
                    const spend = spendEntry ? spendEntry.spend : 0;
                    
                    combined.push({
                        date: date,
                        client: client,
                        spend: spend,
                        leads: leads
                    });
                });

                // Sort by date
                combined.sort((a, b) => new Date(a.date) - new Date(b.date));

                // Get unique clients
                const uniqueClients = [...new Set(combined.map(item => item.client))].sort();
                setClients(uniqueClients);

                setCombinedData(combined);
            };

            useEffect(() => {
                combineData();
            }, [spendData, leadData]);

            // Set dates when combined data is ready
            useEffect(() => {
                if (combinedData.length > 0 && !startDate && !endDate) {
                    const dates = combinedData.map(d => d.date).sort();
                    const minDate = dates[0];
                    const maxDate = dates[dates.length - 1];
                    setStartDate(minDate);
                    setEndDate(maxDate);
                    setDateRange({ min: minDate, max: maxDate });
                }
            }, [combinedData]);

            const calculateTrailing7DayCPL = (data) => {
                const dateMap = new Map();
                
                // Group by date and calculate daily totals
                data.forEach(item => {
                    const dateKey = item.date;
                    if (!dateMap.has(dateKey)) {
                        dateMap.set(dateKey, { spend: 0, leads: 0, date: item.date });
                    }
                    const entry = dateMap.get(dateKey);
                    entry.spend += item.spend;
                    entry.leads += item.leads;
                });

                // Convert to array and sort
                const dailyData = Array.from(dateMap.values()).sort((a, b) => 
                    new Date(a.date) - new Date(b.date)
                );

                // Calculate trailing 7-day CPL
                return dailyData.map((day, index) => {
                    const startIdx = Math.max(0, index - 6);
                    const trailing7Days = dailyData.slice(startIdx, index + 1);
                    
                    const totalSpend = trailing7Days.reduce((sum, d) => sum + d.spend, 0);
                    const totalLeads = trailing7Days.reduce((sum, d) => sum + d.leads, 0);
                    const trailing7DayCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;

                    return {
                        date: day.date,
                        spend: day.spend,
                        leads: day.leads,
                        dailyCPL: day.leads > 0 ? day.spend / day.leads : 0,
                        trailing7DayCPL: trailing7DayCPL,
                        daysInWindow: trailing7Days.length
                    };
                });
            };

            useEffect(() => {
                let filtered = combinedData;

                // Filter by client
                if (selectedClient !== 'all') {
                    filtered = filtered.filter(item => item.client === selectedClient);
                }

                // Filter by date range
                if (startDate) {
                    filtered = filtered.filter(item => item.date >= startDate);
                }
                if (endDate) {
                    filtered = filtered.filter(item => item.date <= endDate);
                }

                const calculated = calculateTrailing7DayCPL(filtered);
                setFilteredData(calculated);
            }, [combinedData, selectedClient, startDate, endDate]);

            useEffect(() => {
                if (filteredData.length > 0 && chartRef.current) {
                    // Destroy previous chart
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: filteredData.map(d => d.date),
                            datasets: [
                                {
                                    label: 'Trailing 7-Day CPL',
                                    data: filteredData.map(d => d.trailing7DayCPL),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    borderWidth: 3,
                                    tension: 0.3,
                                    fill: true,
                                    pointRadius: 4,
                                    pointHoverRadius: 6
                                },
                                {
                                    label: 'Daily CPL',
                                    data: filteredData.map(d => d.dailyCPL),
                                    borderColor: 'rgb(156, 163, 175)',
                                    backgroundColor: 'rgba(156, 163, 175, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: false,
                                    pointRadius: 2,
                                    pointHoverRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        usePointStyle: true,
                                        padding: 15,
                                        font: {
                                            size: 12,
                                            weight: 'bold'
                                        }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    titleFont: { size: 14, weight: 'bold' },
                                    bodyFont: { size: 13 },
                                    callbacks: {
                                        label: function(context) {
                                            const dataPoint = filteredData[context.dataIndex];
                                            if (context.datasetIndex === 0) {
                                                return [
                                                    `Trailing 7-Day CPL: $${dataPoint.trailing7DayCPL.toFixed(2)}`,
                                                    `Days in window: ${dataPoint.daysInWindow}`
                                                ];
                                            } else {
                                                return [
                                                    `Daily CPL: $${dataPoint.dailyCPL.toFixed(2)}`,
                                                    `Qualified Leads: ${dataPoint.leads}`,
                                                    `Spend: $${dataPoint.spend.toFixed(2)}`
                                                ];
                                            }
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return '$' + value.toFixed(0);
                                        }
                                    },
                                    grid: {
                                        color: 'rgba(0, 0, 0, 0.05)'
                                    }
                                },
                                x: {
                                    grid: {
                                        display: false
                                    },
                                    ticks: {
                                        maxRotation: 45,
                                        minRotation: 45
                                    }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [filteredData]);

            const exportData = () => {
                const csvContent = [
                    ['Date', 'Spend', 'Qualified Leads', 'Daily CPL', 'Trailing 7-Day CPL', 'Days in Window'],
                    ...filteredData.map(d => [
                        d.date,
                        d.spend.toFixed(2),
                        d.leads,
                        d.dailyCPL.toFixed(2),
                        d.trailing7DayCPL.toFixed(2),
                        d.daysInWindow
                    ])
                ].map(row => row.join(',')).join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cpl_analysis_${selectedClient}_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            const handleFileUpload = (e, isLeadFile) => {
                const file = e.target.files[0];
                if (file) {
                    parseExcelFile(file, isLeadFile);
                }
            };

            const handleDrop = (e, isLeadFile) => {
                e.preventDefault();
                const file = e.dataTransfer.files[0];
                if (file) {
                    parseExcelFile(file, isLeadFile);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const hasData = spendData.length > 0 && leadData.length > 0;

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">CPL Analyzer - Qualified Leads</h1>
                            <p className="text-gray-600 mb-6">Analyze trailing 7-day Cost Per Lead for qualified leads only</p>

                            {!hasData ? (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Lead Data Upload */}
                                    <div>
                                        <h3 className="text-lg font-semibold mb-3 text-gray-700">
                                            1. Upload Lead Data
                                        </h3>
                                        <div 
                                            className="border-4 border-dashed border-green-300 rounded-lg p-8 text-center bg-green-50 hover:bg-green-100 transition-colors cursor-pointer"
                                            onDrop={(e) => handleDrop(e, true)}
                                            onDragOver={handleDragOver}
                                            onClick={() => document.getElementById('lead-file-input').click()}
                                        >
                                            {leadFileName ? (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <p className="text-sm font-semibold text-green-800">{leadFileName}</p>
                                                    <p className="text-xs text-green-600 mt-1">{leadData.length} qualified leads</p>
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                                    </svg>
                                                    <p className="font-semibold text-gray-700 mb-1">
                                                        Drop lead file here
                                                    </p>
                                                    <p className="text-xs text-gray-500">
                                                        Client, Status, Date
                                                    </p>
                                                </>
                                            )}
                                            <input 
                                                id="lead-file-input"
                                                type="file" 
                                                accept=".xlsx,.xls"
                                                onChange={(e) => handleFileUpload(e, true)}
                                                className="hidden"
                                            />
                                        </div>
                                    </div>

                                    {/* Spend Data Upload */}
                                    <div>
                                        <h3 className="text-lg font-semibold mb-3 text-gray-700">
                                            2. Upload Spend Data
                                        </h3>
                                        <div 
                                            className="border-4 border-dashed border-blue-300 rounded-lg p-8 text-center bg-blue-50 hover:bg-blue-100 transition-colors cursor-pointer"
                                            onDrop={(e) => handleDrop(e, false)}
                                            onDragOver={handleDragOver}
                                            onClick={() => document.getElementById('spend-file-input').click()}
                                        >
                                            {spendFileName ? (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <p className="text-sm font-semibold text-blue-800">{spendFileName}</p>
                                                    <p className="text-xs text-blue-600 mt-1">{spendData.length} spend records</p>
                                                </>
                                            ) : (
                                                <>
                                                    <svg className="w-12 h-12 mx-auto mb-3 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <p className="font-semibold text-gray-700 mb-1">
                                                        Drop spend file here
                                                    </p>
                                                    <p className="text-xs text-gray-500">
                                                        Date, Client, Spend
                                                    </p>
                                                </>
                                            )}
                                            <input 
                                                id="spend-file-input"
                                                type="file" 
                                                accept=".xlsx,.xls"
                                                onChange={(e) => handleFileUpload(e, false)}
                                                className="hidden"
                                            />
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                        <div className="bg-green-50 border border-green-200 rounded-lg p-3">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center">
                                                    <svg className="w-5 h-5 text-green-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <div>
                                                        <span className="text-sm font-semibold text-green-800">{leadFileName}</span>
                                                        <p className="text-xs text-green-600">{leadData.length} qualified leads</p>
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => {
                                                        setLeadData([]);
                                                        setLeadFileName('');
                                                    }}
                                                    className="text-xs text-red-600 hover:text-red-800 font-medium"
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-3">
                                            <div className="flex items-center justify-between">
                                                <div className="flex items-center">
                                                    <svg className="w-5 h-5 text-blue-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                    </svg>
                                                    <div>
                                                        <span className="text-sm font-semibold text-blue-800">{spendFileName}</span>
                                                        <p className="text-xs text-blue-600">{spendData.length} spend records</p>
                                                    </div>
                                                </div>
                                                <button
                                                    onClick={() => {
                                                        setSpendData([]);
                                                        setSpendFileName('');
                                                    }}
                                                    className="text-xs text-red-600 hover:text-red-800 font-medium"
                                                >
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {combinedData.length > 0 && (
                                        <div className="bg-purple-50 border border-purple-200 rounded-lg p-4 mb-6">
                                            <div className="flex items-center">
                                                <svg className="w-5 h-5 text-purple-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                                </svg>
                                                <span className="text-sm text-purple-800">
                                                    Data combined: {dateRange.min} to {dateRange.max} ({combinedData.length} date-client combinations)
                                                </span>
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Client
                                            </label>
                                            <select
                                                value={selectedClient}
                                                onChange={(e) => setSelectedClient(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            >
                                                <option value="all">All Clients</option>
                                                {clients.map(client => (
                                                    <option key={client} value={client}>{client}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                Start Date
                                            </label>
                                            <input
                                                type="date"
                                                value={startDate}
                                                min={dateRange.min}
                                                max={dateRange.max}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">
                                                End Date
                                            </label>
                                            <input
                                                type="date"
                                                value={endDate}
                                                min={dateRange.min}
                                                max={dateRange.max}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                            />
                                        </div>
                                    </div>

                                    {filteredData.length > 0 && (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                                <div className="bg-blue-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Avg 7-Day CPL</p>
                                                    <p className="text-2xl font-bold text-blue-600">
                                                        ${(filteredData.reduce((sum, d) => sum + d.trailing7DayCPL, 0) / filteredData.length).toFixed(2)}
                                                    </p>
                                                </div>
                                                <div className="bg-green-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Qualified Leads</p>
                                                    <p className="text-2xl font-bold text-green-600">
                                                        {filteredData.reduce((sum, d) => sum + d.leads, 0).toLocaleString()}
                                                    </p>
                                                </div>
                                                <div className="bg-purple-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Spend</p>
                                                    <p className="text-2xl font-bold text-purple-600">
                                                        ${filteredData.reduce((sum, d) => sum + d.spend, 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                    </p>
                                                </div>
                                                <div className="bg-orange-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Days Analyzed</p>
                                                    <p className="text-2xl font-bold text-orange-600">
                                                        {filteredData.length}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="bg-gray-50 rounded-lg p-6 mb-6" style={{height: '500px'}}>
                                                <canvas ref={chartRef}></canvas>
                                            </div>

                                            <div className="flex justify-end mb-6">
                                                <button
                                                    onClick={exportData}
                                                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold flex items-center"
                                                >
                                                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    Export CSV
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-sm">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-4 py-3 text-left font-semibold">Date</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Spend</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Qualified Leads</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Daily CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">7-Day CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Window</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredData.map((row, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-gray-50">
                                                                <td className="px-4 py-3">{row.date}</td>
                                                                <td className="px-4 py-3 text-right">${row.spend.toFixed(2)}</td>
                                                                <td className="px-4 py-3 text-right">{row.leads}</td>
                                                                <td className="px-4 py-3 text-right">
                                                                    {row.dailyCPL > 0 ? `$${row.dailyCPL.toFixed(2)}` : '-'}
                                                                </td>
                                                                <td className="px-4 py-3 text-right font-semibold text-blue-600">
                                                                    {row.trailing7DayCPL > 0 ? `$${row.trailing7DayCPL.toFixed(2)}` : '-'}
                                                                </td>
                                                                <td className="px-4 py-3 text-right text-gray-500">
                                                                    {row.daysInWindow} days
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CPLAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
