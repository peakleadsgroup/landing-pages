<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPL Analyzer - Qualified Leads</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Airtable Configuration
        const AIRTABLE_CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            apiKey: 'pato6OZtm7CrR83po.9400ea9366fb0dcec3f346273c8b427fb7804557897f19e99bcd8a886284b589',
            leadsTable: 'B2C Leads',
            spendTable: 'Campaign Spend',
            clientsTable: 'Clients'
        };

        function CPLAnalyzer() {
            const [dailyData, setDailyData] = useState([]);
            const [clients, setClients] = useState([]);
            const [selectedClient, setSelectedClient] = useState('all');
            const [startDate, setStartDate] = useState('');
            const [endDate, setEndDate] = useState('');
            const [minDate, setMinDate] = useState('');
            const [maxDate, setMaxDate] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [rawLeadData, setRawLeadData] = useState([]);
            const [rawSpendData, setRawSpendData] = useState([]);
            const [clientMap, setClientMap] = useState({});
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const formatDate = (dateValue) => {
                if (!dateValue) return null;
                try {
                    const date = new Date(dateValue);
                    if (isNaN(date.getTime())) return null;
                    return date.toISOString().split('T')[0];
                } catch {
                    return null;
                }
            };

            const fetchAirtableRecords = async (tableName) => {
                let allRecords = [];
                let offset = null;

                do {
                    let url = `https://api.airtable.com/v0/${AIRTABLE_CONFIG.baseId}/${encodeURIComponent(tableName)}`;
                    if (offset) {
                        url += `?offset=${offset}`;
                    }

                    const response = await fetch(url, {
                        headers: { 'Authorization': `Bearer ${AIRTABLE_CONFIG.apiKey}` }
                    });

                    if (!response.ok) {
                        throw new Error(`Failed to fetch ${tableName}: ${response.status}`);
                    }

                    const data = await response.json();
                    allRecords = allRecords.concat(data.records || []);
                    offset = data.offset;

                } while (offset);

                return allRecords;
            };

            const fetchDataFromAirtable = async () => {
                setLoading(true);
                setError(null);

                try {
                    // Fetch client names first to build the mapping
                    const clientRecords = await fetchAirtableRecords(AIRTABLE_CONFIG.clientsTable);
                    const newClientMap = {};
                    clientRecords.forEach(record => {
                        newClientMap[record.id] = record.fields['Name'] || record.fields['Client'] || 'Unknown';
                    });
                    setClientMap(newClientMap);
                    console.log('Client Map:', newClientMap);

                    // Fetch leads data
                    const leadsRecords = await fetchAirtableRecords(AIRTABLE_CONFIG.leadsTable);
                    
                    // Fetch spend data
                    const spendRecords = await fetchAirtableRecords(AIRTABLE_CONFIG.spendTable);

                    console.log('Sample lead record:', leadsRecords[0]?.fields);
                    console.log('Sample spend record:', spendRecords[0]?.fields);

                    // Process leads data - keep the record ID first, we'll map it later
                    const processedLeads = leadsRecords
                        .filter(record => record.fields['Status'] === 'Qualified')
                        .map(record => {
                            const clientId = record.fields['Linked Client'] ? 
                                (Array.isArray(record.fields['Linked Client']) ? 
                                    record.fields['Linked Client'][0] : 
                                    record.fields['Linked Client']) : 'Unknown';
                            
                            return {
                                clientId: clientId,
                                client: newClientMap[clientId] || clientId,
                                date: formatDate(record.fields['Created']),
                                status: record.fields['Status']
                            };
                        })
                        .filter(record => record.date !== null);

                    // Process spend data - keep the record ID first, we'll map it later
                    const processedSpend = spendRecords.map(record => {
                        const clientId = record.fields['Linked Client'] ? 
                            (Array.isArray(record.fields['Linked Client']) ? 
                                record.fields['Linked Client'][0] : 
                                record.fields['Linked Client']) : 'Unknown';
                        
                        return {
                            date: formatDate(record.fields['Created']),
                            clientId: clientId,
                            client: newClientMap[clientId] || clientId,
                            spend: parseFloat(record.fields['Spend']) || 0
                        };
                    })
                    .filter(record => record.date !== null);

                    console.log('Processed leads sample:', processedLeads.slice(0, 3));
                    console.log('Processed spend sample:', processedSpend.slice(0, 3));

                    setRawLeadData(processedLeads);
                    setRawSpendData(processedSpend);

                    // Process and combine data
                    processData(processedLeads, processedSpend);

                } catch (err) {
                    console.error('Error fetching data:', err);
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const processData = (leads, spend) => {
                // Aggregate leads by date and client
                const leadsByDateClient = {};
                leads.forEach(lead => {
                    const key = `${lead.date}|${lead.client}`;
                    leadsByDateClient[key] = (leadsByDateClient[key] || 0) + 1;
                });

                // Aggregate spend by date and client
                const spendByDateClient = {};
                spend.forEach(item => {
                    const key = `${item.date}|${item.client}`;
                    spendByDateClient[key] = (spendByDateClient[key] || 0) + item.spend;
                });

                console.log('Leads by date-client:', leadsByDateClient);
                console.log('Spend by date-client:', spendByDateClient);

                // Combine all unique date-client combinations
                const allKeys = new Set([...Object.keys(leadsByDateClient), ...Object.keys(spendByDateClient)]);
                const combined = [];
                
                allKeys.forEach(key => {
                    const [date, client] = key.split('|');
                    combined.push({
                        date: date,
                        client: client,
                        spend: spendByDateClient[key] || 0,
                        leads: leadsByDateClient[key] || 0
                    });
                });

                // Sort by date
                combined.sort((a, b) => a.date.localeCompare(b.date));

                // Get date range
                if (combined.length > 0) {
                    const allDates = combined.map(d => d.date).sort();
                    const min = allDates[0];
                    const max = allDates[allDates.length - 1];
                    setMinDate(min);
                    setMaxDate(max);
                    // Always set start date to 9/5/25
                    setStartDate('2025-09-05');
                    setEndDate(max);
                }

                // Get unique clients
                const uniqueClients = [...new Set(combined.map(item => item.client))].sort();
                setClients(uniqueClients);

                // Aggregate by date for daily totals
                const dailyMap = {};
                combined.forEach(item => {
                    if (!dailyMap[item.date]) {
                        dailyMap[item.date] = { date: item.date, spend: 0, leads: 0 };
                    }
                    dailyMap[item.date].spend += item.spend;
                    dailyMap[item.date].leads += item.leads;
                });

                const daily = Object.values(dailyMap).sort((a, b) => a.date.localeCompare(b.date));

                // Calculate trailing 7-day CPL
                const withTrailing = daily.map((day, index) => {
                    const startIdx = Math.max(0, index - 6);
                    const window = daily.slice(startIdx, index + 1);
                    
                    const totalSpend = window.reduce((sum, d) => sum + d.spend, 0);
                    const totalLeads = window.reduce((sum, d) => sum + d.leads, 0);
                    const trailing7DayCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;
                    const dailyCPL = day.leads > 0 ? day.spend / day.leads : 0;

                    return {
                        date: day.date,
                        spend: day.spend,
                        leads: day.leads,
                        dailyCPL: dailyCPL,
                        trailing7DayCPL: trailing7DayCPL,
                        daysInWindow: window.length
                    };
                });

                setDailyData(withTrailing);
            };

            // Calculate filtered data based on client and date selections
            const getFilteredData = () => {
                if (dailyData.length === 0) return [];

                // Filter by client if selected
                if (selectedClient !== 'all') {
                    const leadsByDate = {};
                    const spendByDate = {};

                    console.log('=== FILTERING FOR CLIENT ===');
                    console.log('Selected client:', selectedClient);
                    console.log('Total raw leads:', rawLeadData.length);
                    console.log('Total raw spend records:', rawSpendData.length);

                    // Filter leads
                    rawLeadData.forEach(lead => {
                        if (lead.client === selectedClient) {
                            leadsByDate[lead.date] = (leadsByDate[lead.date] || 0) + 1;
                        }
                    });

                    // Filter spend
                    rawSpendData.forEach(spend => {
                        if (spend.client === selectedClient) {
                            spendByDate[spend.date] = (spendByDate[spend.date] || 0) + spend.spend;
                        }
                    });

                    console.log('Filtered leads by date:', leadsByDate);
                    console.log('Filtered spend by date:', spendByDate);
                    console.log('Total filtered lead records:', Object.keys(leadsByDate).length);
                    console.log('Total filtered spend records:', Object.keys(spendByDate).length);

                    // Get all dates that have either leads or spend
                    const allDates = new Set([...Object.keys(leadsByDate), ...Object.keys(spendByDate)]);
                    const daily = Array.from(allDates).map(date => ({
                        date: date,
                        spend: spendByDate[date] || 0,
                        leads: leadsByDate[date] || 0
                    })).sort((a, b) => a.date.localeCompare(b.date));

                    console.log('Combined daily data points:', daily.length);
                    console.log('Sample combined data:', daily.slice(0, 3));

                    const withTrailing = daily.map((day, index) => {
                        const startIdx = Math.max(0, index - 6);
                        const window = daily.slice(startIdx, index + 1);
                        
                        const totalSpend = window.reduce((sum, d) => sum + d.spend, 0);
                        const totalLeads = window.reduce((sum, d) => sum + d.leads, 0);
                        const trailing7DayCPL = totalLeads > 0 ? totalSpend / totalLeads : 0;
                        const dailyCPL = day.leads > 0 ? day.spend / day.leads : 0;

                        return {
                            date: day.date,
                            spend: day.spend,
                            leads: day.leads,
                            dailyCPL: dailyCPL,
                            trailing7DayCPL: trailing7DayCPL,
                            daysInWindow: window.length
                        };
                    });

                    // Apply date filter AFTER calculating trailing metrics
                    const filtered = withTrailing.filter(item => {
                        if (startDate && item.date < startDate) return false;
                        if (endDate && item.date > endDate) return false;
                        return true;
                    });

                    console.log('Final filtered data points:', filtered.length);
                    console.log('=== END FILTERING ===');

                    return filtered;
                }

                // No client filter, just apply date filter
                return dailyData.filter(item => {
                    if (startDate && item.date < startDate) return false;
                    if (endDate && item.date > endDate) return false;
                    return true;
                });
            };

            const filteredData = getFilteredData();

            useEffect(() => {
                if (filteredData.length > 0 && chartRef.current) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: filteredData.map(d => d.date),
                            datasets: [
                                {
                                    label: 'Trailing 7-Day CPL',
                                    data: filteredData.map(d => d.trailing7DayCPL),
                                    borderColor: 'rgb(59, 130, 246)',
                                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                                    borderWidth: 3,
                                    tension: 0.3,
                                    fill: true,
                                    pointRadius: 3,
                                    pointHoverRadius: 6
                                },
                                {
                                    label: 'Daily CPL',
                                    data: filteredData.map(d => d.dailyCPL),
                                    borderColor: 'rgb(156, 163, 175)',
                                    backgroundColor: 'rgba(156, 163, 175, 0.1)',
                                    borderWidth: 2,
                                    tension: 0.3,
                                    fill: false,
                                    pointRadius: 2,
                                    pointHoverRadius: 4
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            interaction: {
                                mode: 'index',
                                intersect: false,
                            },
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        usePointStyle: true,
                                        padding: 15,
                                        font: { size: 12, weight: 'bold' }
                                    }
                                },
                                tooltip: {
                                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                    padding: 12,
                                    titleFont: { size: 14, weight: 'bold' },
                                    bodyFont: { size: 13 },
                                    callbacks: {
                                        label: function(context) {
                                            const dataPoint = filteredData[context.dataIndex];
                                            if (context.datasetIndex === 0) {
                                                return [
                                                    `Trailing 7-Day CPL: $${dataPoint.trailing7DayCPL.toFixed(2)}`,
                                                    `Window: ${dataPoint.daysInWindow} days`
                                                ];
                                            } else {
                                                return [
                                                    `Daily CPL: $${dataPoint.dailyCPL.toFixed(2)}`,
                                                    `Qualified Leads: ${dataPoint.leads}`,
                                                    `Spend: $${dataPoint.spend.toFixed(2)}`
                                                ];
                                            }
                                        }
                                    }
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return '$' + value.toFixed(0);
                                        }
                                    },
                                    grid: { color: 'rgba(0, 0, 0, 0.05)' }
                                },
                                x: {
                                    grid: { display: false },
                                    ticks: { maxRotation: 45, minRotation: 45 }
                                }
                            }
                        }
                    });
                }

                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [filteredData]);

            const exportData = () => {
                const csvContent = [
                    ['Date', 'Spend', 'Qualified Leads', 'Daily CPL', 'Trailing 7-Day CPL', 'Days in Window'],
                    ...filteredData.map(d => [
                        d.date,
                        d.spend.toFixed(2),
                        d.leads,
                        d.dailyCPL.toFixed(2),
                        d.trailing7DayCPL.toFixed(2),
                        d.daysInWindow
                    ])
                ].map(row => row.join(',')).join('\n');

                const blob = new Blob([csvContent], { type: 'text/csv' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `cpl_analysis_${selectedClient}_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
            };

            const hasData = dailyData.length > 0;

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-7xl mx-auto">
                        <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                            <h1 className="text-3xl font-bold text-gray-800 mb-2">CPL Analyzer</h1>
                            <p className="text-gray-600 mb-6">Trailing 7-Day Cost Per Lead for Qualified Leads (Powered by Airtable)</p>

                            {error && (
                                <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6">
                                    <div className="flex items-start gap-3">
                                        <svg className="w-5 h-5 text-red-600 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                                        </svg>
                                        <div>
                                            <h3 className="font-semibold text-red-900 mb-1">Error Loading Data</h3>
                                            <p className="text-sm text-red-800">{error}</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {!hasData ? (
                                <div className="text-center py-12">
                                    <svg className="w-16 h-16 text-blue-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"></path>
                                    </svg>
                                    <h3 className="text-xl font-semibold text-gray-900 mb-3">Load Data from Airtable</h3>
                                    <p className="text-gray-600 mb-6">Click the button below to fetch your leads and spend data</p>
                                    <button
                                        onClick={fetchDataFromAirtable}
                                        disabled={loading}
                                        className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold disabled:bg-gray-400 disabled:cursor-not-allowed flex items-center gap-2 mx-auto"
                                    >
                                        {loading ? (
                                            <>
                                                <svg className="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                                </svg>
                                                Loading...
                                            </>
                                        ) : (
                                            <>
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                                                </svg>
                                                Load Data from Airtable
                                            </>
                                        )}
                                    </button>
                                </div>
                            ) : (
                                <>
                                    <div className="bg-purple-50 border border-purple-200 rounded-lg p-3 mb-6">
                                        <div className="flex items-center justify-between">
                                            <span className="text-sm text-purple-800">
                                                📊 Data Range: {minDate} to {maxDate} ({dailyData.length} days)
                                            </span>
                                            <div className="flex gap-2">
                                                <button
                                                    onClick={fetchDataFromAirtable}
                                                    disabled={loading}
                                                    className="text-sm text-blue-600 hover:text-blue-800 font-medium disabled:text-gray-400"
                                                >
                                                    {loading ? 'Refreshing...' : 'Refresh Data'}
                                                </button>
                                                <button
                                                    onClick={() => {
                                                        setDailyData([]);
                                                        setRawLeadData([]);
                                                        setRawSpendData([]);
                                                    }}
                                                    className="text-sm text-red-600 hover:text-red-800 font-medium"
                                                >
                                                    Clear All
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Client</label>
                                            <select
                                                value={selectedClient}
                                                onChange={(e) => setSelectedClient(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            >
                                                <option value="all">All Clients</option>
                                                {clients.map(client => (
                                                    <option key={client} value={client}>{client}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Start Date</label>
                                            <input
                                                type="date"
                                                value={startDate}
                                                min={minDate}
                                                max={maxDate}
                                                onChange={(e) => setStartDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">End Date</label>
                                            <input
                                                type="date"
                                                value={endDate}
                                                min={minDate}
                                                max={maxDate}
                                                onChange={(e) => setEndDate(e.target.value)}
                                                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    </div>

                                    {filteredData.length > 0 && (
                                        <>
                                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                                                <div className="bg-blue-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Avg 7-Day CPL</p>
                                                    <p className="text-2xl font-bold text-blue-600">
                                                        ${(filteredData.reduce((sum, d) => sum + d.trailing7DayCPL, 0) / filteredData.length).toFixed(2)}
                                                    </p>
                                                </div>
                                                <div className="bg-green-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Qualified Leads</p>
                                                    <p className="text-2xl font-bold text-green-600">
                                                        {filteredData.reduce((sum, d) => sum + d.leads, 0).toLocaleString()}
                                                    </p>
                                                </div>
                                                <div className="bg-purple-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Total Spend</p>
                                                    <p className="text-2xl font-bold text-purple-600">
                                                        ${filteredData.reduce((sum, d) => sum + d.spend, 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}
                                                    </p>
                                                </div>
                                                <div className="bg-orange-50 rounded-lg p-4">
                                                    <p className="text-sm text-gray-600 mb-1">Days Analyzed</p>
                                                    <p className="text-2xl font-bold text-orange-600">
                                                        {filteredData.length}
                                                    </p>
                                                </div>
                                            </div>

                                            <div className="bg-gray-50 rounded-lg p-6 mb-6" style={{height: '500px'}}>
                                                <canvas ref={chartRef}></canvas>
                                            </div>

                                            <div className="flex justify-end mb-6">
                                                <button
                                                    onClick={exportData}
                                                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold flex items-center"
                                                >
                                                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                                    </svg>
                                                    Export CSV
                                                </button>
                                            </div>

                                            <div className="overflow-x-auto">
                                                <table className="w-full text-sm">
                                                    <thead className="bg-gray-100">
                                                        <tr>
                                                            <th className="px-4 py-3 text-left font-semibold">Date</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Spend</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Leads</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Daily CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">7-Day CPL</th>
                                                            <th className="px-4 py-3 text-right font-semibold">Window</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredData.map((row, idx) => (
                                                            <tr key={idx} className="border-b hover:bg-gray-50">
                                                                <td className="px-4 py-3">{row.date}</td>
                                                                <td className="px-4 py-3 text-right">${row.spend.toFixed(2)}</td>
                                                                <td className="px-4 py-3 text-right">{row.leads}</td>
                                                                <td className="px-4 py-3 text-right">
                                                                    {row.dailyCPL > 0 ? `$${row.dailyCPL.toFixed(2)}` : '-'}
                                                                </td>
                                                                <td className="px-4 py-3 text-right font-semibold text-blue-600">
                                                                    {row.trailing7DayCPL > 0 ? `$${row.trailing7DayCPL.toFixed(2)}` : '-'}
                                                                </td>
                                                                <td className="px-4 py-3 text-right text-gray-500">
                                                                    {row.daysInWindow} days
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CPLAnalyzer />, document.getElementById('root'));
    </script>
</body>
</html>
