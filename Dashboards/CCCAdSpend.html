<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>CCC Ad Spend</title>
    <link rel="icon" type="image/png" href="https://peakleadsgroup.com/Images/PLG%20FAVICON%20(3).png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-6">
        <div class="max-w-lg mx-auto">
            <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                    <div class="flex items-center gap-4">
                        <img src="https://peakleadsgroup.com/Images/Peak%20Leads%20Flattened%20Logo.png" alt="Peak Leads Logo" class="h-10 w-auto">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">CCC Ad Spend</h1>
                            <p class="text-gray-600 text-sm mt-1">Starts on 3/26</p>
                        </div>
                    </div>
                    <button type="button" onclick="loadSpend()" id="refreshBtn" class="flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors shrink-0">
                        <svg id="refreshIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Refresh
                    </button>
                </div>
            </div>

            <div id="errorMessage" class="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 hidden">
                <h3 class="font-semibold text-red-900 mb-1" id="errorTitle">Could not load spend</h3>
                <p class="text-sm text-red-800" id="errorText"></p>
            </div>

            <div id="loadingState" class="bg-white rounded-lg shadow-sm p-10 text-center">
                <svg class="w-8 h-8 text-blue-600 animate-spin mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                <p class="text-gray-600 text-sm">Loading ad spend and qualified lead count…</p>
            </div>

            <div id="dataPanel" class="hidden space-y-4">
                <div class="bg-white rounded-lg shadow-sm divide-y divide-gray-100">
                    <div class="p-5 flex justify-between items-baseline gap-4">
                        <span class="text-gray-600 font-medium">Unbranded</span>
                        <span class="text-xl font-semibold text-gray-900 tabular-nums" id="valUnbranded">—</span>
                    </div>
                    <div class="p-5 flex justify-between items-baseline gap-4">
                        <span class="text-gray-600 font-medium">Branded</span>
                        <span class="text-xl font-semibold text-gray-900 tabular-nums" id="valBranded">—</span>
                    </div>
                    <div class="p-5 flex justify-between items-baseline gap-4 bg-gray-50">
                        <span class="text-gray-900 font-semibold">Total Spend</span>
                        <span class="text-2xl font-bold text-gray-900 tabular-nums" id="valTotal">—</span>
                    </div>
                    <div class="p-5 flex justify-between items-baseline gap-4">
                        <span class="text-gray-600 font-medium">Agency Fee (25%)</span>
                        <span class="text-xl font-semibold text-indigo-700 tabular-nums" id="valAgencyFee">—</span>
                    </div>
                    <div class="p-5 flex justify-between items-baseline gap-4">
                        <span class="text-gray-600 font-medium">Amount Paid</span>
                        <span class="text-xl font-semibold text-gray-900 tabular-nums" id="valAmountPaid">$0.00</span>
                    </div>
                    <div class="p-5 flex justify-between items-baseline gap-4 bg-gray-50">
                        <span class="text-gray-900 font-semibold">Amount Due</span>
                        <span class="text-2xl font-bold text-gray-900 tabular-nums" id="valAmountDue">—</span>
                    </div>
                    <div class="p-5 flex justify-between items-baseline gap-4">
                        <span class="text-gray-600 font-medium">CPL</span>
                        <div class="text-right shrink-0">
                            <span class="text-xl font-semibold text-gray-900 tabular-nums block" id="valCpl">—</span>
                            <span class="text-sm text-gray-500 tabular-nums" id="valLeadCount"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://hook.us2.make.com/ooadlf089ql95kwrgnu65boesj9ruk1w';
        const FETCH_TIMEOUT_MS = 6 * 60 * 1000;
        /** Replace with a fetched value when wired to your source; total spend + agency fee − this = Amount Due. */
        const AMOUNT_PAID = 0;

        /** Same table/base/linked-field pattern as Dashboards/recordID.html */
        const CONFIG = {
            baseId: 'appmBb0lzqRK9dI8v',
            leadsTableName: 'B2C Leads',
            clientsTableName: 'Clients',
            linkedFieldName: 'Linked Client',
            clientNameField: 'Name'
        };

        /** Creative Concepts Contracting — Clients table record ID (Linked Client on leads). */
        const LINKED_CLIENT_RECORD_ID = 'recN5TuwlaK1BW6g';
        /** March 26 (inclusive), Eastern. Year: null = current calendar year in the browser (fixes wrong-year filters). */
        const CPL_WINDOW_YEAR = null;
        const CPL_MONTH = 3;
        const CPL_DAY = 26;

        const LOG_PREFIX = '[CCC CPL]';

        function getCplWindowYear() {
            return CPL_WINDOW_YEAR == null ? new Date().getFullYear() : CPL_WINDOW_YEAR;
        }

        function logCpl(level, message, data) {
            const fn = console[level] || console.log;
            if (data !== undefined) fn(LOG_PREFIX, message, data);
            else fn(LOG_PREFIX, message);
        }

        function formatMoney(n) {
            return '$' + n.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function parseCurrency(value) {
            if (value === null || value === undefined) return null;
            if (typeof value === 'number' && !Number.isNaN(value)) return value;
            if (typeof value === 'string') {
                const cleaned = value.replace(/[\$,]/g, '').trim();
                const num = parseFloat(cleaned);
                return Number.isNaN(num) ? null : num;
            }
            return null;
        }

        function parseWebhookJsonBody(text) {
            const t = (text || '').replace(/^\uFEFF/, '').trim();
            if (!t) {
                throw new Error(
                    'Webhook returned an empty body. In Make, add a Webhook response module and return JSON: {"unbranded":…,"branded":…}.'
                );
            }
            const lower = t.toLowerCase();
            if (lower === 'accepted' || lower === 'ok' || lower === 'success') {
                throw new Error(
                    'Webhook replied with "' + t + '" instead of JSON. Add a Webhook response in Make with body {"unbranded":"{{2.spend}}","branded":"{{4.spend}}"}.'
                );
            }
            try {
                return JSON.parse(t);
            } catch {
                const i = t.indexOf('{');
                const j = t.lastIndexOf('}');
                if (i >= 0 && j > i) {
                    try {
                        return JSON.parse(t.slice(i, j + 1));
                    } catch { /* fall through */ }
                }
                throw new Error('Response was not valid JSON.');
            }
        }

        function unwrapPayload(raw) {
            let data = raw;
            if (Array.isArray(data) && data.length && typeof data[0] === 'object' && data[0] !== null) {
                data = data[0];
            }
            if (data != null && typeof data === 'object' && data.body != null) {
                const b = data.body;
                if (typeof b === 'string') {
                    try {
                        data = JSON.parse(b);
                    } catch {
                        data = raw;
                    }
                } else if (typeof b === 'object') {
                    data = b;
                }
            }
            return data;
        }

        function setLoading(loading) {
            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');
            document.getElementById('loadingState').classList.toggle('hidden', !loading);
            document.getElementById('dataPanel').classList.toggle('hidden', loading);
            btn.disabled = loading;
            if (icon) icon.classList.toggle('animate-spin', loading);
        }

        function showError(msg, partial) {
            document.getElementById('errorTitle').textContent = partial ? 'Spend OK — lead data issue' : 'Could not load spend';
            document.getElementById('errorMessage').classList.remove('hidden');
            document.getElementById('errorText').textContent = msg;
        }

        function clearError() {
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('errorText').textContent = '';
            document.getElementById('errorTitle').textContent = 'Could not load spend';
        }

        function getCplStartEastern() {
            const y = getCplWindowYear();
            return luxon.DateTime.fromObject(
                { year: y, month: CPL_MONTH, day: CPL_DAY },
                { zone: 'America/New_York' }
            ).startOf('day');
        }

        /** Loose lower bound for Airtable (2 days before 3/26 ET); precise cutoff is applied in JS. */
        function getAirtableCreatedCutoffIsoDate() {
            const start = getCplStartEastern();
            return start.minus({ days: 2 }).toFormat('yyyy-MM-dd');
        }

        function recordCreatedOnOrAfterCplStart(record) {
            const raw = record.fields['Created'];
            if (raw == null || raw === '') return false;
            const { DateTime } = luxon;
            const dt = DateTime.fromISO(String(raw), { zone: 'utc' }).setZone('America/New_York');
            if (!dt.isValid) return false;
            const start = getCplStartEastern();
            return dt >= start;
        }

        /**
         * recordID.html (useRecordId path): Linked Client in the API is an array of record IDs.
         */
        function leadRecordMatchesClient(record) {
            const linkedField = record.fields[CONFIG.linkedFieldName];
            if (!linkedField) return false;
            if (Array.isArray(linkedField)) {
                return linkedField.includes(LINKED_CLIENT_RECORD_ID);
            }
            return false;
        }

        /** Mirrors recordID.html fetchClientName — name is what ARRAYJOIN({Linked Client}) searches in formulas. */
        async function fetchClientDisplayName(clientRecordId) {
            const url = `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.clientsTableName)}/${clientRecordId}`;
            logCpl('log', 'Fetching client row for display name', { url });
            const response = await fetch(url);
            if (!response.ok) {
                const t = await response.text();
                throw new Error(`Failed to fetch client: ${response.status} ${(t || '').slice(0, 120)}`);
            }
            const data = await response.json();
            const clientName =
                data.fields[CONFIG.clientNameField]
                || data.fields['Name']
                || data.fields['Client']
                || data.fields['Company Name']
                || data.fields['Company'];
            if (!clientName) {
                throw new Error(`Client name field not found. Available fields: ${Object.keys(data.fields).join(', ')}`);
            }
            return String(clientName).trim();
        }

        /** Same as recordID.html filterFormula when useRecordId is false. */
        function buildFindLinkedClientFormula(clientDisplayName) {
            const escaped = String(clientDisplayName).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            return `FIND("${escaped}", ARRAYJOIN({${CONFIG.linkedFieldName}}))`;
        }

        function statusIsQualified(record) {
            const s = record.fields['Status'];
            if (s == null) return false;
            if (Array.isArray(s)) {
                return s.some(x => String(x).trim().toLowerCase() === 'qualified');
            }
            return String(s).trim().toLowerCase() === 'qualified';
        }

        /**
         * @param {number} [maxPages] Stop after this many pages (safety for wide filters).
         */
        async function airtableListLeads(filterFormula, pageSize, label, maxPages) {
            let offset = null;
            const records = [];
            let page = 0;
            const limit = maxPages == null ? Infinity : maxPages;
            do {
                page += 1;
                if (page > limit) {
                    logCpl('warn', `Pagination cap reached (${label})`, { maxPages: limit, rowsFetched: records.length });
                    break;
                }
                let url =
                    `/api/airtable/v0/${CONFIG.baseId}/${encodeURIComponent(CONFIG.leadsTableName)}` +
                    `?filterByFormula=${encodeURIComponent(filterFormula)}&pageSize=${pageSize}`;
                if (offset) url += `&offset=${encodeURIComponent(offset)}`;
                logCpl('log', `Airtable request (${label}) page ${page}`, { urlTail: decodeURIComponent(url.slice(Math.max(0, url.length - 200))) });
                const response = await fetch(url);
                if (!response.ok) {
                    const t = await response.text();
                    logCpl('error', `Airtable HTTP error (${label})`, { status: response.status, body: (t || '').slice(0, 500) });
                    throw new Error(`Leads query failed (${response.status}): ${(t || '').slice(0, 120)}`);
                }
                const data = await response.json();
                const batch = data.records || [];
                records.push(...batch);
                logCpl('log', `Airtable response (${label}) page ${page}`, { batchSize: batch.length, totalSoFar: records.length, hasMore: !!data.offset });
                offset = data.offset || null;
            } while (offset);
            return records;
        }

        async function logProbeRecentFieldNames() {
            try {
                const py = getCplWindowYear();
                const probeStart = `${py}-03-01`;
                const rows = await airtableListLeads(`IS_AFTER({Created}, "${probeStart}")`, 5, 'probe recent field keys', 1);
                if (!rows.length) {
                    logCpl('warn', `Probe recent: no rows Created after ${probeStart} — widen probe or check base/year`, { probeStart });
                    return;
                }
                logCpl('warn', 'Probe recent: first record field keys (check link field name)', {
                    recordId: rows[0].id,
                    fieldKeys: Object.keys(rows[0].fields),
                    samples: rows.map(r => ({
                        id: r.id,
                        Status: r.fields['Status'],
                        Created: r.fields['Created'],
                        linkedClient: r.fields[CONFIG.linkedFieldName]
                    }))
                });
            } catch (e) {
                logCpl('error', 'Probe recent fields failed', e.message || String(e));
            }
        }

        /** When strict count is 0, same filter as recordID (name FIND) + Qualified, no date. */
        async function logDiagnosticNoDateFilter(clientFindFormula) {
            const formula = `AND({Status}="Qualified", ${clientFindFormula})`;
            try {
                const recs = await airtableListLeads(formula, 100, 'diagnostic no-date');
                logCpl('warn', 'Diagnostic: Qualified + FIND(client name in ARRAYJOIN(Linked Client))', {
                    count: recs.length,
                    sample: recs.slice(0, 15).map(r => ({
                        id: r.id,
                        Status: r.fields['Status'],
                        Created: r.fields['Created'],
                        linkedClient: r.fields[CONFIG.linkedFieldName]
                    }))
                });
            } catch (e) {
                logCpl('error', 'Diagnostic fetch failed', e.message || String(e));
            }
        }

        function countQualifiedCccFromPool(pool, label) {
            const matched = pool.filter(
                r => leadRecordMatchesClient(r) && statusIsQualified(r) && recordCreatedOnOrAfterCplStart(r)
            );
            logCpl('log', `JS filter (${label})`, {
                poolSize: pool.length,
                matchedCount: matched.length,
                statusHistogram: pool.slice(0, 80).reduce((acc, r) => {
                    const k = r.fields['Status'] == null ? '(empty)' : String(r.fields['Status']);
                    acc[k] = (acc[k] || 0) + 1;
                    return acc;
                }, {}),
                clientIdHitsInPool: pool.filter(leadRecordMatchesClient).length
            });
            return matched.length;
        }

        async function fetchQualifiedCccLeadCount() {
            const clientDisplayName = await fetchClientDisplayName(LINKED_CLIENT_RECORD_ID);
            const clientFindFormula = buildFindLinkedClientFormula(clientDisplayName);

            const y = getCplWindowYear();
            const cutoff = getAirtableCreatedCutoffIsoDate();
            const startEt = getCplStartEastern();
            logCpl('log', 'Lead count config (recordID-style client match)', {
                LINKED_CLIENT_RECORD_ID,
                clientDisplayName,
                clientFindFormula,
                cplWindowYear: y,
                cplStartEasternISO: startEt.toISO(),
                airtableIS_AFTER_Created: cutoff,
                browserNow: new Date().toISOString()
            });

            const strictFormula =
                `AND({Status}="Qualified", ${clientFindFormula}, IS_AFTER({Created}, "${cutoff}"))`;
            logCpl('log', 'filterByFormula (strict)', strictFormula);

            const records = await airtableListLeads(strictFormula, 100, 'strict');

            let postFilter = records.filter(r => recordCreatedOnOrAfterCplStart(r));
            postFilter = postFilter.filter(leadRecordMatchesClient).filter(statusIsQualified);

            logCpl('log', 'Strict query summary', {
                recordsFromApi: records.length,
                afterEasternDateFilter: records.filter(recordCreatedOnOrAfterCplStart).length,
                note: 'JS verifies Linked Client includes rec id (recordID useRecordId pattern)'
            });

            const maxSamples = 12;
            records.slice(0, maxSamples).forEach((r, i) => {
                const raw = r.fields['Created'];
                const { DateTime } = luxon;
                const dt = raw != null ? DateTime.fromISO(String(raw), { zone: 'utc' }).setZone('America/New_York') : null;
                logCpl('log', `Sample row ${i + 1}/${Math.min(records.length, maxSamples)}`, {
                    id: r.id,
                    Status: r.fields['Status'],
                    linkedClient: r.fields[CONFIG.linkedFieldName],
                    CreatedRaw: raw,
                    createdEastern: dt && dt.isValid ? dt.toISO() : null,
                    leadRecordMatchesClient: leadRecordMatchesClient(r),
                    statusQualified: statusIsQualified(r),
                    passesEasternCutoff: recordCreatedOnOrAfterCplStart(r)
                });
            });

            if (records.length > 0 && postFilter.length === 0) {
                logCpl('warn', 'Strict API returned rows but none passed JS — check Linked Client array includes LINKED_CLIENT_RECORD_ID');
            }

            if (postFilter.length > 0) {
                return postFilter.length;
            }

            if (records.length === 0) {
                logCpl('warn', 'Strict filter returned 0 rows — running no-date diagnostic');
                await logDiagnosticNoDateFilter(clientFindFormula);
            }

            const poolFormula = `AND({Status}="Qualified", IS_AFTER({Created}, "${cutoff}"))`;
            logCpl('warn', 'Trying pool: Qualified + Created (client match in JS via Linked Client rec ids)', { poolFormula });
            const pool = await airtableListLeads(poolFormula, 100, 'qualified+created pool');
            let count = countQualifiedCccFromPool(pool, 'qualified+created pool');
            if (count > 0) {
                logCpl('warn', 'Using JS client match on Qualified+Created pool', { count });
                return count;
            }

            const fallbackFormula = `AND(${clientFindFormula}, IS_AFTER({Created}, "${cutoff}"))`;
            logCpl('warn', 'Trying fallback: FIND(name)+Created; Qualified in JS', { fallbackFormula });
            const wide = await airtableListLeads(fallbackFormula, 100, 'client+created');
            count = wide.filter(r => statusIsQualified(r) && recordCreatedOnOrAfterCplStart(r)).length;
            logCpl('log', 'Fallback client+created summary', {
                rowsFromApi: wide.length,
                afterQualifiedAndEastern: count
            });
            if (count > 0) {
                logCpl('warn', 'Using fallback count', { count });
                return count;
            }

            logCpl('warn', 'Last resort: Created-only window (max 30 pages × 100), all filters in JS');
            const dateOnly = await airtableListLeads(`IS_AFTER({Created}, "${cutoff}")`, 100, 'created-only', 30);
            count = countQualifiedCccFromPool(dateOnly, 'created-only capped');
            if (count > 0) {
                logCpl('warn', 'Using created-only capped pool count', { count });
                return count;
            }

            await logProbeRecentFieldNames();
            logCpl('error', 'Still 0 leads: confirm client name from Clients table matches ARRAYJOIN text; see recordID.html filterFormula.');
            return 0;
        }

        function applySpendToDom(unbranded, branded, total, agencyFee, amountDue) {
            document.getElementById('valUnbranded').textContent = formatMoney(unbranded);
            document.getElementById('valBranded').textContent = formatMoney(branded);
            document.getElementById('valTotal').textContent = formatMoney(total);
            document.getElementById('valAgencyFee').textContent = formatMoney(agencyFee);
            document.getElementById('valAmountPaid').textContent = formatMoney(AMOUNT_PAID);
            document.getElementById('valAmountDue').textContent = formatMoney(amountDue);
        }

        function applyCplToDom(leadCount, totalSpend) {
            const cplEl = document.getElementById('valCpl');
            const countEl = document.getElementById('valLeadCount');
            if (leadCount === null) {
                cplEl.textContent = '—';
                countEl.textContent = '';
                return;
            }
            countEl.textContent =
                leadCount === 1 ? '1 qualified lead' : `${leadCount} qualified leads`;
            if (leadCount === 0) {
                cplEl.textContent = '—';
                return;
            }
            cplEl.textContent = formatMoney(totalSpend / leadCount);
        }

        async function fetchSpendFromWebhook(signal) {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { Accept: 'application/json' },
                signal
            });
            const text = await response.text();
            if (!response.ok) {
                throw new Error('HTTP ' + response.status + ': ' + (text || '').slice(0, 120));
            }
            const parsed = unwrapPayload(parseWebhookJsonBody(text));
            if (parsed == null || typeof parsed !== 'object') {
                throw new Error('Webhook JSON was not an object.');
            }
            const unbranded = parseCurrency(parsed.unbranded);
            const branded = parseCurrency(parsed.branded);
            if (unbranded === null || branded === null) {
                throw new Error('Expected numeric (or currency string) fields "unbranded" and "branded" in the JSON response.');
            }
            const total = unbranded + branded;
            const agencyFee = total * 0.25;
            const amountDue = total + agencyFee - AMOUNT_PAID;
            return { unbranded, branded, total, agencyFee, amountDue };
        }

        async function loadSpend() {
            clearError();
            setLoading(true);

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

            try {
                const [spendResult, leadsResult] = await Promise.allSettled([
                    fetchSpendFromWebhook(controller.signal),
                    fetchQualifiedCccLeadCount()
                ]);

                if (spendResult.status === 'rejected') {
                    const e = spendResult.reason;
                    const msg =
                        e && e.name === 'AbortError'
                            ? 'Request timed out. If Make takes longer, increase FETCH_TIMEOUT_MS in this page or shorten the scenario.'
                            : (e && e.message) || String(e);
                    showError(msg);
                    document.getElementById('dataPanel').classList.add('hidden');
                    return;
                }

                const { unbranded, branded, total, agencyFee, amountDue } = spendResult.value;
                applySpendToDom(unbranded, branded, total, agencyFee, amountDue);
                document.getElementById('dataPanel').classList.remove('hidden');

                if (leadsResult.status === 'fulfilled') {
                    const leadCount = leadsResult.value;
                    applyCplToDom(leadCount, total);
                } else {
                    applyCplToDom(null, total);
                    const why = (leadsResult.reason && leadsResult.reason.message) || String(leadsResult.reason);
                    showError('Lead count failed: ' + why, true);
                }
            } catch (e) {
                const msg =
                    e && e.name === 'AbortError'
                        ? 'Request timed out. If Make takes longer, increase FETCH_TIMEOUT_MS in this page or shorten the scenario.'
                        : (e && e.message) || String(e);
                showError(msg);
                document.getElementById('dataPanel').classList.add('hidden');
            } finally {
                clearTimeout(timeoutId);
                setLoading(false);
            }
        }

        loadSpend();
    </script>
</body>
</html>
