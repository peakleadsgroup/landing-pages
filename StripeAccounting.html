<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance History Processor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef } = React;

        function App() {
            const [data, setData] = useState([]);
            const [fileName, setFileName] = useState('');
            const fileInputRef = useRef(null);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setFileName(file.name);

                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const processedData = results.data.map(row => ({
                            date: row['Created (UTC)'] ? row['Created (UTC)'].split(' ')[0] : '',
                            type: row['Type'] || '',
                            description: row['Description'] || '',
                            amount: row['Amount'] || '',
                            fee: row['Fee'] || '',
                            net: row['Net'] || '',
                            customerName: row['cardholder_name (metadata)'] || '',
                            business: 'PLG' // Default to PLG
                        }));
                        setData(processedData);
                    },
                    error: (error) => {
                        alert('Error parsing CSV: ' + error.message);
                    }
                });
            };

            const handleBusinessChange = (index, value) => {
                const newData = [...data];
                newData[index].business = value;
                setData(newData);
            };

            const exportToExcel = () => {
                if (data.length === 0) {
                    alert('Please upload a CSV file first');
                    return;
                }

                // Prepare data for Excel with proper headers
                const excelData = data.map(row => ({
                    'Date': row.date,
                    'Type': row.type,
                    'Description': row.description,
                    'Amount': row.amount,
                    'Fee': row.fee,
                    'Net': row.net,
                    'Customer Name': row.customerName,
                    'Business': row.business
                }));

                // Create workbook
                const wb = XLSX.utils.book_new();
                
                // Sheet 1: Transactions
                const ws = XLSX.utils.json_to_sheet(excelData);
                ws['!cols'] = [
                    { wch: 12 }, // Date
                    { wch: 12 }, // Type
                    { wch: 40 }, // Description
                    { wch: 12 }, // Amount
                    { wch: 10 }, // Fee
                    { wch: 12 }, // Net
                    { wch: 20 }, // Customer Name
                    { wch: 10 }  // Business
                ];
                XLSX.utils.book_append_sheet(wb, ws, 'Transactions');

                // Sheet 2: Tax Summary with formulas
                const taxSummaryData = [
                    ['Tax Category Summary', '', '', ''],
                    ['', '', '', ''],
                    ['Tax Category', 'Description', 'SSL Total', 'PLG Total'],
                    ['Income', 'Customer payments (charges & payments)', '', ''],
                    ['Refunds (Contra Income)', 'Money given back to customers', '', ''],
                    ['Expense - Merchant Fees', 'Stripe processing fees', '', ''],
                    ['Expense/Refund - Adjustments', 'Disputes & chargebacks', '', ''],
                    ['', '', '', ''],
                    ['TOTAL NET INCOME', '', '', '']
                ];

                const wsTax = XLSX.utils.aoa_to_sheet(taxSummaryData);

                // Add formulas for SSL column (column C, starting at row 4)
                // Row 4: Income (charges + payments)
                wsTax['C4'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"charge",Transactions!H:H,"SSL")+SUMIFS(Transactions!F:F,Transactions!B:B,"payment",Transactions!H:H,"SSL")`,
                    t: 'n'
                };
                
                // Row 5: Refunds
                wsTax['C5'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"refund",Transactions!H:H,"SSL")`,
                    t: 'n'
                };
                
                // Row 6: Stripe Fees
                wsTax['C6'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"stripe_fee",Transactions!H:H,"SSL")`,
                    t: 'n'
                };
                
                // Row 7: Adjustments
                wsTax['C7'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"adjustment",Transactions!H:H,"SSL")`,
                    t: 'n'
                };
                
                // Row 9: Total
                wsTax['C9'] = { 
                    f: `SUM(C4:C7)`,
                    t: 'n'
                };

                // Add formulas for PLG column (column D)
                // Row 4: Income (charges + payments)
                wsTax['D4'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"charge",Transactions!H:H,"PLG")+SUMIFS(Transactions!F:F,Transactions!B:B,"payment",Transactions!H:H,"PLG")`,
                    t: 'n'
                };
                
                // Row 5: Refunds
                wsTax['D5'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"refund",Transactions!H:H,"PLG")`,
                    t: 'n'
                };
                
                // Row 6: Stripe Fees
                wsTax['D6'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"stripe_fee",Transactions!H:H,"PLG")`,
                    t: 'n'
                };
                
                // Row 7: Adjustments
                wsTax['D7'] = { 
                    f: `SUMIFS(Transactions!F:F,Transactions!B:B,"adjustment",Transactions!H:H,"PLG")`,
                    t: 'n'
                };
                
                // Row 9: Total
                wsTax['D9'] = { 
                    f: `SUM(D4:D7)`,
                    t: 'n'
                };

                // Set column widths for tax summary
                wsTax['!cols'] = [
                    { wch: 30 }, // Tax Category
                    { wch: 40 }, // Description
                    { wch: 15 }, // SSL Total
                    { wch: 15 }  // PLG Total
                ];

                XLSX.utils.book_append_sheet(wb, wsTax, 'Tax Summary');

                // Generate file name with current date
                const today = new Date().toISOString().split('T')[0];
                XLSX.writeFile(wb, `balance_history_${today}.xlsx`);
            };

            const getTypeColor = (type) => {
                switch (type.toLowerCase()) {
                    case 'charge':
                    case 'payment':
                        return 'bg-green-50 text-green-700';
                    case 'payout':
                        return 'bg-blue-50 text-blue-700';
                    case 'refund':
                        return 'bg-red-50 text-red-700';
                    case 'stripe_fee':
                        return 'bg-yellow-50 text-yellow-700';
                    case 'adjustment':
                        return 'bg-purple-50 text-purple-700';
                    default:
                        return 'bg-gray-50 text-gray-700';
                }
            };

            const calculateTotals = () => {
                const totals = {
                    ssl: { amount: 0, net: 0, count: 0 },
                    plg: { amount: 0, net: 0, count: 0 },
                    unassigned: { amount: 0, net: 0, count: 0 }
                };

                data.forEach(row => {
                    const amount = parseFloat(row.amount) || 0;
                    const net = parseFloat(row.net) || 0;
                    
                    if (row.business === 'SSL') {
                        totals.ssl.amount += amount;
                        totals.ssl.net += net;
                        totals.ssl.count++;
                    } else if (row.business === 'PLG') {
                        totals.plg.amount += amount;
                        totals.plg.net += net;
                        totals.plg.count++;
                    } else {
                        totals.unassigned.amount += amount;
                        totals.unassigned.net += net;
                        totals.unassigned.count++;
                    }
                });

                return totals;
            };

            const totals = data.length > 0 ? calculateTotals() : null;

            return (
                <div className="min-h-screen p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <h1 className="text-3xl font-bold text-gray-900 mb-2">Balance History Processor</h1>
                            <p className="text-gray-600">Upload your Stripe CSV and categorize transactions for your accountant</p>
                        </div>

                        {/* Upload Section */}
                        <div className="bg-white rounded-lg shadow-sm p-6 mb-6">
                            <div className="flex items-center gap-4">
                                <input
                                    type="file"
                                    accept=".csv"
                                    onChange={handleFileUpload}
                                    ref={fileInputRef}
                                    className="hidden"
                                />
                                <button
                                    onClick={() => fileInputRef.current.click()}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium transition-colors"
                                >
                                    Upload CSV File
                                </button>
                                {fileName && (
                                    <span className="text-gray-600">
                                        <span className="font-medium">File:</span> {fileName}
                                    </span>
                                )}
                                {data.length > 0 && (
                                    <>
                                        <div className="flex-1"></div>
                                        <button
                                            onClick={exportToExcel}
                                            className="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-lg font-medium transition-colors"
                                        >
                                            Export to Excel
                                        </button>
                                    </>
                                )}
                            </div>
                        </div>

                        {/* Summary Stats */}
                        {totals && (
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                <div className="bg-white rounded-lg shadow-sm p-6">
                                    <h3 className="text-sm font-medium text-gray-500 mb-2">SSL Transactions</h3>
                                    <div className="text-2xl font-bold text-gray-900">
                                        ${totals.ssl.net.toFixed(2)}
                                    </div>
                                    <div className="text-sm text-gray-500 mt-1">
                                        {totals.ssl.count} transactions
                                    </div>
                                </div>
                                <div className="bg-white rounded-lg shadow-sm p-6">
                                    <h3 className="text-sm font-medium text-gray-500 mb-2">PLG Transactions</h3>
                                    <div className="text-2xl font-bold text-gray-900">
                                        ${totals.plg.net.toFixed(2)}
                                    </div>
                                    <div className="text-sm text-gray-500 mt-1">
                                        {totals.plg.count} transactions
                                    </div>
                                </div>
                                <div className="bg-white rounded-lg shadow-sm p-6">
                                    <h3 className="text-sm font-medium text-gray-500 mb-2">Unassigned</h3>
                                    <div className="text-2xl font-bold text-gray-900">
                                        ${totals.unassigned.net.toFixed(2)}
                                    </div>
                                    <div className="text-sm text-gray-500 mt-1">
                                        {totals.unassigned.count} transactions
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Data Table */}
                        {data.length > 0 && (
                            <div className="bg-white rounded-lg shadow-sm overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full">
                                        <thead className="bg-gray-50 border-b border-gray-200">
                                            <tr>
                                                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                                                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                                                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
                                                <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Amount</th>
                                                <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Fee</th>
                                                <th className="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Net</th>
                                                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                                                <th className="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Business</th>
                                            </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-gray-200">
                                            {data.map((row, index) => (
                                                <tr key={index} className="hover:bg-gray-50">
                                                    <td className="px-4 py-3 text-sm text-gray-900 whitespace-nowrap">{row.date}</td>
                                                    <td className="px-4 py-3 text-sm whitespace-nowrap">
                                                        <span className={`px-2 py-1 rounded-full text-xs font-medium ${getTypeColor(row.type)}`}>
                                                            {row.type}
                                                        </span>
                                                    </td>
                                                    <td className="px-4 py-3 text-sm text-gray-900 max-w-md truncate" title={row.description}>
                                                        {row.description}
                                                    </td>
                                                    <td className="px-4 py-3 text-sm text-gray-900 text-right whitespace-nowrap">
                                                        ${parseFloat(row.amount || 0).toFixed(2)}
                                                    </td>
                                                    <td className="px-4 py-3 text-sm text-gray-900 text-right whitespace-nowrap">
                                                        ${parseFloat(row.fee || 0).toFixed(2)}
                                                    </td>
                                                    <td className="px-4 py-3 text-sm text-gray-900 text-right whitespace-nowrap font-medium">
                                                        ${parseFloat(row.net || 0).toFixed(2)}
                                                    </td>
                                                    <td className="px-4 py-3 text-sm text-gray-900 truncate max-w-xs" title={row.customerName}>
                                                        {row.customerName || '-'}
                                                    </td>
                                                    <td className="px-4 py-3 text-sm">
                                                        <select
                                                            value={row.business}
                                                            onChange={(e) => handleBusinessChange(index, e.target.value)}
                                                            className="w-24 px-2 py-1 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                                        >
                                                            <option value="">Select</option>
                                                            <option value="SSL">SSL</option>
                                                            <option value="PLG">PLG</option>
                                                        </select>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                                <div className="px-4 py-3 bg-gray-50 border-t border-gray-200 text-sm text-gray-500">
                                    Showing {data.length} transactions
                                </div>
                            </div>
                        )}

                        {/* Empty State */}
                        {data.length === 0 && (
                            <div className="bg-white rounded-lg shadow-sm p-12 text-center">
                                <svg className="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <h3 className="mt-2 text-sm font-medium text-gray-900">No data loaded</h3>
                                <p className="mt-1 text-sm text-gray-500">Upload a CSV file to get started</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
